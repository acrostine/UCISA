king, moderating and recording the results that prove a learner has met the learning outcomes of a module.\n\n### Consumes\nIt consumes Assessment Submissions when a learner submits coursework or sits an examination. It consumes Marking Rubrics when an assessor applies a standard to a submission. It consumes Extension Requests when a learner claims circumstances preventing timely submission. It consumes Mitigating Circumstances Claims when a learner asks for a result to be set aside.\n\n### Produces\nIt produces Assessment Results as recorded marks for each module or component. It produces Assessment Board Papers as the set of provisional results needing board approval. It produces Resit Notices when a learner fails a component and is eligible to retake it.\n\n### Activities\nActivities present are: collect Assessment Submissions, apply Marking Rubrics, moderate a sample of marks, record Assessment Results, handle Extension Requests, investigate Mitigating Circumstances Claims, and issue Resit Notices.\n\n### Fails when\nIt fails when Assessment Submissions are lost or when marks are not recorded in the Student Record by the board deadline. Assessment Board Papers are then incomplete, resits cannot be issued, and Student Completion stalls.\n\n### Constraint\nIt is constrained by the academic integrity rules requiring anonymous marking where prescribed and by the external examiner role in confirming standards.\n\n### Operating Conditions\nAn Assessment Submission must carry the module code and an anonymous candidate number; if the module code is missing it is returned. An Extension Request must state the affected assessment and evidence of the ground; if evidence is absent it is rejected. A Mitigating Circumstances Claim must be submitted within the published deadline; if late it is accepted only with a validated reason.","specialization":""},{"id":"elem-id-200032","type":"Capability","name":"Student Attraction & Recruitment","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for generating prospective learner interest and converting that interest into eligible Student Applications.\n\n### Consumes\nIt consumes Prospect Records when a prospective learner enquires or attends an event. It consumes Campaign Briefs when a marketing campaign is commissioned. It consumes Open Day Bookings when a prospect registers to visit. It consumes Market Research Reports when sector data is purchased or assembled.\n\n### Produces\nIt produces Prospectuses as published course and fee information for prospective learners. It produces Student Applications when a prospect completes the application process. It produces Open Day Registers as proof of attendance and follow-up lists.\n\n### Activities\nActivities present are: maintain Prospect Records, run Campaigns from Campaign Briefs, host Open Day Bookings, convert enquiries into Student Applications, record Open Day Registers, and withdraw a Prospect Record when consent expires.\n\n### Fails when\nIt fails when Prospect Records have no valid consent or when campaigns reach no eligible prospects. Student Applications then stop arriving, and the institution cannot fill its Student Enrolment places.\n\n### Constraint\nIt is constrained by the need to balance promotional activity with fair access and by the UK GDPR requirement for consent before direct marketing.\n\n### Operating Conditions\nA Prospect Record must carry a source and a lawful basis for contact; if the lawful basis is absent the record is deleted. A Campaign Brief must state target audience, message and budget; if the budget is absent the campaign is halted for approval. An Open Day Booking must include an attendee identifier and contact detail; if the identifier is missing the booking is returned.","specialization":""},{"id":"elem-id-200033","type":"Capability","name":"Student Completion & Graduation","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for confirming that each learner has completed all requirements and for producing the formal award and graduate evidence.\n\n### Consumes\nIt consumes Completion Checks when programme requirements are compared against the Student Record. It consumes Award Classification Decisions when an Assessment Board confirms or recomputes the final class or merit. It consumes Fee Clearance Statements when all tuition and other charges are settled.\n\n### Produces\nIt produces Awarded Degree Certificates when the learner is confirmed as complete and the award is conferred. It produces Graduate Records when the graduate's final details are validated for external transmission. It produces Transcripts of Results when a graduate requests a full academic statement.\n\n### Activities\nActivities present are: run Completion Checks, apply Award Classification Decisions, verify Fee Clearance Statements, print Awarded Degree Certificates, produce Graduate Records, produce Transcripts of Results, and suspend award when a Completion Check fails.\n\n### Fails when\nIt fails when Completion Checks cannot reconcile the Student Record with the programme requirements or when Fee Clearance Statements are outstanding. Awarded Degree Certificates and Graduate Records then stop, so former learners cannot prove their award.\n\n### Constraint\nIt is constrained by the requirement that awards are conferred only by the Assessment Board and only after fee clearance is confirmed, under the institution's formal award regulations.\n\n### Operating Conditions\nA Completion Check must list every module and credit against the Student Record; if a module is missing the check is returned. An Award Classification Decision must be signed by the Assessment Board Chair; if unsigned it is rejected. A Fee Clearance Statement must match the student's fee ledger; if the ledger shows a balance the award is suspended.","specialization":""},{"id":"elem-id-200034","type":"Capability","name":"Student Enrolment","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for converting a valid Admission Offer into a live Student Enrolment, complete with identity, programme and fee status.\n\n### Consumes\nIt consumes Admission Offers when an applicant has accepted an unconditional or conditional place. It consumes Identity Documents when a learner proves their legal identity. It consumes Student Fee payments when the first fee installment or deposit is paid. It consumes Visa Evidence when an international learner must prove study permission.\n\n### Produces\nIt produces Student Enrolments as the event that activates the learner's Student Record for the academic year. It produces Student ID Cards as proof of enrolment. It produces Enrolment Declarations as a signed statement of enrolment terms.\n\n### Activities\nActivities present are: verify Admission Offers, check Identity Documents, record Student Fee payments, check Visa Evidence, create Student Enrolments, issue Student ID Cards, and refuse enrolment when a conditional offer has unmet conditions.\n\n### Fails when\nIt fails when an Admission Offer cannot be verified against the Student Application or when fee payment is missing. Student Enrolments then do not activate, Student ID Cards are not issued, and the learner cannot access teaching or assessment.\n\n### Constraint\nIt is constrained by the legal requirement to verify identity and study permission before enrolment and by the financial rule that no learner becomes enrolled without an accepted offer.\n\n### Operating Conditions\nAn Admission Offer must be unconditional or have all conditions cleared; if conditions remain the offer is not processed for enrolment. An Identity Document must carry a photograph and official identifier; if it is not a recognised identity document it is rejected. A Student Fee payment must be matched to the learner's fee account; if the amount differs the payment is held for reconciliation.","specialization":""},{"id":"elem-id-200035","type":"Capability","name":"Student Support & Wellbeing Management","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for receiving concerns about learner wellbeing and for organising the support, adjustments and referrals that keep a learner able to continue study.\n\n### Consumes\nIt consumes Support Referrals when a tutor, medical service or self-referral identifies a learner in need. It consumes Wellbeing Concerns when a learner reports mental health or personal crisis. It consumes Reasonable Adjustment Requests when a disability or condition requires a study adjustment. It consumes Mitigating Circumstances Claims when a learner asks for assessment allowance.\n\n### Produces\nIt produces Support Plans when a learner's ongoing needs are assessed and agreed. It produces Counselling Appointments when a learner is assigned to a practitioner. It produces Reasonable Adjustment Agreements when an adjustment is approved and communicated to teaching and assessment staff.\n\n### Activities\nActivities present are: triage Support Referrals, assess Wellbeing Concerns, create Support Plans, schedule Counselling Appointments, review Reasonable Adjustment Requests, record Mitigating Circumstances Claims, escalate a safeguarding case, and close a Support Plan when no longer needed.\n\n### Fails when\nIt fails when Support Referrals are not triaged within the required response time or when safeguarding cases are not escalated. Learner needs then go untreated, Reasonable Adjustment Agreements are delayed, and Student Completion falls because learners stop engaging.\n\n### Constraint\nIt is constrained by confidentiality and safeguarding duties, which require separating wellbeing records from the academic Student Record while still making approved adjustments actionable.\n\n### Operating Conditions\nA Support Referral must state the learner identifier, the concern and the urgency; if the urgency is absent it is returned to the referrer. A Wellbeing Concern judged as high risk must be escalated immediately; if not escalated the case is absorbed as a defect the service must correct. A Reasonable Adjustment Request must include evidence of the condition; if evidence is missing the request is returned.","specialization":""},{"id":"elem-id-200036","type":"Capability","name":"Supporting Services","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for non-academic student support, including wellbeing, disability, counselling, careers, and financial advice. It is answerable for early intervention, reasonable adjustments, and safeguarding.\n\n### Consumes\nIt takes in Student Support Request, triggered by a student seeking help. It takes in Disability Disclosure, triggered by a student declaring a disability. It takes in Counselling Referral, triggered by a student or staff member concerned about a student. It takes in Careers Enquiry, triggered by a student requesting careers guidance. It takes in Bursary Application, triggered by a student applying for financial support. It takes in Incident Referral, triggered by a safeguarding or conduct concern.\n\n### Produces\nIt issues Support Plan when a student's needs are assessed. It issues Reasonable Adjustment when a disability is evidenced and agreed. It issues Counselling Appointment when a referral is triaged and matched. It issues Careers Advice Record when guidance is delivered. It issues Bursary Decision when an application is assessed against criteria. It issues Incident Report when a safeguarding concern is investigated.\n\n### Activities\nTriages Student Support Request by urgency and risk. Assesses Disability Disclosure and arranges Reasonable Adjustment. Arranges Counselling Appointment and manages waiting list. Provides Careers Advice and records Careers Advice Record. Assesses Bursary Application against funding criteria and budget. Manages Incident Referral and escalates to safeguarding lead. Creates Support Plan and reviews progress. Monitors student wellbeing through attendance and engagement. Refers to external agencies where specialist help is needed. Handles crisis and emergency intervention.\n\n### Fails when\nIt stops delivering when Student Support Request is not triaged promptly, causing student harm, withdrawal, or a missed opportunity for intervention; or when Incident Referral is not acted on, causing safeguarding failure.\n\n### Constraint\nIt operates under a duty of care, confidentiality, and multi-agency safeguarding requirements, where information sharing must balance privacy against risk of harm.\n\n### Operating Conditions\nStudent Support Request must include student identifier and nature of issue; if missing, it is returned or immediate outreach is attempted. Disability Disclosure must be voluntary and include consent; if unclear, it is accepted and followed up. Counselling Referral must be from a registered source and include risk level; if missing, it is escalated as urgent. Bursary Application must include financial evidence and course details; if incomplete, it is returned. Incident Referral must include date, persons involved, and factual account; if missing, it is returned for immediate clarification. Careers Enquiry must include student identifier and query; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200037","type":"Capability","name":"Teaching & Learning Delivery","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for the scheduled delivery of teaching sessions and for producing the attendance and delivery records that confirm a learner has engaged with the curriculum.\n\n### Consumes\nIt consumes Course Timetables when the academic timetable is finalised each term. It consumes Module Materials when a teaching session requires prepared content. It consumes Room Bookings when a session is allocated a physical or virtual space. It consumes Student Enrolments to know which learners are expected.\n\n### Produces\nIt produces Learning Session Records when a session is delivered, listing the topic, time, staff and room. It produces Attendance Records when learner presence is captured. It produces Timetable Clash Notices when a scheduled session cannot run in the allocated room or time.\n\n### Activities\nActivities present are: schedule teaching sessions from Course Timetables, deliver teaching sessions using Module Materials, record Attendance Records, resolve Timetable Clash Notices, reschedule a session when a room is unavailable, and cancel a session when no staff member is available.\n\n### Fails when\nIt fails when Course Timetables contain unresolved clashes or when Room Bookings are not confirmed. Learning Session Records then stop being produced, Attendance Records are missing, and learners cannot satisfy engagement requirements.\n\n### Constraint\nIt is constrained by the academic calendar and staff contracts, which fix the number of teaching weeks and the timing within which all sessions must be delivered.\n\n### Operating Conditions\nA Course Timetable must include session date, module code, room and assigned staff; if the module code is absent the timetable is returned. A Room Booking must be confirmed by the room owner; if unconfirmed the session is treated as provisional and may be cancelled. Module Materials must match the module code and session topic; if they do not match they are returned to the originator before delivery.","specialization":""},{"id":"elem-id-10001","type":"Grouping","name":"Commercial Activity","documentation":"### Identity\nThe Commercial Activity domain is accountable for the institution's commercial arrangements with suppliers and external clients. It is responsible for ensuring every Commercial Contract is lawfully sourced, executed, delivered and monitored, and that the institution receives the goods, services and income it has contracted for. A person running this domain is answerable for the financial outcome of each Commercial Contract, for authorising payment against each Supplier Invoice only after verification, and for issuing Contract Agreements and Financial Statements that evidence the institution's commercial position. No financial commitment is made without an approved Commercial Contract, and every commercial transaction is captured in the institution's financial records.\n\n### Consumes\nWhen a Supplier Invoice arrives, the domain records it, matches it to the governing Commercial Contract and delivery acceptance, and schedules payment only after verification. When a Service Request arrives from an internal unit or external client, the domain qualifies it against existing Commercial Contracts and either converts it into a proposal or assigns it for fulfilment. When a Government Policy document arrives, the domain extracts procurement, data protection and sustainability obligations and updates contract terms and monitoring criteria. When a Contract Agreement arrives, the domain registers it for delivery and monitoring and stores the signed counterpart.\n\n### Produces\nThe domain issues a Contract Agreement when both the institution and the counterparty have signed and all institutional approvals are recorded. It issues a Financial Statement after every commercial transaction in the period has been reconciled to its Contract Agreement and bank records. It issues a Regulatory Return when aggregated commercial activity reaches a statutory reporting threshold. It issues a Contract Performance Report at the close of each reporting period, recording key performance indicators, spend, and delivery status.\n\n### Fails when\nThe domain stops delivering when no Commercial Contract can progress to signed status because supplier due diligence, affordability approval or legal review remains incomplete. Downstream, no Contract Agreement is issued, no Supplier Invoice is authorised for payment, fulfilment cannot legally begin, and the Financial Statements for the period cannot be closed without unresolved contract commitments. This failure also prevents the production of statutory returns and final accounts.\n\n### Constraint\nEvery financial commitment and payment in this domain must be traceable to an approved Commercial Contract and its documented delivery acceptance; this single traceability condition separates commercial activity from activity funded by other means.","specialization":""},{"id":"elem-f1-id-6345","type":"Grouping","name":"Consumers","documentation":"**The set of external parties who engage with the institution.** The model gathers Prospective Students, UG Students, PG Students, Public Community, Funding Bodies, Commercial Partners, and External Researchers because each consumes services, resources, or relationships offered by the organisation. Grouping these members supports planning for engagement, satisfaction, external impact, and the alignment of institutional activity with stakeholder expectations.","specialization":""},{"id":"elem-id-10002","type":"Grouping","name":"Enabling Capabilities","documentation":"### Identity\nThis domain holds accountability for the institution's internal operating integrity. It is answerable for the condition of the built estate, the accuracy of financial control, the legality of contracts, the availability of information systems, the management of people, and the provision of student support services. The person running this domain is accountable for ensuring that Supplier Invoices are paid correctly, Facilities Work Orders are completed on time, Employment Contracts meet legal terms, and Service Requests reach closure.\n\n### Consumes\nIt takes in Supplier Invoices and validates them against procurement commitments before payment. It takes in Government Policy documents and assesses impact on statutory obligations. It takes in Student Fee payments and reconciles each against the Student Account. It takes in Service Requests from staff, students and external parties and assigns resolution ownership. It takes in Facilities Work Orders and schedules maintenance against building risk. It takes in Employment Applications and runs selection under recruitment policy. It takes in Procurement Requests and sources suppliers under financial limits.\n\n### Produces\nIt issues Financial Statements when statutory reporting deadlines arrive and the general ledger is closed. It issues Employment Contracts when a candidate is selected and right-to-work checks pass. It issues Maintenance Schedules when a Building Condition Survey identifies required work. It issues Service Reports when a Service Request reaches closure. It issues Contract Agreements when procurement or partnership terms receive legal approval. It issues Library Loans when borrower entitlement is confirmed.\n\n### Fails when\nIt fails when Financial Transactions cannot be processed because Supplier Invoice or Student Fee payment data lacks a valid account code, causing payments to stall and suppliers to withdraw service. It fails when Facilities Work Orders cannot be scheduled because building condition data is not current, causing estates to deteriorate and compliance notices to be issued. It fails when Legal Queries cannot be resolved because regulatory interpretation is unresolved, causing institutional decisions to halt.\n\n### Constraint\nThe single condition that most distinguishes this domain is that it operates under simultaneous statutory reporting cycles, collective bargaining agreements, and physical infrastructure dependencies, so no internal service may optimise independently without degrading another internal service or an external compliance obligation.","specialization":""},{"id":"elem-f1-id-6210","type":"Grouping","name":"Locations","documentation":"**The places where the institution operates.** This grouping brings together Campus, Off-Campus, and Online to describe where activities and services take place. It is used to record the physical or virtual settings for teaching, research, and support. Planners and administrators rely on this classification to allocate resources, manage access, and understand the distribution of operations across different environments. The grouping ensures consistent terminology for location-based reporting.","specialization":""},{"id":"elem-f1-id-6254","type":"Grouping","name":"Market Segments","documentation":"**Student populations split by origin.** This grouping brings together the distinct student populations the institution targets for recruitment and planning: Domestic & EU Students and International Students. The model uses these segments to separate demand, fees, funding, and support requirements because each group has different expectations, regulations, and revenue implications. Admissions, marketing, and academic planning teams rely on this distinction to forecast numbers, allocate resources, and design appropriate services. Both segments are business actors whose choices and needs drive institutional strategy. The grouping ensures that strategic planning accounts for the distinct characteristics of each student cohort.","specialization":""},{"id":"elem-f1-id-6276","type":"Grouping","name":"Products","documentation":"**The institution's educational and research offerings.** This group gathers the qualifications, programmes, publications, custom training, and intellectual property that the institution provides to learners, researchers, and external partners. It supports decisions about portfolio balance, resource allocation, and strategic direction. Members include Short Courses, HNC & HND, Batchelor Degree, Graduate Certificate, Masters Diploma, Graduate Diploma, Doctor of Philosophy, Research Publications, Tailored Learning & Teaching Products, and Intellectual Property Rights. The model uses this grouping to view the full range of what the institution offers and to manage them consistently.","specialization":""},{"id":"elem-id-10003","type":"Grouping","name":"Research","documentation":"### Identity\nThe Research domain is answerable for the institution's creation and dissemination of Research Outputs and Research Publications, the acquisition and administration of research funding, and the evidence of research impact. It is accountable for increasing Research Income per full-time equivalent academic staff member, reducing the time from Research Grant application to award, and ensuring that every Research Publication meets open access mandates. The domain must ensure Research Contracts are executed and delivered, Research Data is managed under a Data Management Plan, and Impact Case Studies are produced for external assessment.\n\n### Consumes\nThe domain receives Research Funding Application from funders; on arrival, each is logged and assessed for eligibility, funding conditions, and alignment with the Research Strategy. It receives Government Policy documents; on arrival, these are interpreted into research compliance requirements, open access mandates, and impact evidence thresholds. It receives Research Data from research activities; on arrival, the data is checked for completeness and stored under an active Data Management Plan.\n\n### Produces\nThe domain issues Research Publication when the corresponding Research Output has been deposited in the institutional repository and an Open Access Compliance Record has been created. It issues Research Output when a Research Project has produced a Research Final Report and the output has passed validation. It issues Impact Case Study when Impact Evidence reaches the threshold required by the external assessment framework. It issues Research Funder Report when a Research Contract completes and all financial and technical reporting requirements have been met.\n\n### Fails when\nThe domain fails when no Research Funding Application results in a Research Award Notice before current Research Projects end, and no new Research Outputs are deposited. As a result, Financial Statements cannot report Research Income, the institution breaches open access mandates for Research Publications, and Impact Case Studies cannot be compiled for the external assessment exercise. Downstream, the institutional research performance measures collapse to zero Research Income per academic staff member and zero Research Outputs for the academic year.\n\n### Constraint\nThe domain operates as if all research activity is contained within a single legal institution; it does not capture Research Contracts or Research Outputs arising from multi-institution collaborations, shared facilities, or jointly owned research assets. Every Research Funding Application, Research Contract and Research Publication is attributed to the one institution and cannot be split across partners.","specialization":""},{"id":"elem-f1-id-6419","type":"Grouping","name":"Stakeholders","documentation":"**A group of parties with an interest.** This grouping gathers the individuals, organisations and public bodies that have a stake in the institution's activities and outcomes. Members include National Goverment, Local Goverment, Staff, Students, Sponsors, Governors, Professional Bodies & Reg Authorities, Suppliers, Accreditation Bodies and Local Community. The model uses this group to identify whose needs, expectations and obligations shape decisions about services, priorities and resources. Each member brings a distinct perspective: students seek education, staff seek employment and development, government bodies set policy and funding conditions, suppliers deliver goods, and accreditation bodies confirm standards.","specialization":""},{"id":"elem-id-10004","type":"Grouping","name":"Strategy & Governance","documentation":"### Identity\nThe Strategy & Governance domain is answerable for the institution's lawful operation, strategic direction, and public accountability. Its accountable executive must ensure that the institution meets the Office for Students condition B3 on student outcomes, discharges UK GDPR data protection duties, complies with open access mandates for research publications, and reports sustainability under the Climate Change Act. Failure in this domain means the institution loses the right to award degrees, receive public funding, or enter into legally binding contracts.\n\n### Consumes\nIt takes in Government Policy Documents as they are published by regulators or Parliament and records each as a Compliance Obligation with an owner and due date. It takes in Key Performance Indicators covering Student Enrolments, Research Outputs, Commercial Contracts executed, and Service Requests resolved; each is compared against targets for the academic year. It takes in Audit Findings from internal and external assurance work and logs each as a corrective action. It takes in Risk Register updates from operations and maps each risk to a Strategic Objective.\n\n### Produces\nIt issues a Strategic Plan when it has been approved by the governing body and includes measurable objectives for the next five academic years. It issues an Annual Budget when revenue and expenditure have been reconciled to the Strategic Plan. It issues Governance Decisions when a committee has a recorded quorum and a majority vote. It issues Statutory Filings when the relevant regulator's deadline falls due. It issues Policy Statements when a policy has been through equality impact assessment and governing body approval.\n\n### Fails when\nThe domain fails when the governing body cannot form a quorum for two consecutive meetings, because no Governance Decision, Strategic Plan, or Annual Budget can be issued. As a result, statutory returns are not filed, the Office for Students can impose sanctions, and downstream operational planning has no approved budget or objectives.\n\n### Constraint\nThe domain operates only for a single legal institution; it does not extend authority over shared services, franchise partners, or collaborative course delivery arrangements, so any governance object for those activities falls outside its remit.","specialization":""},{"id":"elem-id-10005","type":"Grouping","name":"Teaching & Learning","documentation":"### Identity\nThis domain is accountable for the student lifecycle from first contact through graduation and alumni engagement. It holds responsibility for enrolling students, delivering courses, assessing learning, conferring awards, and keeping the Student Record current as the authoritative record of academic progress. The accountable outcome is successful student completion evidenced by Awarded Degree Certificates and accurate Graduate Records.\n\n### Consumes\nIt consumes Student Applications and assesses each against entry requirements, fee status and available places before an enrolment decision is made. It consumes Student Fee payments and posts each to a student account linked to the corresponding enrolment. It consumes Government Policy documents and translates each into institutional admission, teaching, assessment and award rules.\n\n### Produces\nIt issues Awarded Degree Certificates when a student meets all programme requirements and the Assessment Board confirms the final award. It issues Graduate Records when an award is conferred, carrying final classification, credits and personal identifiers to confirm the graduate to external parties.\n\n### Fails when\nIt fails when Student Applications cannot be converted into Student Enrolments because entry requirements or fee status remain unresolved, or when assessment results cannot be verified against the Student Record. Awarded Degree Certificates and Graduate Records then stop, and Student Completion rates fall against the academic year.\n\n### Constraint\nThe single condition that most distinguishes this domain is its obligation to maintain one authoritative Student Record for each learner, updated only through formally approved academic decisions and subject to UK GDPR and OfS condition B3.","specialization":""},{"id":"elem-f1-id-6214","type":"Location","name":"Campus","documentation":"**A physical site of the institution.** Campus is the main ground or set of buildings where the institution delivers its core activities. It houses teaching rooms, libraries, laboratories, offices, and student facilities. Staff and students use the campus for face-to-face learning, research, and administration. The model records campus locations to support timetabling, maintenance, security, and space planning. Decisions about building access, room allocation, and service placement depend on knowing which activities occur on campus.","specialization":""},{"id":"elem-f1-id-6221","type":"Location","name":"Off-Campus","documentation":"**A location away from the main campus.** Off-campus refers to any physical site that is not the institution's central campus but is used for its activities. This includes partner premises, fieldwork sites, placement locations, and outreach centres. The institution uses off-campus locations to deliver work-based learning, community engagement, and collaborative research. Recording these locations supports travel planning, risk assessment, and partnership management. It also helps the institution meet its obligations for students and staff who operate outside the main site.","specialization":""},{"id":"elem-f1-id-6227","type":"Location","name":"Online","documentation":"**A virtual space for learning and work.** Online is the digital setting where the institution delivers teaching, support, and administrative services over the internet. It includes learning platforms, video conferencing, and digital resources. Students and staff access online services from any location with an internet connection. The model records online as a location to distinguish remote delivery from physical presence. This distinction supports decisions about digital infrastructure, accessibility, and the balance between on-campus and remote operations.","specialization":""},{"id":"elem-f1-id-6246","type":"Product","name":"Batchelor Degree","documentation":"**An undergraduate academic award.** The institution offers the Batchelor Degree to students who have completed secondary education and wish to gain in-depth knowledge in a chosen subject. Delivery involves structured teaching, assessment, and student support over an extended period. Graduates receive a recognised qualification for employment or further study. In the model, this product is used to plan curriculum, allocate academic staff, and monitor student progression and outcomes.","specialization":""},{"id":"elem-f1-id-6321","type":"Product","name":"Doctor of Philosophy","documentation":"**A research-based doctoral degree.** Offered to students who undertake original research under academic supervision. Delivery involves independent study, supervisory guidance, and examination of a thesis or equivalent output. It represents the highest level of academic achievement. The institution uses this product to manage doctoral candidates, allocate research supervision, and track completions and research outputs. It supports the institution's research mission and academic reputation.","specialization":""},{"id":"elem-f1-id-6298","type":"Product","name":"Graduate Certificate","documentation":"**A postgraduate short qualification.** Offered to graduates who want to specialise or update their skills in a specific area. The institution delivers it through a focused set of advanced-level modules. It requires less study than a full master's degree but carries academic credit. In the model, it is used to manage postgraduate short offerings, track enrolments, and support continuing professional development. The institution issues the certificate upon successful completion.","specialization":""},{"id":"elem-f1-id-6310","type":"Product","name":"Graduate Diploma","documentation":"**A postgraduate conversion or specialisation qualification.** Offered to graduates who need to develop knowledge in a new field or deepen existing expertise. The institution delivers it through a structured set of advanced modules that include applied work. It carries more credit than a graduate certificate and provides a pathway to further study. In the model, it is used to manage postgraduate pathways, track student load, and plan teaching resources. The institution awards it upon completion.","specialization":""},{"id":"elem-f1-id-6245","type":"Product","name":"HNC & HND","documentation":"**Vocational higher education qualifications.** The institution offers HNC & HND to students who want practical, work-related learning in a specific field. The institution delivers them through taught modules, projects, and assessments that align with industry needs. These qualifications prepare students for employment or progression to further study. In the model, they support the management of vocational pathways, employer engagement, and progression routes. The institution uses them to broaden access to higher education.","specialization":""},{"id":"elem-f1-id-6338","type":"Product","name":"Intellectual Property Rights","documentation":"**Legal rights over creations of the mind.** These include patents, copyrights, trademarks, and other protections arising from research, teaching materials, and institutional branding. The institution owns or licenses these rights to control use and derive value. In the model, Intellectual Property Rights are managed as assets, supporting commercialisation, technology transfer, and protection of academic work. They help the institution capture the benefits of its innovation and scholarship.","specialization":""},{"id":"elem-f1-id-6304","type":"Product","name":"Masters Diploma","documentation":"**A postgraduate taught qualification.** Offered to graduates seeking advanced knowledge and professional skills in a specific field. The institution delivers it through a structured programme of taught modules and assessment. It requires less study than a full master's degree but more than a graduate diploma. In the model, it is used to manage postgraduate taught provision, allocate teaching resources, and track student progression and completion.","specialization":""},{"id":"elem-f1-id-6327","type":"Product","name":"Research Publications","documentation":"**Scholarly works produced by the institution.** These are outputs of research activity, such as articles, books, conference papers, and other scholarly contributions. The institution's researchers create them, and the wider academic community and public use them to share knowledge. In the model, Research Publications are tracked to assess research performance, support reporting, and inform future research strategy. They also contribute to the institution's impact and standing.","specialization":""},{"id":"elem-f1-id-6244","type":"Product","name":"Short Courses","documentation":"**A short, focused learning programme.** The institution offers Short Courses to individuals seeking targeted knowledge or skills without enrolling in a full degree. These courses are delivered through condensed teaching and assessment for professional development, upskilling, or personal interest. In the model, they are used to plan flexible offerings, manage enrolments, and track completion. The institution designs and runs them to respond quickly to demand from learners and employers.","specialization":""},{"id":"elem-f1-id-6333","type":"Product","name":"Tailored Learning & Teaching Products","documentation":"**Customised educational offerings.** These are programmes or learning materials developed to meet the specific needs of a client group, such as employers, industry bodies, or partner organisations. The institution uses its academic expertise and teaching resources to design and deliver them. In the model, they are used to manage bespoke contracts, commercial education, and workforce development. The institution relies on them to generate income and strengthen external partnerships.","specialization":""},{"id":"elem-f1-id-6471","type":"Stakeholder","name":"Accreditation Bodies","documentation":"**Independent bodies that assess quality.** Accreditation Bodies are external organisations that evaluate the institution's courses, services or operations against recognised standards. They expect the institution to demonstrate compliance, maintain quality and provide evidence of continuous improvement. Their approval or accreditation affects the institution's ability to offer certain qualifications, receive funding or maintain reputation. In this model, their view matters because decisions about curriculum, quality assurance and resource allocation must satisfy the requirements these bodies set. Institutional leaders rely on accreditation outcomes to validate programmes and to identify areas needing attention.","specialization":""},{"id":"elem-f1-id-6416","type":"Stakeholder","name":"Governors","documentation":"**The governing body overseeing the institution.** Governors are the senior volunteers or appointed members who hold ultimate responsibility for the institution's strategic direction, financial health and legal compliance. They expect management to deliver the institution's mission while managing risk and using resources properly. Their view matters because they approve major plans, budgets and policies, and hold senior leaders to account. In this model, decisions about significant change, investment or partnership require consideration of governors' expectations and their duty to protect the institution's long-term interests.","specialization":""},{"id":"elem-f1-id-6477","type":"Stakeholder","name":"Local Community","documentation":"**People and organisations near the campus.** Local Community includes residents, community groups and local businesses in the areas where the institution operates. They expect the institution to contribute positively to the local economy, offer cultural or educational opportunities and manage its physical footprint responsibly. Their view matters because the institution's plans for buildings, transport, events and partnerships affect the community. In this model, understanding local community interests supports decisions about campus development, public engagement and community relations, helping the institution maintain its social licence to operate.","specialization":""},{"id":"elem-f1-id-6432","type":"Stakeholder","name":"Local Goverment","documentation":"**A municipal authority with local oversight.** Local Goverment is the elected body responsible for services and regulation in the area where the institution sits. It expects the institution to follow local planning, licensing and environmental rules and to work with it on regional skills, transport and economic development. Its view matters because the institution needs approvals for building projects, events and other activities that affect the locality. In this model, input from Local Goverment shapes decisions about estate development, community engagement and collaborative initiatives that align with local priorities.","specialization":""},{"id":"elem-f1-id-6426","type":"Stakeholder","name":"National Goverment","documentation":"**The central government that sets policy.** National Goverment is the central public authority that shapes higher education policy, funding and regulation for the institution. It expects the institution to deliver accessible, high-quality education, manage public money properly and contribute to national skills and research goals. Its view matters because the institution must respond to national policy changes, funding conditions and reporting requirements. In this model, decisions about strategic direction, curriculum offer and resource use take account of National Goverment expectations, as they affect funding, reputation and compliance.","specialization":""},{"id":"elem-f1-id-6417","type":"Stakeholder","name":"Professional Bodies & Reg Authorities","documentation":"**Bodies that set professional standards.** Professional Bodies & Reg Authorities are organisations that define standards for particular occupations or regulate entry to a profession. They expect the institution's courses to equip students with the knowledge, skills and ethical understanding required for professional practice. Their view matters because recognition by these bodies enables graduates to enter certain careers and confirms the quality of professional programmes. In this model, decisions about curriculum content, work placements and assessment are shaped by the expectations of these bodies, ensuring the institution's offer remains relevant and credible.","specialization":""},{"id":"elem-f1-id-6415","type":"Stakeholder","name":"Sponsors","documentation":"**Funders who support specific work.** Sponsors are individuals, companies, trusts or public funders that provide money or resources for specific institutional activities such as research, scholarships or events. They expect the institution to deliver agreed outcomes, use funds as intended and acknowledge their support. Their view matters because sponsored work depends on their continued backing and must meet their conditions. In this model, decisions about which projects to pursue, how to resource them and how to report progress take account of sponsor expectations, safeguarding funding and reputation.","specialization":""},{"id":"elem-f1-id-6438","type":"Stakeholder","name":"Staff","documentation":"**Employees who deliver the institution's work.** Staff are the people employed by the institution to teach, research, support students and run its services. They expect fair pay and conditions, opportunities for development, a safe working environment and a voice in decisions that affect their work. Their view matters because they deliver the institution's core activities and understand operational realities. In this model, decisions about service design, technology, workload and organisational change take account of staff perspectives to maintain capability, engagement and quality of delivery.","specialization":""},{"id":"elem-f1-id-6444","type":"Stakeholder","name":"Students","documentation":"**Learners enrolled on the institution's courses.** Students are the individuals enrolled to study at the institution. They expect high-quality teaching, access to learning resources, support services and clear information about their programmes and progress. Their view matters because they are the primary beneficiaries of the institution's educational offer and their success defines institutional performance. In this model, decisions about curriculum design, timetabling, student support and the digital environment are informed by student needs, feedback and outcomes, ensuring that services remain focused on learning and student experience.","specialization":""},{"id":"elem-f1-id-6465","type":"Stakeholder","name":"Suppliers","documentation":"**External providers of goods and services.** Suppliers are external companies and organisations that provide goods and services to the institution, such as equipment, software, estate services or consultancy. They expect fair procurement processes, clear contracts and prompt payment. Their view matters because the institution depends on them for important operations and projects, and their performance affects cost, quality and risk. In this model, decisions about outsourcing, procurement and supplier management take account of supplier capabilities and relationships, ensuring the institution secures value and maintains continuity.","specialization":""}],"relationships":[{"id":"elem-id-a-7","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200019","specialization":""},{"id":"elem-id-a-10","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-a-12","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-a-26","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10004","targetid":"elem-id-20009","specialization":""},{"id":"elem-id-a-32","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200030","specialization":""},{"id":"elem-id-a-33","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200031","specialization":""},{"id":"elem-id-a-3","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-20006","specialization":""},{"id":"elem-id-a-17","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200024","specialization":""},{"id":"elem-id-a-18","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200023","specialization":""},{"id":"elem-id-a-29","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-20001","specialization":""},{"id":"elem-id-a-15","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200011","specialization":""},{"id":"elem-id-a-21","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200021","specialization":""},{"id":"elem-id-a-24","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10004","targetid":"elem-id-20004","specialization":""},{"id":"elem-id-a-30","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-a-37","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200033","specialization":""},{"id":"elem-id-a-2","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-20007","specialization":""},{"id":"elem-id-a-13","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200013","specialization":""},{"id":"elem-id-a-31","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200029","specialization":""},{"id":"elem-id-a-11","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200015","specialization":""},{"id":"elem-id-a-14","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-a-28","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200037","specialization":""},{"id":"elem-id-a-9","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200017","specialization":""},{"id":"elem-id-a-27","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-20003","specialization":""},{"id":"elem-id-a-34","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200035","specialization":""},{"id":"elem-id-a-1","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-20008","specialization":""},{"id":"elem-id-a-4","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-20005","specialization":""},{"id":"elem-id-a-5","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-20002","specialization":""},{"id":"elem-id-a-16","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200025","specialization":""},{"id":"elem-id-a-19","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200027","specialization":""},{"id":"elem-id-a-20","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200020","specialization":""},{"id":"elem-id-a-25","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10004","targetid":"elem-id-200028","specialization":""},{"id":"elem-id-a-36","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200032","specialization":""},{"id":"elem-id-a-6","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200036","specialization":""},{"id":"elem-id-a-8","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-200018","specialization":""},{"id":"elem-id-a-22","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200022","specialization":""},{"id":"elem-id-a-23","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-200026","specialization":""},{"id":"elem-id-a-35","type":"CompositionRelationship","name":"","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-200034","specialization":""},{"id":"elem-id-503c2f14-70ac-4d0f-b1d5-ed8433849002","type":"FlowRelationship","name":"Academic Calendar","documentation":"### Object\nThe institution-wide schedule of term dates, teaching weeks, assessment periods, holidays, and degree ceremony dates.\n\n### Condition\nIssued when the academic year structure is approved by governance and any constraints from policy and professional bodies are applied.\n\n### Consequence\nArrival anchors all teaching, assessment, and progression scheduling. Absence leaves no common time framework and prevents coherent planning.","sourceid":"elem-id-841","targetid":"elem-id-880","specialization":""},{"id":"elem-id-3b1dd9b2-3246-4282-9482-25530a145c18","type":"FlowRelationship","name":"Academic Calendar","documentation":"### Object\nThe institution-wide schedule of term dates, teaching weeks, assessment periods, holidays, and degree ceremony dates.\n\n### Condition\nIssued when the academic year structure is approved by governance and any constraints from policy and professional bodies are applied.\n\n### Consequence\nArrival provides the fixed time framework for constructing the teaching timetable. Absence leaves timetable planners without authoritative dates and causes scheduling errors.","sourceid":"elem-id-841","targetid":"elem-id-842","specialization":""},{"id":"elem-id-8b456b4c-3304-4e21-9ef9-e019b68e4b28","type":"FlowRelationship","name":"Academic Collaboration Requirement","documentation":"### Object\nThe Academic Collaboration Requirement specifies the research or teaching capabilities sought from an industry partner.\n\n### Condition\nIt is produced when an academic need cannot be met internally.\n\n### Consequence\nIndustry relationship managers search for and approach suitable partners. Without this requirement, partnerships are pursued without academic purpose, wasting effort.","sourceid":"elem-id-925","targetid":"elem-id-922","specialization":""},{"id":"elem-id-37b8fd58-141a-435e-9d39-660fde1258cf","type":"FlowRelationship","name":"Academic Exchange Priority","documentation":"### Object\nThe Academic Exchange Priority ranks the disciplines or partner institutions where exchange agreements are most desired.\n\n### Condition\nIt is set during strategic planning.\n\n### Consequence\nOther institution relationship managers pursue agreements in those areas. Without this priority, exchange agreements are made opportunistically and may not support institutional goals.","sourceid":"elem-id-925","targetid":"elem-id-923","specialization":""},{"id":"elem-id-24dddbdc-cb77-458b-a1ab-b43b40f88a77","type":"FlowRelationship","name":"Academic History","documentation":"### Object\nThe student's prior academic background, including qualifications, grades, and any credit awarded.\n\n### Condition\nIssued when the record is complete and available for transfer assessment.\n\n### Consequence\nArrival enables credit recognition and transfer evaluation. Absence forces manual reconstruction and delays transfer decisions.","sourceid":"elem-id-863","targetid":"elem-id-864","specialization":""},{"id":"elem-id-60013eaa-ed09-4ece-9593-0e7d41333eaa","type":"FlowRelationship","name":"Academic Policy","documentation":"","sourceid":"elem-id-840","targetid":"elem-id-845","specialization":""},{"id":"id-73b56f41-17a8-44bc-9bfc-33794b6c3773","type":"FlowRelationship","name":"Academic Policy","documentation":"","sourceid":"elem-id-20001","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-5cc6ed09-6293-4fb6-89ce-bc01ca50e174","type":"FlowRelationship","name":"Academic Policy Constraints","documentation":"### Object\nThe rules and constraints that scheduling must respect, including assessment-free days, term length, and study hours.\n\n### Condition\nIssued when academic governance approves the policies that affect the shape of the academic year.\n\n### Consequence\nArrival defines the boundaries for scheduling decisions. Absence allows scheduling to conflict with approved policy and creates unworkable calendars.","sourceid":"elem-id-840","targetid":"elem-id-841","specialization":""},{"id":"elem-id-36c16a3d-19a1-4a84-bbe5-63fcc82ce55e","type":"FlowRelationship","name":"Academic Support Referral","documentation":"### Object\nThe referral record from an academic adviser, containing the concern type, student details, and recommended action or accommodation.\n\n### Condition\nIssued when an adviser identifies that a student's academic difficulty needs formal consideration under exceptional factors or appeal procedures.\n\n### Consequence\nArrival opens a formal case and collects supporting evidence for decision. Absence leaves the concern unaddressed and blocks any formal resolution.","sourceid":"elem-id-872","targetid":"elem-id-866","specialization":""},{"id":"id-0a6262ce-4c21-4c60-8f1c-466b648e1538","type":"FlowRelationship","name":"Academic Timetable","documentation":"","sourceid":"elem-id-20001","targetid":"elem-id-200037","specialization":""},{"id":"elem-id-231c5c00-e5c5-452d-9aa4-6020e0fb3fc2","type":"FlowRelationship","name":"Accepted Offer","documentation":"### Object\nThe accepted offer record, carrying the applicant's identity, programme code, start date, fee status, and any conditions satisfied or waived.\n\n### Condition\nIssued only when a conditional or unconditional offer has been formally accepted by the applicant within the admissions cycle and, for conditional offers, all conditions have been met or waived.\n\n### Consequence\nArrival creates a provisional student record and unlocks enrolment, fee assessment, and module selection. Absence leaves the applicant outside the student body and blocks all downstream enrolment activity.","sourceid":"elem-id-869","targetid":"elem-id-837","specialization":""},{"id":"id-a5d7f20e-0076-4c40-a77a-c289bc67bb90","type":"FlowRelationship","name":"Accepted Offer","documentation":"","sourceid":"elem-id-200030","targetid":"elem-id-200034","specialization":""},{"id":"elem-id-05667bb6-7a04-4918-a5f6-b15052119306","type":"FlowRelationship","name":"Access Control Policy","documentation":"### Object\nThe Access Control Policy defines role-based permissions, authentication standards, and segregation of duties for all systems and data repositories.\n\n### Condition\nIt is issued after security risk assessments and compliance requirements have been reviewed.\n\n### Consequence\nAccess rights are assigned consistently across systems according to job roles. Without this policy, access is granted ad hoc, and unauthorised accounts or over-privileged users persist.","sourceid":"elem-id-967","targetid":"elem-id-959","specialization":""},{"id":"id-d2093077-82ac-4e15-82b9-2f87d2410051","type":"FlowRelationship","name":"Accommodation Allocation","documentation":"","sourceid":"elem-id-20002","targetid":"elem-id-200035","specialization":""},{"id":"elem-id-f52cd8d7-82ac-4b40-9650-1ba594d87e78","type":"FlowRelationship","name":"Accommodation Allocation Notice","documentation":"### Object\nThe Accommodation Allocation Notice specifies the room assigned to a student, move-in date, and lease conditions.\n\n### Condition\nIt is produced after a student has accepted an offer of accommodation and paid any required deposit.\n\n### Consequence\nHousing advisors use the notice to provide tailored advice on the allocated room and related services. Without this notice, the student has no official place in accommodation, and advice cannot be specific.","sourceid":"elem-id-1001","targetid":"elem-id-875","specialization":""},{"id":"id-0835b0ee-1b26-4b18-a489-86f4bd701e9e","type":"FlowRelationship","name":"Accommodation Allocations","documentation":"","sourceid":"elem-id-10002","targetid":"elem-id-10005","specialization":""},{"id":"id-8530ba7a-21ff-421d-8af2-3b7e1afb64de","type":"FlowRelationship","name":"Accreditation Requirements","documentation":"","sourceid":"elem-id-200010","targetid":"elem-id-20001","specialization":""},{"id":"elem-id-f6382d71-a834-436e-9883-b211c06de7bc","type":"FlowRelationship","name":"Accreditation Standards","documentation":"### Object\nThe professional body or regulatory standards, competencies, and compliance criteria that a programme must meet for accreditation.\n\n### Condition\nIssued when the accrediting body publishes or updates its standards and the institution receives and records them.\n\n### Consequence\nArrival defines the requirements for curriculum design, assessment, and resource provision. Absence means programmes lack the criteria needed to secure or maintain accredited status.","sourceid":"elem-id-846","targetid":"elem-id-840","specialization":""},{"id":"elem-id-cbb78f5c-b69f-4f66-bab3-e7fcdc797d71","type":"FlowRelationship","name":"Acquisition Record","documentation":"### Object\nThe Acquisition Record documents the purchase or donation of a new library resource, including provenance and cost.\n\n### Condition\nIt is created after the resource is received and verified.\n\n### Consequence\nArt and museum collections use this record to track similar items or integrate into shared catalogues. Without this record, collection provenance is incomplete, and acquisitions are untraceable.","sourceid":"elem-id-963","targetid":"elem-id-964","specialization":""},{"id":"elem-id-38b4b65d-4787-4158-9a51-55bf5dd1b6e8","type":"FlowRelationship","name":"Actual Expenditure Report","documentation":"### Object\nThe Actual Expenditure Report compares committed and paid expenditure against budgeted amounts for each cost centre.\n\n### Condition\nIt is generated at month-end or upon request after transactions are recorded.\n\n### Consequence\nBudget management reviews variances and reallocates funds if needed. Without this report, overspending goes unnoticed until it is too late to correct.","sourceid":"elem-id-998","targetid":"elem-id-991","specialization":""},{"id":"elem-id-9defeea8-6fd0-45a9-b48c-6cac764bc34e","type":"FlowRelationship","name":"Advanced Training Pathway","documentation":"### Object\nThe pathway describes a sequence of advanced modules and research competencies for a postgraduate researcher beyond the core curriculum.\n\n### Condition\nIt is assigned when the researcher completes the core training and the training team approves the advanced route.\n\n### Consequence\nStudent skills development enrols the researcher in the pathway's modules, and without it advanced skill development has no defined route and remains ad hoc.","sourceid":"elem-id-897","targetid":"elem-id-898","specialization":""},{"id":"elem-id-0faec960-c058-451b-b47c-4a62d5b9fd04","type":"FlowRelationship","name":"Agent Performance Report","documentation":"### Object\nThe report summarising an agent's recruitment outcomes against targets, including conversion and quality metrics.\n\n### Condition\nIssued when agent-submitted data is validated and performance is calculated for a reporting period.\n\n### Consequence\nArrival informs commission, contract renewal, and target adjustment. Absence leaves agent performance unevaluated.","sourceid":"elem-id-854","targetid":"elem-id-852","specialization":""},{"id":"elem-id-621e377e-f505-40b2-8cfe-a94f8c83b562","type":"FlowRelationship","name":"Agent Recruitment Target","documentation":"### Object\nThe set of recruitment targets for an agent, including student numbers by programme, region, and intake.\n\n### Condition\nIssued when annual recruitment targets are set and communicated to the agent management function.\n\n### Consequence\nArrival defines agent performance expectations. Absence leaves agent activity without objectives and complicates performance review.","sourceid":"elem-id-852","targetid":"elem-id-854","specialization":""},{"id":"elem-id-ddd8abca-2155-4725-a8ef-30aae3bc8edb","type":"FlowRelationship","name":"Alumni Profile","documentation":"### Object\nThe profile of an alumnus, including contact preferences, communication history, engagement interests, and event attendance.\n\n### Condition\nIssued when the alumni relationship record is updated with new contact or preference data, and the profile is available for segmentation.\n\n### Consequence\nArrival enables targeting for events and campaigns based on current interest. Absence prevents personalised outreach and reduces event relevance.","sourceid":"elem-id-855","targetid":"elem-id-856","specialization":""},{"id":"elem-id-baea4723-6e1b-4b56-9f16-7969bec7b4e8","type":"FlowRelationship","name":"Analytical Insight Report","documentation":"### Object\nThe Analytical Insight Report presents key findings, visualisations, and dashboards derived from analysed data.\n\n### Condition\nIt is produced after analytics have been validated.\n\n### Consequence\nBusiness reporting incorporates these insights into operational reports for decision-makers. Without this report, managers lack synthesized information and rely on raw data.","sourceid":"elem-id-972","targetid":"elem-id-975","specialization":""},{"id":"id-44ace447-cbff-4975-be1b-9fcc9d41ccf4","type":"FlowRelationship","name":"Appeal Referral","documentation":"","sourceid":"elem-id-200035","targetid":"elem-id-200029","specialization":""},{"id":"elem-id-8b983ede-e027-47e7-af47-2ef553af9f9a","type":"FlowRelationship","name":"Applicant Profile","documentation":"### Object\nThe profile of a domestic applicant relevant to scholarship assessment, including academic merit, background, and financial need.\n\n### Condition\nIssued when a domestic applicant is identified as a scholarship candidate and their profile is passed for assessment.\n\n### Consequence\nArrival enables scholarship ranking and award decisions. Absence leaves eligible students unconsidered for available funds.","sourceid":"elem-id-853","targetid":"elem-id-850","specialization":""},{"id":"elem-id-43dcf1f3-770f-4033-a0c0-b8911de55125","type":"FlowRelationship","name":"Application Access Requirement","documentation":"### Object\nThe Application Access Requirement specifies the user roles and permission levels needed for a new application.\n\n### Condition\nIt is defined during application design and configuration.\n\n### Consequence\nIdentity and access management provisions the appropriate accounts and groups. Without this requirement, users are either unable to access the application or have excessive privileges.","sourceid":"elem-id-956","targetid":"elem-id-959","specialization":""},{"id":"elem-id-8628db3e-ca5d-498d-9ba7-de130da0283c","type":"FlowRelationship","name":"Application Deployment Package","documentation":"### Object\nThe Application Deployment Package contains the compiled software, configuration scripts, and installation instructions for a new or updated application.\n\n### Condition\nIt is prepared after the application has passed testing and is approved for release.\n\n### Consequence\nICT service support installs the package on target systems and provides user support. Without this package, the application cannot be deployed, and users do not receive the update.","sourceid":"elem-id-956","targetid":"elem-id-957","specialization":""},{"id":"elem-id-f94146b8-7d0f-4ec4-8334-25a63b3975a5","type":"FlowRelationship","name":"Approved Budget Allocation","documentation":"### Object\nThe Approved Budget Allocation states the amount of funds permitted for a particular department or project for the financial year.\n\n### Condition\nIt is issued after the budget has been approved by the appropriate authority.\n\n### Consequence\nExpenditure management authorises spending up to the allocated limit. Without this allocation, no expenditure is permitted, and planned activities are halted.","sourceid":"elem-id-991","targetid":"elem-id-998","specialization":""},{"id":"elem-id-644f1d71-7025-4c8e-b9c3-5f065b9b7702","type":"FlowRelationship","name":"Approved Institutional Message","documentation":"### Object\nThe Approved Institutional Message is the authorised text or talking points for external communication on a particular topic.\n\n### Condition\nIt is issued after senior leadership approves the wording.\n\n### Consequence\nMedia relations uses this message in press releases and interviews. Without this message, spokespeople may make unapproved statements, leading to reputational damage.","sourceid":"elem-id-925","targetid":"elem-id-924","specialization":""},{"id":"elem-id-bd3fe9a8-a048-45f8-8fb0-4985a16b9e3d","type":"FlowRelationship","name":"Approved Research Programme","documentation":"### Object\nThe programme defines the research objectives, timeline, budget envelope, and named investigators authorised to start.\n\n### Condition\nIt is issued after institutional approval confirms strategic fit and funding availability. Its arrival means the work has a formal mandate.\n\n### Consequence\nResearch production begins against the approved programme's scope, and without it no new project activity is initiated under that programme.","sourceid":"elem-id-891","targetid":"elem-id-895","specialization":""},{"id":"id-c1964f7f-22de-433d-9d00-c02af9a0b799","type":"FlowRelationship","name":"Approved Research Programme","documentation":"","sourceid":"elem-id-200025","targetid":"elem-id-200021","specialization":""},{"id":"elem-id-fdbb2b65-ad3d-48c7-bb05-f1cd9671c529","type":"FlowRelationship","name":"Approved Strategic Policies","documentation":"### Object\nThis is the set of approved strategic policies derived from the strategic plan, setting institutional direction and priorities.\n\n### Condition\nIt is issued after the strategic plan is approved by the governing body. Arrival means the formal strategic policy instruments are available.\n\n### Consequence\nOn arrival, institutional policies are aligned with the approved strategic direction and regulatory instruments are updated. While absent, policy development proceeds without approved strategic priorities and conflicts with the strategic plan arise.","sourceid":"elem-id-821","targetid":"elem-id-834","specialization":""},{"id":"id-80f26ad9-a3c7-4054-a7d7-e05cdcb19495","type":"FlowRelationship","name":"Approved Strategic Policies","documentation":"","sourceid":"elem-id-200028","targetid":"elem-id-20009","specialization":""},{"id":"elem-id-7148b634-af8e-4c59-ad63-8049d1985609","type":"FlowRelationship","name":"Approved Supplier List","documentation":"### Object\nThe Approved Supplier List identifies suppliers that have passed due diligence and are authorised for use.\n\n### Condition\nIt is maintained and issued when a supplier's status changes or on request.\n\n### Consequence\nProcurement selects from this list when creating purchase orders. Without this list, purchasers may engage unapproved suppliers, increasing risk of fraud or poor quality.","sourceid":"elem-id-999","targetid":"elem-id-990","specialization":""},{"id":"elem-id-5830db32-3174-4942-851d-b93820739843","type":"FlowRelationship","name":"Architecture Compliance Criteria","documentation":"### Object\nThis is a set of criteria for assessing whether projects comply with architecture standards and patterns.\n\n### Condition\nIt is issued when architecture standards are updated. Arrival means the compliance checklist is available for project reviews.\n\n### Consequence\nOn arrival, quality reviews evaluate projects against the architecture criteria and non-compliant designs are flagged. While absent, quality reviews lack architecture compliance checks and non-standard designs pass unchallenged.","sourceid":"elem-id-830","targetid":"elem-id-831","specialization":""},{"id":"id-532fcf88-a022-499d-be82-2e69dd8bd55e","type":"FlowRelationship","name":"Architecture Model","documentation":"","sourceid":"elem-id-20004","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-01ce2f0c-dd6b-4876-ae8a-0cc4c9f7d4f9","type":"FlowRelationship","name":"Architecture Models","documentation":"### Object\nThis is the set of architecture models and standards, including current-state diagrams, target-state patterns, and approved technology standards.\n\n### Condition\nIt is issued when architecture artefacts are baselined and approved by architecture governance. Arrival means authoritative architecture content is available for enterprise access.\n\n### Consequence\nOn arrival, the architecture models become available to all authorised consumers and projects use the approved standards. While absent, content consumers access outdated architecture models and projects apply non-standard patterns.","sourceid":"elem-id-830","targetid":"elem-id-974","specialization":""},{"id":"elem-id-007d0b48-dc14-4abd-b24c-b7b6c43789bc","type":"FlowRelationship","name":"As-Built Documentation","documentation":"### Object\nThe As-Built Documentation records the final layout, systems, and materials of a completed construction or renovation project.\n\n### Condition\nIt is issued after the project is complete and all changes from original design are captured.\n\n### Consequence\nProperty maintenance uses these records to locate assets, plan maintenance, and diagnose issues. Without this documentation, maintenance staff lack accurate records of what was built, leading to errors and costly investigations.","sourceid":"elem-id-980","targetid":"elem-id-983","specialization":""},{"id":"elem-id-c1cd2350-6fca-45a7-bcd0-507331264538","type":"FlowRelationship","name":"Assessment Brief","documentation":"### Object\nThe assessment brief, carrying the task title, submission deadline, marking criteria, word count, format, and academic integrity requirements.\n\n### Condition\nIssued when the assessment design has been approved against module learning outcomes and the assessment policy, and the scheduling window is confirmed.\n\n### Consequence\nArrival releases the formal task to students and enables submission collection. Absence leaves students without defined assessment requirements and prevents valid submission.","sourceid":"elem-id-887","targetid":"elem-id-884","specialization":""},{"id":"elem-id-9c00fa56-db56-448d-8f89-0b2ec7638f48","type":"FlowRelationship","name":"Assessment Policy","documentation":"### Object\nThe set of rules governing assessment design, submission deadlines, extensions, academic integrity, marking, and feedback turnaround.\n\n### Condition\nIssued when policy revisions are approved by academic governance and published for the academic year.\n\n### Consequence\nArrival sets binding standards for assessment design and conduct. Absence leaves assessment arrangements without regulatory basis and creates inconsistency across modules.","sourceid":"elem-id-840","targetid":"elem-id-887","specialization":""},{"id":"id-00120e3a-a89e-4e19-b448-ef1cc789c94c","type":"FlowRelationship","name":"Assessment Regulations","documentation":"","sourceid":"elem-id-20001","targetid":"elem-id-200031","specialization":""},{"id":"id-f2524852-8325-427f-b5c7-1f20e2614cde","type":"FlowRelationship","name":"Assessment Results","documentation":"","sourceid":"elem-id-200031","targetid":"elem-id-200029","specialization":""},{"id":"elem-id-8ce0796d-b603-478c-8cfc-a8771eba2670","type":"FlowRelationship","name":"Assessment Submission","documentation":"### Object\nThe student's completed response to the assessment brief, including the answer content, cover sheet, and any similarity report receipt.\n\n### Condition\nIssued when a student submits work before the deadline and the submission passes file format and academic integrity checks.\n\n### Consequence\nArrival enters the work into marking queues and allocates it to markers. Absence leaves the student unassessed for that task and produces no grade.","sourceid":"elem-id-884","targetid":"elem-id-886","specialization":""},{"id":"elem-id-0e573f35-77c0-4985-b163-7759ca4bd22c","type":"FlowRelationship","name":"Asset Acquisition Notice","documentation":"### Object\nThe Asset Acquisition Notice announces that a procured asset has been received and is ready to be recorded in the asset register.\n\n### Condition\nIt is issued after goods receipt and inspection.\n\n### Consequence\nAsset management adds the asset to the register with its purchase details. Without this notice, the asset is not tracked, and depreciation is not calculated.","sourceid":"elem-id-990","targetid":"elem-id-995","specialization":""},{"id":"elem-id-9e35a94f-757f-4328-a936-c9eca2c9d6d4","type":"FlowRelationship","name":"Asset Condition Report","documentation":"### Object\nThe Asset Condition Report assesses the current state of building systems and major assets, noting deterioration and remaining useful life.\n\n### Condition\nIt is produced after periodic surveys or maintenance inspections.\n\n### Consequence\nEstate development prioritises capital projects for renewal based on this report. Without it, asset failures are unexpected, and investment is reactive rather than planned.","sourceid":"elem-id-983","targetid":"elem-id-980","specialization":""},{"id":"elem-id-2325bd9b-e99e-46b2-9ea4-00dc8d743040","type":"FlowRelationship","name":"Asset Register","documentation":"### Object\nThe Asset Register is the authoritative list of all institutional assets, including descriptions, locations, values, and ownership.\n\n### Condition\nIt is updated whenever an asset is acquired, disposed of, or moved.\n\n### Consequence\nInsurance management uses the register to determine coverage needs and premiums. Without this register, assets are uninsured or incorrectly valued, leading to inadequate compensation in a loss.","sourceid":"elem-id-995","targetid":"elem-id-994","specialization":""},{"id":"elem-id-24341411-ab53-49e5-9e34-ae67546bebc6","type":"FlowRelationship","name":"Audit Performance Findings","documentation":"### Object\nThis is a set of performance findings from internal audit engagements, with metrics on control effectiveness and operational deficiencies.\n\n### Condition\nIt is issued after an internal audit engagement concludes and findings are approved. Arrival means audited evidence of performance gaps is available.\n\n### Consequence\nOn arrival, the findings are incorporated into performance reports and corrective performance objectives are set. While absent, performance reports lack independent assurance of reported results and known deficiencies go uncorrected.","sourceid":"elem-id-835","targetid":"elem-id-825","specialization":""},{"id":"elem-id-349a020b-b34c-4557-9819-b447f6b2af1b","type":"FlowRelationship","name":"Audit Risk Assessments","documentation":"### Object\nThis object carries risk assessments derived from audit findings, including likelihood, impact, and identified control gaps.\n\n### Condition\nIt is issued when audit fie
