ithout correction, causing downstream analytics and reporting to be unreliable.","specialization":""},{"id":"elem-id-967","type":"BusinessProcess","name":"Information & Data Security Mgt","documentation":"### Identity\nInformation and data security management, including risk assessment, security controls, and incident response.\n\n### Trigger\nThe arrival of a security risk assessment request or a security incident report.\n\n### Consumes\nSecurity Risk Assessment supplies the identified threats and vulnerabilities. Security Incident Report supplies the incident details and affected assets. Security Policy supplies the required controls and procedures.\n\n### Steps\nThe process assesses security risks and assigns risk owners. It implements security controls. It monitors for security events. It responds to incidents, containing and eradicating threats. It conducts root cause analysis. It reports to governance. It updates the risk register. If an incident involves personal data, it assesses breach notification requirements. It reviews controls after the incident.\n\n### Produces\nSecurity Risk Register Update records the current risks and controls. Security Incident Response Record states the actions taken and recovery. Security Breach Notification records the notification to the regulator or data subjects.\n\n### Outcome\nThe institution protects its information assets and responds effectively to security incidents.\n\n### Fails when\nA security control is missing, allowing a data breach that causes financial and reputational damage.","specialization":""},{"id":"elem-id-972","type":"BusinessProcess","name":"Information Analytics","documentation":"### Identity\nAdvanced data analytics, including predictive modelling, business intelligence, and insight generation.\n\n### Trigger\nThe arrival of an analytics request or a scheduled analytics model refresh.\n\n### Consumes\nAnalytics Request supplies the business question and data required. Prepared Data Set supplies the cleaned and transformed data. Analytics Model supplies the existing model logic and parameters.\n\n### Steps\nThe process defines the analysis objective. It prepares the data set. It builds or refines the model. It validates the model. It runs the analysis and interprets results. It presents insights to the decision-maker. It monitors model performance. If the model drifts, it is retrained. It documents assumptions.\n\n### Produces\nAnalytics Report states the findings, method, and recommended actions. Model Update records the new version and performance. Presentation Deck supplies the communicated insights.\n\n### Outcome\nThe institution uses data-driven insights for better decisions.\n\n### Fails when\nThe model is not validated against current data, causing misleading insights and poor decisions.","specialization":""},{"id":"elem-id-968","type":"BusinessProcess","name":"Information Collection Mgt","documentation":"### Identity\nCollection of information from internal and external sources, including forms, surveys, and automated feeds.\n\n### Trigger\nThe arrival of a collection requirement or a data submission deadline.\n\n### Consumes\nCollection Requirement supplies the data fields and sources. Data Collection Form supplies the template for respondents. Existing Data Source supplies prior data available internally.\n\n### Steps\nThe process defines the collection method and coverage. It designs or configures the collection form. It launches the collection. It validates incoming data for completeness and eligibility. It stores the data in the appropriate repository. It follows up non-response. It closes the collection. If data quality issues are found, they are reported back to the source.\n\n### Produces\nCollected Data Set states the gathered data and its quality status. Data Collection Validation Report records the checks and issues. Non-Response Follow-Up List states the outstanding submissions.\n\n### Outcome\nThe institution has complete and valid data for the intended purpose.\n\n### Fails when\nResponse rates are insufficient, causing biased or incomplete data for analysis.","specialization":""},{"id":"elem-id-966","type":"BusinessProcess","name":"Information Search & Discovery","documentation":"### Identity\nSearch and discovery across institutional information, including enterprise search and metadata-driven retrieval.\n\n### Trigger\nThe arrival of a search query or an index refresh requirement.\n\n### Consumes\nSearch Query supplies the user's terms and filters. Search Index supplies the indexed content and metadata. Content Classification Scheme supplies the tags and categories.\n\n### Steps\nThe process receives the search query. It expands and disambiguates the terms. It matches against the search index. It ranks results by relevance and security. It returns the results to the user. It logs usage and failed searches. It updates the index periodically. If results are poor, it refines the indexing rules.\n\n### Produces\nSearch Results Set states the returned items. Search Usage Log records the queries and outcomes. Index Update Record states the refresh.\n\n### Outcome\nUsers find the information they need quickly, and search logs inform index improvements.\n\n### Fails when\nThe search index is outdated, causing users to miss critical information.","specialization":""},{"id":"elem-id-955","type":"BusinessProcess","name":"Infrastructure Lifecycle Mgt","documentation":"### Identity\nManagement of the ICT infrastructure lifecycle, including servers, networks, and data centres.\n\n### Trigger\nThe arrival of a capacity shortfall or a hardware end-of-life notification.\n\n### Consumes\nInfrastructure Inventory supplies the current hardware and software versions. Capacity Report supplies the utilisation and growth trends. Technology Roadmap supplies the planned infrastructure standards.\n\n### Steps\nThe process assesses current capacity and performance. It plans upgrades or replacements. It procures new hardware. It installs and configures. It tests and migrates workloads. It monitors post-migration. It retires old hardware. It updates documentation. If a failure occurs, it executes the disaster recovery plan.\n\n### Produces\nInfrastructure Build Record states the new components installed. Capacity Upgrade Plan states the planned improvements. Decommissioning Record states the removal of old hardware.\n\n### Outcome\nThe infrastructure is current, resilient, and sized to meet demand.\n\n### Fails when\nCapacity planning is unreliable, causing unexpected hardware failure or inability to support new applications.","specialization":""},{"id":"elem-id-994","type":"BusinessProcess","name":"Insurance Mgt","documentation":"### Identity\nManagement of insurance policies, claims, and risk assessments for institutional assets and activities.\n\n### Trigger\nThe arrival of a renewal date for an insurance policy or an insurance claim.\n\n### Consumes\nInsurance Policy supplies the coverage terms, limits, and exclusions. Insurance Claim supplies the incident, loss, and amount claimed. Risk Register supplies the institutional risks that insurance may cover.\n\n### Steps\nThe process reviews insurance needs against the risk register and asset values. It obtains quotes and selects insurers. It issues and maintains policies. It handles claims by collecting documentation and submitting to insurers. It tracks claim progress and settlements. It records incidents that may give rise to claims. It reviews claims history to adjust coverage. If a claim is disputed, it escalates to legal. It confirms renewal or terminates policies.\n\n### Produces\nInsurance Policy Record states the current coverage and expiry. Insurance Claim File records the claim status and settlement. Claim Settlement Statement states the amount paid by the insurer.\n\n### Outcome\nThe institution has adequate insurance coverage and legitimate claims are settled.\n\n### Fails when\nA claim is denied because a policy condition was not met, causing an uninsured loss and budget impact.","specialization":""},{"id":"elem-id-835","type":"BusinessProcess","name":"Internal Audit and Reporting","documentation":"### Identity\nThis process provides independent assurance over the institution's governance, risk management, and control processes through planned audits. It is the part of the capability that verifies the effectiveness of internal controls.\n\n### Trigger\nThe approval of the Annual Audit Plan triggers the process, when the audit team is resourced and the audit has been scheduled.\n\n### Consumes\nAudit Plan supplies the list of audits, scope, and timing. Control Framework supplies the expected controls and their design. Evidence Record supplies the operational records needed to test control operation.\n\n### Steps\nFirst the process prepares the audit by defining the audit objectives and test procedures. It then performs fieldwork, testing the control framework against evidence. It records any deviations as draft audit findings. It holds a closing meeting with management to confirm the facts. It drafts the Internal Audit Report with findings and recommendations. It obtains management's response, including action owners and due dates. It issues the final report to the audit committee. It then follows up at agreed intervals to verify completion of actions.\n\n### Produces\nAudit Findings record each control weakness, its impact, and its severity. Internal Audit Report records the audit objectives, methodology, findings, and management responses. Corrective Action Plan records the agreed actions, owners, and due dates.\n\n### Outcome\nThe governing body and management have an independent assessment of the control environment, with agreed corrective actions for every identified weakness.\n\n### Fails when\nManagement does not respond to draft findings, because the Internal Audit Report cannot be issued and no Corrective Action Plan is created, leaving control weaknesses unaddressed.","specialization":""},{"id":"elem-id-940","type":"BusinessProcess","name":"Internal Communications","documentation":"### Identity\nInternal communications to staff and students, including announcements, newsletters, and notices.\n\n### Trigger\nThe arrival of an internal communication request from leadership.\n\n### Consumes\nCommunication Request supplies the message and audience. Audience List supplies the distribution list. Channel Configuration Record supplies the available channels.\n\n### Steps\nThe process reviews the request. It drafts the message. It obtains approval. It distributes via selected channels. It monitors readership. It answers questions. It archives the communication. If the message is sensitive, it applies access controls. It reports on engagement.\n\n### Produces\nInternal Communication Item states the distributed message. Distribution Confirmation records who received it. Engagement Report records opens and clicks.\n\n### Outcome\nThe internal community is informed about institutional matters.\n\n### Fails when\nA critical message is not distributed to all intended staff, causing confusion and non-compliance.","specialization":""},{"id":"elem-id-925","type":"BusinessProcess","name":"Internal Stakeholder Relationship Mgt","documentation":"### Identity\nManagement of relationships with internal stakeholders, including academic and administrative units, to ensure alignment and communication.\n\n### Trigger\nThe arrival of an internal stakeholder request or a scheduled stakeholder engagement plan.\n\n### Consumes\nInternal Stakeholder Request supplies the need or issue to be addressed. Stakeholder Map supplies the list of internal groups and their interests. Communication Channel Record supplies the preferred and available channels.\n\n### Steps\nThe process identifies the relevant internal stakeholder groups. It plans engagement activities and messages. It delivers communications and meetings. It collects feedback. It resolves any issues raised. It updates the stakeholder map with new contacts or preferences. It reports on engagement outcomes. If a request requires action, it is assigned to the relevant unit.\n\n### Produces\nStakeholder Engagement Plan states the engagement activities and schedule. Engagement Feedback Summary records the points raised. Internal Communication Item delivers the message to the stakeholder group.\n\n### Outcome\nInternal stakeholders are informed and aligned with institutional plans, and their issues are managed.\n\n### Fails when\nA key internal stakeholder group is not consulted on a decision affecting them, causing resistance and delayed implementation.","specialization":""},{"id":"elem-id-852","type":"BusinessProcess","name":"International Student Recruitment","documentation":"### Identity\nThe work of recruiting international students, including agent management and visa-related attraction.\n\n### Trigger\nThe international recruitment cycle begins.\n\n### Consumes\nInternational Recruitment Plan supplies target markets and channels. Student Recruitment Agent Contract supplies agent obligations. Country Entry Requirements supplies visa and qualification information. Prospectus supplies programme information.\n\n### Steps\nThe plan is executed in target markets. Agents are briefed and provided with Prospectus materials. Enquiries are handled and converted to Student Applications. Visa requirements are communicated. The agent performance is tracked against Student Recruitment Agent Contract. Conversion rates are monitored. Underperforming agents are reviewed. A country-level report is produced.\n\n### Produces\nInternational Recruitment Campaign Report. Agent Performance Report. Student Application.\n\n### Outcome\nInternational applicants are recruited within planned numbers and agent performance is measured.\n\n### Fails when\nVisa policy changes reduce conversion and no alternative markets are identified, missing intake targets.","specialization":""},{"id":"elem-id-970","type":"BusinessProcess","name":"Knowledge Mgt","documentation":"### Identity\nKnowledge management, including capturing, organising, and sharing institutional knowledge.\n\n### Trigger\nThe arrival of new knowledge from a completed project or a knowledge request.\n\n### Consumes\nKnowledge Item supplies the new content or lesson learned. Knowledge Taxonomy supplies the classification structure. Knowledge Request supplies the user's specific information need.\n\n### Steps\nThe process captures knowledge from projects, incidents, and experts. It reviews and validates the knowledge. It classifies it in the taxonomy. It stores in the knowledge base. It publishes and promotes. It answers knowledge requests. It reviews knowledge for currency. Retired knowledge is archived. If knowledge is outdated, it is updated or removed.\n\n### Produces\nKnowledge Article states the validated knowledge. Knowledge Base Update records the added or changed entry. Knowledge Request Response supplies the answer to the requester.\n\n### Outcome\nThe institution leverages its collective knowledge, reducing rework and improving decisions.\n\n### Fails when\nCritical knowledge resides only in individuals' heads and is lost when they leave.","specialization":""},{"id":"elem-id-977","type":"BusinessProcess","name":"Legal & Legislative Compliance","documentation":"### Identity\nManagement of legal and legislative compliance, including horizon scanning, impact assessment, and adherence monitoring.\n\n### Trigger\nThe arrival of new legislation or a compliance audit finding.\n\n### Consumes\nLegislation Update supplies the new or changed law. Compliance Register supplies the current obligations and controls. Audit Finding supplies the identified non-compliance.\n\n### Steps\nThe process scans for new legislation affecting the institution. It assesses impact. It updates the compliance register. It assigns compliance owners. It monitors compliance controls. It reports to governance. It remediates audit findings. It provides training on new requirements. If a breach is found, it escalates to legal. The register is reviewed regularly.\n\n### Produces\nCompliance Impact Assessment states the effect of new law. Compliance Register Update records changes. Compliance Remediation Plan states the actions to close findings.\n\n### Outcome\nThe institution meets its legal obligations and manages compliance risks.\n\n### Fails when\nNew legislation is missed, causing a breach and enforcement action.","specialization":""},{"id":"elem-id-979","type":"BusinessProcess","name":"Legal Advisory","documentation":"### Identity\nProvision of legal advice to internal clients on routine and complex matters.\n\n### Trigger\nThe arrival of a legal query from a department.\n\n### Consumes\nLegal Query supplies the facts and question. Policy Document supplies the internal rules. Legislation Database supplies the applicable laws.\n\n### Steps\nThe process reviews the query and gathers facts. It researches the legal position. It drafts advice. It reviews with a senior lawyer. It issues the advice. It discusses implications with the client. It updates the advice log. It follows up on material changes. If the matter is complex, it escalates to external counsel.\n\n### Produces\nLegal Advice Note states the recommendation and basis. External Counsel Instructions records the engagement for external advice. Legal Advice Log Update records the advice given.\n\n### Outcome\nThe institution receives sound legal advice, enabling compliant decisions.\n\n### Fails when\nA legal query is not answered before the decision deadline, causing either a poor decision or a lost opportunity.","specialization":""},{"id":"elem-id-962","type":"BusinessProcess","name":"Library Collection Access Mgt","documentation":"### Identity\nManagement of access to library collections, including loans, reading rooms, and access permissions.\n\n### Trigger\nThe arrival of a library loan request or an access permission request.\n\n### Consumes\nLibrary Loan Request supplies the item and borrower. Borrower Record supplies the user's eligibility and standing. Collection Item Record supplies the availability and location.\n\n### Steps\nThe process verifies borrower eligibility and any outstanding blocks. It checks item availability. It issues the loan and sets due date. It manages renewals and returns. It handles reserves and recalls. It manages reading room access. It applies fines for overdue items. It reports on usage. If an item is not returned, it follows the lost items policy.\n\n### Produces\nLibrary Loan Record states the borrower, item, and due date. Access Grant states the permitted reading room use. Overdue Notice states the item and fine.\n\n### Outcome\nLibrary users can access collections within policy, and items circulate correctly.\n\n### Fails when\nA borrower has an unresolved block but is still granted access, causing loss of materials and unfairness.","specialization":""},{"id":"elem-id-963","type":"BusinessProcess","name":"Library Collection Resource Mgt","documentation":"### Identity\nManagement of library collection resources, including acquisition, cataloguing, and deselection.\n\n### Trigger\nThe arrival of a collection development plan or an acquisition request.\n\n### Consumes\nAcquisition Request supplies the requested resource and justification. Collection Development Policy supplies the selection criteria. Current Holdings Record supplies the existing collection.\n\n### Steps\nThe process evaluates the request against policy and budget. It acquires the resource. It catalogues and classifies it. It adds it to the library system. It promotes new acquisitions. It monitors usage. It deselects low-use or damaged items. It updates holdings records. If an item is not available through normal suppliers, an interlibrary loan or alternative is considered.\n\n### Produces\nLibrary Item Catalogue Record states the new item and metadata. Acquisition Order states the purchase order for the resource. Deselection List states the items removed.\n\n### Outcome\nThe library collection is current, relevant, and within budget.\n\n### Fails when\nAcquisition requests exceed budget, causing the collection to fall behind user needs.","specialization":""},{"id":"elem-id-965","type":"BusinessProcess","name":"Library Membership Mgt","documentation":"### Identity\nManagement of library memberships, including registration, entitlement, and expiry.\n\n### Trigger\nThe arrival of a membership application or a renewal request.\n\n### Consumes\nMembership Application supplies the applicant's details and status. Entitlement Policy supplies who is entitled and the fees. Membership Record supplies the existing membership.\n\n### Steps\nThe process verifies the applicant's entitlement. It collects any fee. It creates or renews the membership. It issues a library card. It records the expiry date. It manages changes to status. It cancels membership on departure. If the applicant is not entitled, a guest or fee-paying option may be offered. It reviews membership data regularly.\n\n### Produces\nLibrary Membership Card states the member and expiry. Membership Record Update states the current status. Fee Receipt records any payment.\n\n### Outcome\nThe institution has an accurate membership base with correct entitlements.\n\n### Fails when\nAn ineligible person receives membership, creating security and accountability problems.","specialization":""},{"id":"elem-id-987","type":"BusinessProcess","name":"Mail Mgt","documentation":"### Identity\nDaily processing of inbound and outbound institutional mail, parcels, and courier items.\n\n### Trigger\nThe arrival of inbound post or a request for an outbound mailing.\n\n### Consumes\nInbound Mail Item supplies the recipient address and contents. Outbound Mailing Request supplies the sender, destination, and service required. Mailroom Capacity Record supplies the handling capacity for peak volumes.\n\n### Steps\nThe process sorts inbound mail by department and urgency. It records registered and tracked items. It distributes mail to internal locations. It processes outbound requests, checking address and service. It franks or arranges courier collection. It logs tracking numbers and delivery confirmations. Undeliverable items are returned to sender or held for collection.\n\n### Produces\nMail Delivery Log records each item's receipt and internal delivery. Outbound Dispatch Record states the date and service used for each outbound item. Undeliverable Mail Notice informs the sender of non-delivery.\n\n### Outcome\nMail is processed and delivered within agreed timescales, with tracking information available for each item.\n\n### Fails when\nA mail item is lost or misdelivered, causing missed deadlines or confidential information exposure.","specialization":""},{"id":"elem-id-902","type":"BusinessProcess","name":"Manage Research Relationships","documentation":"### Identity\nWork here establishes and sustains relationships with external research partners, funders, and stakeholders so that collaborative activity is tracked and obligations are met.\n\n### Trigger\nThe arrival of a Collaboration Request from an external organisation, when no active Research Partnership Agreement covers that organisation for the proposed activity.\n\n### Consumes\nCollaboration Request supplies the proposed activity, partner details, and desired outcomes. Research Relationship Register supplies the history of past interactions and current agreements with the partner. Stakeholder Engagement Record supplies the last recorded contact and any outstanding commitments. Research Partnership Agreement supplies the terms and obligations when an existing agreement covers the relationship.\n\n### Steps\nThe Collaboration Request is checked against the Research Relationship Register to identify existing links. If an active Research Partnership Agreement exists, the request is routed to the agreement owner for renewal or amendment. If no agreement exists, the process drafts a new Research Partnership Agreement covering data sharing, intellectual property, and publication rights. The draft is approved by legal and the partner before being signed. After signing, the relationship is added to the Research Relationship Register. The process then sets a schedule for Stakeholder Engagement Records and produces a Partnership Performance Report at each annual review.\n\n### Produces\nResearch Partnership Agreement: issued when the collaboration terms are signed, establishing the legal basis for joint work. Research Relationship Register: updated with the new or amended relationship, establishing the current relationship portfolio. Partnership Performance Report: issued at review points, establishing whether the collaboration is delivering against its objectives.\n\n### Outcome\nEvery external research relationship is under a signed agreement and is actively reviewed.\n\n### Fails when\nThe Stakeholder Engagement Record shows no contact for over a year and the process does not schedule a review; the partnership lapses and the Research Partnership Agreement is breached.","specialization":""},{"id":"elem-id-930","type":"BusinessProcess","name":"Market Research","documentation":"### Identity\nConducting market research to understand prospective students, employers, and stakeholders.\n\n### Trigger\nThe arrival of a research brief or a scheduled market survey.\n\n### Consumes\nResearch Brief supplies the questions and objectives. Sample Frame supplies the target population and contacts. Survey Instrument supplies the questionnaire.\n\n### Steps\nThe process designs the research method. It selects the sample. It collects data. It cleans and analyses data. It prepares the report. It presents insights. It updates the research database. If response rates are low, it adjusts the sample or method. It archives the research.\n\n### Produces\nMarket Research Report states the findings and implications. Data Set Update records the new data. Research Presentation supplies the key insights.\n\n### Outcome\nThe institution understands its market and stakeholders, informing strategy and campaigns.\n\n### Fails when\nThe sample is not representative, causing misleading insights and poor decisions.","specialization":""},{"id":"elem-id-931","type":"BusinessProcess","name":"Marketing Mgt","documentation":"### Identity\nOverall marketing management, including planning, budgeting, and coordination of all marketing activities.\n\n### Trigger\nThe arrival of the annual planning cycle or a marketing performance review.\n\n### Consumes\nInstitutional Strategy supplies the goals and target market. Current Marketing Plan supplies the existing initiatives. Market Research Report supplies the insights and competitor data.\n\n### Steps\nThe process develops the marketing strategy. It allocates budget. It plans the annual programme of activities. It monitors performance against KPIs. It adjusts the programme. It reports to governance. It coordinates with other communication teams. If a market opportunity arises, it reallocates budget. It reviews the plan quarterly.\n\n### Produces\nMarketing Plan states the annual objectives and activities. Marketing Budget Allocation states the spend by activity. Marketing Performance Report records results against targets.\n\n### Outcome\nThe institution's marketing is strategic, coordinated, and measured.\n\n### Fails when\nMarketing activities are not aligned with recruitment targets, causing missed enrolment goals.","specialization":""},{"id":"elem-id-924","type":"BusinessProcess","name":"Media Relations Mgt","documentation":"### Identity\nMedia relations, including proactive press engagement, crisis communication, and media monitoring.\n\n### Trigger\nThe arrival of a media enquiry or a scheduled press release date.\n\n### Consumes\nMedia Enquiry supplies the journalist's question and deadline. Press Release Draft supplies the intended message. Media Contact List supplies the targeted outlets and journalists.\n\n### Steps\nThe process logs the enquiry or press release request. It drafts or refines the response or press release. It obtains approval from the communications lead. It issues the response or release by the deadline. It monitors media coverage. It responds to follow-up questions. If the story is negative, it activates a crisis communication plan. It records all interactions and coverage.\n\n### Produces\nPress Release states the official institutional statement. Media Response states the answer given to an enquiry. Media Coverage Report records the resulting coverage and tone.\n\n### Outcome\nThe institution's reputation is protected and promoted through managed media engagement.\n\n### Fails when\nA media enquiry receives no response or an unapproved statement is issued, causing reputational harm and loss of control.","specialization":""},{"id":"elem-id-932","type":"BusinessProcess","name":"Merchandising","documentation":"### Identity\nManagement of institutional merchandise, including design, production, stock, and sales.\n\n### Trigger\nThe arrival of a merchandise product request or a stock replenishment trigger.\n\n### Consumes\nMerchandise Product Request supplies the item concept and approval. Stock Record supplies the current inventory. Sales Channel Order supplies the demand.\n\n### Steps\nThe process designs or sources the product. It obtains brand approval. It places a production order. It receives and stores stock. It manages sales channels. It tracks stock levels and reorders. It prices products. It runs promotions. It discontinues slow items. It reports on sales and profit.\n\n### Produces\nMerchandise Product Line states the items and prices. Stock Replenishment Order states the quantity reordered. Merchandise Sales Report records revenue and margin.\n\n### Outcome\nThe institution sells merchandise that supports the brand and generates income.\n\n### Fails when\nStock is over- or under-supplied, causing lost sales or obsolescence.","specialization":""},{"id":"elem-id-838","type":"BusinessProcess","name":"Module Selection Mgt","documentation":"### Identity\nThe work of processing student module choices and producing module registrations.\n\n### Trigger\nThe module selection window opens for the term.\n\n### Consumes\nStudent Enrolment supplies the student's programme. Module Catalogue supplies available modules. Programme Requirements Register supplies compulsory and optional modules. Timetable supplies the session slots.\n\n### Steps\nThe student submits a Module Selection Form. The choices are checked against programme requirements and prerequisites. Capacity checks are performed against module limits. Timetable conflicts are detected. Conflicts are identified and resolved. The Module Registration is created. The student is confirmed.\n\n### Produces\nModule Registration. Module Selection Confirmation.\n\n### Outcome\nEach student has a valid set of module registrations for the term.\n\n### Fails when\nThe student selects too few credits and does not amend the form, leaving incomplete registration.","specialization":""},{"id":"elem-id-881","type":"BusinessProcess","name":"Non Presence Based Teaching","documentation":"### Identity\nThe work of delivering asynchronous or online teaching sessions.\n\n### Trigger\nThe published Timetable indicates a non-presence based session.\n\n### Consumes\nTeaching Content Pack supplies the learning materials. Module Registration supplies the participant list. Virtual Learning Platform supplies the delivery environment. Accessibility Check supplies the compliance status.\n\n### Steps\nThe materials are uploaded to the platform. The session is made available. Students are notified. Activity is monitored and recorded. Completion tracking is enabled. A reminder is sent to non-participants.\n\n### Produces\nTeaching Session Record. Student Participation Log. Completion Report.\n\n### Outcome\nStudents access learning asynchronously as scheduled.\n\n### Fails when\nThe Virtual Learning Platform is unavailable and the session cannot be delivered.","specialization":""},{"id":"elem-id-860","type":"BusinessProcess","name":"Non-Academic Achievement Mgt","documentation":"### Identity\nThe work of recording and recognising student achievements outside the formal curriculum.\n\n### Trigger\nA student submits evidence of a non-academic achievement.\n\n### Consumes\nNon-Academic Achievement Evidence supplies the activity details. Student Record supplies the student identity. Recognition Criteria supplies the rules for acceptance.\n\n### Steps\nThe evidence is verified. The achievement is logged against the Student Record. If the achievement qualifies under Recognition Criteria, it is included in a supplementary transcript entry. The student is notified. A certificate of participation may be issued for certain achievements.\n\n### Produces\nNon-Academic Achievement Log. Updated Student Record. Supplementary Transcript Entry.\n\n### Outcome\nStudent achievements beyond the curriculum are formally recorded.\n\n### Fails when\nThe evidence cannot be verified and the achievement is not recorded.","specialization":""},{"id":"elem-id-904","type":"BusinessProcess","name":"Non-Commercial Research Impact Mgt","documentation":"### Identity\nWork here collects and curates evidence of non-commercial research impact, turning that evidence into assessed case studies for external evaluation.\n\n### Trigger\nThe arrival of an Impact Evidence submission from a researcher, when the evidence relates to a Research Output that is not under a commercialisation route.\n\n### Consumes\nImpact Evidence supplies the observed change, beneficiary, and supporting documentation. Research Output supplies the underpinning research that led to the impact. Impact Case Study supplies the template and required narrative fields for the external assessment. Impact Framework supplies the criteria and weighting used to judge whether evidence is sufficient.\n\n### Steps\nThe Impact Evidence is logged and linked to the relevant Research Output. The process then assesses the evidence against the Impact Framework criteria for reach and significance. If the evidence fails the threshold, it is stored in the Impact Evidence Register but not progressed. If it passes, the process drafts an Impact Case Study using the supplied template, describing the research, the pathway, and the evidence. The draft is reviewed by the academic lead and, if revisions are required, returned. When approved, the Impact Case Study is submitted to the external assessment body. The process then records the submission in the Impact Evidence Register.\n\n### Produces\nImpact Case Study: issued when the evidence has been assembled and approved, establishing the institution's formal submission. Impact Evidence Register: updated with the evidence and its assessment status, establishing a searchable record of impact claims.\n\n### Outcome\nNon-commercial research impact is evidenced, assessed, and available for external evaluation.\n\n### Fails when\nThe Impact Evidence is accepted without checking it against the Impact Framework and an Impact Case Study is submitted with insufficient significance; the external assessment rejects the case and the institution's impact score drops.","specialization":""},{"id":"elem-id-948","type":"BusinessProcess","name":"Occupational Health","documentation":"### Identity\nOccupational health management, including referrals, assessments, and return-to-work plans.\n\n### Trigger\nThe arrival of an occupational health referral or a return-to-work notification.\n\n### Consumes\nOccupational Health Referral supplies the reason and employee details. Employee Record supplies the job role and sickness history. Medical Assessment Report supplies the clinical findings and fitness for work.\n\n### Steps\nThe process triages the referral. It arranges a medical assessment. It receives the assessment report and interprets its impact on the employee's role. It arranges the workplace adjustments or return-to-work plan. It monitors the employee's progress. If the employee is unfit, it manages long-term absence procedures. It reviews the case at defined intervals. It records all decisions.\n\n### Produces\nOccupational Health Report states the employee's fitness and recommendations. Return to Work Plan states the phased return or adjustments. Workplace Adjustment Record states the changes made to the job.\n\n### Outcome\nEmployees are supported through health issues and return to work in a managed way, reducing absence and risk.\n\n### Fails when\nOccupational health advice is not acted upon, causing an employee to return too early and suffer further harm.","specialization":""},{"id":"elem-id-869","type":"BusinessProcess","name":"Offer, Acceptance & Quota Mgt","documentation":"### Identity\nThe work of converting assessed applications into offers and acceptances while managing intake quotas.\n\n### Trigger\nAn Assessed Application is released for offer decision.\n\n### Consumes\nAssessed Application supplies the applicant's qualifications and fee status. Quota Register supplies the remaining places per programme. Academic Policy supplies offer conditions. Offer Template supplies the standard wording.\n\n### Steps\nThe applicant's qualifications are compared to programme entry requirements. If the applicant meets unconditional requirements and quota is available, an Unconditional Offer is issued. If conditional, a Conditional Offer is issued with conditions. The offer is recorded in the Quota Register as a provisional place. The applicant responds with an Offer Acceptance or rejection. Acceptances are matched against quota; if quota is full, accepted applicants are placed on a waiting list or offered an alternative. Once the applicant meets conditions, the Conditional Offer is converted to an Unconditional Offer. The final acceptance is confirmed.\n\n### Produces\nConditional Offer. Unconditional Offer. Offer Acceptance. Updated Quota Register.\n\n### Outcome\nThe institution has a controlled intake of accepted applicants within quota.\n\n### Fails when\nQuota is exhausted and no alternative is accepted, leaving applicants without a place.","specialization":""},{"id":"elem-id-828","type":"BusinessProcess","name":"Organisational Design","documentation":"### Identity\nThis process designs changes to the institution's organisational structure, roles, and responsibilities to align with strategic change. It is the part of the capability that ensures structural decisions are deliberate and consultative.\n\n### Trigger\nA Business Case requiring structural change, such as a new unit or merged department, is approved and starts the process when the current structure is known to be insufficient.\n\n### Consumes\nCurrent Organisation Structure supplies the existing reporting lines, roles, and headcount. Workforce Data supplies the staff capabilities, grades, and locations. Business Case supplies the strategic rationale and the required new capabilities.\n\n### Steps\nFirst the process analyses the Current Organisation Structure and Workforce Data against the Business Case. Then it develops two or more Organisation Design Options. It consults with affected staff and recognised trade unions, recording their feedback. It selects the preferred option based on feasibility, cost, and impact. It then prepares a Transition Plan setting out steps, dates, and responsibilities for implementation. If consultation identifies a legal risk, the process escalates to the governing body before proceeding.\n\n### Produces\nOrganisation Design Options records the alternative structures considered and their assessment. Approved Organisation Structure records the new reporting lines and position titles. Transition Plan records the sequence of changes, affected posts, and consultation outcomes.\n\n### Outcome\nThe institution has an approved organisational structure whose roles and reporting lines are aligned with the capabilities required by the approved Business Case.\n\n### Fails when\nConsultation feedback is not obtained or is disregarded, because the resulting structure faces legal challenge or staff resistance and the Transition Plan cannot be executed without industrial relations risk.","specialization":""},{"id":"elem-id-923","type":"BusinessProcess","name":"Other Tertiary Institution Relationship Mgt","documentation":"### Identity\nManagement of relationships with other tertiary institutions, including partnerships, benchmarking, and joint programmes.\n\n### Trigger\nThe arrival of a collaboration proposal from another institution or a scheduled inter-institutional review.\n\n### Consumes\nCollaboration Proposal supplies the proposed activity and objectives. Institutional Profile supplies the other institution's strengths and reputation. Partnership Policy supplies the conditions for inter-institutional arrangements.\n\n### Steps\nThe process evaluates the proposal against strategy and policy. It conducts due diligence on the partner. It negotiates the collaboration agreement. It obtains internal approval. It establishes monitoring and annual review. It manages joint activities and resolves disputes. If the collaboration is non-viable, it is declined or wound down. It maintains a register of all inter-institutional relationships.\n\n### Produces\nInter-Institutional Agreement states the agreed scope and obligations. Due Diligence Report records the partner assessment. Collaboration Review summarizes performance and future options.\n\n### Outcome\nThe institution maintains productive and compliant relationships with other tertiary institutions.\n\n### Fails when\nA partner institution fails to meet its obligations, causing joint programmes to suffer and the relationship to deteriorate.","specialization":""},{"id":"elem-id-898","type":"BusinessProcess","name":"PGR Student Skills Development","documentation":"### Identity\nWork here assesses and develops the skills of postgraduate research students to meet doctoral training requirements.\n\n### Trigger\nThe arrival of a new PGR Student Record at the start of doctoral study, when the student has no Training Plan.\n\n### Consumes\nPGR Student Record supplies the student's background, discipline, and programme requirements. Training Needs Assessment supplies the identified skill gaps from induction and supervisor input. Training Completion Record supplies any prior completed training that counts towards the requirement.\n\n### Steps\nThe Training Needs Assessment is reviewed against the PGR Student Record to confirm the required skills. A Training Plan is drafted listing mandatory and elective training courses. The plan is agreed with the student and supervisor. As training is completed, the Training Completion Record is updated and checked against the plan.\n\n### Produces\nTraining Plan: issued when the required skills and courses are agreed, establishing the student's development route. Training Completion Record: updated after each course, establishing progress towards the plan.\n\n### Outcome\nEvery PGR student has a current Training Plan and an accurate record of completed training.\n\n### Fails when\nThe Training Needs Assessment is not completed and the student is assigned generic training; a required skill is missed and the student fails progression.","specialization":""},{"id":"elem-id-899","type":"BusinessProcess","name":"PGR Supervisor Development","documentation":"### Identity\nWork here ensures postgraduate research supervisors have the required competencies and ongoing development to supervise effectively.\n\n### Trigger\nThe assignment of a new PGR supervisor, when the supervisor's Competency Record does not show current approval.\n\n### Consumes\nSupervisor Competency Record supplies the supervisor's training history and approval status. PGR Student Record supplies the number and discipline of students assigned. Training Completion Record supplies evidence of completed development activities.\n\n### Steps\nThe Supervisor Competency Record is checked for required supervisory training. If the supervisor is not approved, they are required to complete the mandatory induction before assignment is confirmed. A Supervisor Development Plan is issued, listing any further training needed based on current student load. As development is completed, the Training Completion Record and Supervisor Competency Record are updated.\n\n### Produces\nSupervisor Development Plan: issued when gaps are identified, establishing the required development actions. Supervisor Competency Record: updated with the new approval status, establishing the supervisor's current competence.\n\n### Outcome\nAll PGR supervisors are approved and have a current development plan.\n\n### Fails when\nThe assignment is confirmed before induction training is completed and the supervisor fails a student progression review; the student complains and the assignment is revoked.","specialization":""},{"id":"elem-id-879","type":"BusinessProcess","name":"Personal Learning Mgt","documentation":"### Identity\nThe work of helping students plan their personal development goals.\n\n### Trigger\nA student requests personal learning guidance.\n\n### Consumes\nStudent Enrolment supplies the programme context. Personal Development Plan supplies existing goals. Progress Check supplies the current status.\n\n### Steps\nThe student's current progress is reviewed. New goals are set. A Personal Development Plan is updated. The plan is scheduled for follow-up. A progress check is completed at the next meeting.\n\n### Produces\nPersonal Development Plan. Progress Update.\n\n### Outcome\nStudents have current personal learning goals.\n\n### Fails when\nThe student does not attend follow-up and the plan goes stale.","specialization":""},{"id":"elem-id-876","type":"BusinessProcess","name":"Personal Tutor Provision","documentation":"### Identity\nThe work of assigning and delivering personal tutoring to students.\n\n### Trigger\nA new student cohort is created and personal tutor assignments are due.\n\n### Consumes\nStudent Enrolment supplies the student list. Staff Availability Record supplies tutors. Personal Tutor Allocation Rule supplies the allocation basis. Tutorial Schedule supplies the meeting times.\n\n### Steps\nStudents are matched to tutors based on programme and availability. The allocation is recorded. The tutor meets the student at least once per term. Issues raised are logged. Escalations to specialist support are recorded. An annual review of the allocation is performed.\n\n### Produces\nPersonal Tutor Allocation. Tutorial Meeting Record. Support Referral.\n\n### Outcome\nEvery student has an assigned personal tutor and regular contact.\n\n### Fails when\nInsufficient staff are available and some students are left without a tutor.","specialization":""},{"id":"elem-id-834","type":"BusinessProcess","name":"Policy and Regulation Mgt","documentation":"### Identity\nThis process develops, reviews, and approves the institution's Policy Statements in response to changing external regulation and internal governance decisions. It is the part of the capability that maintains a current suite of compliant policies.\n\n### Trigger\nThe publication of a new or amended Government Policy Document, or a Governance Decision requiring policy change, starts the process when existing policy is known to be insufficient.\n\n### Consumes\nGovernment Policy Document supplies the new legal or regulatory requirement. Existing Policy Statement supplies the current policy to be amended or replaced. Stakeholder Consultation Feedback supplies the views of affected staff and students. Equality Impact Assessment Record supplies the analysis of equalities implications.\n\n### Steps\nFirst the process analyses the new requirement and identifies which Existing Policy Statement is affected. It drafts a revised policy. It conducts a consultation with affected stakeholders and records their feedback. It completes an equality impact assessment. It incorporates the required changes and prepares the final Policy Statement. It submits the policy to the governing body for approval. After approval, it publishes the policy and records the effective date.\n\n### Produces\nPolicy Statement records the approved policy text, its effective date, and the governing body approval reference. Equality Impact Assessment Record records the equalities analysis and any mitigations included in the final policy.\n\n### Outcome\nThe institution has a current, approved Policy Statement for each changed regulatory requirement, with evidence of consultation and equality impact assessment.\n\n### Fails when\nThe Equality Impact Assessment Record is not completed before approval, because the Policy Statement cannot lawfully proceed to governing body approval and the regulatory deadline is missed.","specialization":""},{"id":"elem-id-880","type":"BusinessProcess","name":"Presence Based Teaching","documentation":"### Identity\nThe work of delivering face-to-face teaching sessions.\n\n### Trigger\nThe published Timetable indicates a presence based session.\n\n### Consumes\nTeaching Content Pack supplies the materials. Room Booking Confirmation supplies the room. Module Registration supplies the expected attendees. Equipment Check supplies the required technology.\n\n### Steps\nThe room is prepared. The session is delivered. Attendance is recorded. Any issues are logged. An incident report is created if significant disruption occurs.\n\n### Produces\nTeaching Session Record. Attendance Register. Incident Report.\n\n### Outcome\nStudents receive scheduled face-to-face teaching.\n\n### Fails when\nThe room is double-booked and no alternative is available, cancelling the session.","specialization":""},{"id":"elem-id-939","type":"BusinessProcess","name":"Printing Mgt","documentation":"### Identity\nManagement of institutional printing, including print requests, production, and document finishing.\n\n### Trigger\nThe arrival of a print request.\n\n### Consumes\nPrint Request supplies the document and specifications. Print Machine Availability supplies the capacity and capability. Stock Record supplies paper and consumables.\n\n### Steps\nThe process validates the request against policy. It schedules printing. It produces the document. It finishes and binds. It quality checks. It delivers or notifies the requester. It records usage and charges. If a print error occurs, it is reproduced. It maintains machines.\n\n### Produces\nPrinted Document states the physical output. Print Job Record states the quantity and cost. Usage Report records the consumption.\n\n### Outcome\nRequesters receive high-quality printed materials on time.\n\n### Fails when\nA printer breaks down, causing a backlog and missed deadlines for critical documents.","specialization":""},{"id":"elem-id-1005","type":"BusinessProcess","name":"Private Sector Housing Mgt","documentation":"### Identity\nManagement of relationships with private landlords and the placement of students into external rented housing. It maintains property listings, inspects standards, and supports student tenants.\n\n### Trigger\nThe arrival of a private landlord property registration or a student request for private housing assistance.\n\n### Consumes\nPrivate Landlord Registration supplies the property details, safety certificates, and letting terms. Student Housing Request supplies the student's needs, budget, and preferred area. Property Inspection Report supplies the condition and compliance status of a listed property.\n\n### Steps\nThe process validates landlord registration and safety certificate currency. It matches student requests against registered properties that meet standards. It arranges viewings and provides tenancy guidance. It monitors tenancy agreements and supports dispute resolution. It schedules property inspections and follows up on non-compliance. If a property fails inspection, it is suspended from the listings until remedial works are confirmed. It maintains a record of available and unavailable properties. Tenancy deposits are tracked for return or dispute.\n\n### Produces\nPrivate Property Listing states a compliant property as available or suspended. Tenancy Guidance Pack supplies the student with contract and deposit advice. Inspection Follow-Up Request states the remedial work required for a listed property.\n\n### Outcome\nStudents are placed only in compliant private housing, and landlord listings reflect verified standards.\n\n### Fails when\nLandlord safety certificates expire or properties fail inspection, causing available housing stock to shrink and student demand to go unmet.","specialization":""},{"id":"elem-id-990","type":"BusinessProcess","name":"Procurement & Purchasing Mgt","documentation":"### Identity\nProcurement of goods, services, and works from requisition through sourcing to contract award.\n\n### Trigger\nThe arrival of a Procurement Request from an authorised budget holder.\n\n### Consumes\nProcurement Request supplies the specification, quantity, and budget code. Approved Budget supplies the available funds for the purchase. Supplier Catalogue supplies pre-approved items and prices.\n\n### Steps\nThe process validates the procurement request against budget and procurement policy. It determines the appropriate route: catalogue, quotation, or tender. It runs the sourcing process, issuing requests for quotation or tender. It evaluates bids against criteria. It obtains internal approval and awards the contract or purchase order. It records the commitment. It manages any legal review of the contract. If the request exceeds budget or policy, it is rejected or escalated. Award decisions are documented.\n\n### Produces\nPurchase Order states the supplier, price, and quantity of the order. Contract Agreement states the legal terms for a procured service or works. Bid Evaluation Record records the scoring and award justification.\n\n### Outcome\nThe institution procures goods and services at best value and within budget and policy.\n\n### Fails when\nBudget is insufficient or tenders receive no compliant bids, causing the requisitioning unit to operate without required goods or services.","specialization":""},{"id":"elem-id-846","type":"BusinessProcess","name":"Professional Accreditation","documentation":"### Identity\nThe work of preparing and submitting accreditation applications for professional programmes.\n\n### Trigger\nAn Accreditation Submission Deadline set by the professional body.\n\n### Consumes\nAccreditation Application supplies the programme evidence. Curriculum Blueprint supplies the programme specification. Graduate Outcomes Data supplies employment statistics. Standards Evidence Matrix supplies the mapping of criteria to evidence.\n\n### Steps\nThe accreditation coordinator collects evidence against each accreditation criterion. The Accreditation Application is compiled. An internal reviewer checks completeness. The application is submitted to the professional body. A site visit or panel review occurs. The Accreditation Decision is received and recorded. If conditions are attached, the faculty responds with an action plan. The action plan is implemented and evidence of completion is submitted.\n\n### Produces\nAccreditation Application. Accreditation Decision. Accreditation Action Plan. Standards Evidence Matrix.\n\n### Outcome\nProfessional programmes hold recognised accreditation status.\n\n### Fails when\nThe Accreditation Decision is denied and no appeal or resubmission is made, losing professional recognition.","specialization":""},{"id":"elem-id-837","type":"BusinessProcess","name":"Programme Enrolment","documentation":"### Identity\nThe work of formally enrolling an accepted applicant onto a programme.\n\n### Trigger\nAn Offer Acceptance is received from the applicant.\n\n### Consumes\nOffer Acceptance supplies the accepted offer and conditions. Student Application supplies the applicant's data. Academic Policy supplies enrolment requirements. Identity Document supplies the verification.\n\n### Steps\nThe acceptance is matched to the original offer. Any conditions are checked; if unmet, the applicant is notified. The applicant's identity is confirmed using Identity Document. Fees are confirmed. The Student Enrolment record is created. The Student Record is created or updated. An Enrolment Confirmation is issued. The new student is eligible for module selection.\n\n### Produces\nStudent Enrolment. Enrolment Confirmation. Updated Student Record.\n\n### Outcome\nAccepted applicants become enrolled students with an active record.\n\n### Fails when\nConditions remain unmet and the applicant does not provide evidence, leaving the offer unfulfilled.","specialization":""},{"id":"elem-id-864","type":"BusinessProcess","name":"Programme Transfer Mgt","documentation":"### Identity\nThe work of evaluating and executing a student's transfer between programmes.\n\n### Trigger\nA Programme Transfer Request submitted by a student.\n\n### Consumes\nStudent Enrolment supplies the current programme. Programme Transfer Request supplies the target programme and rationale. Academic Policy supplies transfer rules including credit recognition. Target Programme Capacity supplies the available places.\n\n### Steps\nThe request is assessed for eligibility against the target programme's entry requirements. The student's current Student Results Record is reviewed for transferable credit. The target programme capacity is checked. If credit recognition is needed, a credit mapping is prepared. The receiving faculty approves or rejects the request. On approval, the Student Enrolment is updated to the new programme. The Student Record is updated with the transfer. The student is issued a Programme Transfer Approval. If rejected, the student is informed with reasons.\n\n### Produces\nProgramme Transfer Approval. Updated Student Enrolment. Credit Recognition Record.\n\n### Outcome\nStudents are correctly enrolled in a programme that matches their academic path.\n\n### Fails when\nThe target programme has no capacity or the credit recognition cannot be agreed, leaving the student unable to transfer.","specialization":""},{"id":"elem-id-827","type":"BusinessProcess","name":"Programme and Project Mgt","documentation":"### Identity\nThis process manages approved programmes and projects from initiation through to closure, controlling scope, schedule, cost, quality, and risk. It is the part of the capability that delivers the outputs of change initiatives.\n\n### Trigger\nAn approved Business Case or Project Mandate authorises a new project or programme, when resources are available and the project manager is appointed.\n\n### Consumes\nBusiness Case supplies the objectives, expected benefits, budget, and success criteria. Project Plan supplies the activities, milestones, dependencies, and resource assignments. Resource Allocation supplies the assigned staff and budget against each activity. Risk Register supplies the known risks and their ownership. Issue Log supplies the current issues requiring resolution. Deliverable Acceptance Record supplies evidence of acceptance for completed outputs.\n\n### Steps\nFirst the process reviews the Business Case and establishes the project governance structure and baseline Project Plan. Then it tracks actual progress against the plan, collecting status data from work packages. It manages risks and issues, deciding whether to mitigate, transfer, accept, or escalate each. It controls changes to scope, schedule, or cost through a change control decision. When a deliverable is completed, it obtains formal acceptance from the sponsor. It monitors stage boundaries and decides whether the project should continue to the next stage. At closure, it reviews benefits handover and confirms all deliverables are accepted.\n\n### Produces\nProject Status Report records actual progress, forecasts, and exceptions after each reporting period. Change Request records a proposed change to baselines and its disposition. Project Closure Report records the final performance against baselines and the lessons learned.\n\n### Outcome\nEvery approved project has a controlled baseline, a documented decision at each stage boundary, and a formal closure record; benefits commitments pass to the accountable owner for post-project tracking.\n\n### Fails when\nThe Business Case baseline is not approved or the Project Plan lacks dependencies, because project performance cannot be measured and changes cannot be distinguished from initial scope, leading to uncontrolled delivery.","specialization":""},{"id":"elem-id-983","type":"BusinessProcess","name":"Property Maintenance","documentation":"### Identity\nReactive and planned maintenance of buildings, plant, and infrastructure. It receives work requests and planned schedules, and executes them.\n\n### Trigger\nThe arrival of a Facilities Work Order from a building user or a planned maintenance schedule date.\n\n### Consumes\nFacilities Work Order supplies the defect or task description, location, and priority. Maintenance Schedule supplies the planned service intervals for building assets. Building Condition Survey supplies the life-cycle defect list.\n\n### Steps\nThe process prioritises work orders against safety and operational impact. It schedules work and allocates resources. It performs the maintenance or repair. It checks completion against the required standard. Safety-critical work is completed first. If a repair cannot be completed, it is escalated to a higher work category. Completed work is recorded against the asset. Recurring issues are fed back into the maintenance schedule.\n\n### Produces\nCompleted Work Order records the repair action and closure time. Asset Service Record updates the maintenance history. Follow-Up Work Order states any remaining or new work identified.\n\n### Outcome\nBuilding assets are maintained to an acceptable condition, and reported defects are resolved or escalated.\n\n### Fails when\nCritical spares are unavailable or skilled labour is absent, causing safety-critical repairs to remain open and building areas to close.","specialization":""},{"id":"elem-id-851","type":"BusinessProcess","name":"Prospective Student Engagement","documentation":"### Identity\nThe work of engaging prospective students before application.\n\n### Trigger\nA Prospective Student Enquiry is received via website, email or phone.\n\n### Consumes\nProspective Student Enquiry supplies the question and contact details. Prospectus supplies programme information. Open Day Schedule supplies events. Response Template supplies standard answers.\n\n### Steps\nThe enquiry is logged and routed to the appropriate recruiter. A response is prepared using Prospectus information and the Response Template. The prospective student is invited to an Open Day. Follow-up is scheduled. The interaction is recorded. A lead score is assigned based on engagement.\n\n### Produces\nEnquiry Response. Prospective Student Interaction Record. Lead Score.\n\n### Outcome\nProspective students receive timely and accurate information and are invited to engage further.\n\n### Fails when\nEnquiries are not answered within the service standard, losing the prospective student.","specialization":""},{"id":"elem-id-926","type":"BusinessProcess","name":"Public Relationship Mgt","documentation":"### Identity\nManagement of the institution's relationship with the general public, including community engagement and public events.\n\n### Trigger\nThe arrival of a public enquiry or a scheduled community engagement event.\n\n### Consumes\nPublic Enquiry supplies the public's question or concern. Community Engagement Plan supplies the planned activities and messages. Event Proposal supplies the proposed public event.\n\n### Steps\nThe process logs and routes public enquiries to the appropriate unit. It plans and delivers community events. It monitors public perception. It responds to complaints or concerns. It reports on engagement outcomes. If a public event is planned, it obtains necessary permissions and manages logistics. It records all interactions for future reference.\n\n### Produces\nPublic Enquiry Response states the answer given. Community Event Report records the outcomes and feedback. Public Perception Summary records the measured sentiment.\n\n### Outcome\nThe institution is accessible to the public and manages its community reputation.\n\n### Fails when\nA public concern is ignored or a community event causes disruption, leading to community opposition and reputational loss.","specialization":""},{"id":"elem-id-831","type":"BusinessProcess","name":"Quality Mgt","documentation":"### Identity\nThis process defines quality standards for the institution's operational processes and verifies that those standards are met through audits and reviews. It is the part of the capability that ensures consistent service delivery.\n\n### Trigger\nThe approval of the annual quality plan or the receipt of a quality complaint or incident starts the process, when quality performance needs to be assessed.\n\n### Consumes\nQuality Standard supplies the acceptance criteria and benchmarks for a given activity. Audit Findings supplies evidence of nonconformance from previous assurance work. Service Delivery Record supplies actual performance data for the period under review.\n\n### Steps\nFirst the process selects the operational area to be reviewed from the annual plan. It compares the Service Delivery Record against the Quality Standard. When it finds nonconformance, it records the finding and its severity. It then identifies root causes and requested corrective actions. It agrees a Quality Improvement Plan with the process owner. It schedules a follow-up review to verify that actions have closed the gaps. If a finding is high severity, it escalates to the responsible director and sets an immediate corrective action deadline.\n\n### Produces\nQuality Review Report records the assessed area, criteria used, and findings. Quality Improvement Plan records each nonconformance, its root cause, the agreed action, owner, and due date.\n\n### Outcome\nOperational processes have verified conformance to defined quality standards, and identified nonconformances have an owner and a committed correction date.\n\n### Fails when\nThe Quality Standard is not defined for the area under review, because conformance cannot be judged and the review produces no actionable findings, leaving poor service ungoverned.","specialization":""},{"id":"elem-id-973","type":"BusinessProcess","name":"Records Mgt","documentation":"### Identity\nRecords management, including classification, retention, disposal, and archival of institutional records.\n\n### Trigger\nThe arrival of a new record or a retention disposal review.\n\n### Consumes\nNew Record Item supplies the record and its metadata. Retention Schedule supplies the required retention periods and disposal actions. Records Classification Scheme supplies the categories and access rules.\n\n### Steps\nThe process classifies the record. It applies metadata and security. It stores in the records repository. It manages retention and holds. It executes disposal or transfer to archive. It provides access to authorised users. It responds to Freedom of Information requests. It audits disposal. If a record is subject to litigation hold, disposal is suspended.\n\n### Produces\nRecords Disposal Certificate records the authorised destruction. Records Transfer Confirmation records the move to archive. Records Access Log records who accessed what.\n\n### Outcome\nThe institution's records are complete, retrievable, and disposed of lawfully.\n\n### Fails when\nRecords are destroyed before their retention period, causing legal non-compliance and loss of evidence.","specialization":""},{"id":"elem-id-934","type":"BusinessProcess","name":"Religious Support","documentation":"### Identity\nProvision of religious and pastoral support, including chaplaincy services and prayer spaces.\n\n### Trigger\nThe arrival of a request for religious support or a scheduled service.\n\n### Consumes\nSupport Request supplies the individual's need. Religious Calendar supplies the upcoming events and festivals. Room Booking Confirmation supplies the prayer space.\n\n### Steps\nThe process receives the request. It assigns a chaplain. It provides counselling or ritual support. It organises services. It manages prayer spaces. It promotes interfaith dialogue. It responds to emergencies. If a request needs external clergy, it arranges contact. It records the interaction.\n\n### Produces\nSupport Session Record states the support provided. Service Schedule states the upcoming services. Room Booking Confirmation for prayer spaces.\n\n### Outcome\nThe campus community has access to religious support and appropriate spaces.\n\n### Fails when\nNo suitable prayer space is available, causing unmet religious needs.","specialization":""},{"id":"elem-id-945","type":"BusinessProcess","name":"Remuneration & Entitlements Mgt","documentation":"### Identity\nManagement of staff remuneration, payroll, and entitlements, including salaries, allowances, and pension contributions.\n\n### Trigger\nThe arrival of a payroll cycle date or a change to an employee's contractual terms.\n\n### Consumes\nPayroll Input File supplies the employee time, changes, and deductions for the period. Employee Contract supplies the base salary and terms. Entitlement Policy supplies the rules for pension, leave, and allowances.\n\n### Steps\nThe process collects and validates payroll inputs. It calculates gross pay, deductions, and net pay. It processes the payroll run. It distributes payslips. It pays employees and statutory bodies. It reconciles the payroll to the general ledger. It handles payroll queries and corrections. If a payroll error occurs, an off-cycle correction is run. Year-end reporting is completed.\n\n### Produces\nPayslip states the employee's pay and deductions for the period. Payroll Report states the total payroll cost and deductions. Payroll Correction Entry records any adjustment to a previous pay period.\n\n### Outcome\nEmployees are paid correctly and on time, and all statutory obligations are met.\n\n### Fails when\nPayroll input is late or incorrect, causing delayed or incorrect pay and employee dissatisfaction.","specialization":""},{"id":"elem-id-908","type":"BusinessProcess","name":"Research Compliance Mgt","documentation":"### Identity\nWork here translates external research policy into binding internal controls and verifies that active research activity complies with data protection, open access, and funder conditions. It is the control function that keeps the Research domain inside legal and funder mandates.\n\n### Trigger\nThe arrival of a new Government Policy document or a changed Research Funding Application template, when existing Compliance Requirements do not yet reflect the change.\n\n### Consumes\nGovernment Policy supplies the new statutory or funding condition that must be turned into an internal control. Research Activity Record supplies the current set of live research projects, data handling practices, and publication intentions against which the new condition is checked. Data Management Plan supplies the agreed data handling controls for each active project; when a plan conflicts with the new condition, the process flags it. Compliance Requirement supplies the existing register of internal controls that the new condition may supersede or extend.\n\n### Steps\nFirst, the new Government Policy is read and each clause mapped to the institution's existing research activity. Where a clause affects data handling, the matching Data Management Plan is selected for review. A gap check then compares the clause against the current Compliance Requirement register. Where no gap exists, a note of continued compliance is recorded. Where a gap exists, the process drafts a new Compliance Requirement stating the exact action required and the deadline for implementation. The draft is presented to the accountable academic and, if approved, added to the register. If the required action changes a Data Management Plan, the plan is updated and re-approved before the compliance date. The process then issues a Compliance Assessment Report listing the gap, the corrective action, and the date of verification. When the change affects open access publication, the process sets an Open Access Compliance Record flag for all affected Research Outputs.\n\n### Produces\nCompliance Requirement: issued when the new government condition has been translated into a specific internal control and assigned an owner. Compliance Assessment Report: issued after each gap check, recording the assessed activity, the gap found, and the decision taken. Corrective Action Plan: issued when a gap requires changes to research practice; it lists actions, owners, and completion dates.\n\n### Outcome\nAll active research activity is demonstrably aligned with the current set of funding, data protection, and open access obligations.\n\n### Fails when\nA new Government Policy arrives and the process does not complete gap scoring before the next Research Output is deposited; as a result, non-compliant outputs are released and the institution breaches funder conditions.","specialization":""},{"id":"elem-id-896","type":"BusinessProcess","name":"Research Dataset Mgt","documentation":"### Identity\nWork here catalogues, stores, and controls access to research data so that datasets remain findable, citable, and compliant with data management obligations.\n\n### Trigger\nThe arrival of a new Research Data deposit from a research activity, when the producing project has an active Data Management Plan.\n\n### Consumes\nResearch Data supplies the raw data files and accompanying description of how they were produced. Data Management Plan supplies the storage location, retention period, and access restrictions agreed for that dataset. Metadata Record supplies the descriptive fields to be confirmed and extended during deposit.\n\n### Steps\nOn arrival, the Research Data is checked for completeness against the Data Management Plan. The process then extracts or confirms the Metadata Record, including creator, funder, date, and file format. The dataset is deposited into the research data repository and assigned a persistent identifier. Access controls are applied according to the Data Management Plan, and an Access Control Record is issued. If the dataset contains personal data, a data protection check is run and the access level is set to restricted. The process records the deposit in the repository and issues a Dataset Repository Entry.\n\n### Produces\nDataset Repository Entry: issued when the dataset is stored and described, establishing its discovery point. Access Control Record: issued when access restrictions are set, establishing who may retrieve the data. Metadata Record: issued when the descriptive fields are confirmed, establishing the dataset's citable description.\n\n### Outcome\nResearch data is stored under active access control and is discoverable and citable via the repository.\n\n### Fails when\nThe completeness check is skipped and an incomplete Research Data deposit is given a persistent identifier; downstream reuse fails because files are missing.","specialization":""},{"id":"elem-id-892","type":"BusinessProcess","name":"Research Funding Identification","documentation":"### Identity\nWork here scans the external funding landscape and identifies which funding calls match the institution's research strengths.\n\n### Trigger\nThe arrival of a new Research Funding Opportunity from a funder, when no existing Research Opportunity has been recorded for that call.\n\n### Consumes\nResearch Funding Opportunity supplies the call details, eligibility, deadline, and funding amount. Research Strategy supplies the institutional priorities and target research areas. Research Capability Profile supplies the current expertise and track record of academic staff.\n\n### Steps\nThe new Research Funding Opportunity is parsed into its eligibility, scope, and deadline. The process then maps the scope against the Research Strategy to confirm alignment. For aligned calls, the Research Capability Profile is searched for researchers whose expertise matches the call. A shortlist of potential applicants is produced and a Researcher Alert is sent to each named academic.\n\n### Produces\nResearcher Alert: issued to each matched academic, establishing awareness of the opportunity and the application deadline. Research Opportunity: issued when an aligned call is recorded, establishing the institution's interest in the call.\n\n### Outcome\nThe institution has a current list of funding calls that align with its research strategy and are assigned to named potential applicants.\n\n### Fails when\nThe mapping step uses an outdated Research Strategy and a misaligned call is circulated; staff apply to funding outside institutional priority and the application fails.","specialization":""},{"id":"elem-id-893","type":"BusinessProcess","name":"Research Funds Mgt","documentation":"### Identity\nWork here controls the financial management of awarded research funds, ensuring spend aligns with the award terms and that funder financial reports are produced on schedule.\n\n### Trigger\nThe arrival of a Research Award Notice, when the institution has accepted the award and established a Research Budget for the project.\n\n### Consumes\nResearch Award Notice supplies the approved budget, spending rules, and reporting dates. Research Budget supplies the internal plan for spend across cost categories and periods. Research Expenditure Record supplies the actual committed and paid spend from financial systems. Research Funder Report supplies the template and prior submissions for financial progress. Research Contract supplies the legal obligation to report and any cost eligibility restrictions.\n\n### Steps\nThe Research Award Notice is logged and its financial terms are extracted into the Research Budget. The process then sets up spend categories, cost centres, and approval limits. Each month, Research Expenditure Records are reconciled against the Research Budget and a Budget Variance Report is produced. If the variance exceeds the permitted tolerance, the process triggers a Budget Review; the review decides whether to reallocate funds or request a funder variation. The variation request is sent and, if approved, the Research Budget is updated. At each funder reporting date, the process assembles the Research Funder Report including expenditure to date, commitments, and forecast. The report is checked against the Research Award Notice terms and, if compliant, submitted. If non-compliant, the report is returned for correction before submission.\n\n### Produces\nBudget Variance Report: issued each reconciliation, establishing the difference between planned and actual spend. Research Funder Report: issued at each reporting date, establishing the financial position against the award. Research Budget: updated after any variation, establishing the current approved spending plan.\n\n### Outcome\nResearch funds are spent within the award terms and every funder financial report is accurate and submitted on time.\n\n### Fails when\nThe monthly reconciliation misses an overspend and the next Research Funder Report is submitted without correction; the funder reclaims funds and future awards are withheld.","specialization":""},{"id":"elem-id-909","type":"BusinessProcess","name":"Research Infrastructure Mgt","documentation":"### Identity\nThis process maintains the physical and digital research estate so that booked facilities and equipment are available when research activity needs them. It allocates existing assets and
