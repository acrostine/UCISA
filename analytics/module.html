esearcher's confirmed outputs, funding secured, and contribution to programme milestones for the period.\n\n### Condition\nIt is produced after individual performance reviews are completed and all contribution claims are verified by programme leads.\n\n### Consequence\nProgramme performance reports incorporate the aggregated researcher contributions, and without it programme performance is calculated without individual attribution.","sourceid":"elem-id-907","targetid":"elem-id-905","specialization":""},{"id":"id-57e19b41-d055-421e-b4b0-9692f7b4ba52","type":"FlowRelationship","name":"Researcher Performance Evaluation","documentation":"","sourceid":"elem-id-200024","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-eac3ce8b-172c-4ea8-bd6b-142a331a4563","type":"FlowRelationship","name":"Researcher Performance Review","documentation":"### Object\nThe review contains individual researcher objectives, outputs, and competency ratings agreed during the annual performance conversation.\n\n### Condition\nIt is released when the researcher and reviewer have both confirmed the final assessment, and it carries the approved rating that feeds the institutional performance record.\n\n### Consequence\nEmployee performance records are updated with the researcher's formal rating, and without the review the individual's contribution is absent from the central reward and development cycle.","sourceid":"elem-id-907","targetid":"elem-id-949","specialization":""},{"id":"elem-id-0481a4db-a292-4b1a-81fb-c5b4f6591fc3","type":"FlowRelationship","name":"Researcher Quality Findings","documentation":"### Object\nThe findings record individual researcher non-compliance with quality standards, including authorship or data integrity issues.\n\n### Condition\nThey are issued when a quality audit confirms a deviation and the researcher has been informed. Arrival means the individual performance record must be updated with the quality outcome.\n\n### Consequence\nResearcher performance records include the quality finding, and without it the researcher's quality record remains clean even when a deviation occurred.","sourceid":"elem-id-906","targetid":"elem-id-907","specialization":""},{"id":"elem-id-8c9142a0-1636-48e0-b7e0-604eb9448a57","type":"FlowRelationship","name":"Researcher Training Needs","documentation":"### Object\nThis statement lists skill gaps, required training modules, and development priorities identified for each researcher during performance review.\n\n### Condition\nIt is produced only when the performance review identifies a gap that cannot be closed within the current role assignment and requires a formal learning intervention.\n\n### Consequence\nTraining plans are assembled from the stated needs, and researchers without a needs statement receive no personalised development allocation in the next cycle.","sourceid":"elem-id-907","targetid":"elem-id-897","specialization":""},{"id":"elem-id-d5fdc603-6253-4af9-97ad-71ba262c38c4","type":"FlowRelationship","name":"Resource Catalogue","documentation":"### Object\nThe Resource Catalogue lists all library resources, including physical books, journals, databases, and their availability status.\n\n### Condition\nIt is updated as resources are acquired, relocated, or withdrawn.\n\n### Consequence\nAccess services use the catalogue to locate items and fulfil user requests. Without this catalogue, resources are effectively lost, and users cannot discover what is available.","sourceid":"elem-id-963","targetid":"elem-id-962","specialization":""},{"id":"elem-id-0bd3bab1-b229-476a-ad35-42529962e576","type":"FlowRelationship","name":"Retention Report","documentation":"","sourceid":"elem-id-874","targetid":"elem-id-849","specialization":""},{"id":"id-f001c796-24a3-435d-8f8d-fc1a8599e493","type":"FlowRelationship","name":"Retention Report","documentation":"","sourceid":"elem-id-200035","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-ddbdfbda-e4af-46c1-809f-632ba7aacf6e","type":"FlowRelationship","name":"Retention Trigger","documentation":"### Object\nThe Retention Trigger indicates that a piece of content has reached a lifecycle event, such as expiry or supersession, requiring records management action.\n\n### Condition\nIt is fired when the content reaches a retention rule threshold.\n\n### Consequence\nRecords management applies the appropriate disposition, such as archiving or destruction. Without this trigger, content is kept beyond its required retention period, increasing storage costs and legal risk.","sourceid":"elem-id-974","targetid":"elem-id-973","specialization":""},{"id":"elem-id-4f499a4a-9254-46c1-a994-68ae7d42b360","type":"FlowRelationship","name":"Revenue Target","documentation":"### Object\nThe Revenue Target sets the expected income from tuition fees, research grants, or commercial activities for a given period.\n\n### Condition\nIt is established during budget setting and communicated to income-generating units.\n\n### Consequence\nIncome management monitors receipts against this target and investigates shortfalls. Without this target, revenue performance is not measured, and financial planning lacks a baseline.","sourceid":"elem-id-991","targetid":"elem-id-993","specialization":""},{"id":"elem-id-752a589f-f127-4f85-8c99-b13fd7bf3d6d","type":"FlowRelationship","name":"Revenue Transaction Record","documentation":"### Object\nThe Revenue Transaction Record details each income receipt, including source, amount, and date.\n\n### Condition\nIt is created when income is recorded from tuition, grants, or commercial activities.\n\n### Consequence\nFinancial reporting includes these records in revenue accounts. Without this record, income is not recognised, and financial statements understate performance.","sourceid":"elem-id-993","targetid":"elem-id-996","specialization":""},{"id":"id-6e74fa5b-fe22-4b43-87a2-e3a76fc35443","type":"FlowRelationship","name":"Risk Impact Assessment","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-20004","specialization":""},{"id":"elem-id-54222707-9368-4e4f-9891-7920415cc963","type":"FlowRelationship","name":"Risk Insight Brief","documentation":"### Object\nA brief highlighting performance risks, emerging threats, and control weaknesses identified from reported commercial activity.\n\n### Condition\nIssued when reporting reveals a risk pattern or material exposure. Arrival means the risk insight is available for planning.\n\n### Consequence\nContingency plans are updated or created to address the identified risks. Without the brief, contingency planning proceeds without current risk intelligence.","sourceid":"elem-id-919","targetid":"elem-id-920","specialization":""},{"id":"elem-id-8f929f7f-8c62-438e-97bd-ec814b6735fc","type":"FlowRelationship","name":"Risk Mitigation Plan","documentation":"### Object\nA plan outlining specific actions, owners, and timelines to reduce or eliminate an identified risk to contract performance.\n\n### Condition\nIssued when a risk is assessed and mitigation actions are approved. Arrival means the mitigation is ready for implementation.\n\n### Consequence\nThe mitigation actions are applied to affected contracts. Risk exposure is reduced in line with the plan. While absent, the risk continues without mitigation, and contract performance deteriorates.","sourceid":"elem-id-920","targetid":"elem-id-918","specialization":""},{"id":"elem-id-d0606cb0-42d0-4b96-9b0d-71698f21651f","type":"FlowRelationship","name":"Role Definitions","documentation":"### Object\nThis is the set of role definitions with responsibilities, competencies, and reporting lines for employees.\n\n### Condition\nIt is issued after organisational design approves the target operating model. Arrival means current role expectations are available for performance management.\n\n### Consequence\nOn arrival, employee objectives and performance standards are aligned to the defined roles. While absent, employee objectives are set without authoritative role expectations and performance is evaluated against ad hoc criteria.","sourceid":"elem-id-828","targetid":"elem-id-949","specialization":""},{"id":"elem-id-13cd0ca0-7f16-456a-827b-e11a73420e36","type":"FlowRelationship","name":"Role Definitions","documentation":"### Object\nThis is the set of role definitions with responsibilities for quality activities, including ownership of processes and quality controls.\n\n### Condition\nIt is issued after organisational design approves quality-related role assignments. Arrival means the authority model for quality ownership is available.\n\n### Consequence\nOn arrival, quality responsibilities are assigned to the defined roles and process owners are held accountable. While absent, quality ownership is ambiguous and process control gaps are not assigned.","sourceid":"elem-id-828","targetid":"elem-id-831","specialization":""},{"id":"id-0bbea94e-dc28-4158-9510-9646ccefe801","type":"FlowRelationship","name":"Role Definitions","documentation":"","sourceid":"elem-id-20004","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-900212fb-10ff-43a5-a47f-030c83906877","type":"FlowRelationship","name":"Room Availability Notice","documentation":"### Object\nThe Room Availability Notice states which rooms have been cleaned, inspected, and are ready for the next occupant.\n\n### Condition\nIt is issued after turnaround and maintenance tasks are completed and the room passes readiness checks.\n\n### Consequence\nAccommodation allocation assigns these rooms to new applicants. Without this notice, rooms are not offered to waiting students, and vacancies remain unfilled.","sourceid":"elem-id-1004","targetid":"elem-id-1001","specialization":""},{"id":"elem-id-21c21e5e-60f0-445b-8bb4-ca7d8d1996c3","type":"FlowRelationship","name":"Room Cleaning Schedule","documentation":"### Object\nThe Room Cleaning Schedule lists the frequency and timing for cleaning each room based on usage patterns and hygiene requirements.\n\n### Condition\nIt is issued after space utilisation data indicates the appropriate cleaning regime.\n\n### Consequence\nProperty maintenance aligns cleaning services with the schedule to ensure rooms are ready for use. Without this schedule, cleaning is misaligned with demand, and rooms are either over-serviced or left dirty.","sourceid":"elem-id-982","targetid":"elem-id-983","specialization":""},{"id":"elem-id-fa5b53c3-da8c-4e83-b8ca-2ab9203e900f","type":"FlowRelationship","name":"Room Condition Report","documentation":"### Object\nThe Room Condition Report records the state of a room at a point in time, including damage, inventory, and required repairs.\n\n### Condition\nIt is created after an inspection or at check-in/check-out.\n\n### Consequence\nFacilities teams prioritise repairs and schedule maintenance based on reported conditions. Without this report, damage is not documented, and rooms are reallocated in poor condition.","sourceid":"elem-id-1001","targetid":"elem-id-1002","specialization":""},{"id":"elem-id-6d245c70-1870-4e19-b0e9-5f865a06bcc1","type":"FlowRelationship","name":"Room Inventory Update","documentation":"### Object\nThe Room Inventory Update records changes in furniture, fixtures, or condition status for a specific room.\n\n### Condition\nIt is issued after maintenance, replacement, or inspection alters the room's contents or state.\n\n### Consequence\nAllocation systems reflect the latest inventory when assigning rooms. Without this update, rooms may be allocated based on outdated contents, causing mismatches between expectation and reality.","sourceid":"elem-id-1002","targetid":"elem-id-1001","specialization":""},{"id":"elem-id-3052ae63-069b-4388-8e30-d06155552399","type":"FlowRelationship","name":"Safety Inspection Findings","documentation":"### Object\nThe Safety Inspection Findings report non-compliance with safety regulations or identification of new hazards during scheduled inspections.\n\n### Condition\nIt is issued after an inspection has been completed and findings reviewed.\n\n### Consequence\nProperty maintenance corrects the identified defects to bring facilities into compliance. Without these findings, safety defects remain uncorrected, and the campus remains non-compliant.","sourceid":"elem-id-986","targetid":"elem-id-983","specialization":""},{"id":"id-6e68d5b3-43a5-40da-b9e7-3121a8e9296b","type":"FlowRelationship","name":"Safety Policy Update","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-200014","specialization":""},{"id":"id-b432b1d6-89a8-45ea-a604-86f8557fdf1f","type":"FlowRelationship","name":"Safety Policy Update","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-200015","specialization":""},{"id":"elem-id-b01dbee5-2bdd-4c24-9648-eb65c74d1733","type":"FlowRelationship","name":"Safety Risk Assessment","documentation":"### Object\nThe Safety Risk Assessment identifies hazards, evaluates likelihood and severity, and specifies control measures for campus activities.\n\n### Condition\nIt is completed after a formal assessment by health and safety professionals.\n\n### Consequence\nCampus security uses the assessment to prioritise patrols and emergency response plans. Without this assessment, security operations lack awareness of the most significant risks, and resources are misallocated.","sourceid":"elem-id-986","targetid":"elem-id-981","specialization":""},{"id":"elem-id-03b06890-9a57-497a-96d8-7bf7067389a5","type":"FlowRelationship","name":"Scholarship Availability","documentation":"### Object\nThe listing of available scholarships and bursaries, including eligibility criteria, amounts, deadlines, and application links.\n\n### Condition\nIssued when scholarship programmes are approved and open for application.\n\n### Consequence\nArrival makes funding options visible to prospects and advisers. Absence leaves applicants unaware of support and lowers uptake.","sourceid":"elem-id-850","targetid":"elem-id-851","specialization":""},{"id":"elem-id-8b33ea71-9f35-4801-b095-b46cdd6e9547","type":"FlowRelationship","name":"Scholarship Promotion Pack","documentation":"### Object\nThe marketing materials describing scholarship opportunities, including eligibility, benefits, and application instructions.\n\n### Condition\nIssued when scholarship schemes are confirmed and promotional content is approved.\n\n### Consequence\nArrival equips recruitment staff to attract applicants. Absence leaves recruiters without current funding information and reduces outreach effectiveness.","sourceid":"elem-id-850","targetid":"elem-id-853","specialization":""},{"id":"elem-id-ead42660-fd7a-4244-9166-30f5855e3e84","type":"FlowRelationship","name":"Search Analytics","documentation":"### Object\nThe Search Analytics contain query logs, click-through rates, and user behaviour patterns from search tools.\n\n### Condition\nIt is collected automatically during search sessions.\n\n### Consequence\nKnowledge management identifies gaps in content or search relevance and improves knowledge base coverage. Without these analytics, search effectiveness is unknown, and users struggle to find information.","sourceid":"elem-id-966","targetid":"elem-id-970","specialization":""},{"id":"elem-id-3d740d69-458a-462c-bd92-db6d3cc324b5","type":"FlowRelationship","name":"Security Classification","documentation":"### Object\nThe Security Classification labels data assets according to sensitivity, such as public, internal, confidential, or restricted.\n\n### Condition\nIt is assigned after a data protection impact assessment.\n\n### Consequence\nData management implements access controls and encryption based on the classification. Without this classification, sensitive data may be left unprotected, and public data overprotected.","sourceid":"elem-id-967","targetid":"elem-id-971","specialization":""},{"id":"elem-id-e98042e4-63b1-4f04-bff2-ac7f24274495","type":"FlowRelationship","name":"Security Incident Report","documentation":"### Object\nThe Security Incident Report details a suspected or confirmed breach of digital security, including affected systems, indicators of compromise, and initial containment actions.\n\n### Condition\nIt is filed when a security event is detected or reported by monitoring or staff.\n\n### Consequence\nDigital security experts investigate the incident, determine impact, and implement recovery measures. Without this report, the breach remains unanalysed and the environment stays exposed.","sourceid":"elem-id-981","targetid":"elem-id-967","specialization":""},{"id":"id-bdab583f-af26-484c-a733-c121bfa358a6","type":"FlowRelationship","name":"Security Incident Report","documentation":"","sourceid":"elem-id-200011","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-57d4b8ec-adad-4cc5-bac6-1f4c57e88221","type":"FlowRelationship","name":"Security Infrastructure Requirement","documentation":"### Object\nThe Security Infrastructure Requirement specifies the cameras, access barriers, lighting, or alarm systems needed to reduce risk at a location.\n\n### Condition\nIt is produced after a security assessment identifies a vulnerability in campus infrastructure.\n\n### Consequence\nEstate development incorporates this requirement into project scopes and budgeting. Without this requirement, new builds or renovations proceed without adequate security, and vulnerabilities persist.","sourceid":"elem-id-981","targetid":"elem-id-980","specialization":""},{"id":"elem-id-a6d0d3cb-1cbe-4161-8f18-27cca40395e2","type":"FlowRelationship","name":"Service Outage Notification","documentation":"### Object\nThe Service Outage Notification informs users of a planned or unplanned interruption to an IT service, including impacted systems and expected restoration time.\n\n### Condition\nIt is issued when an outage is detected or planned.\n\n### Consequence\nICT service support logs the outage and coordinates restoration efforts. Without this notification, users are unaware of the disruption, and support teams lack a formal trigger to act.","sourceid":"elem-id-958","targetid":"elem-id-957","specialization":""},{"id":"elem-id-12335bd6-d145-4461-b2c8-bcad79b9cf99","type":"FlowRelationship","name":"Shared Facility Booking Schedule","documentation":"### Object\nThe Shared Facility Booking Schedule shows when sports facilities are booked or available for shared use, including maintenance windows.\n\n### Condition\nIt is produced after venue management coordinates with sports teams.\n\n### Consequence\nSport and recreation management plans training and matches around the schedule. Without this schedule, bookings conflict and facilities are underutilised.","sourceid":"elem-id-936","targetid":"elem-id-935","specialization":""},{"id":"elem-id-f414e5fc-a104-443d-98b7-022148251034","type":"FlowRelationship","name":"Skills Development Plan","documentation":"### Object\nThe set of recommended skills development activities, including workshops, tutorials, and self-study resources.\n\n### Condition\nIssued when a skills gap is identified and the development activity is designed to close it.\n\n### Consequence\nArrival adds the recommendation to the student's personal learning plan and schedules participation. Absence leaves the gap unaddressed and may affect academic performance.","sourceid":"elem-id-871","targetid":"elem-id-879","specialization":""},{"id":"elem-id-0caa1e3d-57c7-4cb4-92e2-dea441763cff","type":"FlowRelationship","name":"Societal Impact Report","documentation":"### Object\nThe report evidences the social or policy change attributable to research, with participant testimonies and public outputs.\n\n### Condition\nIt is produced after the impact assessment process is complete and the evidence is signed off by the impact panel.\n\n### Consequence\nThe institution communicates the proven impact to stakeholders, and without it the institution has no external impact story to share.","sourceid":"elem-id-904","targetid":"elem-id-902","specialization":""},{"id":"elem-id-d486948c-9fa3-4e95-a713-877e411fed5c","type":"FlowRelationship","name":"Societal Need Assessment","documentation":"### Object\nThe assessment identifies a societal problem and the research capability that could address it, with evidence of demand.\n\n### Condition\nIt is completed when impact management confirms the need is persistent and aligns with institutional strengths.\n\n### Consequence\nCommercialisation activity considers the assessment as a source of new applications, and without it commercial development is driven only by existing market signals.","sourceid":"elem-id-904","targetid":"elem-id-903","specialization":""},{"id":"elem-id-529cf478-859d-452c-8a9b-1cf9fa6f311d","type":"FlowRelationship","name":"Software Bug Report","documentation":"### Object\nThe Software Bug Report describes a defect in an application, including reproduction steps, severity, and affected module.\n\n### Condition\nIt is filed by the service desk after confirming a reproducible issue.\n\n### Consequence\nApplication lifecycle management assigns the bug to developers for fixing and regression testing. Without this report, the defect remains unknown to the development team and users continue to experience errors.","sourceid":"elem-id-957","targetid":"elem-id-956","specialization":""},{"id":"elem-id-cca1efcc-78b2-4382-a85d-a1a7f1204ed2","type":"FlowRelationship","name":"Space Demand Forecast","documentation":"### Object\nThe Space Demand Forecast projects future space requirements by type, based on enrolment trends, staff growth, and utilisation data.\n\n### Condition\nIt is produced annually or on request when planning is needed.\n\n### Consequence\nEstate development uses the forecast to justify new buildings or reconfiguration of existing space. Without this forecast, space provision does not match demand, resulting in overcrowding or surplus.","sourceid":"elem-id-982","targetid":"elem-id-980","specialization":""},{"id":"elem-id-718368d0-8325-4cfe-9135-99acbf3c21d6","type":"FlowRelationship","name":"Spiritual Care Programme Schedule","documentation":"### Object\nThe Spiritual Care Programme Schedule lists times and locations for chaplaincy services, meditation, or faith-based events.\n\n### Condition\nIt is updated each term.\n\n### Consequence\nInternal communications distributes the schedule to the campus. Without this schedule, those seeking spiritual care are unable to find the services.","sourceid":"elem-id-934","targetid":"elem-id-940","specialization":""},{"id":"elem-id-73919b8a-0d85-4e62-81af-e9d857dfd297","type":"FlowRelationship","name":"Sports Programme Promotion","documentation":"### Object\nThe Sports Programme Promotion publicises sports activities, competitions, and facility availability to the campus.\n\n### Condition\nIt is created for each sports season or event.\n\n### Consequence\nSport and recreation management increases participation through the promotion. Without this promotion, students and staff are unaware of opportunities, and utilisation drops.","sourceid":"elem-id-940","targetid":"elem-id-935","specialization":""},{"id":"id-4db0b074-e47c-46ce-b646-2c86d6347686","type":"FlowRelationship","name":"Stakeholder Engagement Brief","documentation":"","sourceid":"elem-id-200023","targetid":"elem-id-200013","specialization":""},{"id":"elem-id-206a5333-b136-4f4a-b26f-ffedf9e190e1","type":"FlowRelationship","name":"Stakeholder Needs Statement","documentation":"### Object\nThe statement summarises what external stakeholders require from non-commercial research, including policy questions and community priorities.\n\n### Condition\nIt is compiled from stakeholder engagement sessions and validated by the relationship team as representing current needs.\n\n### Consequence\nImpact activity targets its work at the stated needs, and without it impact activity is driven by researcher assumptions alone.","sourceid":"elem-id-902","targetid":"elem-id-904","specialization":""},{"id":"elem-id-84cdff95-ad2b-4230-b14e-2ab712c7fc12","type":"FlowRelationship","name":"Strategic Financial Recommendation","documentation":"### Object\nThe Strategic Financial Recommendation proposes changes to budget allocations, cost structures, or revenue generation based on financial analysis.\n\n### Condition\nIt is produced after a thorough review of financial risk and opportunity.\n\n### Consequence\nBudget management incorporates the recommendation into the next budget round. Without this recommendation, budgets are set without strategic financial input, leading to misallocation.","sourceid":"elem-id-1000","targetid":"elem-id-991","specialization":""},{"id":"elem-id-9e5b2cca-4614-44cb-9f79-67563e30f520","type":"FlowRelationship","name":"Strategic Performance Reports","documentation":"### Object\nThis is a set of strategic performance reports showing institutional achievement against strategic objectives, with compliance-relevant metrics.\n\n### Condition\nIt is issued at the reporting cycle after performance is reviewed. Arrival means the strategic performance context is available for regulatory reporting.\n\n### Consequence\nOn arrival, regulatory reporting is aligned with strategic performance and submissions are informed. While absent, regulatory reporting operates without the strategic performance perspective and submissions are incomplete.","sourceid":"elem-id-824","targetid":"elem-id-833","specialization":""},{"id":"elem-id-8fe5ad82-d567-44a4-9750-7b6070a74627","type":"FlowRelationship","name":"Student Application","documentation":"### Object\nThe completed application form and supporting documents, including personal details, academic history, personal statement, references, and fee status evidence.\n\n### Condition\nIssued when an applicant submits a complete application for a programme of study, having satisfied data validation and identity checks.\n\n### Consequence\nArrival opens eligibility screening, fee assessment, and offer decisioning. Absence means there is no applicant to consider, and no offer or rejection is produced.","sourceid":"elem-id-868","targetid":"elem-id-869","specialization":""},{"id":"elem-id-81abf930-5974-4acc-83e2-ab59f4d69c13","type":"FlowRelationship","name":"Student Background","documentation":"### Object\nThe contextual information about a student, including circumstances, prior incidents, and any relevant personal history.\n\n### Condition\nIssued when the record is complete enough to inform an exceptional factors or appeal decision.\n\n### Consequence\nArrival gives the decision-maker a full picture of the student's situation. Absence risks decisions made without relevant context.","sourceid":"elem-id-863","targetid":"elem-id-866","specialization":""},{"id":"elem-id-1731d887-bba2-4c09-9389-658970bb6ed4","type":"FlowRelationship","name":"Student Demographics","documentation":"### Object\nThe student's demographic data, including age, domicile, fee status, and equality monitoring categories.\n\n### Condition\nIssued when the data is collected at application or enrolment and verified where required.\n\n### Consequence\nArrival enables fee assessment, reporting, and analytics. Absence prevents accurate fee classification and statutory returns.","sourceid":"elem-id-863","targetid":"elem-id-867","specialization":""},{"id":"elem-id-9c1281a4-18c9-42b7-8818-3f326569913f","type":"FlowRelationship","name":"Student Eligibility","documentation":"### Object\nThe record of a student's eligibility for mobility, including programme stage, academic standing, and language proficiency.\n\n### Condition\nIssued when the student record demonstrates that mobility criteria are met.\n\n### Consequence\nArrival permits participation in mobility opportunities and funding applications. Absence blocks nomination and placement application.","sourceid":"elem-id-863","targetid":"elem-id-865","specialization":""},{"id":"elem-id-5239eb77-a5d5-4f96-a423-5b9dca55dea8","type":"FlowRelationship","name":"Student Enquiry","documentation":"### Object\nThe prospective student's initial enquiry, carrying contact details, programme interest, intended start date, and any questions.\n\n### Condition\nIssued when a prospective student submits an enquiry through web, email, phone, or event registration.\n\n### Consequence\nArrival creates a prospect record and begins application nurturing. Absence leaves the prospect unattended and reduces conversion to application.","sourceid":"elem-id-851","targetid":"elem-id-868","specialization":""},{"id":"elem-id-a03e38f0-95e9-495a-b663-6e49a6034d7a","type":"FlowRelationship","name":"Student Enrolment","documentation":"","sourceid":"elem-id-837","targetid":"elem-id-843","specialization":""},{"id":"id-3c995913-b9af-4008-9d81-c23eb13b2c74","type":"FlowRelationship","name":"Student Enrolment","documentation":"","sourceid":"elem-id-200034","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-1e7210fc-bf7b-43ba-9e43-34677c045731","type":"FlowRelationship","name":"Student Financial Need","documentation":"### Object\nThe prospective student's self-declared financial circumstances and need for financial support.\n\n### Condition\nIssued when a prospect discloses financial need during engagement and consents to sharing with scholarship functions.\n\n### Consequence\nArrival triggers assessment for scholarships and bursaries. Absence prevents targeted financial support and reduces access.","sourceid":"elem-id-851","targetid":"elem-id-850","specialization":""},{"id":"elem-id-0c07c759-bcea-4f91-a137-1c5b11b24a21","type":"FlowRelationship","name":"Student Financial Transaction","documentation":"### Object\nThe record of any financial transaction on a student account, including charges, payments, refunds, and adjustments.\n\n### Condition\nIssued when a transaction is posted by the finance system or recorded by student financial administration.\n\n### Consequence\nArrival updates the student's financial record and supports audit and reconciliation. Absence leaves the account balance incomplete and inaccurate.","sourceid":"elem-id-867","targetid":"elem-id-863","specialization":""},{"id":"elem-id-39fc435a-5d1f-4905-bfa4-77706461850c","type":"FlowRelationship","name":"Student Lead","documentation":"### Object\nThe lead record for a prospective student sourced from domestic recruitment activity, including contact details and programme interest.\n\n### Condition\nIssued when a prospective student has expressed interest through recruitment channels and is passed for engagement follow-up.\n\n### Consequence\nArrival starts prospect nurturing and application support. Absence leaves the recruitment effort without a contactable pool.","sourceid":"elem-id-853","targetid":"elem-id-851","specialization":""},{"id":"elem-id-21574b1b-f4c4-48b8-834f-10af4293a9fb","type":"FlowRelationship","name":"Student Lead","documentation":"### Object\nThe lead record for a prospective student sourced from international recruitment activity, including contact details, country of origin, and programme interest.\n\n### Condition\nIssued when a prospective international student expresses interest through recruitment channels and is passed for engagement follow-up.\n\n### Consequence\nArrival starts regionally appropriate prospect nurturing and application support. Absence leaves the international recruitment effort without a contactable pool.","sourceid":"elem-id-852","targetid":"elem-id-851","specialization":""},{"id":"elem-id-652faf42-0ea4-48d9-b8fc-b4547ab9f836","type":"FlowRelationship","name":"Student Performance Report","documentation":"### Object\nThe report of a student's performance in in-person settings, including participation, formative marks, and tutor observations.\n\n### Condition\nIssued when classroom performance data is collated for placement assessment.\n\n### Consequence\nArrival supports placement matching and suitability review. Absence leaves placement providers without evidence of practical ability.","sourceid":"elem-id-880","targetid":"elem-id-883","specialization":""},{"id":"elem-id-312bb3f9-ee78-4c04-9360-dfee4a052f6f","type":"FlowRelationship","name":"Student Progress Report","documentation":"### Object\nA summary of attendance, engagement, formative performance, and any concerns raised by teaching staff for a student.\n\n### Condition\nIssued when a student's presence or performance falls below defined thresholds, or when an academic adviser requests a formal update.\n\n### Consequence\nArrival prompts academic advice intervention and support planning. Absence leaves advisers without current information and delays response to underperformance.","sourceid":"elem-id-880","targetid":"elem-id-872","specialization":""},{"id":"elem-id-fc6bc381-e0a1-454d-8d17-14f9be977c7c","type":"FlowRelationship","name":"Student Record","documentation":"### Object\nThe verified core student record containing identity, contact, programme, and personal identifiers.\n\n### Condition\nIssued when identity and personal details have been verified against authoritative documents and are ready for use by other functions.\n\n### Consequence\nArrival ensures that downstream processes use consistent and accurate student identity data. Absence causes duplicate or conflicting records and incorrect communication.","sourceid":"elem-id-863","targetid":"elem-id-862","specialization":""},{"id":"elem-id-b71989e6-fa90-4e76-b7ac-9226e1135809","type":"FlowRelationship","name":"Student Results","documentation":"","sourceid":"elem-id-885","targetid":"elem-id-849","specialization":""},{"id":"id-e4b45a46-42b0-4d75-a244-03275f3d4b82","type":"FlowRelationship","name":"Student Results","documentation":"","sourceid":"elem-id-200031","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-11d14346-b0fa-4ee9-95b9-f4ca84e199a6","type":"FlowRelationship","name":"Student Results Transcript","documentation":"### Object\nThe official record of module results, credits achieved, marks, and progression or award decisions for a student.\n\n### Condition\nIssued when all module results for the relevant period have been confirmed by the examination board and quality checks have passed.\n\n### Consequence\nArrival updates the student's academic record and enables progression, award, and external reporting. Absence leaves the record incomplete and blocks certification.","sourceid":"elem-id-885","targetid":"elem-id-863","specialization":""},{"id":"elem-id-fdc8c654-0a87-4010-891f-79ca77e7d038","type":"FlowRelationship","name":"Student Skills Profile","documentation":"### Object\nThe profile shows the student's completed training, current skill levels, and outstanding requirements, with version history for each element.\n\n### Condition\nIt is updated after each training completion or assessment and is issued to the supervisor before each progress review, carrying the latest confirmed competency state.\n\n### Consequence\nSupervisor development receives the profile to tailor supervision guidance, and without it supervisors lack the student's current skill state and cannot target development support effectively.","sourceid":"elem-id-898","targetid":"elem-id-899","specialization":""},{"id":"elem-id-97fb9e9d-86af-4a47-ab3f-e1f24f829b40","type":"FlowRelationship","name":"Student Training Completion Record","documentation":"### Object\nThe record names the postgraduate researcher, the completed skill module, and the assessment result.\n\n### Condition\nIt is issued when the student finishes a mandatory training element and the skills development team verifies completion.\n\n### Consequence\nTraining plans remove the requirement from the student's plan, and without it the student remains flagged as not trained.","sourceid":"elem-id-898","targetid":"elem-id-897","specialization":""},{"id":"elem-id-a490807e-6eba-4934-b697-494aa3080a6f","type":"FlowRelationship","name":"Student Training Needs Feedback","documentation":"### Object\nThe feedback identifies gaps a supervisor observes in a student's research skills during supervision.\n\n### Condition\nIt is provided when a supervision meeting reveals a skill gap that affects the student's ability to progress.\n\n### Consequence\nStudent skills development incorporates the feedback into the student's training plan, and without it the gap remains unaddressed.","sourceid":"elem-id-899","targetid":"elem-id-898","specialization":""},{"id":"elem-id-512d6244-0c3e-449b-84ae-ee807e2595d2","type":"FlowRelationship","name":"Supervisor Competency Record","documentation":"### Object\nThe record lists the supervisory skills completed, the date achieved, and any refresher requirements due.\n\n### Condition\nIt is updated when a supervisor completes a development module or a periodic review confirms continued competence.\n\n### Consequence\nEmployee performance management holds the supervisor's current competency state, and without it supervisory eligibility for new researchers is not confirmed.","sourceid":"elem-id-899","targetid":"elem-id-949","specialization":""},{"id":"id-cd53a173-62b4-4e1e-aadd-ab960521cf6e","type":"FlowRelationship","name":"Supervisor Competency Record","documentation":"","sourceid":"elem-id-200027","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-3623a6ab-069a-4ae8-b59d-53a34b00cbd7","type":"FlowRelationship","name":"Supervisor Training Material","documentation":"### Object\nThe material contains updated best practice guides, case studies, regulatory changes relevant to research supervision, and institutional policy templates.\n\n### Condition\nIt is distributed when the training team revises the supervisor curriculum and approves the material for use after an annual curriculum review.\n\n### Consequence\nSupervisor development uses the material in its sessions, and without it supervisors are trained on outdated practice and the gap is corrected only when updated material arrives.","sourceid":"elem-id-897","targetid":"elem-id-899","specialization":""},{"id":"elem-id-254be3e2-8817-43df-ac41-aa9ffd7f4519","type":"FlowRelationship","name":"Supplier Contract","documentation":"### Object\nThe Supplier Contract defines the legal terms, service levels, pricing, and obligations between the institution and a supplier.\n\n### Condition\nIt is issued after negotiation and legal approval are complete.\n\n### Consequence\nSupplier management monitors performance against the agreed terms and renews or terminates as needed. Without this contract, there is no enforceable relationship, and supplier performance is unmanaged.","sourceid":"elem-id-976","targetid":"elem-id-999","specialization":""},{"id":"elem-id-5357a33c-3500-4db4-8d19-353e49f3ed91","type":"FlowRelationship","name":"Supplier Contract Term","documentation":"### Object\nThe Supplier Contract Term states the payment terms, delivery schedules, and service levels agreed with a supplier.\n\n### Condition\nIt is extracted from the executed contract.\n\n### Consequence\nExpenditure management matches invoices against these terms before payment. Without this term, invoices may be paid incorrectly, and contractual obligations are not enforced.","sourceid":"elem-id-999","targetid":"elem-id-998","specialization":""},{"id":"elem-id-394bcc66-0856-407a-82c0-3da52556ba8d","type":"FlowRelationship","name":"Suspicious Package Alert","documentation":"### Object\nThe Suspicious Package Alert describes a mail item or package that appears threatening or unusual, along with its location and handling instructions.\n\n### Condition\nIt is issued when mail staff identify a package that fails standard screening criteria.\n\n### Consequence\nCampus security responds to assess the package and initiate evacuation or controlled detonation if required. Without this alert, the package is handled normally, potentially causing injury or damage.","sourceid":"elem-id-987","targetid":"elem-id-981","specialization":""},{"id":"elem-id-237e4ad8-31a3-4298-bdbc-3e1abbef53e3","type":"FlowRelationship","name":"Sustainability Compliance Report","documentation":"### Object\nThe Sustainability Compliance Report details the institution's performance against environmental targets, emissions, and regulatory obligations.\n\n### Condition\nIt is produced after data collection and verification against relevant standards.\n\n### Consequence\nEstate development uses the report to justify retrofits, plan new buildings, and meet planning conditions. Without this report, projects may not comply with sustainability requirements, and funding or permissions are at risk.","sourceid":"elem-id-984","targetid":"elem-id-980","specialization":""},{"id":"elem-id-d6b5c858-1d81-4373-abb8-145d7c6ca80c","type":"FlowRelationship","name":"Tax Compliance Status Report","documentation":"### Object\nThe Tax Compliance Status Report summarises whether all tax returns have been filed and payments made on time.\n\n### Condition\nIt is generated after each filing deadline.\n\n### Consequence\nFinancial advisors assess the institution's tax risk and take corrective action if needed. Without this report, missing filings or late payments go unnoticed until penalties accrue.","sourceid":"elem-id-997","targetid":"elem-id-1000","specialization":""},{"id":"elem-id-3fdfeb43-4a83-4518-8179-76a67d5bd3a9","type":"FlowRelationship","name":"Tax Liability Statement","documentation":"### Object\nThe Tax Liability Statement calculates the total tax owed for a period, including VAT, PAYE, and corporation tax.\n\n### Condition\nIt is produced after tax computations are complete.\n\n### Consequence\nFinancial reporting records the liability in the balance sheet. Without this statement, tax liabilities are not recognised, and the financial position is misstated.","sourceid":"elem-id-997","targetid":"elem-id-996","specialization":""},{"id":"elem-id-18bc2faa-5155-434c-b8b4-8fe4e5c164b3","type":"FlowRelationship","name":"Tax Planning Recommendation","documentation":"### Object\nThe Tax Planning Recommendation suggests legal arrangements to minimise tax liabilities, such as use of allowances or structuring.\n\n### Condition\nIt is made after analysing the institution's tax position and applicable law.\n\n### Consequence\nTaxation management implements the recommendation to reduce tax payments. Without this recommendation, the institution pays more tax than necessary, reducing available funds.","sourceid":"elem-id-1000","targetid":"elem-id-997","specialization":""},{"id":"elem-id-a1dff872-ff2a-4456-a3b8-3ca10318d037","type":"FlowRelationship","name":"Taxation Financial Extract","documentation":"### Object\nThe Taxation Financial Extract compiles the financial statement data needed to complete tax computations, such as taxable income and allowable expenses.\n\n### Condition\nIt is prepared after financial statements are finalised.\n\n### Consequence\nTaxation management uses the extract to calculate tax liabilities and file returns. Without this extract, tax computations are delayed or inaccurate, risking penalties.","sourceid":"elem-id-996","targetid":"elem-id-997","specialization":""},{"id":"elem-id-1acc1962-48c2-4f9e-bc09-6d8fbc5ae4fe","type":"FlowRelationship","name":"Teaching Session Policy","documentation":"### Object\nThe timetabling constraints derived from policy, including maximum class size, contact hours per module, and room specifications.\n\n### Condition\nIssued when policy owners publish the rules that restrict how teaching sessions may be scheduled.\n\n### Consequence\nArrival constrains timetable construction and prevents sessions that violate workload or space limits. Absence leaves timetable decisions without policy guardrails.","sourceid":"elem-id-840","targetid":"elem-id-842","specialization":""},{"id":"elem-id-9be63c9f-6f57-484b-87dd-71a48a43a373","type":"FlowRelationship","name":"Teaching Timetable","documentation":"### Object\nThe specific week-by-week schedule of teaching sessions, rooms, staff, and student groups.\n\n### Condition\nIssued when room availability, staff availability, module constraints, and student group sizes have been reconciled.\n\n### Consequence\nArrival tells staff and students where and when to teach, and releases rooms for scheduled use. Absence leaves sessions unscheduled and generates conflicts.","sourceid":"elem-id-842","targetid":"elem-id-880","specialization":""},{"id":"elem-id-43c51a2e-ef68-4b1c-8b9c-03232f5506ce","type":"FlowRelationship","name":"Temporary Relocation Notice","documentation":"### Object\nThe Temporary Relocation Notice specifies rooms or entire buildings that are temporarily unavailable and where occupants are being moved.\n\n### Condition\nIt is issued after an incident requires evacuation or restricts access to normally occupied spaces.\n\n### Consequence\nAccommodation allocation reassigns affected occupants to alternative rooms and updates records. Without this notice, students are sent to rooms that are still occupied or unsafe, and conflicts arise.","sourceid":"elem-id-1003","targetid":"elem-id-1001","specialization":""},{"id":"elem-id-44bfcbb2-a99a-497f-a4a0-8da655bbe42a","type":"FlowRelationship","name":"Tenant Mail Delivery Record","documentation":"### Object\nThe Tenant Mail Delivery Record shows which mail items were delivered to commercial tenants, including tracking numbers and recipient signatures.\n\n### Condition\nIt is updated after each delivery or collection event.\n\n### Consequence\nCommercial tenancy management verifies that tenants received their mail and resolves any disputes about lost items. Without this record, mail delivery cannot be proven, and liability disputes remain unresolved.","sourceid":"elem-id-987","targetid":"elem-id-988","specialization":""},{"id":"elem-id-3a9ed59d-3f34-46bf-b8ad-02442b5b6015","type":"FlowRelationship","name":"Tenant Maintenance Request","documentation":"### Object\nThe Tenant Maintenance Request reports a building issue from a commercial tenant, describing the fault and its impact on business operations.\n\n### Condition\nIt is submitted by the tenant when a maintenance problem affects their leased space.\n\n### Consequence\nProperty maintenance schedules repair work according to the lease obligations. Without this request, tenant issues are not addressed, leading to dissatisfaction and potential lease violations.","sourceid":"elem-id-988","targetid":"elem-id-983","specialization":""},{"id":"elem-id-daa51bed-3950-49a0-a03a-528af4747f24","type":"FlowRelationship","name":"Training Completion Record","documentation":"### Object\nThe record names the researcher, the completed course, and the date of completion, along with any assessment outcome.\n\n### Condition\nIt is issued only when the training provider confirms attendance and the final assessment is passed or waived. Its arrival means the development action is closed.\n\n### Consequence\nResearcher performance records reflect the updated skill state, and without it the previous training need remains open in the development plan.","sourceid":"elem-id-897","targetid":"elem-id-907","specialization":""},{"id":"id-415f781a-4dcb-4738-9cd5-34e1d505b1a3","type":"FlowRelationship","name":"Training Completion Record","documentation":"","sourceid":"elem-id-200027","targetid":"elem-id-200024","specialization":""},{"id":"elem-id-1c60dec4-9efb-4211-9c54-d6a696c961c8","type":"FlowRelationship","name":"Training Knowledge Base","documentation":"### Object\nThe Training Knowledge Base contains curated articles, procedure guides, and best practices for staff development topics.\n\n### Condition\nIt is made available when the knowledge has been validated by subject matter experts and tagged for training use.\n\n### Consequence\nTraining programmes incorporate the approved content into course materials and reference libraries. Without this knowledge base, training content is inconsistent and may rely on outdated or unverified procedures.","sourceid":"elem-id-970","targetid":"elem-id-950","specialization":""},{"id":"id-d6a3b367-ec52-443c-98e4-be8ad55e2dc9","type":"FlowRelationship","name":"Training Knowledge Base","documentation":"","sourceid":"elem-id-200016","targetid":"elem-id-200014","specialization":""},{"id":"id-8cfc0b0b-7c78-48e2-96c9-dbc18c7466cb","type":"FlowRelationship","name":"Training Needs Assessment","documentation":"","sourceid":"elem-id-200024","targetid":"elem-id-200027","specialization":""},{"id":"elem-id-d68d92d2-52ba-4fea-998d-d2287aa27103","type":"FlowRelationship","name":"Transfer Decision","documentation":"### Object\nThe formal decision on a programme transfer request, including approved programme, year of study, and any conditions.\n\n### Condition\nIssued when a transfer request has been assessed and either approved or rejected by the appropriate authority.\n\n### Consequence\nArrival changes the student's enrolment status and, if approved, moves the student to the new programme. Absence leaves the request unresolved and the student on the original programme.","sourceid":"elem-id-864","targetid":"elem-id-862","specialization":""},{"id":"elem-id-833d9b3d-1e58-4d83-bf73-979b977e2f8e","type":"FlowRelationship","name":"Transfer Decision","documentation":"### Object\nThe formal decision on a programme transfer request, including approved programme, year of study, and any conditions.\n\n### Condition\nIssued when the transfer decision is finalised and needs to be reflected in the official student record.\n\n### Consequence\nArrival updates the student's academic record with the new programme information. Absence leaves the record showing the original programme and creates downstream misalignment.","sourceid":"elem-id-864","targetid":"elem-id-863","specialization":""},{"id":"id-8b3b2dd4-c9d5-4335-8598-5c20381b037a","type":"FlowRelationship","name":"Tuition Fee Ledger","documentation":"","sourceid":"elem-id-200029","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-5aad9329-919f-4940-9a6b-f5d154b44b0f","type":"FlowRelationship","name":"Tuition Fee Payment","documentation":"### Object\nThe financial record of tuition fee charges, payments received, outstanding balance, and any fee status decisions for a student.\n\n### Condition\nIssued when the student's fee liability is calculated and payment transactions are posted to the student account.\n\n### Consequence\nArrival feeds institutional financial reporting and cash flow monitoring. Absence leaves fee income unreconciled and prevents accurate financial statements.","sourceid":"elem-id-867","targetid":"elem-id-996","specialization":""},{"id":"elem-id-ac1d9bad-7224-48cc-b250-7eb37782e0d8","type":"FlowRelationship","name":"Unmet Housing Demand","documentation":"### Object\nThe Unmet Housing Demand lists students who require accommodation but cannot be placed in institution-managed rooms.\n\n### Condition\nIt is produced after all available rooms are allocated and excess demand is identified.\n\n### Consequence\nPrivate sector housing coordinators use the list to negotiate and secure external rooms for these students. Without this list, the students remain without any housing solution, and the institution fails its accommodation obligation.","sourceid":"elem-id-1001","targetid":"elem-id-1005","specialization":""},{"id":"elem-id-0bbf1a34-e746-46d5-80cb-7baf1f704f17","type":"FlowRelationship","name":"Unresolved Issue Register","documentation":"### Object\nA register of issues that remain open at the point of commercial activity exit, with owner, impact, and proposed closure actions.\n\n### Condition\nIssued when closure is attempted and outstanding issues are confirmed. Arrival means the unresolved issue set is formally handed over.\n\n### Consequence\nClosure decisions incorporate the unresolved issues. Exit sign-off is withheld until issues are addressed or accepted. While absent, closure proceeds without visibility of unresolved problems.","sourceid":"elem-id-916","targetid":"elem-id-917","specialization":""},{"id":"elem-id-8e58963d-f0f8-4ede-82bf-34d8ccd74b64","type":"FlowRelationship","name":"User Account Status Update","documentation":"### Object\nThe User Account Status Update indicates changes such as account lockout, password reset, or deactivation for a user.\n\n### Condition\nIt is generated when identity management performs an action on a user account.\n\n### Consequence\nICT service support uses this update to inform the user and adjust support activities. Without this update, support staff are unaware of account changes and may misdiagnose access issues.","sourceid":"elem-id-959","targetid":"elem-id-957","specialization":""},{"id":"elem-id-68c34606-3262-4b1b-8d00-2717a07a7cda","type":"FlowRelationship","name":"User Device Registration","documentation":"### Object\nThe User Device Registration associates a specific device with an individual user, including hardware identifiers.\n\n### Condition\nIt is created when a device is first issued or connected to the network.\n\n### Consequence\nIdentity and access management links the device to the user's account for authentication and policy enforcement. Without this registration, the device is unrecognised and may be blocked from corporate resources.","sourceid":"elem-id-961","targetid":"elem-id-959","specialization":""},{"id":"elem-id-2a9f218a-83e9-4be8-95b3-be44138cb231","type":"FlowRelationship","name":"Vehicle Registration","documentation":"### Object\nThe Vehicle Registration associates a university vehicle with its department, purpose, and authorised driver.\n\n### Condition\nIt is recorded when a vehicle is added to the fleet or a change occurs.\n\n### Consequence\nCampus parking systems recognise the vehicle and grant appropriate parking privileges. Without this registration, the vehicle is treated as unauthorised, and parking enforcement may issue penalties.","sourceid":"elem-id-989","targetid":"elem-id-985","specialization":""},{"id":"elem-id-56c30e9e-6ae8-47f3-93e2-d6497fe27806","type":"FlowRelationship","name":"Vehicle Repair Request","documentation":"### Object\nThe Vehicle Repair Request specifies the fault, maintenance needed, and priority for a university vehicle.\n\n### Condition\nIt is raised when a vehicle inspection or driver report identifies a problem.\n\n### Consequence\nProperty maintenance schedules the repair or service to keep the fleet operational. Without this request, the fault persists, and the vehicle may be unsafe or unavailable.","sourceid":"elem-id-989","targetid":"elem-id-983","specialization":""},{"id":"elem-id-0507cbb4-8d75-4972-8477-4fd7406ddaf2","type":"FlowRelationship","name":"Venue Availability Update","documentation":"### Object\nThe Venue Availability Update reflects changes in which venues are open for bookings, cancellations, or new spaces.\n\n### Condition\nIt is issued when venue status changes.\n\n### Consequence\nInternal communications relays the update so event organisers can adjust plans. Without this update, organisers attempt to book unavailable venues, causing delays.","sourceid":"elem-id-936","targetid":"elem-id-940","specialization":""},{"id":"elem-id-7261b3ac-5893-4a22-9a2c-f0b6654b46a0","type":"FlowRelationship","name":"Venue Booking Request","documentation":"### Object\nThe Venue Booking Request specifies the event date, expected attendance, room layout, catering needs, and technical requirements for a proposed campus event.\n\n### Condition\nIt is submitted once an event is approved and requires a physical space to be reserved.\n\n### Consequence\nVenue managers confirm availability, assign a specific room, and schedule setup. Without this request, no space is held, and the event has no confirmed location.","sourceid":"elem-id-929","targetid":"elem-id-936","specialization":""},{"id":"elem-id-dbf2d8ac-7824-4453-8c5e-73727613a14d","type":"FlowRelationship","name":"Venue Feedback Summary","documentation":"### Object\nThe Venue Feedback Summary aggregates comments about venue quality, including cleanliness, accessibility, and technical facilities.\n\n### Condition\nIt is produced after event organisers or attendees submit feedback.\n\n### Consequence\nVenue management uses the summary to prioritise improvements and respond to recurring complaints. Without this summary, venue issues are not systematically addressed, leading to continued dissatisfaction.","sourceid":"elem-id-941","targetid":"elem-id-936","specialization":""},{"id":"elem-id-4beebd28-3848-4971-8739-2ec1a5d38844","type":"FlowRelationship","name":"Vision Statements","documentation":"### Object\nThis is a set of vision statements and guiding principles for the institution's long-term direction.\n\n### Condition\nIt is issued after strategic vision is validated by leadership. Arrival means the foundational direction is available to set objectives.\n\n### Consequence\nOn arrival, strategic goals and objectives are formulated consistent with the vision and guiding principles. While absent, strategic planning lacks the directional foundation and goals are set without institutional aspiration.","sourceid":"elem-id-820","targetid":"elem-id-823","specialization":""},{"id":"elem-id-8f5cfa43-1344-4b7f-80d6-14a6c606c22e","type":"FlowRelationship","name":"Wellbeing Impact Report","documentation":"### Object\nThe report indicating how wellbeing issues affect a student's engagement and learning.\n\n### Condition\nIssued when health and wellbeing services assess the impact and share it with retention staff.\n\n### Consequence\nArrival adjusts retention interventions to account for wellbeing. Absence separates health from engagement and lessens support effectiveness.","sourceid":"elem-id-877","targetid":"elem-id-874","specialization":""},{"id":"elem-id-7f175b5f-74dd-40a2-b189-8062f73aa063","type":"FlowRelationship","name":"Wellbeing Referral","documentation":"### Object\nThe referral from a personal tutor to health and wellbeing services, containing the concern type and consent.\n\n### Condition\nIssued when a tutor identifies a student in need of professional wellbeing support and the student consents or risk warrants it.\n\n### Consequence\nArrival opens a wellbeing case and schedules support interventions. Absence leaves the student without clinical or counselling access.","sourceid":" b4109-1949-44e5-82fb-2dc2c15ba18d","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-d4038c5e-89ab-4ec0-94ff-233ea497f897","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-8f5cfa43-1344-4b7f-80d6-14a6c606c22e","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-dae360e0-30ca-4c70-b757-86dc0e741dd0","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-1335b6c8-7131-46ef-a201-dae2b4ca5f42","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-7ca757b5-1d25-47e6-8341-6a12540ffe52","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-652faf42-0ea4-48d9-b8fc-b4547ab9f836","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-1124b414-1a63-40d2-85c4-e6aca8f26f35","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-455d9224-e174-4f54-aa1c-2efa7785d577","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-1dbca73a-564d-4353-82da-ba992bad1d2a","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-924b3fea-a6f2-4a2c-96a9-1b81925fc488","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-ed61b96e-9e0a-4f2c-a906-e74f4b16b470","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-43bcd839-2c18-4914-9a0a-b8e1d1a30334","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-d787fb4b-b400-4cdb-8c13-384d426d4122","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-13cd0ca0-7f16-456a-827b-e11a73420e36","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-80bf16e9-45d5-4a53-bfce-6f8b29a3c148","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-5830db32-3174-4942-851d-b93820739843","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-a2d1541f-763d-48b7-bdd4-068817e5fba9","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-fee869f0-f0a0-47a2-aad3-e9b1d3522bff","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-a03e38f0-95e9-495a-b663-6e49a6034d7a","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-c274347c-895d-416b-bf41-ff31ddc20825","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-60013eaa-ed09-4ece-9593-0e7d41333eaa","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-000bb71b-c2c9-4f1d-8092-74873a22f160","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-b71989e6-fa90-4e76-b7ac-9226e1135809","propkey":"tier","propvalue":"paid"},{"conceptid":"elem-id-0bd3bab1-b229-476a-ad35-42529962e576","propkey":"tier","propvalue":"paid"}]}</script>
