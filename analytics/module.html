paid.\n\n### Activities\nActivities present are: maintain Alumni Contact Preferences, validate Graduate Records for alumni eligibility, organise Alumni Event Invitations, publish Alumni Newsletters, record Donation Pledges, process Donation Receipts, and suppress contact when an opt-out is recorded.\n\n### Fails when\nIt fails when Graduate Records are not matched to current contact details or when Alumni Contact Preferences are ignored. Engagement then drops, Donation Pledges are not recorded, and the institution has no reliable graduate contact base for statutory or fundraising purposes.\n\n### Constraint\nIt is constrained by the UK GDPR requirement that every contact use a lawful basis and by the need to keep alumni data separate from current student records.\n\n### Operating Conditions\nA Graduate Record must be checked against the institution's graduation list and include the graduate identifier and programme title; if the title is missing it is accepted with a qualification for later correction. An Alumni Contact Preference must state the preferred channel and consent; if consent is absent the record is suppressed. A Donation Pledge must have a stated amount and payment instruction; if the instruction is incomplete the pledge is returned.","specialization":""},{"id":"elem-id-20004","type":"Capability","name":"Business Capability Management","documentation":"### Identity\nThis is a layer two capability within Strategy & Governance. It is accountable for maintaining the inventory of business capabilities, assessing each against Strategic Objectives, and directing investment to close gaps or retire redundant capability.\n\n### Consumes\nIt takes in the approved Strategic Plan when a new planning cycle starts; each Strategic Objective is extracted and mapped to the current capability inventory. It takes in Key Performance Indicators at the end of each academic term; each indicator is tied to a capability owner. It takes in Capability Assessment Requests from service owners when a service issue suggests a capability gap. It takes in Risk Register entries when a risk is linked to capability underperformance.\n\n### Produces\nIt issues a Capability Roadmap when the governing body approves a set of investment priorities. It issues an Investment Decision when a business case has a named owner, cost estimate, and expected impact on a Strategic Objective. It issues a Capability Change Mandate when an investment is approved, which authorises the change. It issues a Capability Performance Report at the end of each academic year, stating maturity and utilisation for each capability.\n\n### Activities\nActivities include assessing a business capability against a Strategic Objective, prioritising a Capability Assessment Request, recording a capability owner, issuing an Investment Decision, escalating a Capability Performance Report that shows underperformance, rejecting an Investment Decision request that lacks a cost estimate, and reassessing a business capability after a Capability Change Mandate completes.\n\n### Fails when\nThis capability fails when no current Capability Roadmap exists and the governing body refuses to approve one, because then Investment Decisions cannot be made and underperforming business capabilities continue without remediation.\n\n### Constraint\nEvery business capability in the inventory must have a named accountable executive and a traceable link to at least one Strategic Objective; capabilities without both are excluded from investment decisions.\n\n### Operating Conditions\nIncoming Strategic Plan must be the governing-body-approved version for the current cycle and must contain measurable Strategic Objectives; if it is a draft or lacks measurable objectives, it is returned to the originator. Key Performance Indicators must be no older than the last completed academic term and must include the capability owner and baseline; if missing either, the indicator is rejected. Capability Assessment Requests must state the service issue and the suspected capability; without both, the request is accepted with a qualification and placed in a holding queue. Risk Register entries must carry a risk owner and a likelihood score; if not, they are returned. The produced Capability Roadmap is judged by whether each entry maps to a Strategic Objective and an Investment Decision; any entry without both is sent back for revision.","specialization":""},{"id":"elem-id-20005","type":"Capability","name":"Commercial Delivery","documentation":"### Identity\nAn operating capability within the Commercial Activity domain. It ensures that contracted goods or services are delivered, accepted and recorded against the Commercial Contract.\n\n### Consumes\nContract Agreement arrives when it is fully signed and binds delivery obligations; it triggers creation of a delivery plan. Service Request arrives from an internal or external party as a demand for contracted service; it triggers scheduling of resources. Supplier Invoice arrives when a supplier claims payment for delivered goods or services; it triggers verification against delivery acceptance.\n\n### Produces\nDelivery Acceptance Record is issued when the goods or services meet the Contract Agreement scope and quality requirements; it leaves an accepted state with date, recipient and contract reference. Payment Instruction is issued when a Supplier Invoice matches a Delivery Acceptance Record and contract pricing; it leaves an approved state for payment. Contract Variation is issued when scope, price or delivery date changes require formal amendment; it leaves a pending or approved state.\n\n### Activities\nPlan delivery milestones from Contract Agreement. Assign delivery resources to Service Requests. Verify delivered goods or services against Contract Agreement specifications. Record Delivery Acceptance Record. Reject non-conforming delivery and return to supplier or client. Verify Supplier Invoice against Delivery Acceptance Record and Contract Agreement pricing. Issue Payment Instruction for verified Supplier Invoice. Raise Contract Variation when scope or date changes exceed tolerance.\n\n### Fails when\nDeliveries cannot be accepted because they fail contract specifications, or Supplier Invoices cannot be matched to accepted deliveries; then payments are not authorised, suppliers or clients stop providing contracted goods or services, and Contract Agreements cannot close.\n\n### Constraint\nNo payment is authorised for any Supplier Invoice until the corresponding Delivery Acceptance Record is recorded and linked to the Contract Agreement.\n\n### Operating Conditions\nIncoming Contract Agreement must be signed by an authorised signatory and contain complete specifications, pricing, delivery dates and acceptance criteria; unsigned or incomplete agreements are returned to origin. Service Request must reference a valid Contract Agreement or approved purchase; requests lacking that reference are rejected. Supplier Invoice must be accurate against contract pricing and receipt of goods; invoices with price or quantity mismatches are returned to supplier. Delivery Acceptance Record must be traceable to the named recipient and contract line; untraceable acceptance blocks payment. Contract Variation must carry revised approvals; an unapproved variation is rejected.","specialization":""},{"id":"elem-id-20006","type":"Capability","name":"Commercial Engagement","documentation":"### Identity\nAn operating capability within the Commercial Activity domain. It establishes and develops commercial relationships with external clients and translates client needs into firm proposals and signed Contract Agreements.\n\n### Consumes\nClient Enquiry arrives when an external organisation requests commercial services or collaboration; it triggers qualification and scope discussions. Service Request arrives when an internal unit identifies a commercial opportunity requiring client engagement; it triggers proposal development. Contract Agreement arrives when legal and finance have approved the proposed terms; it triggers final client signature and record creation.\n\n### Produces\nCommercial Proposal is issued when scope, pricing and delivery terms are agreed with the client and the internal cost model is approved; it leaves a state ready for client acceptance. Contract Agreement is issued when both parties sign; it leaves a binding arrangements record and triggers delivery and invoicing. Client Record is issued when a prospective client is qualified and added to the pipeline; it leaves an active account state with contact, sector and creditworthiness.\n\n### Activities\nQualify Client Enquiry against institutional commercial criteria. Develop Commercial Proposal with pricing model and delivery terms. Negotiate Contract Agreement terms with client. Escalate legal deviation to institutional legal review. Decline Client Enquiry where commercial viability or compliance risk is unacceptable. Maintain Client Record with engagement history and approvals.\n\n### Fails when\nA Client Enquiry cannot be converted to a signed Contract Agreement because pricing cannot cover costs or legal terms are not approved; then no external commercial income is generated for that opportunity and downstream delivery cannot start.\n\n### Constraint\nNo commercial engagement proceeds beyond proposal stage without an institutional cost model and legal sign-off, regardless of client urgency.\n\n### Operating Conditions\nIncoming Client Enquiry must carry named client legal entity, contact authority and required services; enquiries without a legal entity are rejected. Service Request must include an approved internal sponsor and budget code; unauthorised requests are returned. Contract Agreement arriving from legal review must be complete with all schedules and signatories; incomplete agreements are returned for correction. Commercial Proposal must be traceable to the Client Enquiry and approved cost model; where the cost model is missing the proposal is not issued. Client Record must maintain current beneficial ownership and sanctions screening; failure to complete screening rejects the client.","specialization":""},{"id":"elem-id-20007","type":"Capability","name":"Commercial Monitoring","documentation":"### Identity\nAn operating capability within the Commercial Activity domain. It monitors performance, financial delivery, risks and compliance of Commercial Contracts and produces reports for management and external obligations.\n\n### Consumes\nContract Agreement arrives when executed and triggers registration in the monitoring system. Delivery Acceptance Record arrives when delivery is accepted; it triggers update of contract performance metrics. Supplier Invoice arrives when processed and triggers financial tracking and spend analysis. Government Policy document arrives when regulatory reporting duties change; it triggers update of monitoring indicators.\n\n### Produces\nContract Performance Report is issued at each reporting period, recording key performance indicators, spend and delivery status. Risk Register is issued when risks are identified and assessed, with risk owner and mitigation. Financial Statement is issued when all transactions for the period are reconciled and audited. Regulatory Return is issued when statutory thresholds are met and obligations require submission.\n\n### Activities\nTrack contract milestones against Contract Agreement. Reconcile Supplier Invoice and Delivery Acceptance Record against contract values. Identify contract performance exceptions. Escalate underperformance to contract owner and supplier. Maintain Risk Register with likelihood, impact and owner. Prepare Contract Performance Report with variance analysis. Submit Regulatory Return to regulator. Reassess contract compliance when Government Policy document changes.\n\n### Fails when\nContract performance data is incomplete or Supplier Invoices cannot be reconciled to contract lines, preventing Financial Statements from being signed off and Regulatory Returns from being submitted; then management cannot evidence commercial performance and statutory deadlines are missed.\n\n### Constraint\nAll contract performance and financial reporting must be traceable to the underlying Contract Agreement and its accepted delivery records, not to manual aggregates.\n\n### Operating Conditions\nIncoming Contract Agreement must be complete, dated and signed; unsigned contracts are rejected for monitoring until resolved. Delivery Acceptance Record must be recorded within the same reporting period as delivery; late records are accepted but flagged as non-current and excluded from performance metrics until corrected. Supplier Invoice must be matched to contract line and delivery; unmatched invoices are returned to processing. Government Policy document must be current and confirmed as applicable; superseded documents are archived and not applied. Contract Performance Report must reconcile to the Risk Register and financial ledger; unreconciled reports are not issued.","specialization":""},{"id":"elem-id-20008","type":"Capability","name":"Commercial Sourcing","documentation":"### Identity\nAn operating capability within the Commercial Activity domain. It identifies, evaluates and selects external suppliers and assembles the terms that become Commercial Contracts for purchased goods and services.\n\n### Consumes\nRequest for Purchase arrives when an institutional unit submits a requirement for goods, works or services not available internally; it triggers sourcing. Supplier Proposal arrives when a supplier responds to a call for competition or direct invitation; it triggers evaluation. Government Policy document arrives when procurement thresholds or sustainability duties are updated; it triggers alignment of sourcing criteria.\n\n### Produces\nApproved Supplier List is issued when supplier due diligence, financial checks and insurance evidence are complete and recorded; it leaves a list of suppliers eligible for future contracts. Commercial Contract is issued when chosen supplier and the institution agree price, scope, duration and terms; it remains unsigned pending approvals. Supplier Evaluation Record is issued after each proposal is scored against advertised criteria; it records scores, clarifications and non-compliance findings.\n\n### Activities\nIssue Request for Purchase to market. Evaluate Supplier Proposal against published selection criteria. Conduct supplier due diligence on financial standing and insurance. Negotiate Commercial Contract terms with selected supplier. Reject non-compliant Supplier Proposal when mandatory requirements are not met. Escalate affordability rejection to budget holder when price exceeds approved threshold. Record conflict of interest declaration and exclude conflicted supplier from evaluation.\n\n### Fails when\nNo Supplier Proposal meets the evaluation criteria or affordability limits; then no Commercial Contract is issued and the requested goods or services cannot be procured, leaving the originating Service Request unresolved.\n\n### Constraint\nEvery sourcing decision must be documented against pre-published evaluation criteria; no Commercial Contract may be awarded to an off-contract supplier.\n\n### Operating Conditions\nIncoming Request for Purchase must be complete with specification, budget code and authorised sign-off; incomplete or unauthorised requests are returned to requester. Supplier Proposal must be received by the published closing date; late proposals are rejected. Government Policy document must be current and authoritative; outdated policy is accepted only if archived with superseded status. Supplier due diligence outputs must be verified and traceable to the named supplier; missing financial statements cause rejection. Approved Supplier List and Commercial Contract must be traceable to the Supplier Evaluation Record; where traceability is broken, the decision is re-opened.","specialization":""},{"id":"elem-id-20009","type":"Capability","name":"Corporate Governance","documentation":"### Identity\nThis is a layer two capability within Strategy & Governance. It is accountable for the lawful and proper conduct of the institution's governing body, its committees, and its statutory officers. It ensures decisions are made with a recorded quorum, conflicts of interest are declared, and obligations to the Office for Students, Companies House, and the Information Commissioner are met.\n\n### Consumes\nIt takes in Government Policy Documents as they are published by regulators or Parliament; each is assessed for applicability and converted into a Compliance Obligation with a due date. It takes in Audit Findings from internal and external assurance providers; each is logged against a committee with a required response. It takes in Board Agenda Requests from officers and committees; each is scheduled against the annual governance calendar. It takes in Whistleblowing Reports through the confidential channel; each is forwarded to the nominated senior independent director.\n\n### Produces\nIt issues Governance Decisions when a meeting has a recorded quorum and a majority vote; each decision is numbered and dated. It issues Board Minutes after they have been approved at the following meeting. It issues Statutory Filings to the relevant regulator on or before the statutory deadline. It issues Annual Reports when the external auditor has signed and the governing body has approved the accounts. It issues Policy Statements when a policy has passed equality impact assessment and governing body approval.\n\n### Activities\nActivities include scheduling a Board Agenda Request, preparing a Board Pack, reviewing a Compliance Obligation against the statutory calendar, recording a Governance Decision in the minute book, investigating a Whistleblowing Report, rejecting a Board Agenda Request that lacks an executive sponsor, escalating a Compliance Obligation that is past due, and approving a Board Minutes draft after amendment.\n\n### Fails when\nThis capability fails when the governing body cannot achieve a quorum for two consecutive scheduled meetings, because no Governance Decision, Board Minutes, or Statutory Filing can be issued. As a result, the Office for Students is not notified of reportable events and the institution loses its registration conditions.\n\n### Constraint\nEvery Governance Decision must be attributable to a named individual and recorded in Board Minutes within five working days; a decision without both is void.\n\n### Operating Conditions\nIncoming Government Policy Documents must state the issuing body, effective date, and affected legislation; if any is missing, the document is returned to the source with a request for the full text. Audit Findings must include evidence, impact, and a recommendation; if not, the finding is rejected and the auditor is asked to resubmit. Board Agenda Requests must include a decision required and an executive sponsor; without both, the request is returned. Whistleblowing Reports must be dated and identify the alleged breach; if anonymous and undated, the report is accepted with a qualification that limits investigation. Produced Governance Decisions are judged by whether they include the motion, vote count, and date; a decision missing any of these is not issued. Board Minutes are judged by whether they record all Governance Decisions and declarations of interest; if a decision is omitted, the minutes are returned for correction.","specialization":""},{"id":"elem-id-200010","type":"Capability","name":"Curriculum Management","documentation":"### Identity\nThis is a management capability within the Teaching & Learning domain. It is accountable for the approval, maintenance and retirement of the institutional curriculum, including module content, credits, learning outcomes and assessment strategies.\n\n### Consumes\nIt consumes Programme Specifications when a new programme is proposed or an existing one is revised. It consumes Module Proposals when a module is added, changed or withdrawn. It consumes External Examiner Feedback when a programme review identifies a quality issue. It consumes Professional Body Requirements when an accrediting body issues new standards.\n\n### Produces\nIt produces an Approved Curriculum as the authoritative list of programmes, modules and credit values. It produces a Module Catalogue as a published, searchable record for students and staff. It produces Curriculum Change Notices when an approval or withdrawal is confirmed.\n\n### Activities\nActivities present are: draft Programme Specifications, review Module Proposals, validate Learning Outcomes against credit value, apply Professional Body Requirements, approve a Curriculum Change, reject a Module Proposal that lacks assessment strategy, and retire a Course when no longer viable.\n\n### Fails when\nIt fails when Module Proposals are not approved before the academic year starts or when the Module Catalogue does not match the Approved Curriculum. Students cannot then select valid modules, assessment schedules become unusable, and Student Completion is delayed.\n\n### Constraint\nIt is constrained by the requirement that every module and programme satisfy both institutional regulations and any relevant professional accreditation standard before it is listed in the Module Catalogue.\n\n### Operating Conditions\nA Module Proposal must state module code, credit total, learning outcomes and assessment strategy; if the assessment strategy is absent the proposal is returned. A Programme Specification must include progression rules and exit awards; if progression rules are missing it is rejected. External Examiner Feedback must reference the relevant programme and identify the issue; if the reference is absent it is escalated to the responsible committee.","specialization":""},{"id":"elem-id-200011","type":"Capability","name":"Facilities & Property Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the condition, safety, and utilisation of the institution's estate. It is answerable for planned and reactive maintenance, building compliance, energy performance, and space allocation.\n\n### Consumes\nIt takes in Building Condition Survey, triggered by scheduled inspection or regulatory requirement. It takes in Facilities Work Order, triggered by fault report or planned maintenance due. It takes in Planned Maintenance Schedule, triggered by asset lifecycle or manufacturer interval. It takes in Utility Invoice, triggered by billing cycle. It takes in Space Request, triggered by department or service change.\n\n### Produces\nIt issues Facilities Work Order closure when work is verified complete against specification. It issues Maintenance Schedule when asset condition and statutory intervals are assessed. It issues Building Compliance Certificate when statutory inspections pass. It issues Energy Performance Report when meter data is collected and analysed. It issues Space Allocation when a Space Request is approved against utilisation criteria.\n\n### Activities\nInspects building fabric and plant to produce Building Condition Survey. Prioritises Facilities Work Order by safety impact and statutory risk. Schedules Planned Maintenance Schedule from asset register and condition data. Dispatches internal staff or external contractor for work. Verifies completion against work specification and test results. Maintains Asbestos Register for each building. Processes Space Request against room utilisation data and academic need. Handles Emergency Repair Request to restore safe operation. Manages contractor performance against safety and time standards. Responds to utility failure and restores supply.\n\n### Fails when\nIt stops delivering when Building Condition Survey is missing or older than the statutory interval, causing unplanned failures, unsafe conditions, and maintenance backlog that cannot be prioritised.\n\n### Constraint\nIt operates a 24-hour physical campus under statutory building safety, fire and environmental regulations, where a single failed asset can close a building.\n\n### Operating Conditions\nFacilities Work Order must include location, fault type, priority and requester contact; if incomplete, it is returned to the requester. Building Condition Survey must be current within the statutory interval and produced by an accredited surveyor; if not, it is escalated and not used for maintenance planning. Utility Invoice must reconcile to meter readings and contract tariffs; if mismatched, it is returned to the utility provider. Planned Maintenance Schedule must include asset ID, statutory interval and last completed date; if missing, it is returned to the asset owner. Space Request must include required space type, occupancy, and purpose; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200012","type":"Capability","name":"Finance Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's financial control, accounting, payroll, procurement, treasury, and statutory reporting. It is answerable for financial accuracy, liquidity, and compliance with funding and tax obligations.\n\n### Consumes\nIt takes in Supplier Invoice, triggered by receipt of goods or services. It takes in Purchase Order, triggered by an approved procurement decision. It takes in Expense Claim, triggered by a staff member's business expense. It takes in Student Fee payment, triggered by invoice or payment plan. It takes in Budget Proposal, triggered by annual planning or reforecast. It takes in Payroll Change Request, triggered by a change in employment terms.\n\n### Produces\nIt issues Payment Run when Supplier Invoices are approved and due. It issues Financial Statement when the general ledger is closed for a period. It issues Budget Report when actuals are compared to budget. It issues Payroll Record when payroll is calculated and paid. It issues Invoice Query Resolution when a supplier or student disputes a charge.\n\n### Activities\nValidates Supplier Invoice against Purchase Order and goods receipt. Processes Expense Claim against expense policy and budget code. Allocates Student Fee payment to Student Account. Prepares Payment Run with segregation of duties. Reconciles Bank Statement to Financial Transactions. Produces Financial Statement under statutory accounting standards. Reviews Budget Proposal against resource constraints and strategic priorities. Processes Payroll Change Request with effective date and authorisation. Investigates Invoice Query and corrects transaction or requests credit note. Manages credit control and debt recovery for unpaid invoices.\n\n### Fails when\nIt stops delivering when Supplier Invoice cannot be matched to a valid Purchase Order or budget code, causing payment delays, supplier holds, and breach of statutory payment terms; or when Payroll Record cannot be calculated because Payroll Change Request data is missing.\n\n### Constraint\nIt operates under HMRC tax rules, OfS financial reporting conditions, and external audit requirements, with hard month-end and year-end close deadlines.\n\n### Operating Conditions\nSupplier Invoice must include valid Purchase Order number, VAT registration, and amount; if missing, it is returned to the supplier. Expense Claim must include receipts and budget code; if incomplete, it is returned to the claimant. Student Fee payment must include Student ID and amount; if mismatched, it is accepted with qualification and allocated to a suspense account until reconciled. Payroll Change Request must include signed authorisation and effective date; if not, it is returned. Budget Proposal must include cost centre and full-year impact; if incomplete, it is returned. Purchase Order must include approved supplier, amount, and budget code; if missing, it is returned to the requester.","specialization":""},{"id":"elem-id-200013","type":"Capability","name":"Government, Public & Stakeholder Relationships","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's external standing with government, regulators, local communities, media, and partners. It is answerable for monitoring policy, responding to consultations and requests, and protecting institutional reputation.\n\n### Consumes\nIt takes in Government Policy document, triggered by publication from a government body. It takes in Consultation Request, triggered by a regulator or government department seeking institutional input. It takes in Stakeholder Enquiry, triggered by a partner, community group or public body. It takes in Freedom of Information Request, triggered by a written request from the public. It takes in Parliamentary Question, triggered by a parliament member's query.\n\n### Produces\nIt issues Consultation Response when institutional position is approved. It issues Stakeholder Briefing when an issue requires internal awareness or external communication. It issues Public Statement when the institution responds to media or public concern. It issues Regulatory Submission when a statutory return is due. It issues Memorandum of Understanding when a partnership framework is agreed.\n\n### Activities\nMonitors Government Policy document for relevance to institutional obligations. Prepares Consultation Response with institutional position and evidence. Coordinates Stakeholder Enquiry handling and response. Prepares Public Statement under press office and executive approval. Maintains Stakeholder Register with contact and interest. Responds to Freedom of Information Request within statutory deadline. Manages Parliamentary Question response from internal briefings. Arranges stakeholder meeting and records Meeting Note. Handles complaint from external stakeholder and escalates where unresolved.\n\n### Fails when\nIt stops delivering when a Government Policy document is received but not assessed for impact, causing the institution to miss a consultation deadline or fail a statutory return, with regulatory sanction.\n\n### Constraint\nIt operates to external deadlines set by government and regulators, many of which are statutory and cannot be extended, while institutional reputation depends on accurate public communication.\n\n### Operating Conditions\nGovernment Policy document must be current and official; if draft or unauthorised, it is accepted with qualification and flagged for confirmation. Consultation Request must include closing date, scope and contact; if missing, it is escalated for clarification. Freedom of Information Request must be in writing and include requester details; if not, it is accepted and the requester is asked for clarification under the duty to advise. Stakeholder Enquiry must include subject and expected response date; if incomplete, it is accepted and logged with a default response target. Parliamentary Question must include identifying number and deadline; if missing, it is escalated.","specialization":""},{"id":"elem-id-200014","type":"Capability","name":"Human Resource Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the employment lifecycle, recruitment, pay, development, and employee relations across the institution. It is answerable for workforce capacity, legal compliance, and fair treatment of staff.\n\n### Consumes\nIt takes in Position Request, triggered by a vacancy or organisational change. It takes in Employment Application, triggered by a candidate response to a vacancy. It takes in Payroll Change Request, triggered by a change in employment terms or personal details. It takes in Training Request, triggered by a development need or appraisal. It takes in Grievance Record, triggered by an employee complaint. It takes in Sickness Absence Record, triggered by employee illness.\n\n### Produces\nIt issues Offer Letter when a candidate is selected. It issues Employment Contract when the offer is accepted and right-to-work checks pass. It issues Payroll Change Instruction when an approved change is sent for payroll processing. It issues Training Record when training is completed and recorded. It issues Disciplinary Outcome when a disciplinary hearing concludes. It issues Exit Interview Record when an employee leaves.\n\n### Activities\nReviews Position Request against workforce plan and budget. Advertises vacancy and shortlists Employment Application. Interviews and selects candidate. Issues Offer Letter and Employment Contract. Onboards new employee and creates employee record. Processes Payroll Change Request against policy and authorisation. Maintains Training Record for each employee. Conducts appraisal and records Appraisal Outcome. Manages Grievance Record through investigation and hearing. Handles Sickness Absence Record and return-to-work meeting. Processes termination and issues exit documentation. Manages appeal against disciplinary or grievance outcome.\n\n### Fails when\nIt stops delivering when Payroll Change Request is not processed before the payroll cut-off, causing incorrect pay, tax errors, and employee relations risk; or when Employment Contract is issued without right-to-work check, causing illegal working.\n\n### Constraint\nIt operates under employment law, collective bargaining agreements, equality duties, and UK GDPR for employee personal data, with strict deadlines for pay and dispute resolution.\n\n### Operating Conditions\nEmployment Application must include right-to-work evidence, qualifications, and application form; if incomplete, it is returned to the candidate. Payroll Change Request must be authorised by the budget holder and include effective date; if not, it is returned. Grievance Record must be submitted within policy timeframe and include a factual account; if late, it is accepted with qualification and investigated where reasonable. Sickness Absence Record must include fit note and dates; if missing, it is accepted and manager follows absence policy. Position Request must include job description and grade; if incomplete, it is returned. Training Request must include learner, course, and budget code; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200015","type":"Capability","name":"Information & Communication Technology Mgt","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's ICT infrastructure, applications, user support, security, and technology change. It is answerable for service availability, data integrity, and cyber resilience.\n\n### Consumes\nIt takes in ICT Service Request, triggered by a user requesting access, equipment, or service change. It takes in Incident Record, triggered by a reported failure or disruption. It takes in Change Request, triggered by a need to alter an ICT service. It takes in Security Alert, triggered by a threat notification or detection. It takes in Asset Purchase Request, triggered by a hardware or software need.\n\n### Produces\nIt issues Service Desk Ticket when an ICT Service Request is logged. It issues Configuration Item when an asset or software is recorded in the configuration management database. It issues Change Approval Record when a Change Request is assessed and authorised. It issues Security Patch Record when a vulnerability is remediated. It issues ICT Service Catalogue when a service is defined and published.\n\n### Activities\nLogs ICT Service Request and assigns Service Desk Ticket. Diagnoses Incident Record and applies known error. Resolves Incident Record or escalates to specialist group. Assesses Change Request for risk and impact. Tests change and implements with backout plan. Maintains Configuration Item for each asset and software version. Applies Security Patch Record to vulnerable systems. Handles Asset Purchase Request within procurement limits. Provisions user access and removes access on role change. Manages service continuity and disaster recovery.\n\n### Fails when\nIt stops delivering when a Security Alert is not acted on, causing unauthorised access, data loss, or system compromise; or when Change Request cannot be assessed because Configuration Item data is inaccurate.\n\n### Constraint\nIt operates under UK GDPR security obligations and a requirement for continuous service availability, where unplanned downtime disrupts teaching, research, and administration.\n\n### Operating Conditions\nIncident Record must include time, impact, affected service, and user contact; if missing, it is returned for clarification. Change Request must include risk assessment, backout plan, and approver; if not, it is rejected by the change advisory board. Security Alert must be verified from a trusted source; if unverified, it is accepted with qualification and quarantined. ICT Service Request must include requester and requested service; if incomplete, it is returned. Asset Purchase Request must include business need and budget code; if missing, it is returned.","specialization":""},{"id":"elem-id-200016","type":"Capability","name":"Information Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's records, information assets, data protection, privacy, and retention. It is answerable for lawful processing, discoverability, and secure disposal of information.\n\n### Consumes\nIt takes in Data Protection Impact Assessment, triggered by a new or changed processing activity. It takes in Record Retention Request, triggered by a department needing a retention schedule. It takes in Information Asset Register, triggered by an asset owner update or new asset. It takes in Data Subject Access Request, triggered by an individual's request. It takes in Information Classification Request, triggered by a new information asset or review.\n\n### Produces\nIt issues Data Protection Impact Assessment approval when risks are mitigated. It issues Record Retention Schedule when retention periods are set. It issues Information Asset Register entry when asset details are recorded. It issues Data Subject Access Response when requested information is compiled. It issues Information Classification Decision when an asset is classified.\n\n### Activities\nMaintains Information Asset Register with owner, location, and classification. Conducts Data Protection Impact Assessment and reviews risk. Applies Record Retention Schedule to record series. Processes Data Subject Access Request within statutory deadline. Classifies information asset according to confidentiality and integrity. Handles data breach report and notifies regulator where required. Manages records disposal and destruction order. Responds to audit finding on information handling. Reviews third-party data sharing agreement.\n\n### Fails when\nIt stops delivering when a Data Subject Access Request is not answered within one month, causing a regulatory breach and potential fine; or when Record Retention Schedule is missing, causing unlawful disposal or retention.\n\n### Constraint\nIt operates under UK GDPR, Freedom of Information Act, and public records legislation, with statutory deadlines and evidence requirements that cannot be relaxed.\n\n### Operating Conditions\nData Subject Access Request must include identity verification and scope; if missing, the requester is asked for proof before processing. Data Protection Impact Assessment must be completed before processing begins and include residual risks; if incomplete, it is returned to the data owner. Record Retention Request must specify record series, format, and proposed retention period; if not, it is returned. Information Asset Register entry must include owner, location, and classification; if missing, it is accepted with qualification and assigned an owner. Information Classification Request must include asset type and sensitivity; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200017","type":"Capability","name":"Legal Services","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's legal advice, contract drafting, litigation, regulatory compliance, and intellectual property. It is answerable for legal risk and for lawful execution of institutional obligations.\n\n### Consumes\nIt takes in Legal Query, triggered by a request for advice from an internal department. It takes in Contract Draft, triggered by a proposed agreement with a third party. It takes in Litigation Notice, triggered by a claim or court document. It takes in Regulatory Notice, triggered by a regulator's communication. It takes in Intellectual Property Disclosure, triggered by an inventor or author.\n\n### Produces\nIt issues Legal Opinion when advice is delivered. It issues Contract Agreement when terms are signed and approved. It issues Litigation Response when a defence or settlement is filed. It issues Regulatory Filing when a required submission is made. It issues Intellectual Property Assignment when ownership is transferred.\n\n### Activities\nReviews Legal Query and assigns responsible lawyer. Drafts Legal Opinion with applicable law and risk. Negotiates Contract Draft against institutional terms. Executes Contract Agreement after approval. Responds to Litigation Notice within court deadline. Manages Regulatory Notice and coordinates regulatory filing. Assesses Intellectual Property Disclosure for ownership and commercial potential. Handles settlement negotiation and records settlement terms. Maintains legal precedent register. Supports internal investigation and disciplinary proceedings.\n\n### Fails when\nIt stops delivering when Contract Draft is not reviewed before sign-off, causing the institution to accept unfavourable terms; or when Litigation Notice is overlooked, causing default judgment.\n\n### Constraint\nIt operates under professional legal privilege, court deadlines, and statutory limitation periods, where delay can extinguish rights or create liability.\n\n### Operating Conditions\nLegal Query must include full facts, relevant documents, and desired outcome; if incomplete, it is returned to the requester. Contract Draft must be accompanied by procurement or partnership approval; if not, it is rejected. Litigation Notice must be date-stamped and served; if unclear, it is accepted with qualification and diarised. Regulatory Notice must be official and specify deadline; if missing, it is escalated. Intellectual Property Disclosure must include inventors, dates, and funding source; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200018","type":"Capability","name":"Library Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's library collections, access to information resources, borrowing, and research support. It is answerable for matching users to the materials they need within copyright and licensing terms.\n\n### Consumes\nIt takes in Library Acquisition Request, triggered by a reading list, research need, or collection gap. It takes in Library Loan Request, triggered by a user wanting to borrow an item. It takes in Interlibrary Loan Request, triggered by a user requesting an item not held. It takes in Copyright Query, triggered by a use of third-party material. It takes in Resource Access Request, triggered by a user needing access to a digital resource.\n\n### Produces\nIt issues Library Loan when a borrower's entitlement is confirmed and item is available. It issues Interlibrary Loan when a supplying library confirms availability. It issues Catalogue Record when an item is acquired and catalogued. It issues Copyright Clearance when a proposed use is assessed as lawful. It issues Resource Access Grant when a user is authorised for a platform.\n\n### Activities\nReviews Library Acquisition Request against collection policy and budget. Selects and acquires item and creates Catalogue Record. Circulates Library Loan and records due date. Manages Overdue Loan and applies recall. Processes Interlibrary Loan Request and tracks return. Answers Copyright Query and advises on fair dealing. Grants Resource Access Request against licence terms. Maintains reading list support and scans chapter requests. Handles lost item and replacement fee.\n\n### Fails when\nIt stops delivering when Library Loan Request cannot be fulfilled because Catalogue Record is missing or inaccurate, causing users to be unable to locate or access material.\n\n### Constraint\nIt operates under copyright law and digital licensing agreements that restrict what can be copied, shared, or accessed across the institution.\n\n### Operating Conditions\nLibrary Acquisition Request must include reading list or research need and source details; if missing, it is returned. Library Loan Request must be from a registered borrower with valid status; if not, it is rejected. Interlibrary Loan Request must include full citation and copyright declaration; if incomplete, it is returned. Copyright Query must include intended use and extract; if not, it is escalated to the copyright officer. Resource Access Request must include user role and resource; if incomplete, it is returned.","specialization":""},{"id":"elem-id-200019","type":"Capability","name":"Promotions Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the institution's marketing, brand, recruitment promotions, campaigns, and events. It is answerable for attracting students, protecting brand consistency, and measuring campaign effectiveness.\n\n### Consumes\nIt takes in Promotional Campaign Brief, triggered by a recruitment or reputational need. It takes in Market Research Report, triggered by a commissioned study or internal analysis. It takes in Budget Allocation, triggered by annual planning or campaign approval. It takes in Brand Asset Request, triggered by a department needing logo or template. It takes in Event Request, triggered by a proposed open day or promotional event.\n\n### Produces\nIt issues Promotional Material when a campaign asset is approved and produced. It issues Communication Plan when a campaign approach is agreed. It issues Campaign Report when campaign performance is measured. It issues Brand Asset when a logo or template is supplied under licence. It issues Event Plan when an event is approved and scheduled.\n\n### Activities\nReviews Promotional Campaign Brief against brand and objectives. Conducts market research or commissions Market Research Report. Creates Communication Plan with channels and timeline. Develops Promotional Material for print, web, and social. Approves brand use on Promotional Material. Runs campaign and monitors spend. Measures Campaign Report against key performance indicators. Handles Event Request and schedules event logistics. Manages promotional budget and reconciles spend.\n\n### Fails when\nIt stops delivering when Promotional Campaign Brief lacks target audience or budget, causing a campaign to launch without measurable objective or sufficient resource.\n\n### Constraint\nIt operates under brand guidelines and Advertising Standards Authority rules, within the seasonal recruitment cycle that concentrates activity in autumn and spring.\n\n### Operating Conditions\nPromotional Campaign Brief must include objective, target audience, budget, and deadline; if missing, it is returned to the requester. Market Research Report must include methodology and sample; if not, it is accepted with qualification and not used for major decisions. Brand Asset Request must comply with brand guidelines; if not, it is rejected. Event Request must include date, venue, audience, and purpose; if incomplete, it is returned. Budget Allocation must include cost centre and approved amount; if missing, it is returned.","specialization":""},{"id":"elem-id-200020","type":"Capability","name":"Research Administration","documentation":"### Identity\nThis is an operational capability within the Research domain. It is responsible for setting up Research Contracts, Research Projects, Data Management Plans and Research Ethics Approvals after a Research Award Notice, and for producing Research Funder Reports from Research Progress Reports and Research Final Reports.\n\n### Consumes\nIt consumes Research Award Notice, which arrives from funding and triggers the creation of a Research Contract and Research Project. It consumes Research Progress Report, which arrives at each reporting point and triggers administrative review against the Research Contract. It consumes Research Final Report, which arrives when research activities complete and triggers financial and technical closure checks.\n\n### Produces\nIt produces Research Contract when a Research Award Notice is accepted and all funder terms are recorded. It produces Research Project when a Research Contract is signed and the project is assigned a start date. It produces Data Management Plan when research data requirements are agreed with the research lead. It produces Research Ethics Approval when an ethics review is complete and the approval is attached to the Research Project. It produces Research Funder Report when all Research Progress Reports and Research Final Reports have been accepted and contractual financial obligations are met.\n\n### Activities\nAccepting a Research Award Notice is present. Creating a Research Contract is present. Creating a Research Project is present. Producing a Data Management Plan is present. Producing a Research Ethics Approval is present. Reviewing Research Progress Report against the Research Contract is present. Reviewing Research Final Report against the Research Contract is present. Producing Research Funder Report is present. Rejecting incomplete Research Progress Report is present. Escalating late Research Final Report is present. Reassessing a Data Management Plan after an audit finding is present. Closing a Research Project after Research Funder Report acceptance is present.\n\n### Fails when\nThis capability fails when Research Award Notices are received but Research Contracts cannot be signed because funder terms are unacceptable or Data Management Plans cannot be agreed, and no Research Projects are created. As a result, no Research Progress Reports or Research Final Reports can be reviewed, and no Research Funder Reports are issued.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot administer Research Contracts or Research Ethics Approvals for multi-institution projects, and every Research Project and Data Management Plan is owned by the institution alone.\n\n### Operating Conditions\nResearch Award Notice must include funder terms, award amount, duration and named research lead; notices missing any element are rejected. Research Progress Report must arrive before the contractual reporting deadline and include progress against milestones; late or incomplete reports are returned. Research Final Report must be submitted after all research activities cease and include final spend and deliverable completion; reports submitted before project end are rejected. Data Management Plan must specify storage, access, retention and open access arrangements; plans that do not meet funder conditions are returned for revision.","specialization":""},{"id":"elem-id-200021","type":"Capability","name":"Research Delivery","documentation":"### Identity\nThis is an operational capability within the Research domain. It is responsible for executing Research Projects according to the Research Contract, producing Research Data and Research Outputs, and maintaining milestones up to the Research Final Report.\n\n### Consumes\nIt consumes Research Project, which triggers the allocation of staff and facilities. It consumes Data Management Plan, which arrives with the Research Project and defines how Research Data is captured and stored. It consumes Research Ethics Approval, which arrives when the project involves regulated participants or data and must be in place before research activity begins. It consumes Research Budget, which arrives at project start and releases funds for approved research activities.\n\n### Produces\nIt produces Research Data when experiments, fieldwork or analysis generate raw results, and the data is deposited under the Data Management Plan. It produces Research Output when research findings are synthesised and validated against the Research Contract. It produces Research Progress Report at each contractual reporting point. It produces Research Final Report when all research activities are complete and the Research Project closes.\n\n### Activities\nExecuting a Research Project is present. Capturing Research Data is present. Storing Research Data under a Data Management Plan is present. Analysing Research Data is present. Producing Research Output is present. Producing Research Progress Report is present. Producing Research Final Report is present. Reassessing research methods after a failed experiment is present. Escalating Research Data loss or corruption is present. Rejecting Research Output that does not meet the Research Contract is present. Replanning Research Milestones after a budget or ethics change is present.\n\n### Fails when\nThis capability fails when Research Projects are started without a valid Data Management Plan or Research Ethics Approval, and Research Data cannot be captured or stored. As a result, no Research Outputs, Research Progress Reports or Research Final Reports are produced, and the Research Contract is breached.\n\n### Constraint\nThe capability operates as if all research activity occurs inside the single legal institution; it cannot deliver research in shared facilities or manage multi-institution research teams, and Research Data cannot leave the institutional boundary.\n\n### Operating Conditions\nResearch Project must carry an approved Research Budget and named research lead; projects missing either are returned for correction. Research Ethics Approval must be current and cover the planned research methods; expired approvals block start. Data Management Plan must specify storage and access before Research Data capture; a plan without retention terms is rejected. Research Budget must be authorised and match the Research Award Notice; unauthorised budgets stop research activity. Research Output is judged downstream for completeness, reproducibility and open access eligibility; outputs without sufficient Research Data are returned for additional evidence.","specialization":""},{"id":"elem-id-200022","type":"Capability","name":"Research Funding","documentation":"### Identity\nThis is a management capability within the Research domain. It is responsible for converting Research Funding Applications and Opportunity Register entries into Research Proposals, Research Costings, and finally Research Award Notices and Research Budgets.\n\n### Consumes\nIt consumes Research Funding Application, which arrives from funders and triggers assessment of scope, deadline and eligibility. It consumes Opportunity Register, which arrives from planning and triggers matching of academic staff and research strengths to opportunities. It consumes Research Strategy, which arrives from planning and sets priority areas for proposal selection.\n\n### Produces\nIt produces Research Proposal when a Research Funding Application is matched to a named academic lead and a feasible research plan is written. It produces Research Costing when the resource and cost estimate is completed and approved. It produces Research Award Notice when the funder accepts the Research Proposal and issues terms. It produces Research Budget when a Research Award Notice is accepted and the budget is allocated.\n\n### Activities\nAssessing Research Funding Application is present. Matching Opportunity Register entries to research strengths is present. Preparing Research Proposal is present. Preparing Research Costing is present. Reviewing Research Proposal against funder criteria is present. Submitting Research Proposal is present. Negotiating Research Award Notice is present. Rejecting Research Funding Application that is out of scope is present. Reassessing a Research Proposal after reviewer feedback is present. Producing Research Budget from Research Award Notice is present.\n\n### Fails when\nThis capability fails when Research Funding Applications and Opportunity Register entries are available but no Research Proposal is submitted because the Research Costing cannot be approved, and no Research Award Notice arrives. As a result, Research Budgets are not produced and no new Research Projects can start.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot submit joint Research Proposals with another institution or accept Research Award Notices that require shared Research Contracts, so every proposal and award is attributed to the institution alone.\n\n### Operating Conditions\nResearch Funding Application must arrive before the funder deadline and with complete eligibility criteria; late or incomplete calls are rejected. Opportunity Register entry must carry a named academic lead and an identified funder; entries without both are returned. Research Strategy must be current and approved; an outdated Research Strategy blocks proposal initiation. Research Proposal must meet funder eligibility and include a Research Costing; proposals without an approved Research Costing are not submitted. Research Award Notice is accepted only when the funder terms match the submitted Research Proposal; a mismatch triggers escalation and renegotiation.","specialization":""},{"id":"elem-id-200023","type":"Capability","name":"Research Impact","documentation":"### Identity\nThis is a management capability within the Research domain. It is responsible for collecting, validating and packaging Impact Evidence from Research Outputs and Research Publications into Impact Case Studies that meet external assessment requirements.\n\n### Consumes\nIt consumes Research Output, which triggers the extraction of claims about economic, social or policy change. It consumes Research Publication, which arrives when a Publication Record is created and triggers citation and uptake tracking. It consumes Stakeholder Testimony, which arrives from external stakeholders and is logged for verification.\n\n### Produces\nIt produces Impact Evidence when a claim is verified against a Research Output or Research Publication and assigned a source record. It produces Impact Case Study when Impact Evidence for a Research Project reaches the threshold and is packaged in the required template.\n\n### Activities\nCollecting Stakeholder Testimony is present. Extracting impact claims from Research Output is present. Extracting impact claims from Research Publication is present. Verifying Stakeholder Testimony against Research Output and Research Publication is present. Producing Impact Evidence is present. Producing Impact Case Study is present. Rejecting unverifiable Stakeholder Testimony is present. Reassessing Impact Evidence after external assessment feedback is present. Escalating Impact Case Study that misses the submission deadline is present.\n\n### Fails when\nThis capability fails when Research Outputs and Research Publications exist but no Stakeholder Testimony can be verified into Impact Evidence, and Impact Case Studies cannot be produced. As a result, the institution has zero Impact Case Studies for the external assessment exercise and fails to demonstrate research impact.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot attribute impact arising from collaborative research to another institution, and every Impact Case Study must be linked to the institution's own Research Outputs and Research Publications.\n\n### Operating Conditions\nResearch Output must be deposited in the institutional repository with a persistent identifier and be publicly accessible where mandated; outputs without a repository record are returned. Research Publication must have a Publication Record and Open Access Compliance Record; publications without open access compliance are excluded from Impact Evidence. Stakeholder Testimony must name the Research Output or Research Publication and be attributable to a named individual; anonymous or unverifiable testimony is rejected. Impact Evidence must be accurate and current before inclusion in an Impact Case Study; evidence older than the assessment window is rejected.","specialization":""},{"id":"elem-id-200024","type":"Capability","name":"Research Improvement","documentation":"### Identity\nThis is a management capability within the Research domain. It is responsible for analysing Research Funder Reports, Research Final Reports and Impact Case Studies to identify underperformance, and for producing Research Improvement Plans that change research practice and policy.\n\n### Consumes\nIt consumes Research Funder Report, which arrives when Research Projects close and triggers analysis of spend, outputs and compliance. It consumes Research Final Report, which arrives from completed Research Projects and is reviewed for technical findings and deviations. It consumes Impact Case Study, which arrives after external assessment and is used to judge impact strength.\n\n### Produces\nIt produces Research Improvement Plan when an analysis shows a deviation from Research Strategy or a funder requirement, and the plan specifies remedial actions and owners.\n\n### Activities\nAnalysing Research Funder Report is present. Analysing Research Final Report is present. Comparing Impact Case Study against Research Strategy is present. Identifying deviations from funder requirements is present. Producing Research Improvement Plan is present. Rejecting Research Final Report that lacks complete data is present. Escalating recurring funder audit findings is present. Reassessing a Research Improvement Plan after implementation feedback is present.\n\n### Fails when\nThis capability fails when Research Funder Reports, Research Final Reports and Impact Case Studies are all produced but no Research Improvement Plan is issued because analysis does not lead to corrective actions. As a result, repeated funder audit findings, compliance breaches and weak Impact Case Studies persist into the next academic year.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot benchmark performance against other institutions or shared services, so every Research Improvement Plan must be scoped to the institution's own projects and outputs.\n\n### Operating Conditions\nResearch Funder Report must include final spend, deliverable completion and compliance status; reports missing any of these are returned. Research Final Report must match the Research Contract milestones; mismatched reports are rejected. Impact Case Study must have passed external assessment review and include an Impact Evidence source; those without a source are not analysed. Research Improvement Plan must name a responsible owner and a review date; plans without either are not issued.","specialization":""},{"id":"elem-id-200025","type":"Capability","name":"Research Opportunity & Planning","documentation":"### Identity\nThis is a management capability within the Research domain. It is responsible for scanning Government Policy and research performance to set the Research Strategy and maintain an Opportunity Register of funding and collaboration opportunities.\n\n### Consumes\nIt consumes Government Policy, which arrives from external bodies and triggers review of research priorities, open access mandates and impact requirements. It consumes Research Improvement Plan, which arrives as a corrective output and triggers adjustment of the Research Strategy.\n\n### Produces\nIt produces Research Strategy when Government Policy and Research Improvement Plans have been analysed and approved strategic priorities are set for the academic year. It produces Opportunity Register entry when a funding call or research theme aligns with the Research Strategy and a named academic lead is identified.\n\n### Activities\nAnalysing Government Policy is present. Reviewing Research Improvement Plan is present. Setting Research Strategy is present. Identifying Opportunity Register entry is present. Prioritising Opportunity Register entry is present. Rejecting Government Policy that is out of scope is present. Reassessing Research Strategy after a funding council mandate is present. Escalating conflicts between Research Strategy and funder requirements is present.\n\n### Fails when\nThis capability fails when Government Policy arrives but no Research Strategy is produced or updated, and no Opportunity Register entries are identified. As a result, Research Funding Applications are not assessed against current priorities, and the institution misses funding opportunities.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot plan shared research opportunities or collaborative bids, and every Opportunity Register entry is assessed for institutional delivery alone.\n\n### Operating Conditions\nGovernment Policy must be the current official version and carry an effective date; superseded policy is rejected. Research Improvement Plan must have an approved owner and review date; plans without these are returned. Research Strategy must be approved before Opportunity Register entries are created; unapproved strategy blocks planning. Opportunity Register entry must include funder, deadline, scope and named academic lead; entries missing any field are not published.","specialization":""},{"id":"elem-id-200026","type":"Capability","name":"Research Publications","documentation":"### Identity\nThis is an operational capability within the Research domain. It is responsible for depositing Research Outputs into the institutional repository, creating Publication Records, and ensuring every Research Publication meets open access mandates before release.\n\n### Consumes\nIt consumes Research Output, which arrives when a Research Project produces a validated output and triggers deposit preparation. It consumes Data Management Plan, which arrives with the Research Output and specifies which data must accompany a publication. It consumes Government Policy, which arrives from opportunity and planning and defines open access requirements.\n\n### Produces\nIt produces Open Access Deposit when a Research Output is deposited in the institutional repository with the required metadata. It produces Publication Record when an Open Access Deposit is validated and assigned a persistent identifier. It produces Research Publication when the Publication Record is complete and the version of record or accepted manuscript is made publicly accessible under the mandated licence. It produces Open Access Compliance Record when a Research Publication meets the funder and institutional mandates.\n\n### Activities\nDepositing Research Output is present. Validating Research Output metadata is present. Creating Open Access Deposit is present. Assigning Publication Record is present. Producing Research Publication is present. Producing Open Access Compliance Record is present. Escalating Research Output that is not deposited within the mandate period is present. Rejecting Research Output with missing Data Management Plan is present. Reassessing a Publication Record after a funder audit is present.\n\n### Fails when\nThis capability fails when Research Outputs are produced but not deposited into the repository, and no Publication Records or Research Publications are issued. As a result, open access mandates are breached, Research Publications are not discoverable, and the institution's Research Output count for the academic year is zero.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot deposit or publish Research Outputs held jointly with another institution, and every Research Publication must be attributed solely to the institution's repository.\n\n### Operating Conditions\nResearch Output must arrive with a signed Data Management Plan and complete metadata including title, author list and funder identifiers; outputs missing these are returned. Data Management Plan must specify the open access version and embargo period; plans that conflict with funder mandates are returned for revision. Government Policy must be the current open access mandate; outdated mandates are not applied. Open Access Deposit must be made before the funder or institutional deadline; late deposits are accepted but flagged as non-compliant in the Open Access Compliance Record.","specialization":""},{"id":"elem-id-200027","type":"Capability","name":"Research Training","documentation":"### Identity\nThis is an operational capability within the Research domain. It is responsible for developing research skills, supervising Research Degree Milestones, and maintaining Research Training Records for research students and research staff.\n\n### Consumes\nIt consumes Research Student Application, which arrives from admissions and triggers enrolment into research degree programmes. It consumes Research Training Need, which arrives from supervisors and identifies required skills.\n\n### Produces\nIt produces Research Training Record when a training activity is completed and assessed. It produces Supervisor Report when a research student reaches a progress review point. It produces Research Degree Milestone when a student passes a milestone such as confirmation or defence.\n\n### Activities\nProcessing Research Student Application is present. Assessing Research Training Need is present. Delivering Research Training is present. Recording Research Training Record is present. Producing Supervisor Report is present. Producing Research Degree Milestone is present. Escalating Research Student Application that lacks supervisor capacity is present. Rejecting Research Training Need that is not linked to a research degree or project is present. Reassessing Research Degree Milestone after an examiner decision is present.\n\n### Fails when\nThis capability fails when Research Student Applications are accepted but Research Training Needs cannot be met, and no Research Training Records or Supervisor Reports are produced. As a result, research students cannot progress through Research Degree Milestones, and the institution cannot award research degrees.\n\n### Constraint\nThe capability operates under the single legal institution constraint; it cannot deliver joint research degrees or share Research Training Records with another institution, and every Supervisor Report and Research Degree Milestone is owned by the institution.\n\n### Operating Conditions\nResearch Student Application must carry academic qualifications, supervisor agreement and funding source; applications missing any are returned. Research Training Need must be specific to a named research student and approved by a supervisor; unapproved or generic needs are rejected. Supervisor Report must be submitted before the progress review deadline; late reports are accepted but flagged as non-compliant. Research Training Record must be updated within five working days of a completed training activity; missing records block progression to the next Research Degree Milestone.","specialization":""},{"id":"elem-id-200028","type":"Capability","name":"Strategy Management","documentation":"### Identity\nThis is a layer two capability within Strategy & Governance. It is accountable for setting the institution's long-term direction, translating external policy and funding changes into Strategic Objectives, and monitoring performance against those objectives each academic year.\n\n### Consumes\nIt takes in Government Policy Documents when a regulator or funding body publishes a new requirement; each is assessed for impact on current Strategic Objectives. It takes in Key Performance Indicators covering Student Completion rates, Research Income per FTE, cost per Student Credit, and time from Research Grant application to award; these arrive at the end of each academic term. It takes in the previous Strategic Plan as a baseline when a refresh is mandated. It takes in Risk Register entries when a strategic risk is updated.\n\n### Produces\nIt issues a Strategic Plan when the governing body approves it and it contains measurable Strategic Objectives for at least five academic years. It issues an Annual Budget when revenue and expenditure are reconciled to the Strategic Plan. It issues a Strategic Objective when a new external obligation requires a change in direction. It issues a Risk Appetite Statement when the governing body approves the level of risk the institution will accept. It issues an Environmental Sustainability Report when the Climate Change Act reporting period ends.\n\n### Activities\nActivities include formulating a Strategic Objective from a Government Policy Document, assessing a Key Performance Indicator against a target, allocating a Strategic Resource to a Strategic Objective, revising a Strategic Plan after a material change in funding, rejecting a Strategic Objective that lacks a measurable outcome, escalating a Key Performance Indicator that breaches an Office for Students condition, and reassessing a Strategic Objective after a Risk Register shows a new risk.\n\n### Fails when\nThis capability fails when no current Strategic Plan has been approved for the upcoming academic year, because then the Annual Budget cannot be issued, Key Performance Indicators have no targets, and the institution cannot demonstrate compliance with Office for Students condition B3.\n\n### Constraint\nStrategic Objectives must be refreshed at least annually to incorporate changes in Office for Students conditions, open access mandates, and Climate Change Act reporting duties; a Strategic Plan older than one academic year is not valid.\n\n### Operating Conditions\nIncoming Government Policy Documents must include the issuing body, effective date, and the specific condition or mandate; if any is missing, the document is returned. Key Performance Indicators must cover the full academic year and be verified by the relevant data owner; unverified or partial-year indicators are rejected. The previous Strategic Plan must carry the governing body approval date; if not, it is accepted with a qualification and used only as an informal baseline. Produced Strategic Plan is judged by whether each Strategic Objective has a measurable target, a named owner, and a review date; any objective without all three is returned for revision. Annual Budget is judged by whether every line item traces to a Strategic Objective; unaligned items are returned. Strategic Objective is judged by whether it states the external obligation it addresses; if it does not, it is not issued.","specialization":""},{"id":"elem-id-200029","type":"Capability","name":"Student Administration","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for maintaining the Student Record as the live, authoritative account of a learner's personal, enrolment and module status from first registration to award.\n\n### Consumes\nIt consumes Student Data Changes when a learner updates personal details, such as name or address. It consumes Module Selection Forms when a learner chooses modules for a term. It consumes Interruption Requests when a learner asks to suspend study. It consumes Withdrawal Requests when a learner asks to leave the institution.\n\n### Produces\nIt produces an Updated Student Record whenever a change is verified and applied. It produces Enrolment Confirmations to attest to current status for external bodies. It produces Module Selection Confirmations when a module selection is accepted.\n\n### Activities\nActivities present are: validate Student Data Changes, update Student Records, process Module Selection Forms, confirm enrolments, handle Interruption Requests, handle Withdrawal Requests, and recover a Student Record when a duplicate identifier is found.\n\n### Fails when\nIt fails when the Student Record becomes outdated or duplicated, causing module selection to be assigned to the wrong learner or fee liabilities to be posted incorrectly. Enrolment Confirmations then stop, external bodies receive incorrect status, and graduation is blocked.\n\n### Constraint\nIt is constrained by the need for one version-controlled Student Record per learner; all updates require evidence and a clear audit trail.\n\n### Operating Conditions\nA Student Data Change must carry the learner identifier and evidence of the change; if evidence is missing it is returned. A Module Selection Form must meet prerequisites and credit limits; if prerequisites are not met the selection is escalated for academic approval. An Interruption Request must state the suspension start date and reason; if the date is absent the request is returned.","specialization":""},{"id":"elem-id-200030","type":"Capability","name":"Student Admission Management","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for deciding which applicants receive an offer and for ensuring every decision is derived from verified evidence and published entry criteria.\n\n### Consumes\nIt consumes Student Applications when an applicant submits a completed application. It consumes Academic Transcripts when an applicant provides prior study outcomes. It consumes Fee Status Questionnaires when an applicant declares residence and funding basis. It consumes Reference Letters when a referee supports an application.\n\n### Produces\nIt produces Admission Offers when an applicant meets the entry requirements and a place is available. It produces Rejection Notices when an applicant does not meet requirements or the course is full. It produces Conditional Offers when a place is offered subject to results.\n\n### Activities\nActivities present are: evaluate Student Applications against entry criteria, verify Academic Transcripts, calculate Fee Status from a Fee Status Questionnaire, issue Admission Offers, issue Rejection Notices, issue Conditional Offers, and reconsider a decision after an applicant appeals.\n\n### Fails when\nIt fails when Student Applications are not assigned to decision-makers or when entry criteria are not applied consistently. Admission Offers then stop, applicants have no route to enrolment, and Student Enrolment numbers fall.\n\n### Constraint\nIt is constrained by published entry criteria and by the equal treatment duties under the Office for Students; every decision must be explainable from the evidence.\n\n### Operating Conditions\nA Student Application must contain the applicant's identifier, course code and qualification history; if the course code is missing the application is returned. An Academic Transcript must be issued by the awarding body; if the body is unaccredited the transcript is rejected. A Fee Status Questionnaire must be signed and dated; if the date is absent it is returned.","specialization":""},{"id":"elem-id-200031","type":"Capability","name":"Student Assessment","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for collecting, mar
