et, diagnose the issue, and either resolve it or escalate to specialist teams. Without this ticket, the user's problem remains unrecorded and no remediation is scheduled.","sourceid":"elem-id-957","targetid":"elem-id-952","specialization":""},{"id":"elem-id-79a63fbf-ca30-4590-8f3f-5ed8c13b5f0f","type":"FlowRelationship","name":"Impact Assessment Report","documentation":"### Object\nThe report records the measured societal, economic, or policy effect of non-commercial research, including evidence sources and beneficiary testimony.\n\n### Condition\nIt is issued after the impact evidence is collected and an assessment panel has rated the strength of the claimed effect. Its arrival means the impact is formally evidenced.\n\n### Consequence\nOutput reporting incorporates the assessed impact into its institutional returns, and without the report the research contribution appears as publications only.","sourceid":"elem-id-904","targetid":"elem-id-901","specialization":""},{"id":"id-2f244721-fe6b-496a-be9b-8e12230e8e2f","type":"FlowRelationship","name":"Impact Assessment Report","documentation":"","sourceid":"elem-id-200023","targetid":"elem-id-200026","specialization":""},{"id":"elem-id-48e44886-ba43-42aa-83be-3c74584f3e39","type":"FlowRelationship","name":"Indexed Content Record","documentation":"### Object\nThe Indexed Content Record contains the metadata and full-text index for a document or piece of content stored in the enterprise content system.\n\n### Condition\nIt is created when content is checked in and indexing completes.\n\n### Consequence\nSearch and discovery returns the content in user queries based on this record. Without this record, the content is not searchable, and users fail to find it.","sourceid":"elem-id-974","targetid":"elem-id-966","specialization":""},{"id":"elem-id-6edf9b4b-a424-4c91-b50d-2197bd0911cc","type":"FlowRelationship","name":"Induction Invitee Record","documentation":"### Object\nThe induction invitee record, carrying the accepted applicant's contact details, programme, start date, pre-arrival task list, and any access requirements.\n\n### Condition\nIssued when an application has progressed to an accepted or confirmed state and the student is expected to attend induction.\n\n### Consequence\nArrival schedules induction communications and allocates the student to induction groups. Absence leaves the student without induction instructions and delays access to learning activities.","sourceid":"elem-id-868","targetid":"elem-id-839","specialization":""},{"id":"elem-id-d61191e5-5a86-4004-ba82-b597a654734e","type":"FlowRelationship","name":"Industry Engagement Record","documentation":"### Object\nThe record captures the contact, meeting history, shared interests, and prior collaboration outcomes with an industry stakeholder.\n\n### Condition\nIt is created when a relationship interaction produces new information that affects future engagement, and it arrives with the latest verified contact details.\n\n### Consequence\nIndustry relationship activity uses the record to sequence follow-ups, and without it the engagement history is lost and each contact is treated as new.","sourceid":"elem-id-902","targetid":"elem-id-922","specialization":""},{"id":"id-0a0942ec-492c-4783-840e-74e4f7f768d4","type":"FlowRelationship","name":"Industry Partner Register","documentation":"","sourceid":"elem-id-20006","targetid":"elem-id-200013","specialization":""},{"id":"elem-id-23b3495c-5e70-4d4e-ba98-e08dedd41001","type":"FlowRelationship","name":"Industry Partnership Success Story","documentation":"### Object\nThe Industry Partnership Success Story describes a completed collaborative achievement with a company, highlighting benefits and outcomes.\n\n### Condition\nIt is written after the partnership activity achieves measurable success.\n\n### Consequence\nMedia relations uses the story to generate positive coverage. Without this story, successful partnerships are not publicised, and opportunities for reputation building are lost.","sourceid":"elem-id-922","targetid":"elem-id-924","specialization":""},{"id":"id-d6b703b2-4d9b-486a-bbb6-6f628985c38f","type":"FlowRelationship","name":"Information Security Policy","documentation":"","sourceid":"elem-id-200016","targetid":"elem-id-200015","specialization":""},{"id":"elem-id-badd07b6-f1ed-4025-b9bb-ee8252fa4e79","type":"FlowRelationship","name":"Infrastructure Compliance Requirement","documentation":"### Object\nThe requirement sets out the safety, security, or environmental standard that research infrastructure must meet.\n\n### Condition\nIt is issued when a new regulation or institutional policy applies to research facilities, and it includes the compliance deadline.\n\n### Consequence\nResearch infrastructure management upgrades facilities to meet the requirement, and without it the infrastructure operates outside the mandated standard.","sourceid":"elem-id-908","targetid":"elem-id-909","specialization":""},{"id":"elem-id-ce44d0bf-854c-4aa9-8f7a-9ef551756ff6","type":"FlowRelationship","name":"Infrastructure Hazard Report","documentation":"### Object\nThe Infrastructure Hazard Report details a safety hazard in building systems or fabric, such as exposed wiring, leaks, or structural damage.\n\n### Condition\nIt is filed when a hazard is identified during routine inspections or by staff or residents.\n\n### Consequence\nEmergency response teams assess the risk and initiate immediate containment or evacuation if required. Without this report, the hazard remains undisclosed, and occupants are exposed to harm.","sourceid":"elem-id-1002","targetid":"elem-id-1003","specialization":""},{"id":"elem-id-817be3b7-7df7-4b5e-b6ab-65617f8a85d1","type":"FlowRelationship","name":"Infrastructure Incident Report","documentation":"### Object\nThe Infrastructure Incident Report details a failure in servers, networking, storage, or other base infrastructure components.\n\n### Condition\nIt is created when monitoring alerts or user reports confirm an infrastructure outage.\n\n### Consequence\nInfrastructure lifecycle engineers investigate and restore service. Without this report, the failure is not formally addressed, and downtime extends.","sourceid":"elem-id-957","targetid":"elem-id-955","specialization":""},{"id":"elem-id-9437629f-2128-433c-b3bd-79471a350484","type":"FlowRelationship","name":"Infrastructure Maintenance Request","documentation":"### Object\nThe request identifies the research facility, the defect or required upgrade, and the urgency rating.\n\n### Condition\nIt is raised when an asset fails or a planned maintenance window approaches, and it includes the operational impact if not addressed.\n\n### Consequence\nThe maintenance schedule is updated with the request's urgency, and without it the affected research infrastructure remains at risk of unplanned downtime.","sourceid":"elem-id-909","targetid":"elem-id-980","specialization":""},{"id":"elem-id-497b1b01-414c-4760-a659-64bcdca1a214","type":"FlowRelationship","name":"Infrastructure Usage Report","documentation":"### Object\nThe report logs facility utilisation, incident counts, and downtime for the reporting period.\n\n### Condition\nIt is produced from sensor data and incident records after each period, and it arrives with incident classifications.\n\n### Consequence\nThe compliance position for research infrastructure is assessed from the report, and without it the assessment has no operational evidence.","sourceid":"elem-id-909","targetid":"elem-id-908","specialization":""},{"id":"elem-id-d26043cf-126a-44ed-9027-5ea355f5ae6c","type":"FlowRelationship","name":"Institutional Advocacy Priority","documentation":"### Object\nThe Institutional Advocacy Priority states the policy positions and funding requests the institution wants to advance with government.\n\n### Condition\nIt is set after internal stakeholder consultation and approval.\n\n### Consequence\nGovernment relations lobby on these priorities in meetings and submissions. Without this priority, advocacy is unfocused, and the institution's voice is not heard on key issues.","sourceid":"elem-id-925","targetid":"elem-id-921","specialization":""},{"id":"elem-id-5df5be60-4e67-45fd-bb7f-d652574a49c0","type":"FlowRelationship","name":"Institutional Policies","documentation":"### Object\nThis is the set of updated institutional policies and regulations affecting academic operations, carrying policy text, effective dates, and compliance obligations.\n\n### Condition\nIt is issued after policy approval by the governing body. Arrival means current binding institutional rules are available for academic policy alignment.\n\n### Consequence\nOn arrival, academic policies are aligned with the institutional policy and contradictions are resolved. While absent, academic policy operates on outdated versions and conflicts with institutional rules remain unresolved.","sourceid":"elem-id-834","targetid":"elem-id-840","specialization":""},{"id":"id-c7699c29-a0f6-48d9-8b08-1db3567409bc","type":"FlowRelationship","name":"Institutional Policies","documentation":"","sourceid":"elem-id-10004","targetid":"elem-id-10005","specialization":""},{"id":"id-e7c31de4-36cf-46f2-8083-0d6a95ca9f5f","type":"FlowRelationship","name":"Institutional Regulations","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-20001","specialization":""},{"id":"elem-id-08506ebb-c234-4aac-bc9a-bce75f7fb09a","type":"FlowRelationship","name":"Insurance Claim Record","documentation":"### Object\nThe Insurance Claim Record documents a claim against the institution's insurance policy, including the event, losses claimed, and supporting evidence.\n\n### Condition\nIt is created when an insured event occurs and a claim is submitted to the insurer.\n\n### Consequence\nFinancial reporting recognises the claim receivable or expense. Without this record, the claim is not recorded, and any recovery from the insurer is not reflected in the accounts.","sourceid":"elem-id-994","targetid":"elem-id-996","specialization":""},{"id":"elem-id-1d10ed81-7910-4d0a-aeda-b2bf4856cb75","type":"FlowRelationship","name":"Insured Asset Status Update","documentation":"### Object\nThe Insured Asset Status Update records changes to an asset's insured status, such as addition, removal, or change in value.\n\n### Condition\nIt is issued after an insurance policy adjustment is made.\n\n### Consequence\nAsset management updates the asset register to reflect the current insurance coverage. Without this update, the asset register shows incorrect coverage, and claims may be rejected.","sourceid":"elem-id-994","targetid":"elem-id-995","specialization":""},{"id":"elem-id-8d64bf64-6130-42a0-aedc-f12a704be7d7","type":"FlowRelationship","name":"Integration Document Pack","documentation":"### Object\nThe complete set of integration artefacts: configuration records, access lists, test results, sign-off forms, and transition checklists.\n\n### Condition\nIssued when all integration and transition activities are complete and verified. Arrival means the documentation is ready for archival.\n\n### Consequence\nThe document pack is stored as the authoritative record of the integration. Audit and retrieval requests are served from this archive. While absent, the integration history has no complete record.","sourceid":"elem-id-914","targetid":"elem-id-974","specialization":""},{"id":"id-be44d09e-7050-459d-bd0d-088e8ff31dc3","type":"FlowRelationship","name":"Integration Specification","documentation":"","sourceid":"elem-id-20006","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-1693ad87-61cf-49bb-9b1f-8688ca177290","type":"FlowRelationship","name":"Integration Status Report","documentation":"### Object\nA report describing the current state of partner integration, completed setup tasks, pending items, and outputs produced during transition.\n\n### Condition\nIssued at defined integration milestones or when a transition phase completes. Arrival means the integration state is visible for output tracking.\n\n### Consequence\nCommercial outputs arising from the newly integrated partner are tracked and reported. Without it, outputs from the integration remain unrecorded and cannot be attributed.","sourceid":"elem-id-914","targetid":"elem-id-915","specialization":""},{"id":"elem-id-02aed91b-68f6-4240-aa7c-82383f3db136","type":"FlowRelationship","name":"Intellectual Property Agreement","documentation":"### Object\nThe agreement sets out the ownership, licensing terms, revenue share, and publication rights attached to a commercialised research outcome.\n\n### Condition\nIt is issued only after both institutional legal review and the prospective partner's signature have been received. Its arrival means the intellectual property position is contractually fixed.\n\n### Consequence\nContract execution proceeds on the agreed terms, and without the agreement no revenue-bearing activity involving the outcome starts.","sourceid":"elem-id-903","targetid":"elem-id-976","specialization":""},{"id":"id-5b029522-5831-4188-a9a4-c5d6ce51a2eb","type":"FlowRelationship","name":"Intellectual Property Agreement","documentation":"","sourceid":"elem-id-200023","targetid":"elem-id-200017","specialization":""},{"id":"id-57a40881-e9a2-4202-ba96-f0e19af42df0","type":"FlowRelationship","name":"Intellectual Property Agreements","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-10002","specialization":""},{"id":"elem-id-d050bc2b-2e1a-4eb7-9407-560fdbc44f6a","type":"FlowRelationship","name":"Inter-Institutional Agreement","documentation":"### Object\nThe Inter-Institutional Agreement formalises a partnership with another tertiary institution, covering student exchange, research collaboration, or credit transfer.\n\n### Condition\nIt is signed after negotiation and legal review.\n\n### Consequence\nInternal stakeholders coordinate the implementation of the agreement across departments. Without this agreement, collaborative activities have no legal basis and cannot proceed.","sourceid":"elem-id-923","targetid":"elem-id-925","specialization":""},{"id":"elem-id-549c53b3-19dc-49e0-bbca-130f26d8a808","type":"FlowRelationship","name":"Internal Campaign Plan","documentation":"### Object\nThe Internal Campaign Plan outlines the objectives, key messages, channels, and timeline for an internal communication initiative.\n\n### Condition\nIt is created after internal stakeholders agree on the campaign's purpose and audience.\n\n### Consequence\nMarketing management aligns its external campaigns with the internal messaging to ensure coherence. Without this plan, internal and external communications diverge, and staff receive conflicting narratives.","sourceid":"elem-id-940","targetid":"elem-id-931","specialization":""},{"id":"id-1f61ad6c-f300-4e3f-bd64-90f8d5c5d344","type":"FlowRelationship","name":"Internal Communication Campaign","documentation":"","sourceid":"elem-id-200036","targetid":"elem-id-200019","specialization":""},{"id":"elem-id-a5c88cef-5f82-422f-ae83-09abcd55d6b6","type":"FlowRelationship","name":"Investment Guidance","documentation":"### Object\nThe Investment Guidance advises on the appropriate investment of surplus cash, considering risk tolerance and cash flow needs.\n\n### Condition\nIt is issued after a review of current market conditions and treasury policies.\n\n### Consequence\nTreasury management follows the guidance to invest funds and manage liquidity. Without this guidance, cash is held idle or invested inappropriately, reducing returns or increasing risk.","sourceid":"elem-id-1000","targetid":"elem-id-992","specialization":""},{"id":"elem-id-5b0863d3-af8e-42c2-a593-7090703e888e","type":"FlowRelationship","name":"Issue Impact Assessment","documentation":"### Object\nAn assessment of how an issue affects commercial outputs, including delivery delays, cost overruns, and quality degradation.\n\n### Condition\nIssued after an issue is analysed for its impact on outputs. Arrival means the impact is quantified and documented.\n\n### Consequence\nOutput delivery adjusts to mitigate the assessed impact. Corrective actions are defined. While absent, output delivery continues without adjustment, and the issue's effect on deliverables is unmanaged.","sourceid":"elem-id-916","targetid":"elem-id-915","specialization":""},{"id":"elem-id-432ddaf1-3034-4c4a-b6c4-b59a6c426f28","type":"FlowRelationship","name":"Issue Resolution Status","documentation":"### Object\nAn update on the status of an issue, including resolution progress, assigned owner, and remaining blockers.\n\n### Condition\nIssued whenever an issue's status changes or at a defined reporting point. Arrival means the current issue state is visible to performance monitoring.\n\n### Consequence\nContract performance assessment incorporates outstanding issues and their impact. Performance ratings reflect unresolved problems. While absent, contract performance is viewed without issue context, leading to inaccurate evaluation.","sourceid":"elem-id-916","targetid":"elem-id-918","specialization":""},{"id":"elem-id-78e56c1c-3d17-4e74-b8c9-fe7bf42915dd","type":"FlowRelationship","name":"Knowledge Asset","documentation":"### Object\nThe Knowledge Asset is a distilled piece of institutional knowledge, such as a best practice guide or lessons learned, ready for broader distribution.\n\n### Condition\nIt is produced after knowledge has been captured and validated.\n\n### Consequence\nEnterprise content management stores and indexes the asset for future reuse across the institution. Without this asset, valuable knowledge remains in individuals' heads and is lost when they leave.","sourceid":"elem-id-970","targetid":"elem-id-974","specialization":""},{"id":"elem-id-3fee2311-25f4-4fcd-9056-e273f4a2e3f0","type":"FlowRelationship","name":"Knowledge Extraction Content","documentation":"### Object\nThe Knowledge Extraction Content is a corpus of documents and communications from which insights or new knowledge can be mined.\n\n### Condition\nIt is made available from the content repository for analysis.\n\n### Consequence\nKnowledge management applies extraction techniques to identify patterns or codify tacit knowledge. Without this content, knowledge extraction has no source material.","sourceid":"elem-id-974","targetid":"elem-id-970","specialization":""},{"id":"elem-id-ba8edb52-a8a6-48f3-9048-0d2aa61b6f73","type":"FlowRelationship","name":"Learning Achievement","documentation":"### Object\nThe record of learning achievements relevant to career development, including projects, certifications, and extracurricular learning.\n\n### Condition\nIssued when a student completes a learning activity and the achievement is recorded in their personal learning record.\n\n### Consequence\nArrival enriches the student's employability profile and readiness for career opportunities. Absence understates the student's capabilities.","sourceid":"elem-id-879","targetid":"elem-id-870","specialization":""},{"id":"elem-id-9451ce27-9890-4dd3-b5ab-ea1a6f7455cd","type":"FlowRelationship","name":"Learning Goal Update","documentation":"### Object\nThe updated set of personal learning goals, reflecting progress and changes in academic direction.\n\n### Condition\nIssued when a student revises their goals or achieves a milestone, and the updated goals are recorded.\n\n### Consequence\nArrival realigns advice and support with current goals. Absence leaves advisers working from outdated aspirations.","sourceid":"elem-id-879","targetid":"elem-id-872","specialization":""},{"id":"elem-id-7ca757b5-1d25-47e6-8341-6a12540ffe52","type":"FlowRelationship","name":"Learning Progress Report","documentation":"### Object\nThe report on a student's progress through non-presence learning, including activity completion and assessment scores.\n\n### Condition\nIssued when online learning activity is recorded and prepared for placement consideration.\n\n### Consequence\nArrival informs placement readiness and identifies students needing pre-placement support. Absence leaves placement decisions blind to online performance.","sourceid":"elem-id-881","targetid":"elem-id-883","specialization":""},{"id":"elem-id-53f042e2-ba16-4cb5-8664-5765b443b75a","type":"FlowRelationship","name":"Lease Expiry Notice","documentation":"### Object\nThe Lease Expiry Notice lists forthcoming lease end dates and the associated space that will become vacant.\n\n### Condition\nIt is generated when a commercial lease approaches its termination date without renewal.\n\n### Consequence\nEstate development plans for that space to be redeveloped, re-leased, or repurposed. Without this notice, space is not proactively managed, and revenue from vacant units is lost.","sourceid":"elem-id-988","targetid":"elem-id-980","specialization":""},{"id":"elem-id-020aadde-d28a-4804-ab57-7fac07d5772a","type":"FlowRelationship","name":"Legal Opinion","documentation":"### Object\nThe Legal Opinion is a formal written analysis of a legal question, including applicable law and recommended resolution.\n\n### Condition\nIt is provided when a dispute requires an authoritative legal position.\n\n### Consequence\nDispute resolution uses the opinion to negotiate a settlement or proceed to litigation. Without this opinion, the institution's legal stance is unclear, and resolution is delayed.","sourceid":"elem-id-979","targetid":"elem-id-978","specialization":""},{"id":"elem-id-a25bd069-eb75-4e69-8fdc-dde33262e03b","type":"FlowRelationship","name":"Legal Risk Assessment","documentation":"### Object\nThe Legal Risk Assessment identifies legal exposure in a proposed contract or activity and recommends mitigations.\n\n### Condition\nIt is produced after legal review of the facts.\n\n### Consequence\nContract management revises terms or declines the deal based on this assessment. Without this assessment, contracts are signed with unmitigated legal risk, leading to disputes or losses.","sourceid":"elem-id-979","targetid":"elem-id-976","specialization":""},{"id":"elem-id-217de83c-0987-41de-a760-816d21ac68b4","type":"FlowRelationship","name":"Library Access Record","documentation":"### Object\nThe Library Access Record contains the identifiers and permissions that allow a user to access library resources, including digital collections and physical lending rights.\n\n### Condition\nIt is generated when library membership is verified and access rights are assigned.\n\n### Consequence\nSearch and discovery tools authenticate the user and expose licensed content according to their entitlements. Without this record, the user cannot access restricted resources, and search results are limited.","sourceid":"elem-id-962","targetid":"elem-id-966","specialization":""},{"id":"id-149d44d7-b555-4730-8037-7f1834b5c341","type":"FlowRelationship","name":"Library Access Record","documentation":"","sourceid":"elem-id-200018","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-3f5f8bab-1a53-477b-9085-d98acbd195e6","type":"FlowRelationship","name":"Library Membership Record","documentation":"### Object\nThe Library Membership Record holds the borrower details, membership status, and loan privileges for a library user.\n\n### Condition\nIt is created after a new user registers and eligibility is confirmed.\n\n### Consequence\nThe central staff record system links this membership to the person's institutional identity, enabling consistent identification across services. Without this record, the person's library activity is not connected to their official staff profile, and duplicate identities arise.","sourceid":"elem-id-965","targetid":"elem-id-953","specialization":""},{"id":"elem-id-d3bb39be-c795-4d4e-8db7-4a509ad10238","type":"FlowRelationship","name":"Library Membership Record","documentation":"### Object\nThe Library Membership Record contains the user's credentials and entitlements for library services.\n\n### Condition\nIt is issued after library membership is approved and activated.\n\n### Consequence\nLibrary collection access verifies the user's right to borrow or access specific materials. Without this record, the user cannot access the collection, and borrowing is denied.","sourceid":"elem-id-965","targetid":"elem-id-962","specialization":""},{"id":"id-02c61242-880d-4c1a-8390-2d8603781261","type":"FlowRelationship","name":"Library Membership Record","documentation":"","sourceid":"elem-id-200018","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-58ae9b2d-b3ea-4dff-a631-7934faa096b1","type":"FlowRelationship","name":"Maintenance Purchase Order","documentation":"### Object\nThe Maintenance Purchase Order authorises a supplier to perform specified maintenance work at an agreed cost and within a defined period.\n\n### Condition\nIt is issued after a maintenance need is identified and approved through procurement.\n\n### Consequence\nThe maintenance team can instruct the supplier to begin work, and payment is committed against the order. Without this order, the supplier has no authority to act, and the maintenance task remains unscheduled.","sourceid":"elem-id-990","targetid":"elem-id-983","specialization":""},{"id":"id-1940890e-6e80-45ad-b0b2-affb926f00ed","type":"FlowRelationship","name":"Maintenance Purchase Order","documentation":"","sourceid":"elem-id-200012","targetid":"elem-id-200011","specialization":""},{"id":"id-f72319bd-403b-42e2-9d71-1c2a8e8aa426","type":"FlowRelationship","name":"Maintenance Request","documentation":"","sourceid":"elem-id-200020","targetid":"elem-id-200011","specialization":""},{"id":"elem-id-0252e471-7505-468f-a63b-14d32ce1586e","type":"FlowRelationship","name":"Management Accounts","documentation":"### Object\nThe Management Accounts provide internal financial results for the current period, including variance analysis and operational performance.\n\n### Condition\nThey are produced monthly or quarterly by financial reporting.\n\n### Consequence\nFinancial advisors use these accounts to identify emerging issues and advise management. Without these accounts, decision-makers lack current financial visibility, and problems are detected late.","sourceid":"elem-id-996","targetid":"elem-id-1000","specialization":""},{"id":"elem-id-aafca6a7-75ab-4d90-8eea-e9cd4be6a446","type":"FlowRelationship","name":"Marked Assessment","documentation":"### Object\nThe marked work, carrying the marker's grade, written feedback, and any moderation comments or penalty deductions.\n\n### Condition\nIssued when marking and moderation are complete, the grade is approved within the marking scheme, and feedback is recorded against the correct student and module.\n\n### Consequence\nArrival feeds final results calculation and release. Absence leaves the student without a grade and holds up progression and award decisions.","sourceid":"elem-id-886","targetid":"elem-id-885","specialization":""},{"id":"id-dc8c0e0a-e15e-4eab-b298-6fb511c9e593","type":"FlowRelationship","name":"Market Analysis Brief","documentation":"","sourceid":"elem-id-20008","targetid":"elem-id-200019","specialization":""},{"id":"elem-id-dbc9510c-7347-44d0-b844-fc9cafa61ee7","type":"FlowRelationship","name":"Market Analysis Report","documentation":"### Object\nA report containing market size, growth rates, competitor positioning, and regulatory trends relevant to commercial activity.\n\n### Condition\nIssued when the market scan is complete and findings are synthesised. Arrival means the analysis is ready for further research use.\n\n### Consequence\nThe findings are incorporated into the research repository and used to fill intelligence gaps. While absent, research proceeds without the latest market evidence and gaps remain unfilled.","sourceid":"elem-id-911","targetid":"elem-id-930","specialization":""},{"id":"elem-id-1488fd55-d712-4e7d-aa72-6a2ed6f3762a","type":"FlowRelationship","name":"Market Analysis Report","documentation":"### Object\nThe Market Analysis Report summarises market trends, competitor activity, student demand indicators, and segmentation insights relevant to upcoming campaigns.\n\n### Condition\nIt is produced after research data has been collected and analysed against current marketing objectives.\n\n### Consequence\nCampaign planners adjust messaging, target segments, and channel mix based on the findings. Without this report, campaigns are launched on assumptions rather than evidence, and market opportunities are missed.","sourceid":"elem-id-930","targetid":"elem-id-928","specialization":""},{"id":"elem-id-9000aeec-1475-4f53-9ef6-27f22e387454","type":"FlowRelationship","name":"Market Analysis Reports","documentation":"### Object\nThis is a set of environmental and market analysis reports covering sector trends, competitor actions, and regulatory shifts.\n\n### Condition\nIt is issued after the horizon scanning cycle completes and insights are validated. Arrival means the external evidence base for strategic choices is available.\n\n### Consequence\nOn arrival, strategic options incorporate the market shifts and priorities are set with current external evidence. While absent, strategic options are developed without current external evidence and do not anticipate market changes.","sourceid":"elem-id-822","targetid":"elem-id-823","specialization":""},{"id":"elem-id-a653de96-3af5-4a58-9e70-66178a7ade7b","type":"FlowRelationship","name":"Market Feasibility Brief","documentation":"### Object\nA brief containing market size, demand forecasts, competitor landscape, and regulatory considerations for a specific opportunity.\n\n### Condition\nIssued when market analysis produces data needed to assess feasibility. Arrival means the feasibility input is available.\n\n### Consequence\nThe market evidence is incorporated into the feasibility analysis. The business case is built on current market data. While absent, feasibility assessment lacks market grounding and risk is misjudged.","sourceid":"elem-id-911","targetid":"elem-id-912","specialization":""},{"id":"elem-id-aa47bab2-f91f-44b2-92ae-34bf98091305","type":"FlowRelationship","name":"Market Trend Brief","documentation":"### Object\nA brief summarising observed market trends, competitor movements, and emerging customer demands relevant to commercial opportunities.\n\n### Condition\nIssued when market analysis identifies a significant trend or competitor shift. Arrival means the trend is available for opportunity identification.\n\n### Consequence\nNew commercial opportunities are identified based on the trend. The opportunity pipeline is refreshed. While absent, opportunity identification lacks trend input and misses emerging opportunities.","sourceid":"elem-id-911","targetid":"elem-id-910","specialization":""},{"id":"id-bcc80dd7-ed82-4203-9bf1-6059dd91f327","type":"FlowRelationship","name":"Marketing Content","documentation":"","sourceid":"elem-id-200019","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-933ff41b-31c4-4111-8890-505140f42085","type":"FlowRelationship","name":"Marketing Content Package","documentation":"### Object\nThe Marketing Content Package bundles copy, images, video assets, and approved claims for a specific campaign, ready for storage and reuse.\n\n### Condition\nIt is assembled after final sign-off of all creative material.\n\n### Consequence\nThe content is indexed and made retrievable for future campaigns and channels. Without this package, each new campaign recreates material from scratch, and approved assets are lost.","sourceid":"elem-id-931","targetid":"elem-id-974","specialization":""},{"id":"elem-id-66fee93b-c470-4deb-891c-1bfee2f0c6c7","type":"FlowRelationship","name":"Metadata Catalogue","documentation":"### Object\nThe Metadata Catalogue indexes all managed data assets, including their definitions, locations, and quality indicators.\n\n### Condition\nIt is published after data assets are registered and indexed.\n\n### Consequence\nSearch and discovery tools use the catalogue to help users find relevant data. Without this catalogue, data assets are hidden, and users cannot locate them.","sourceid":"elem-id-971","targetid":"elem-id-966","specialization":""},{"id":"elem-id-1ebf96e1-0f58-4869-9844-d8638d872c66","type":"FlowRelationship","name":"Mobility Academic Record","documentation":"### Object\nThe academic transcript and credit outcomes from the mobility placement, including grades achieved and credit equivalency.\n\n### Condition\nIssued when the host institution provides official results and the home institution receives and verifies them.\n\n### Consequence\nArrival integrates external credit into the student's academic record and enables progression. Absence leaves the placement unassessed and delays award.","sourceid":"elem-id-865","targetid":"elem-id-863","specialization":""},{"id":"elem-id-ad52cf56-05cf-46b1-9ba8-45b139882968","type":"FlowRelationship","name":"Mobility Placement","documentation":"### Object\nThe record of a student's mobility placement status, including host institution, dates, and stage of approval.\n\n### Condition\nIssued when a mobility placement is approved or its status changes, such as departure, return, or withdrawal.\n\n### Consequence\nArrival informs enrolment status and maintains the student's active record during external study. Absence leaves the student's whereabouts unknown and endangers funding.","sourceid":"elem-id-865","targetid":"elem-id-862","specialization":""},{"id":"elem-id-f1fb42e2-82d2-4a0a-a573-dbdc574984e1","type":"FlowRelationship","name":"Module Selection","documentation":"### Object\nThe set of modules a student has chosen for the current academic year, with credit totals and any pre-requisite or timetabling constraints.\n\n### Condition\nIssued when the student submits module choices within the selection window and choices pass validation against programme rules.\n\n### Consequence\nArrival registers the student on modules and triggers content access and timetable membership. Absence leaves the student with no registered teaching and prevents assessment entry.","sourceid":"elem-id-838","targetid":"elem-id-882","specialization":""},{"id":"elem-id-baa02fd1-f5c5-4b65-a6c6-ad09c624ea86","type":"FlowRelationship","name":"Module Selection","documentation":"### Object\nThe set of modules a student has chosen for the current academic year, with credit totals and any pre-requisite or timetabling constraints.\n\n### Condition\nIssued when the student's module choice validation is complete and requires sharing for induction preparation.\n\n### Consequence\nArrival registers the student's choices and ensures induction reflects actual teaching membership. Absence leaves induction materials generic and misaligned with the student's timetable.","sourceid":"elem-id-838","targetid":"elem-id-839","specialization":""},{"id":"id-76305252-2a4c-4208-a39b-2d42eb815a82","type":"FlowRelationship","name":"Module Selections","documentation":"","sourceid":"elem-id-200034","targetid":"elem-id-200037","specialization":""},{"id":"elem-id-eb2caf8e-edc3-4ea3-bc56-8c6073c07684","type":"FlowRelationship","name":"Network Configuration Update","documentation":"### Object\nThe Network Configuration Update contains changes to network device settings, VLANs, firewalls, or routing tables.\n\n### Condition\nIt is pushed after extensive testing in a staging environment.\n\n### Consequence\nEnd user computing devices receive the new configuration automatically, ensuring connectivity and security. Without this update, devices remain on outdated network settings and may be vulnerable or unable to connect.","sourceid":"elem-id-955","targetid":"elem-id-961","specialization":""},{"id":"elem-id-279d9ddf-8605-479d-84b4-025f5d1c1720","type":"FlowRelationship","name":"New Space Inventory","documentation":"### Object\nThe New Space Inventory lists all rooms and spaces added or renovated by a project, including their intended use and capacity.\n\n### Condition\nIt is compiled after handover of the facility.\n\n### Consequence\nSpace utilisation systems incorporate the new spaces into allocation and timetabling. Without this inventory, the new areas are not available for booking, and their utilisation is unknown.","sourceid":"elem-id-980","targetid":"elem-id-982","specialization":""},{"id":"elem-id-5291bda9-73fe-4807-b74f-0078b846b4aa","type":"FlowRelationship","name":"New Staff Record","documentation":"### Object\nThe New Staff Record holds personal details, employment start date, role, department, and payroll information for a newly hired individual.\n\n### Condition\nIt is created after the hiring decision is confirmed and all pre-employment checks are complete.\n\n### Consequence\nThe staff member becomes a recognised employee in the institution, enabling payroll, access, and training enrolment. Without this record, the person has no official status, and no services are provisioned.","sourceid":"elem-id-943","targetid":"elem-id-953","specialization":""},{"id":"elem-id-5a58f5a2-a69d-46bd-a280-12a6ea3f2d54","type":"FlowRelationship","name":"New Supplier Record","documentation":"### Object\nThe New Supplier Record contains the supplier's legal name, address, tax identification, and bank details required for payment.\n\n### Condition\nIt is created after vendor due diligence and approval.\n\n### Consequence\nSupplier management maintains the approved supplier list with this record. Without this record, the supplier cannot be paid, and transactions with them are blocked.","sourceid":"elem-id-990","targetid":"elem-id-999","specialization":""},{"id":"elem-id-ec217db8-d9d4-4fb6-9629-0810e0a68244","type":"FlowRelationship","name":"Non-Commercial Spin-Off Opportunity","documentation":"### Object\nThe opportunity describes a research outcome that has social value but no commercial market, such as a public tool or open standard.\n\n### Condition\nIt is issued when a commercialisation review concludes the outcome is better advanced through non-commercial routes.\n\n### Consequence\nThe opportunity is developed into a public benefit initiative, and without it the outcome remains unexploited.","sourceid":"elem-id-903","targetid":"elem-id-904","specialization":""},{"id":"elem-id-f1595904-53b5-4103-8003-6f2db9fdc786","type":"FlowRelationship","name":"Occupational Health Policy","documentation":"### Object\nThis is the updated occupational health policy carrying duties, exposure limits, and incident reporting requirements for workplace health.\n\n### Condition\nIt is issued after policy review and approval by the governing body. Arrival means current legal and institutional requirements for workplace safety are available.\n\n### Consequence\nOn arrival, workplace health practice adopts the new policy and workplace safety procedures are revised to meet the updated duties. While absent, workplace health practice follows outdated safety duties and does not meet current reporting requirements.","sourceid":"elem-id-834","targetid":"elem-id-948","specialization":""},{"id":"elem-id-455d9224-e174-4f54-aa1c-2efa7785d577","type":"FlowRelationship","name":"Online Delivery Report","documentation":"### Object\nThe report summarising online delivery metrics, including engagement, completion, and resource usage.\n\n### Condition\nIssued when online course analytics are compiled for a defined period.\n\n### Consequence\nArrival informs content improvement and resource reallocation. Absence leaves online delivery unmonitored for effectiveness.","sourceid":"elem-id-881","targetid":"elem-id-882","specialization":""},{"id":"elem-id-2c2cfb6d-f948-4d52-9f26-909401a8d6e3","type":"FlowRelationship","name":"Operational Finance Report","documentation":"### Object\nThe Operational Finance Report contains departmental expenditure, income, and variance from budget for non-core activities, formatted for consolidation.\n\n### Condition\nIt is produced at period close after all operational transactions have been recorded.\n\n### Consequence\nFinancial reporting combines these operational figures with other accounts to produce institutional statements. Without this report, the overall financial position excludes operational activity, and statements are incomplete.","sourceid":"elem-id-975","targetid":"elem-id-996","specialization":""},{"id":"id-026e0dc4-cd56-4ef1-b483-5d94af3e4173","type":"FlowRelationship","name":"Operational Finance Report","documentation":"","sourceid":"elem-id-200016","targetid":"elem-id-200012","specialization":""},{"id":"id-454fc251-eb89-45cd-b936-5f5c3c3dece3","type":"FlowRelationship","name":"Opportunity Assessment","documentation":"","sourceid":"elem-id-20008","targetid":"elem-id-20004","specialization":""},{"id":"elem-id-7e021d34-b919-4d90-a866-4d9ba6498317","type":"FlowRelationship","name":"Opportunity Assessment Report","documentation":"### Object\nA report evaluating an opportunity's feasibility, expected financial return, strategic fit, and risk level, with a recommendation.\n\n### Condition\nIssued when an opportunity has been fully assessed and a recommendation is made. Arrival means the assessment is ready for project initiation.\n\n### Consequence\nProject initiation proceeds for opportunities assessed as viable, and resources are assigned. While absent, no project is initiated and the assessment work remains unused.","sourceid":"elem-id-912","targetid":"elem-id-827","specialization":""},{"id":"elem-id-2020b329-4952-499e-bde2-0bc0bbb2a151","type":"FlowRelationship","name":"Opportunity Brief","documentation":"### Object\nA concise summary of a potential commercial opportunity, including market need, potential partner type, expected value, and initial constraints.\n\n### Condition\nIssued when scanning identifies a credible opportunity. Arrival means the opportunity is available for partner outreach.\n\n### Consequence\nThe brief is used to target and approach suitable partners. Without it, partner outreach has no opportunity focus and no candidate list is generated.","sourceid":"elem-id-910","targetid":"elem-id-913","specialization":""},{"id":"elem-id-6b4b31dc-7198-4862-b180-ed2391770a50","type":"FlowRelationship","name":"Opportunity Brief","documentation":"### Object\nA concise summary of a potential commercial opportunity, including market need, potential partner type, expected value, and initial constraints.\n\n### Condition\nIssued when scanning identifies a credible opportunity. Arrival means the opportunity is available for assessment.\n\n### Consequence\nFeasibility assessment begins using the brief. The opportunity is evaluated against institutional criteria. While absent, the opportunity is not assessed and no decision is made.","sourceid":"elem-id-910","targetid":"elem-id-912","specialization":""},{"id":"elem-id-291e3a73-fd46-4a91-a2d4-f1b1292265ed","type":"FlowRelationship","name":"Organisational Policy Update","documentation":"### Object\nThe Organisational Policy Update communicates changes to policies that affect staff and students, such as HR or finance policies.\n\n### Condition\nIt is issued after the policy is approved.\n\n### Consequence\nChildcare management adjusts its operations in line with the new policy if applicable. Without this update, childcare services may operate under outdated rules and be non-compliant.","sourceid":"elem-id-940","targetid":"elem-id-937","specialization":""},{"id":"elem-id-34665a96-3d9a-4686-90ed-677508723491","type":"FlowRelationship","name":"Parking Usage Report","documentation":"### Object\nThe Parking Usage Report aggregates counts of vehicles entering, exiting, and occupying parking facilities over a period.\n\n### Condition\nIt is generated from automated gate and sensor systems at regular intervals.\n\n### Consequence\nEnvironmental management uses the data to assess traffic impact and plan sustainable transport initiatives. Without this report, parking-related emissions and congestion are unmeasured, and environmental targets are not informed.","sourceid":"elem-id-985","targetid":"elem-id-984","specialization":""},{"id":"elem-id-0998e349-6369-4348-a0ad-c06aa0088fd7","type":"FlowRelationship","name":"Parking Violation Record","documentation":"### Object\nThe Parking Violation Record captures details of a parking infraction: vehicle registration, location, time, and alleged violation.\n\n### Condition\nIt is created when a parking attendant observes a vehicle in breach of parking regulations.\n\n### Consequence\nCampus security receives the record for review and may issue a penalty. Without this record, violations are not recorded, and enforcement is not possible.","sourceid":"elem-id-985","targetid":"elem-id-981","specialization":""},{"id":"id-70095ca9-37bb-42a3-9cf5-5fd315bf1e24","type":"FlowRelationship","name":"Partner Contract","documentation":"","sourceid":"elem-id-20006","targetid":"elem-id-20007","specialization":""},{"id":"elem-id-d8b5937b-4394-4284-be1c-352914bb0075","type":"FlowRelationship","name":"Partner Input","documentation":"### Object\nThe input collects partner comments, constraints, and preferences submitted during collaborative opportunity assessment.\n\n### Condition\nIt is received when partners respond to a formal consultation and the content is verified by the opportunity team.\n\n### Consequence\nPrioritisation decisions incorporate the partner's stated position, and without it the prioritisation is made without partner-side constraints known.","sourceid":"elem-id-890","targetid":"elem-id-889","specialization":""},{"id":"id-edddf5bf-e2a0-4dee-93b7-a815ebdae3ec","type":"FlowRelationship","name":"Partner Integration Brief","documentation":"","sourceid":"elem-id-20006","targetid":"elem-id-20005","specialization":""},{"id":"elem-id-57df5f38-89b5-4d1e-bd4c-8350d079e4a8","type":"FlowRelationship","name":"Partner Onboarding Pack","documentation":"### Object\nA collection of materials needed to onboard a partner, including account details, system access forms, training schedules, and compliance requirements.\n\n### Condition\nIssued when the partnership agreement is signed and the partner is ready to integrate. Arrival means onboarding prerequisites are available.\n\n### Consequence\nSystem configuration and access provisioning proceed using the pack. Partner users are set up according to the pack. While absent, onboarding cannot start because account and access details are missing.","sourceid":"elem-id-913","targetid":"elem-id-914","specialization":""},{"id":"elem-id-7bc7ba3a-b9eb-461a-969b-3c9ecd061bcc","type":"FlowRelationship","name":"Partner Opportunity Brief","documentation":"### Object\nContains partner requirements, desired collaboration scope, expected outcomes, and known constraints. It captures the partner's stated needs and the commercial context for engagement.\n\n### Condition\nIssued only after partner discussions confirm a mutual area of interest and the partner agrees to share requirements. Arrival means a partner-sourced opportunity is in view.\n\n### Consequence\nScreening against institutional priorities and commercial viability proceeds. The brief enters the opportunity assessment pipeline. While absent, no partner-sourced opportunity is evaluated, and potential collaborations remain unexamined.","sourceid":"elem-id-913","targetid":"elem-id-910","specialization":""},{"id":"elem-id-ad8bd91e-60ac-4f5c-9f75-e1d391c5b24d","type":"FlowRelationship","name":"Partner Relationship Record","documentation":"### Object\nA structured profile of the partner organisation, key contacts, relationship history, past engagements, and communication preferences.\n\n### Condition\nIssued when a partner relationship is formalised or updated after engagement. Arrival means the relationship is registered for ongoing management.\n\n### Consequence\nRelationship maintenance activities, such as contact scheduling and issue escalation, proceed with correct context. While absent, partner contacts and history are unavailable, and relationship continuity is broken.","sourceid":"elem-id-913","targetid":"elem-id-922","specialization":""},{"id":"id-7273d640-bbf8-4db2-ba7e-82239d263059","type":"FlowRelationship","name":"Partner Sourcing Brief","documentation":"","sourceid":"elem-id-20006","targetid":"elem-id-20008","specialization":""},{"id":"elem-id-b67abb75-b054-49b1-b396-9bb3a3db3be4","type":"FlowRelationship","name":"Partnership Collaboration Plan","documentation":"### Object\nThe Partnership Collaboration Plan outlines joint activities, resource commitments, and timelines agreed with an industry partner.\n\n### Condition\nIt is produced after initial discussions and mutual agreement.\n\n### Consequence\nInternal stakeholders align support services and academic input to the partnership. Without this plan, the partnership remains informal and may fail due to lack of coordination.","sourceid":"elem-id-922","targetid":"elem-id-925","specialization":""},{"id":"elem-id-43bfc627-6ae6-4e7e-a1be-3ee02c783268","type":"FlowRelationship","name":"Partnership Opportunity","documentation":"### Object\nThe opportunity identifies a prospective collaborative partner, their funding interests, and the research theme where joint work is feasible.\n\n### Condition\nIt is raised only when the relationship team confirms the partner's intent and a mutual research focus, and it arrives with named contacts.\n\n### Consequence\nFunding identification works from the named partnership opportunity, and without it potential joint applications are not entered into the opportunity pipeline.","sourceid":"elem-id-902","targetid":"elem-id-892","specialization":""},{"id":"id-544f069b-08e6-41c7-a212-41af4ada9129","type":"FlowRelationship","name":"Partnership Opportunity","documentation":"","sourceid":"elem-id-200023","targetid":"elem-id-200022","specialization":""},{"id":"elem-id-162c9ed1-c533-4b60-8fdc-ecdb353b44d7","type":"FlowRelationship","name":"Pastoral Concern Report","documentation":"### Object\nThe report noting a pastoral concern about a student, such as disengagement, distress, or behavioural change.\n\n### Condition\nIssued when a personal tutor identifies concern that may affect retention and records it for the retention team.\n\n### Consequence\nArrival triggers retention outreach and coordinated support. Absence leaves the concern invisible and allows the student to slip away.","sourceid":"elem-id-876","targetid":"elem-id-874","specialization":""},{"id":"elem-id-4afe9809-dfb8-4bb3-be4e-fc0612383b6c","type":"FlowRelationship","name":"Payment History","documentation":"### Object\nThe Payment History lists all payments made to a supplier, including dates, amounts, and invoice references.\n\n### Condition\nIt is accumulated as payments are processed.\n\n### Consequence\nSupplier management uses this history to resolve disputes and negotiate terms. Without this history, past payments are unknown, and duplicate payments or missed credits occur.","sourceid":"elem-id-998","targetid":"elem-id-999","specialization":""},{"id":"elem-id-d1969255-60ae-4e30-943a-9b7ad752bbdc","type":"FlowRelationship","name":"Payment Instruction","documentation":"### Object\nThe Payment Instruction directs the bank to transfer funds to a specified supplier or employee, including account details and amount.\n\n### Condition\nIt is issued after invoices are approved for payment.\n\n### Consequence\nIncome management updates its records of outgoing payments once the instruction is executed. Without this instruction, the payment is not processed, and the supplier remains unpaid.","sourceid":"elem-id-992","targetid":"elem-id-993","specialization":""},{"id":"elem-id-4e92d767-f9ea-427d-a962-91eb3d227cad","type":"FlowRelationship","name":"Performance Dashboards","documentation":"### Object\nThis is a set of performance dashboards containing key performance indicator trends, benchmarks, and variance explanations.\n\n### Condition\nIt is issued after performance data is validated and dashboards are published. Arrival means the consolidated performance view is available.\n\n### Consequence\nOn arrival, institutional performance reports use the dashboard metrics and the governing body sees current performance. While absent, governing body reports lack consolidated performance metrics and variances are unexplained.","sourceid":"elem-id-825","targetid":"elem-id-824","specialization":""},{"id":"elem-id-f0a8510c-8623-4ce7-88f2-00c8085aa260","type":"FlowRelationship","name":"Performance Gap Report","documentation":"### Object\nThe report identifying a student's performance gap, including the skill, subject area, and evidence.\n\n### Condition\nIssued when a learning need is detected through assessment, self-evaluation, or tutor observation.\n\n### Consequence\nArrival routes the student to appropriate skills development. Absence lets the gap persist and reduces academic progression.","sourceid":"elem-id-879","targetid":"elem-id-871","specialization":""},{"id":"elem-id-e207e586-ce22-471e-986b-85b5b93b625a","type":"FlowRelationship","name":"Philanthropic Prospect","documentation":"### Object\nThe prospect record identifying an individual with giving capacity and engagement history, plus any initial interest signals.\n\n### Condition\nIssued when an alumnus or other contact is identified as a potential benefactor through engagement screening or referral.\n\n### Consequence\nArrival opens a benefactor cultivation track and assigns relationship management. Absence leaves the potential gift unapproached and missing from the pipeline.","sourceid":"elem-id-855","targetid":"elem-id-857","specialization":""},{"id":"elem-id-1124b414-1a63-40d2-85c4-e6aca8f26f35","type":"FlowRelationship","name":"Placement Feedback","documentation":"### Object\nThe feedback from a placement, including student reflections, employer comments, and suggested curriculum improvements.\n\n### Condition\nIssued when a placement concludes and feedback is collected from all parties.\n\n### Consequence\nArrival updates curriculum content to align with practice. Absence lets curriculum drift from employer expectations.","sourceid":"elem-id-883","targetid":"elem-id-882","specialization":""},{"id":"elem-id-53d6c103-c094-4037-baf3-a9ba64a3bdcb","type":"FlowRelationship","name":"Platform Environment Specification","documentation":"### Object\nThe Platform Environment Specification describes the operating system, database, middleware, and hardware configuration required to run an application.\n\n### Condition\nIt is defined during application architecture.\n\n### Consequence\nApplication lifecycle management ensures the application is compatible with the specified environment. Without this specification, deployment may fail or perform poorly.","sourceid":"elem-id-955","targetid":"elem-id-956","specialization":""},{"id":"elem-id-c15184aa-3165-497b-8b26-e7c1a9d3f09e","type":"FlowRelationship","name":"Policy Compliance Requirement","documentation":"### Object\nThe Policy Compliance Requirement communicates new or changed government policy that the institution must implement.\n\n### Condition\nIt is issued after a government department publishes a binding requirement.\n\n### Consequence\nInternal stakeholders assess the impact and assign responsibility for compliance. Without this requirement, the institution is unaware of new obligations and fails to act.","sourceid":"elem-id-921","targetid":"elem-id-925","specialization":""},{"id":"elem-id-23e28b9e-e804-470d-9a66-17da12b39c8a","type":"FlowRelationship","name":"Print Service Demand Forecast","documentation":"### Object\nThe Print Service Demand Forecast predicts the volume of print jobs expected for a period, based on academic calendar and communication campaigns.\n\n### Condition\nIt is produced before peak periods.\n\n### Consequence\nPrinting management schedules staff, orders supplies, and prioritises jobs accordingly. Without this forecast, print queues overflow, and deadlines are missed.","sourceid":"elem-id-940","targetid":"elem-id-939","specialization":""},{"id":"elem-id-d5df3265-ea61-4801-ac8b-efcd1a6b8a54","type":"FlowRelationship","name":"Print Service Status Report","documentation":"### Object\nThe Print Service Status Report informs internal communications of any outages, backlogs, or changes to print services.\n\n### Condition\nIt is issued when printing operations are disrupted or changed.\n\n### Consequence\nInternal communications adjusts messaging to warn users or reschedule print-dependent campaigns. Without this report, users are caught by surprise and deadlines are missed.","sourceid":"elem-id-939","targetid":"elem-id-940","specialization":""},{"id":"elem-id-43bcd839-2c18-4914-9a0a-b8e1d1a30334","type":"FlowRelationship","name":"Prioritised Change Portfolio","documentation":"### Object\nThis is a prioritised change portfolio listing approved change initiatives with priority scores and architectural impact.\n\n### Condition\nIt is issued after portfolio prioritisation decisions are made. Arrival means the demand context for architecture planning is available.\n\n### Consequence\nOn arrival, architecture plans and standards are aligned with the prioritised initiatives. While absent, architecture planning has no visibility of change demand and standards are developed without portfolio context.","sourceid":"elem-id-829","targetid":"elem-id-830","specialization":""},{"id":"elem-id-dc1d6872-4302-452f-b609-dc3b33189a10","type":"FlowRelationship","name":"Prioritised Research Selection","documentation":"### Object\nThe selection lists the research opportunities approved for progression, in ranked order, with the resource envelope for each.\n\n### Condition\nIt is issued when the prioritisation panel reaches a decision and the minutes are approved.\n\n### Consequence\nProposals are built only for the selected opportunities, and without it no new programme has a formal prioritisation mandate.","sourceid":"elem-id-889","targetid":"elem-id-891","specialization":""},{"id":"elem-id-86779bdd-02bd-426e-957e-254328720ec8","type":"FlowRelationship","name":"Private Housing Inventory","documentation":"### Object\nThe Private Housing Inventory lists available external properties, their conditions, rents, and landlord details for student accommodation.\n\n### Condition\nIt is updated after agreements with landlords are signed and properties pass inspection.\n\n### Consequence\nAccommodation allocation can offer these properties to students on the unmet demand list. Without this inventory, students referred to private housing have no verified options, and placements stall.","sourceid":"elem-id-1005","targetid":"elem-id-1001","specialization":""},{"id":"elem-id-3caa6761-3a1f-4144-872d-2eef44aec80d","type":"FlowRelationship","name":"Programme Evaluation Report","documentation":"### Object\nThe report records an independent assessment of each programme's financial return, delivery milestones, and resource utilisation against the approved plan.\n\n### Condition\nIt is produced when all financial transactions for the period are reconciled and the evaluation panel has signed off the variance analysis. Its arrival signals that funding adjustments are evidence-based.\n\n### Consequence\nFunding decisions for the next period are made with the evaluated cost and output position in front of them; without the report, allocations are decided on unverified spend and programme volume alone.","sourceid":"elem-id-905","targetid":"elem-id-893","specialization":""},{"id":"elem-id-3318f554-d55e-4d14-8455-c98766fa7c6b","type":"FlowRelationship","name":"Programme Performance Report","documentation":"### Object\nThe report carries per-programme outcome counts, completion rates, research income, and benchmark comparisons for the completed academic year.\n\n### Condition\nIt is issued only after term-end data collection closes and final validation confirms that all enrolled activities are accounted for. Its arrival marks the point at which performance evidence is authoritative.\n\n### Consequence\nPrioritisation decisions rest on measured performance rather than stated ambition, and programmes without recent performance evidence are excluded from forward planning until a new report is issued.","sourceid":"elem-id-905","targetid":"elem-id-889","specialization":""},{"id":"elem-id-f0cd9e76-69a5-4286-8404-5a5064250ae5","type":"FlowRelationship","name":"Programme Performance Report","documentation":"### Object\nThe report carries per-programme outcome counts, completion rates, research income, and benchmark comparisons for the completed academic year.\n\n### Condition\nIt is issued only after term-end data collection closes and final validation confirms that all enrolled activities are accounted for. Its arrival marks the point at which performance evidence is authoritative.\n\n### Consequence\nQuality assurance activity reviews the report to identify underperforming programmes and triggers targeted quality audits; without it quality review proceeds without outcome evidence.","sourceid":"elem-id-905","targetid":"elem-id-906","specialization":""},{"id":"id-b781da35-8316-49ac-96aa-219f606ab44b","type":"FlowRelationship","name":"Programme Performance Review","documentation":"","sourceid":"elem-id-200024","targetid":"elem-id-200025","specialization":""},{"id":"id-097d476a-423d-4571-ab84-c6bfce72e5ce","type":"FlowRelationship","name":"Progress Alert","documentation":"","sourceid":"elem-id-200037","targetid":"elem-id-200035","specialization":""},{"id":"id-89ca5a76-f6ab-40e3-bcc9-c5b8fbe79a31","type":"FlowRelationship","name":"Project Budget Request","documentation":"","sourceid":"elem-id-20004","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-b8ccaca1-bdd6-4e17-a819-5ce304993964","type":"FlowRelationship","name":"Project Budget Requests","documentation":"### Object\nThis is a set of project budget requests carrying cost estimates, resource requirements, and planned spend profiles.\n\n### Condition\nIt is issued when a project passes initiation and its financial case is prepared. Arrival means the demand for project funding is available for budget allocation.\n\n### Consequence\nOn arrival, project funds are allocated against approved budget lines and variances are tracked. While absent, project spending has no approved funding envelope and costs are incurred outside budget control.","sourceid":"elem-id-827","targetid":"elem-id-991","specialization":""},{"id":"id-eea84030-e46f-4264-b226-0b6661d6fe3a","type":"FlowRelationship","name":"Project Evaluation Report","documentation":"","sourceid":"elem-id-200024","targetid":"elem-id-200022","specialization":""},{"id":"elem-id-d787fb4b-b400-4cdb-8c13-384d426d4122","type":"FlowRelationship","name":"Project Status Report","documentation":"### Object\nThis is a project status report carrying progress, risks, issues, and variance against plan.\n\n### Condition\nIt is issued at each reporting cycle or exception event. Arrival means current delivery status is available for portfolio oversight.\n\n### Consequence\nOn arrival, portfolio dashboards are updated and interventions are triggered for off-track projects. While absent, the change portfolio has no current project status and delivery slippage goes undetected.","sourceid":"elem-id-827","targetid":"elem-id-829","specialization":""},{"id":"id-dfe87e43-266c-45fb-b955-e5bc7d8953e3","type":"FlowRelationship","name":"Prospect Enquiry","documentation":"","sourceid":"elem-id-200032","targetid":"elem-id-200030","specialization":""},{"id":"elem-id-3350e066-6ddc-4c6b-b093-522adadaf62f","type":"FlowRelationship","name":"Provenance Record","documentation":"### Object\nThe Provenance Record details the origin, ownership history, and authenticity of a collection item.\n\n### Condition\nIt is compiled by museum or art experts after acquisition.\n\n### Consequence\nLibrary resource management incorporates this record into its own catalogue for any shared or loaned items. Without this record, the institution cannot verify the item's legal ownership or historical significance.","sourceid":"elem-id-964","targetid":"elem-id-963","specialization":""},{"id":"elem-id-23478b38-22dc-4425-942c-d432a6ff2385","type":"FlowRelationship","name":"Public Perception Insight","documentation":"### Object\nThe Public Perception Insight summarises media coverage analysis and public opinion trends regarding the institution.\n\n### Condition\nIt is produced after media monitoring data is collected and analysed.\n\n### Consequence\nPublic relationship managers adjust engagement strategies to address negative perceptions or capitalise on positive ones. Without this insight, public sentiment is unknown, and strategies are blind.","sourceid":"elem-id-924","targetid":"elem-id-926","specialization":""},{"id":"elem-id-fbbffdd2-f186-4498-8982-688518e0b7d8","type":"FlowRelationship","name":"Publication Metrics Report","documentation":"### Object\nThe report carries citation counts, download statistics, and altmetric attention for each managed output.\n\n### Condition\nIt is produced after the metrics provider delivers the latest data and the output management team resolves duplicate entries.\n\n### Consequence\nResearch production sees the measured reach of its outputs, and without it publication impact is not fed back into future project planning.","sourceid":"elem-id-894","targetid":"elem-id-895","specialization":""},{"id":"elem-id-02bded82-a640-47d3-b30d-7791abae94fd","type":"FlowRelationship","name":"Publication Quality Findings","documentation":"### Object\nThis finding records the outcome of quality checks on manuscripts, including adherence to open access requirements, authorship integrity, and peer review standards.\n\n### Condition\nIt is issued only after a quality review identifies a deviation or confirms compliance for a batch of submitted outputs. Its arrival means publication decisions now have a quality judgement attached.\n\n### Consequence\nManuscripts with unresolved quality findings are held at the point of publication, while compliant manuscripts proceed without further quality gate review.","sourceid":"elem-id-906","targetid":"elem-id-900","specialization":""},{"id":"elem-id-56fbed2b-60ff-4fdb-8c0b-78d6cc987605","type":"FlowRelationship","name":"Publication Record","documentation":"### Object\nThe record contains the bibliographic details, DOI, and full-text location of a published research output.\n\n### Condition\nIt is emitted when the publication management system confirms the output is published and its metadata passes library schema validation.\n\n### Consequence\nThe library system ingests the record for catalogue and preservation, and without it the publication is not discoverable through the library system.","sourceid":"elem-id-900","targetid":"elem-id-963","specialization":""},{"id":"elem-id-026d0d31-3e0a-4a75-8345-5f69899bf5d7","type":"FlowRelationship","name":"Publication Record","documentation":"### Object\nThe record contains the bibliographic details, DOI, and full-text location of a published research output.\n\n### Condition\nIt is emitted when the publication management system confirms the output is published and its metadata passes library schema validation.\n\n### Consequence\nInstitutional reporting includes the record in its published output counts, and without it the output is missing from institutional reporting.","sourceid":"elem-id-900","targetid":"elem-id-901","specialization":""},{"id":"id-6c0fb158-fc0b-4bda-96f5-21486cd1cf46","type":"FlowRelationship","name":"Publication Record","documentation":"","sourceid":"elem-id-200026","targetid":"elem-id-200018","specialization":""},{"id":"elem-id-12e5eff1-d5ef-4161-b68d-d619543cad82","type":"FlowRelationship","name":"Purchase Order","documentation":"### Object\nThe Purchase Order is a formal commitment to buy specified goods or services at an agreed price from a supplier.\n\n### Condition\nIt is issued after a requisition is approved and the supplier is selected.\n\n### Consequence\nExpenditure management recognises a liability and reserves funds for the order. Without this order, the supplier has no authority to deliver, and the purchase cannot proceed.","sourceid":"elem-id-990","targetid":"elem-id-998","specialization":""},{"id":"id-86f19abb-e272-486c-81d7-0f5a2c7e7ea9","type":"FlowRelationship","name":"Quality Assurance Findings","documentation":"","sourceid":"elem-id-20004","targetid":"elem-id-20001","specialization":""},{"id":"elem-id-09a054eb-3c3e-4fae-802a-8ee8cf3ccad3","type":"FlowRelationship","name":"Quality Assurance Reports","documentation":"### Object\nThis is a set of quality assurance reports on academic and administrative processes, including audit findings, non-conformities, and improvement recommendations.\n\n### Condition\nIt is issued after quality reviews are completed and findings are approved. Arrival means evidence of quality performance is available.\n\n### Consequence\nOn arrival, academic regulations are revised to address the reported non-conformities and improvement actions are initiated. While absent, academic regulations remain unchanged and known quality issues persist.","sourceid":"elem-id-831","targetid":"elem-id-840","specialization":""},{"id":"id-a5a37ec0-cebb-4fde-b034-0433a426abc4","type":"FlowRelationship","name":"Quality Assurance Review","documentation":"","sourceid":"elem-id-200024","targetid":"elem-id-200026","specialization":""},{"id":"elem-id-80bf16e9-45d5-4a53-bfce-6f8b29a3c148","type":"FlowRelationship","name":"Quality Standards","documentation":"### Object\nThis is a set of quality standards and procedures governing project deliverables, reviews, and acceptance criteria.\n\n### Condition\nIt is issued after quality management approves the standards. Arrival means the mandatory quality requirements are available for project delivery.\n\n### Consequence\nOn arrival, project teams apply the standards to all deliverables and quality gates are enforced. While absent, project deliverables are produced without agreed quality standards and acceptance is ad hoc.","sourceid":"elem-id-831","targetid":"elem-id-827","specialization":""},{"id":"elem-id-b919402b-aeef-43fa-a5c1-25fc2ef7ee16","type":"FlowRelationship","name":"Reasonable Adjustment Plan","documentation":"### Object\nThe formal plan specifying adjustments required by a disabled student, including exam arrangements, deadlines, and access provisions.\n\n### Condition\nIssued when a disability support assessment has been completed and the recommended adjustments are approved.\n\n### Consequence\nArrival ensures teaching and assessment environments comply with the student's needs. Absence leads to inaccessible delivery and potential legal breach.","sourceid":"elem-id-878","targetid":"elem-id-876","specialization":""},{"id":"elem-id-9e672aa6-0849-44dc-a66f-bf9a21f20669","type":"FlowRelationship","name":"Record Classification Scheme","documentation":"### Object\nThe Record Classification Scheme assigns categories and retention periods to different types of records.\n\n### Condition\nIt is established by records management and approved by compliance.\n\n### Consequence\nData management applies this scheme to all new records for consistent retention. Without this scheme, records are classified inconsistently and retention periods are unmanaged.","sourceid":"elem-id-973","targetid":"elem-id-971","specialization":""},{"id":"elem-id-9e3a69b3-07b8-4b4a-88bf-a2f4866f6538","type":"FlowRelationship","name":"Regulatory Compliance Status","documentation":"### Object\nThis is a current regulatory compliance status record across obligations, carrying outstanding items, severity ratings, and trend indicators.\n\n### Condition\nIt is issued after each monitoring cycle when compliance data is validated. Arrival means the latest compliance position is available for governing body reporting.\n\n### Consequence\nOn arrival, the compliance position is incorporated into institutional performance reports and trend indicators inform governing body risk discussions. While absent, governing body reports omit the current regulatory position and compliance trends are not visible.","sourceid":"elem-id-833","targetid":"elem-id-824","specialization":""},{"id":"elem-id-9a8b7e60-015a-4348-afa9-00531bc68fcf","type":"FlowRelationship","name":"Regulatory Update","documentation":"### Object\nThe Regulatory Update contains changes to legislation, regulatory guidance, or government policy that affect institutional operations.\n\n### Condition\nIt is issued after an official announcement or publication by a governing body.\n\n### Consequence\nCompliance teams assess the impact and update internal rules and procedures accordingly. Without this update, the institution operates under outdated requirements and risks non-compliance.","sourceid":"elem-id-921","targetid":"elem-id-977","specialization":""},{"id":"id-327946f5-41ee-4e16-b459-cd46baf4666d","type":"FlowRelationship","name":"Regulatory Update","documentation":"","sourceid":"elem-id-200013","targetid":"elem-id-200017","specialization":""},{"id":"elem-id-e70de3d7-c026-4d5d-9313-9b0e736ec49e","type":"FlowRelationship","name":"Remediation Work Order","documentation":"### Object\nThe Remediation Work Order instructs facility teams to repair or replace damaged infrastructure identified as a result of an incident or hazard.\n\n### Condition\nIt is issued after an emergency response has stabilised the situation and the required remediation is defined.\n\n### Consequence\nMaintenance teams execute the specified repairs and restore the facility to safe use. Without this order, the damaged infrastructure remains unrepaired and the area stays closed or unsafe.","sourceid":"elem-id-1003","targetid":"elem-id-1002","specialization":""},{"id":"elem-id-877cedc8-ac3c-4fd5-b9f0-cb551b784ad8","type":"FlowRelationship","name":"Research Compliance Report","documentation":"### Object\nThe report summarises compliance checks across research projects, including ethics approvals, data protection, and funder terms.\n\n### Condition\nIt is generated after each compliance cycle when all flagged items are either cleared or escalated. Its arrival means the compliance position is formally recorded.\n\n### Consequence\nThe institutional compliance dashboard reflects the current research compliance status, and without it the dashboard shows the research domain as unreported.","sourceid":"elem-id-908","targetid":"elem-id-833","specialization":""},{"id":"id-2363bb39-3974-48e3-82c2-19dd609a5e22","type":"FlowRelationship","name":"Research Compliance Report","documentation":"","sourceid":"elem-id-200020","targetid":"elem-id-20009","specialization":""},{"id":"elem-id-9b8a422a-7013-47bb-a471-927195ad7209","type":"FlowRelationship","name":"Research Dataset","documentation":"### Object\nThe dataset contains the structured research data, variable definitions, and any consent restrictions associated with an active project.\n\n### Condition\nIt is submitted once the data is stable, documented, and free of personally identifiable information not covered by a data management plan.\n\n### Consequence\nThe institutional data repository receives the dataset for preservation and access control, and without it the dataset is not discoverable or citable beyond the originating project.","sourceid":"elem-id-896","targetid":"elem-id-971","specialization":""},{"id":"elem-id-1e7267f0-9ad0-41f9-82f8-10be1d196ae0","type":"FlowRelationship","name":"Research Dataset","documentation":"### Object\nThe dataset contains raw or processed research data generated during a project, with its generation context and file formats.\n\n### Condition\nIt is deposited when the data reaches a stable state and the project completes its active collection phase.\n\n### Consequence\nDataset management receives the data for curation and preservation, and without it the data remains on local storage and is not preserved.","sourceid":"elem-id-895","targetid":"elem-id-896","specialization":""},{"id":"id-e9d6e852-a58d-468c-b791-53af82d5a0c4","type":"FlowRelationship","name":"Research Dataset","documentation":"","sourceid":"elem-id-200021","targetid":"elem-id-200016","specialization":""},{"id":"elem-id-4a6a8d73-b389-4e69-bb57-f31b5a5566c1","type":"FlowRelationship","name":"Research Funding Allocation","documentation":"### Object\nThe allocation records the amount of awarded research funds assigned to each cost centre and project for the academic year.\n\n### Condition\nIt is produced when the funds management team matches awards to budget codes and the finance system posts the entries.\n\n### Consequence\nThe institutional budget holds the research income position, and without it research spend is not reconciled against the institutional budget.","sourceid":"elem-id-893","targetid":"elem-id-991","specialization":""},{"id":"id-bf46ce40-86f0-4df2-a1d1-799b394a31b6","type":"FlowRelationship","name":"Research Impact Outputs","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-10003","specialization":""},{"id":"elem-id-0e84506f-c8a9-412d-ab6c-504c0f1006cb","type":"FlowRelationship","name":"Research Manuscript","documentation":"### Object\nThe manuscript is the finished written output of a research project, including the full text, data availability statement, and author list.\n\n### Condition\nIt is forwarded only after the research output management team has confirmed the manuscript is complete, internally consistent, and cleared for publication.\n\n### Consequence\nPublication processing begins on the manuscript's content, and without it the publication pipeline has no citable output to assign to the project.","sourceid":"elem-id-894","targetid":"elem-id-900","specialization":""},{"id":"elem-id-42909a06-92de-4a69-9cd1-3a5e87c09527","type":"FlowRelationship","name":"Research Manuscript","documentation":"### Object\nThe manuscript carries the full research narrative, results, and interpretation produced by a project.\n\n### Condition\nIt is submitted when the research team agrees the manuscript is ready for internal review and output recording.\n\n### Consequence\nResearch output management registers the manuscript as an institutional output, and without it the work has no formal output record.","sourceid":"elem-id-895","targetid":"elem-id-894","specialization":""},{"id":"elem-id-45d27a8c-6915-4ccf-88f3-8e370f34a2b6","type":"FlowRelationship","name":"Research Performance Report","documentation":"### Object\nThe report aggregates publication outputs, citation counts, and research income against the institution's strategic indicators.\n\n### Condition\nIt is generated after the reporting period closes and all output records are validated for inclusion.\n\n### Consequence\nThe institutional strategic narrative incorporates the research performance position, and without it the narrative omits the research domain's contribution.","sourceid":"elem-id-901","targetid":"elem-id-824","specialization":""},{"id":"id-3d6d98bf-7741-496a-8a1e-ea97f06b91db","type":"FlowRelationship","name":"Research Performance Report","documentation":"","sourceid":"elem-id-200026","targetid":"elem-id-200028","specialization":""},{"id":"elem-id-90fc286a-c969-423a-907e-a703e51155d8","type":"FlowRelationship","name":"Research Skills Certification","documentation":"### Object\nThe certification confirms that a postgraduate researcher has completed the required methodological and safety training for their project stage.\n\n### Condition\nIt is awarded when the skills development record shows all mandatory elements passed and the supervisor signs the competency confirmation.\n\n### Consequence\nResearch production tasks requiring certified skills are assigned to the researcher, and without it the researcher is restricted to supervised activities only.","sourceid":"elem-id-898","targetid":"elem-id-895","specialization":""},{"id":"id-7cf30b38-c5ca-4278-bf0c-9f6630ce7283","type":"FlowRelationship","name":"Research Skills Certification","documentation":"","sourceid":"elem-id-200027","targetid":"elem-id-200021","specialization":""},{"id":"elem-id-83019def-b295-498e-95f6-1c0e701f27c2","type":"FlowRelationship","name":"Researcher Contribution Record","documentation":"### Object\nThe record summarises each r
