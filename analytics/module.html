ldwork is complete and risk ratings are agreed with the audited area. Arrival means new audit-verified risks are available for the risk register.\n\n### Consequence\nOn arrival, the risk register is updated with the audited assessments and mitigation actions are assigned to risk owners. While absent, the risk register lacks audit-verified risk ratings and control gaps remain outside formal risk management.","sourceid":"elem-id-835","targetid":"elem-id-832","specialization":""},{"id":"elem-id-5fac1c55-6ceb-4df1-b3a2-bf8ac74f7d89","type":"FlowRelationship","name":"Authentication Credential","documentation":"### Object\nThe Authentication Credential is the unique identifier and secret issued to a user for accessing systems, such as a username and temporary password.\n\n### Condition\nIt is provisioned after a user's identity is verified and access is approved.\n\n### Consequence\nEnd user computing delivers the credential to the user so they can log in. Without this credential, the user cannot access any IT resources, and work is blocked.","sourceid":"elem-id-959","targetid":"elem-id-961","specialization":""},{"id":"elem-id-ed61b96e-9e0a-4f2c-a906-e74f4b16b470","type":"FlowRelationship","name":"Benefit Realisation Plans","documentation":"### Object\nThis is a set of benefit realisation plans specifying expected benefits, measures, and tracking responsibilities for projects.\n\n### Condition\nIt is issued after benefits are identified and approved for a project. Arrival means the benefits plan is available for inclusion in delivery.\n\n### Consequence\nOn arrival, project delivery incorporates benefit measures and tracks progress against planned benefits. While absent, projects deliver outputs without defined benefit measures and realisation is not tracked.","sourceid":"elem-id-826","targetid":"elem-id-827","specialization":""},{"id":"elem-id-a2d1541f-763d-48b7-bdd4-068817e5fba9","type":"FlowRelationship","name":"Benefit-Driven Capability Requirements","documentation":"### Object\nThis is a set of capability requirements derived from expected benefits, specifying what organisational capabilities must be created or changed.\n\n### Condition\nIt is issued when benefit plans are approved. Arrival means the capability demand for structural design is available.\n\n### Consequence\nOn arrival, structures and accountabilities are designed to meet the benefit-driven capability requirements. While absent, organisational design lacks benefit-driven capability demand and structures are designed without benefit linkage.","sourceid":"elem-id-826","targetid":"elem-id-828","specialization":""},{"id":"elem-id-a2c74a13-a585-46cf-be06-04d209128fab","type":"FlowRelationship","name":"Borrowing Activity Report","documentation":"### Object\nThe Borrowing Activity Report summarises loans, renewals, and overdue items per user or group.\n\n### Condition\nIt is produced monthly from the library management system.\n\n### Consequence\nMembership management identifies heavy users, sends overdue reminders, and may suspend privileges. Without this report, overdue items accumulate and borrowing rules are not enforced.","sourceid":"elem-id-962","targetid":"elem-id-965","specialization":""},{"id":"elem-id-b864a728-ef46-442d-a063-ea2547d14b87","type":"FlowRelationship","name":"Brand Style Guide","documentation":"### Object\nThe Brand Style Guide carries the visual identity standards, approved logo variants, colour palette, typography rules, and tone of voice for institutional communications.\n\n### Condition\nIt is issued only after the brand has been formally reviewed and approved for external use.\n\n### Consequence\nMarketing materials align with the central identity, and all advertising uses the correct marks. Without it, campaign assets are produced with unapproved designs, and brand consistency is lost.","sourceid":"elem-id-927","targetid":"elem-id-931","specialization":""},{"id":"elem-id-e153b67d-ff00-4e09-a065-4d31fc059843","type":"FlowRelationship","name":"Budget Assumption Statement","documentation":"### Object\nThe Budget Assumption Statement documents the economic, enrolment, and policy assumptions underlying the budget.\n\n### Condition\nIt is produced as part of the budget planning cycle.\n\n### Consequence\nFinancial advisors use these assumptions to test budget robustness and advise on adjustments. Without this statement, the rationale for budget figures is opaque, and advisors cannot challenge them.","sourceid":"elem-id-991","targetid":"elem-id-1000","specialization":""},{"id":"elem-id-1298070f-9975-4413-991f-7a2cf8529e05","type":"FlowRelationship","name":"Business Continuity Plan","documentation":"### Object\nThis is the institution's business continuity plan for ICT services, carrying service recovery priorities, recovery time objectives, and step-by-step restoration procedures for critical systems.\n\n### Condition\nIt is issued only after business impact analysis and approval by continuity governance. Arrival means the authorised recovery arrangements for the current planning period are in place.\n\n### Consequence\nOn arrival, recovery priorities and restoration procedures are adopted for ICT services, and recovery time objectives drive response targets. While absent, service recovery decisions are made without approved priorities, and restoration work proceeds ad hoc.","sourceid":"elem-id-836","targetid":"elem-id-957","specialization":""},{"id":"id-361f44a1-80c6-49af-8d4d-febf1d912c5e","type":"FlowRelationship","name":"Business Continuity Plan","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-200017","specialization":""},{"id":"elem-id-2bcd3555-bb9f-481b-b2c5-82ef12da52d9","type":"FlowRelationship","name":"Campaign Performance Report","documentation":"### Object\nThe Campaign Performance Report contains reach, engagement, conversion, and cost metrics for each marketing campaign, along with audience breakdowns and channel effectiveness.\n\n### Condition\nIt is generated after a campaign closes or at the end of a reporting period when final performance data is available.\n\n### Consequence\nMarket analysts compare actual outcomes against targets and identify patterns in audience behaviour. Without this report, campaign effectiveness remains unevaluated, and future planning proceeds without evidence.","sourceid":"elem-id-928","targetid":"elem-id-930","specialization":""},{"id":"elem-id-2f138a2b-6240-41f5-8c5f-62a242d4a224","type":"FlowRelationship","name":"Campus Event Notice","documentation":"### Object\nThe Campus Event Notice provides details of upcoming events that may affect dining services, such as large conferences or sports fixtures.\n\n### Condition\nIt is issued when event schedules are confirmed.\n\n### Consequence\nFood and retail management adjusts staffing, supplies, and opening hours for the event. Without this notice, dining outlets are unprepared for demand spikes, causing long queues or stockouts.","sourceid":"elem-id-940","targetid":"elem-id-933","specialization":""},{"id":"elem-id-65c4169b-b39c-45f9-a11d-4c6cb283cd69","type":"FlowRelationship","name":"Campus Incident Report","documentation":"### Object\nThe Campus Incident Report documents a physical security or safety event on campus, such as a theft, assault, or hazardous situation, including location and involved parties.\n\n### Condition\nIt is filed when campus security responds to or is notified of such an event.\n\n### Consequence\nHealth and safety staff review the report to identify trends, update risk assessments, and implement preventive measures. Without this report, recurring safety threats go unaddressed.","sourceid":"elem-id-981","targetid":"elem-id-986","specialization":""},{"id":"elem-id-924b3fea-a6f2-4a2c-96a9-1b81925fc488","type":"FlowRelationship","name":"Capability Blueprint","documentation":"### Object\nThis is a capability blueprint that maps enabling capabilities to intended benefits and outcomes.\n\n### Condition\nIt is issued when architecture validates the capability-benefit relationships. Arrival means the blueprint is available to plan benefit realisation.\n\n### Consequence\nOn arrival, benefit maps are built from the blueprint and each benefit has an owner and measure. While absent, benefit mapping lacks the capability linkages and benefits are not traceable to enabling changes.","sourceid":"elem-id-830","targetid":"elem-id-826","specialization":""},{"id":"elem-id-a57a76ab-1e41-4cb9-8335-61b21a6ba4f1","type":"FlowRelationship","name":"Capability Maps","documentation":"### Object\nThis is a set of capability maps showing the institution's current and required capabilities for delivering strategy.\n\n### Condition\nIt is issued after capability modelling is completed and approved. Arrival means the capability baseline is available to design structures.\n\n### Consequence\nOn arrival, structures and accountabilities are aligned to required capabilities. While absent, organisational design proceeds without a capability baseline and structures are misaligned with strategic needs.","sourceid":"elem-id-830","targetid":"elem-id-828","specialization":""},{"id":"elem-id-7582797e-d972-4084-a5de-7ba723d6f3ea","type":"FlowRelationship","name":"Capital Project Budget Request","documentation":"### Object\nThe Capital Project Budget Request outlines the planned expenditure, timeline, and expected outcomes for a proposed building or infrastructure project.\n\n### Condition\nIt is submitted after project scope and preliminary design are approved.\n\n### Consequence\nBudget holders review the request against available funds and strategic priorities, then approve or reject the allocation. Without this request, no capital funding is reserved, and the project cannot proceed.","sourceid":"elem-id-980","targetid":"elem-id-991","specialization":""},{"id":"id-d023760c-0218-4c99-bbb6-3b480f2d5256","type":"FlowRelationship","name":"Capital Project Budget Request","documentation":"","sourceid":"elem-id-200011","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-d4f7c746-36e2-4271-b830-2673f7e8f409","type":"FlowRelationship","name":"Career Opportunity","documentation":"### Object\nThe list of career-related opportunities, including placements, internships, employer events, and mentoring.\n\n### Condition\nIssued when opportunities are validated by the careers function and made available for student use.\n\n### Consequence\nArrival expands the student's learning plan with employability activities. Absence limits exposure to career development and reduces employment readiness.","sourceid":"elem-id-870","targetid":"elem-id-879","specialization":""},{"id":"elem-id-076f481d-ffbd-4030-8059-efaaf2a8cf1a","type":"FlowRelationship","name":"Case Decision","documentation":"### Object\nThe formal decision on an exceptional factors, misconduct, or appeal case, including outcome, rationale, and any actions required.\n\n### Condition\nIssued when the case panel reaches a decision and the decision is authorised under the relevant procedure.\n\n### Consequence\nArrival updates enrolment status with the decision, applying any suspension, reinstatement, or withdrawal. Absence leaves the student's status unchanged and the case uncapped.","sourceid":"elem-id-866","targetid":"elem-id-862","specialization":""},{"id":"elem-id-2a9b8418-aa52-4d1c-b232-8bee50de75fc","type":"FlowRelationship","name":"Case Decision","documentation":"### Object\nThe formal decision on an exceptional factors, misconduct, or appeal case, including outcome, rationale, and any actions required.\n\n### Condition\nIssued when the case decision is finalised and requires recording in the student's academic record.\n\n### Consequence\nArrival adds the decision to the student's record, enabling correct progression and award outcomes. Absence leaves the record without the decision and may block final classification.","sourceid":"elem-id-866","targetid":"elem-id-863","specialization":""},{"id":"elem-id-ea606e95-6e57-4aa3-9447-1d36b0ac0569","type":"FlowRelationship","name":"Cash Balance","documentation":"### Object\nThe Cash Balance reports the current amount held in the institution's bank accounts and short-term investments.\n\n### Condition\nIt is updated daily from bank statements.\n\n### Consequence\nFinancial reporting includes this balance in the balance sheet and cash flow statement. Without this balance, the institution's liquidity position is unknown, and short-term solvency is at risk.","sourceid":"elem-id-992","targetid":"elem-id-996","specialization":""},{"id":"elem-id-f8c1109e-719d-4bc4-b0a3-b1f4b4851b79","type":"FlowRelationship","name":"Cash Flow Forecast","documentation":"### Object\nThe Cash Flow Forecast projects future cash inflows and outflows for the next 13 weeks or longer.\n\n### Condition\nIt is produced at least monthly using committed and expected transactions.\n\n### Consequence\nBudget management uses the forecast to plan for surpluses or deficits. Without this forecast, budget decisions are made without regard to cash timing, leading to liquidity crises.","sourceid":"elem-id-992","targetid":"elem-id-991","specialization":""},{"id":"elem-id-71878557-9167-4cc6-b9c3-12da98653cec","type":"FlowRelationship","name":"Cash Receipt Forecast","documentation":"### Object\nThe Cash Receipt Forecast predicts the timing and amount of incoming cash from fees, grants, and other sources.\n\n### Condition\nIt is issued based on historical patterns and current debtor information.\n\n### Consequence\nTreasury management uses the forecast to ensure sufficient liquidity for obligations. Without this forecast, cash shortages arise unexpectedly, and the institution may fail to meet payment deadlines.","sourceid":"elem-id-993","targetid":"elem-id-992","specialization":""},{"id":"elem-id-e91f4a27-ba85-4187-beb5-9dc2193fc46a","type":"FlowRelationship","name":"Change Risk Assessments","documentation":"### Object\nThis is a set of risk impact assessments for proposed change initiatives, carrying likelihood, impact, and recommended controls.\n\n### Condition\nIt is issued when a change initiative passes initial screening and risk analysis is completed. Arrival means risk exposure for each change is available for portfolio decisions.\n\n### Consequence\nOn arrival, change initiatives are prioritised with risk exposure visible, and high-risk changes receive mandated controls. While absent, change portfolio decisions are made without risk exposure and high-risk initiatives proceed unmitigated.","sourceid":"elem-id-832","targetid":"elem-id-829","specialization":""},{"id":"elem-id-e12d2cdf-211f-4c35-bed5-cc71f8cbe951","type":"FlowRelationship","name":"Childcare Service Update","documentation":"### Object\nThe Childcare Service Update announces changes to childcare provision, such as new places, fees, or opening hours.\n\n### Condition\nIt is issued when the childcare service is modified.\n\n### Consequence\nInternal communications distributes the update to staff and students so they can plan accordingly. Without this update, users remain unaware of changes and may be unable to arrange childcare.","sourceid":"elem-id-937","targetid":"elem-id-940","specialization":""},{"id":"elem-id-19b7e867-8025-418a-9376-2b2aea1d682b","type":"FlowRelationship","name":"Circulation Report","documentation":"### Object\nThe Circulation Report shows how frequently each resource is borrowed or accessed, indicating demand levels.\n\n### Condition\nIt is generated from circulation logs.\n\n### Consequence\nResource management decides which items to purchase more copies of or to withdraw based on this report. Without this report, the collection does not reflect user demand, and budget is wasted on unused items.","sourceid":"elem-id-962","targetid":"elem-id-963","specialization":""},{"id":"elem-id-3caee891-7ff3-4233-a156-18543469e945","type":"FlowRelationship","name":"Citation Report","documentation":"### Object\nThe report contains citation counts, field-weighted impact, and publication venues for the institution's outputs.\n\n### Condition\nIt is compiled from verified bibliometric sources after the reporting period closes.\n\n### Consequence\nPublication decisions use the report to adjust venue strategy and author support, and without it publication decisions rely on internal judgement alone.","sourceid":"elem-id-901","targetid":"elem-id-900","specialization":""},{"id":"elem-id-1dbca73a-564d-4353-82da-ba992bad1d2a","type":"FlowRelationship","name":"Classroom Feedback","documentation":"### Object\nThe feedback from classroom teaching, including student questions, resource needs, and delivery issues.\n\n### Condition\nIssued when teaching staff report on what worked and what needs were unmet.\n\n### Consequence\nArrival prompts content revisions and resource updates. Absence continues the same delivery problems in future sessions.","sourceid":"elem-id-880","targetid":"elem-id-882","specialization":""},{"id":"elem-id-1335b6c8-7131-46ef-a201-dae2b4ca5f42","type":"FlowRelationship","name":"Classroom Teaching Resources","documentation":"### Object\nThe physical and digital resources required for classroom teaching, including slides, handouts, and equipment lists.\n\n### Condition\nIssued when resources are prepared and aligned to the teaching timetable.\n\n### Consequence\nArrival enables face-to-face sessions to run as planned. Absence forces improvisation and reduces teaching quality.","sourceid":"elem-id-882","targetid":"elem-id-880","specialization":""},{"id":"elem-id-ddf4a617-054c-4089-9954-34ee27e18965","type":"FlowRelationship","name":"Cleaned Dataset","documentation":"### Object\nThe Cleaned Dataset is the result of removing errors, duplicates, and inconsistencies, and applying standard formats.\n\n### Condition\nIt is issued after data quality checks are passed.\n\n### Consequence\nInformation analytics uses the cleaned dataset to produce accurate models and reports. Without this dataset, analyses are based on dirty data and produce unreliable results.","sourceid":"elem-id-971","targetid":"elem-id-972","specialization":""},{"id":"elem-id-8b6475b3-c069-46cb-a042-57ce2a77abf6","type":"FlowRelationship","name":"Collaboration Proposal","documentation":"### Object\nThe proposal outlines a possible collaborative research project, including scope, partner roles, and resource expectations.\n\n### Condition\nIt is drafted when an opportunity has sufficient partner commitment to justify formal consideration and is issued with a named lead for each side.\n\n### Consequence\nFormal approval activity begins on the proposal's terms, and without it collaborative discussions remain informal and unbudgeted.","sourceid":"elem-id-890","targetid":"elem-id-902","specialization":""},{"id":"id-7d5b57eb-a227-473e-9a99-515c7e036566","type":"FlowRelationship","name":"Collaboration Proposal","documentation":"","sourceid":"elem-id-200025","targetid":"elem-id-200023","specialization":""},{"id":"elem-id-b01b41c5-d8b5-4ae0-ad71-9d3fac6976c7","type":"FlowRelationship","name":"Collaboration Requirement","documentation":"### Object\nThe requirement specifies the partner capabilities, access, or co-funding that a programme needs to succeed.\n\n### Condition\nIt is defined as part of programme development when the programme plan identifies a gap that cannot be filled internally.\n\n### Consequence\nPartnership search is guided by the requirement, and without it partnership search has no specification.","sourceid":"elem-id-891","targetid":"elem-id-890","specialization":""},{"id":"elem-id-18b3b5fc-1f65-432e-986a-37ef27bb6857","type":"FlowRelationship","name":"Collaborative Academic Achievement","documentation":"### Object\nThe Collaborative Academic Achievement highlights a successful joint research output or teaching development with another institution.\n\n### Condition\nIt is documented after the collaboration produces a notable result.\n\n### Consequence\nMedia relations promotes the achievement to enhance institutional reputation. Without this achievement notice, the success is not publicised, and the partner's contribution is unrecognised.","sourceid":"elem-id-923","targetid":"elem-id-924","specialization":""},{"id":"elem-id-4273912c-d86f-46a5-b05c-9bf1ba7bb3c6","type":"FlowRelationship","name":"Collected Dataset","documentation":"### Object\nThe Collected Dataset is the raw data gathered from sources such as surveys, sensors, or transactions, before cleaning.\n\n### Condition\nIt is produced after collection methods have been executed.\n\n### Consequence\nData management processes the raw data for quality and structure. Without this dataset, no analysis can begin, and downstream decisions lack input.","sourceid":"elem-id-968","targetid":"elem-id-971","specialization":""},{"id":"elem-id-9cb29654-501a-4ff2-89db-3bab40e88ce8","type":"FlowRelationship","name":"Commercial Activity Report","documentation":"### Object\nA periodic report summarising commercial activities, including volumes, outcomes, contract counts, and compliance-relevant events.\n\n### Condition\nIssued at the close of each reporting period or upon a compliance trigger. Arrival means the activity record is ready for compliance review.\n\n### Consequence\nCompliance obligations are assessed against reported activities. Deviations and breaches are identified from the report. While absent, compliance status cannot be verified for the period.","sourceid":"elem-id-919","targetid":"elem-id-833","specialization":""},{"id":"id-ed365486-2dfc-4732-ab67-4ac50f8303a3","type":"FlowRelationship","name":"Commercial Activity Report","documentation":"","sourceid":"elem-id-20007","targetid":"elem-id-20009","specialization":""},{"id":"id-6df1285d-e084-4ba0-9556-92f1f398cb60","type":"FlowRelationship","name":"Commercial Financials","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-10002","specialization":""},{"id":"id-dd55847a-14d2-4679-9850-12d89b4f7def","type":"FlowRelationship","name":"Commercial Impact Evidence","documentation":"","sourceid":"elem-id-20005","targetid":"elem-id-200023","specialization":""},{"id":"id-bf2b077d-b575-4466-bcc0-3bcd45793208","type":"FlowRelationship","name":"Commercial Opportunity","documentation":"","sourceid":"elem-id-20008","targetid":"elem-id-20006","specialization":""},{"id":"id-28d85230-d665-467e-bb8e-3fcb5b89328b","type":"FlowRelationship","name":"Commercial Reports","documentation":"","sourceid":"elem-id-10001","targetid":"elem-id-10004","specialization":""},{"id":"elem-id-97d9cac4-7636-4843-b674-4b6094fa1f66","type":"FlowRelationship","name":"Commercial Revenue Statement","documentation":"### Object\nA statement of revenue earned and costs incurred from commercial outputs, including invoices raised and payments received.\n\n### Condition\nIssued when outputs are delivered and revenue recognition criteria are met. Arrival means the financial result is ready for consolidation.\n\n### Consequence\nCommercial revenue and costs are included in financial records. Income recognition aligns with delivery. While absent, commercial income is not recorded, and financial statements understate activity.","sourceid":"elem-id-915","targetid":"elem-id-996","specialization":""},{"id":"id-6bb99a41-f217-4f4d-b4d5-41cd4cbe521e","type":"FlowRelationship","name":"Commercial Revenue Statement","documentation":"","sourceid":"elem-id-20005","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-b9d1a8fc-860e-4ead-b129-07f536a189fa","type":"FlowRelationship","name":"Commercialisable Research Output","documentation":"### Object\nA research output with demonstrated commercial potential, including proof of concept, intellectual property status, and market application.\n\n### Condition\nIssued when an output exhibits both research impact and commercial viability. Arrival means the output is ready for commercialisation activities.\n\n### Consequence\nCommercialisation activities, such as licensing or spin-out formation, proceed with this output. While absent, research outputs remain uncommercialised and potential revenue is not pursued.","sourceid":"elem-id-915","targetid":"elem-id-903","specialization":""},{"id":"elem-id-f6816763-dcd6-445c-89e3-fcd2fbd0deec","type":"FlowRelationship","name":"Commercialisation Lead","documentation":"### Object\nThe lead identifies a research outcome, a potential application, and a named external party interested in development.\n\n### Condition\nIt is raised when a relationship interaction confirms commercial interest and the outcome is not already under an existing agreement.\n\n### Consequence\nCommercialisation activity assesses the lead's viability, and without it no commercialisation project is opened for that outcome.","sourceid":"elem-id-902","targetid":"elem-id-903","specialization":""},{"id":"elem-id-be9c7385-ca49-4a0d-9268-d660850cc952","type":"FlowRelationship","name":"Commercialisation Outcome Report","documentation":"### Object\nThe report records the result of a commercialisation project, including license revenues, market entry, or termination.\n\n### Condition\nIt is issued when the commercialisation project closes or reaches a reporting milestone, and it includes the partner's feedback.\n\n### Consequence\nThe engagement history is updated with the outcome, and without it the partner record retains no record of what was achieved.","sourceid":"elem-id-903","targetid":"elem-id-902","specialization":""},{"id":"elem-id-3ce11ccc-59cb-4e93-92c2-a8e0854ce583","type":"FlowRelationship","name":"Commercialisation Proposal","documentation":"### Object\nThe proposal describes a research outcome suitable for commercial development, including its market application, ownership position, and proposed partner type.\n\n### Condition\nIt is issued after an internal evaluation confirms the outcome has protectable value and a realistic route to market, and it is not already committed to another route.\n\n### Consequence\nPartner engagement activity begins against the proposal's defined opportunity, and without it no external partner approach is initiated for that outcome.","sourceid":"elem-id-903","targetid":"elem-id-913","specialization":""},{"id":"id-0d403948-aace-4b9f-9296-b3888025b97b","type":"FlowRelationship","name":"Commercialisation Proposal","documentation":"","sourceid":"elem-id-200023","targetid":"elem-id-20006","specialization":""},{"id":"id-ecc4c755-82b2-41bb-afba-8aeadfc1cc39","type":"FlowRelationship","name":"Commercialisation Proposals","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-10001","specialization":""},{"id":"elem-id-51b424d9-0839-4f99-a582-573a75582870","type":"FlowRelationship","name":"Community Engagement Objective","documentation":"### Object\nThe Community Engagement Objective specifies the local community groups or public outcomes the institution aims to support.\n\n### Condition\nIt is determined by internal stakeholders based on strategic plans.\n\n### Consequence\nPublic relationship teams design programmes to meet these objectives. Without this objective, community activities are disconnected from institutional priorities and impact is reduced.","sourceid":"elem-id-925","targetid":"elem-id-926","specialization":""},{"id":"elem-id-d04db6a2-7dad-4894-b789-436930141729","type":"FlowRelationship","name":"Community Event Highlight","documentation":"### Object\nThe Community Event Highlight describes a successful public engagement event, including attendance and impact.\n\n### Condition\nIt is written after the event concludes.\n\n### Consequence\nMedia relations uses the highlight to generate positive news coverage. Without this highlight, the event's success is not communicated externally, and reputation benefits are missed.","sourceid":"elem-id-926","targetid":"elem-id-924","specialization":""},{"id":"elem-id-1de589fa-063b-417e-8b9d-f36f17a1fdf7","type":"FlowRelationship","name":"Community Feedback Report","documentation":"### Object\nThe Community Feedback Report aggregates comments, complaints, and suggestions from local residents and community groups.\n\n### Condition\nIt is compiled after public events or when feedback is received through channels.\n\n### Consequence\nInternal stakeholders review the report to adjust community strategies and address concerns. Without this report, community sentiment is ignored, and local relationships deteriorate.","sourceid":"elem-id-926","targetid":"elem-id-925","specialization":""},{"id":"id-53dc92c0-6aae-471f-b71f-362d130d1f97","type":"FlowRelationship","name":"Compliance Audit Findings","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-200028","specialization":""},{"id":"elem-id-7c98a56f-03da-43a1-afdf-e5ef95f469c0","type":"FlowRelationship","name":"Compliance Audit Reports","documentation":"### Object\nThis is a set of compliance audit reports recording audit findings, evidence of non-compliance, and recommended corrective actions.\n\n### Condition\nIt is issued after a compliance audit is completed and the findings are verified against regulations. Arrival means audited evidence of current compliance gaps is available.\n\n### Consequence\nOn arrival, non-compliance findings are remediated and the legal risk register is updated with the audited evidence. While absent, non-compliance persists without audited evidence and the legal risk register remains unchanged.","sourceid":"elem-id-833","targetid":"elem-id-977","specialization":""},{"id":"id-77954266-23e8-4eab-b257-58838cca8b15","type":"FlowRelationship","name":"Compliance Reports","documentation":"","sourceid":"elem-id-10003","targetid":"elem-id-10004","specialization":""},{"id":"elem-id-b732ca8f-2a79-4cdb-aede-b1cfc6a7a6e3","type":"FlowRelationship","name":"Compliance Update","documentation":"### Object\nThe Compliance Update communicates new or changed legal and regulatory requirements that affect institutional operations.\n\n### Condition\nIt is issued after the compliance team interprets a new regulation.\n\n### Consequence\nLegal advisory incorporates the update into its advice to other units. Without this update, legal advice may not reflect current law, and the institution remains non-compliant.","sourceid":"elem-id-977","targetid":"elem-id-979","specialization":""},{"id":"elem-id-fc88bf1f-7839-4acf-8f6f-e1fd8965e9cd","type":"FlowRelationship","name":"Confirmed Enrolment","documentation":"### Object\nThe record of a student's confirmed acceptance onto a programme, including personal details, programme, mode, and start date.\n\n### Condition\nIssued when an admitted student has met all conditions, paid any required deposit or completed financial clearance, and the institution has confirmed the place.\n\n### Consequence\nArrival creates the authoritative enrolment and enables status tracking, module selection, and induction. Absence leaves the student without official enrolment and blocks all learning activities.","sourceid":"elem-id-837","targetid":"elem-id-862","specialization":""},{"id":"elem-id-65015bce-5d4a-493a-a1a1-2f422a20b560","type":"FlowRelationship","name":"Confirmed Enrolment","documentation":"### Object\nThe record of a student's confirmed acceptance onto a programme, including personal details, programme, mode, and start date.\n\n### Condition\nIssued when an admitted student has met all conditions and the institution has confirmed the place, ready for module registration.\n\n### Consequence\nArrival allows the student to be registered for modules and placed in teaching groups. Absence leaves the student unable to select modules and without a timetable.","sourceid":"elem-id-837","targetid":"elem-id-838","specialization":""},{"id":"elem-id-b666c5c1-c4f7-41a6-adb5-1d78e32c91d3","type":"FlowRelationship","name":"Confirmed Enrolment","documentation":"### Object\nThe record of a student's confirmed acceptance onto a programme, including personal details, programme, mode, and start date.\n\n### Condition\nIssued when an admitted student has met all conditions and is ready for induction planning.\n\n### Consequence\nArrival places the student on induction lists and schedules pre-arrival tasks. Absence leaves the student absent from induction and unaware of start-of-year requirements.","sourceid":"elem-id-837","targetid":"elem-id-839","specialization":""},{"id":"elem-id-6942e511-2ecb-4b4e-86b6-011799dd0579","type":"FlowRelationship","name":"Content Usage Report","documentation":"### Object\nThe Content Usage Report records how often and in what context licensed content is accessed or distributed.\n\n### Condition\nIt is generated periodically from access logs.\n\n### Consequence\nCopyright management verifies that usage remains within licence terms and renews licences as needed. Without this report, usage may exceed permitted limits without detection, causing legal exposure.","sourceid":"elem-id-974","targetid":"elem-id-969","specialization":""},{"id":"elem-id-435c1c32-2f57-48c3-a728-cf0a61f50dd8","type":"FlowRelationship","name":"Contingency Plan","documentation":"### Object\nA plan specifying alternative actions, responsibilities, and resource allocations to be enacted if a defined risk materialises.\n\n### Condition\nIssued after risk assessment identifies a material threat and a viable response is approved. Arrival means a tested response is available for the risk.\n\n### Consequence\nContinuity arrangements incorporate the planned response. Recovery actions are defined for the risk scenario. While absent, the risk scenario has no agreed recovery procedure.","sourceid":"elem-id-920","targetid":"elem-id-836","specialization":""},{"id":"id-974de5f4-7cc9-4d8f-b974-39cba55c1e10","type":"FlowRelationship","name":"Continuity Plans","documentation":"","sourceid":"elem-id-10004","targetid":"elem-id-10002","specialization":""},{"id":"id-10d3601e-1450-496e-a227-37d8f4f3cd5f","type":"FlowRelationship","name":"Contract Agreement","documentation":"","sourceid":"elem-id-200017","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-7a23fadb-9dc8-4a30-94c1-da648c97f6ed","type":"FlowRelationship","name":"Contract Issue Alert","documentation":"### Object\nA notification identifying a contract breach, performance shortfall, or emerging issue, with supporting evidence and severity.\n\n### Condition\nIssued when performance falls below contractual thresholds or a breach is detected. Arrival means an issue requiring resolution is formally raised.\n\n### Consequence\nIssue records are opened and assigned for resolution. The affected contract is flagged for investigation. While absent, breaches and shortfalls continue without formal tracking.","sourceid":"elem-id-918","targetid":"elem-id-916","specialization":""},{"id":"id-ba9eaaea-f121-402e-8455-1e66d43ab7f8","type":"FlowRelationship","name":"Contract Issue Alert","documentation":"","sourceid":"elem-id-20007","targetid":"elem-id-20005","specialization":""},{"id":"id-95d4de0a-9b07-45ab-968b-4219793ef42c","type":"FlowRelationship","name":"Contract Performance Evidence","documentation":"","sourceid":"elem-id-20007","targetid":"elem-id-200017","specialization":""},{"id":"elem-id-26941a44-c9ad-49cf-a488-4e5134a99fb9","type":"FlowRelationship","name":"Contract Performance Report","documentation":"### Object\nA report detailing performance against contract terms, including service level attainment, delivery milestones, and financial metrics.\n\n### Condition\nIssued after performance data is collected and validated for the review period. Arrival means the contract's current performance is documented.\n\n### Consequence\nContract records are updated with current performance. Renewal, amendment, or termination decisions use this report. While absent, contract status is outdated and decisions lack latest performance evidence.","sourceid":"elem-id-918","targetid":"elem-id-976","specialization":""},{"id":"elem-id-71ef48aa-9a57-4bf3-928c-94480c310db0","type":"FlowRelationship","name":"Contract Performance Scorecard","documentation":"### Object\nA scorecard summarising key contract performance indicators against targets, with trend and variance analysis.\n\n### Condition\nIssued after performance metrics are calculated and reviewed. Arrival means the scorecard is ready for aggregation.\n\n### Consequence\nContract performance results are included in periodic activity reporting. Trends and variances inform management review. While absent, activity reports lack contract performance content.","sourceid":"elem-id-918","targetid":"elem-id-919","specialization":""},{"id":"elem-id-8e402bba-e6ab-4a5c-91ce-295b9e6dfc75","type":"FlowRelationship","name":"Contractual Compliance Report","documentation":"### Object\nThe Contractual Compliance Report details whether parties are meeting their obligations under active contracts.\n\n### Condition\nIt is generated periodically by contract management.\n\n### Consequence\nLegal compliance uses the report to identify breaches and take corrective action. Without this report, non-compliance by either party goes unnoticed until it causes significant harm.","sourceid":"elem-id-976","targetid":"elem-id-977","specialization":""},{"id":"elem-id-12e8ec3f-4459-46c5-8cad-958ce571ff35","type":"FlowRelationship","name":"Contractual Dispute Document","documentation":"### Object\nThe Contractual Dispute Document assembles the contract, correspondence, and claims related to a disagreement between parties.\n\n### Condition\nIt is compiled when a dispute is formally raised.\n\n### Consequence\nDispute resolution reviews the document to understand the facts and prepare a response. Without this document, the dispute lacks evidence and cannot be properly adjudicated.","sourceid":"elem-id-976","targetid":"elem-id-978","specialization":""},{"id":"elem-id-070852e6-0b9b-461e-91dd-f6c4d835408a","type":"FlowRelationship","name":"Copyright Licence","documentation":"### Object\nThe Copyright Licence grants permission to use third-party material for a specific purpose, with associated terms and restrictions.\n\n### Condition\nIt is issued after copyright clearance is obtained.\n\n### Consequence\nEnterprise content management attaches the licence to the content so usage is compliant. Without this licence, the material cannot legally be used, and infringement risk is high.","sourceid":"elem-id-969","targetid":"elem-id-974","specialization":""},{"id":"id-498b156c-2199-4b53-8d3c-b10e83a0be4b","type":"FlowRelationship","name":"Course Content Package","documentation":"","sourceid":"elem-id-200037","targetid":"elem-id-200015","specialization":""},{"id":"id-9871239a-d33f-4f7b-8656-10384c987401","type":"FlowRelationship","name":"Course Materials","documentation":"","sourceid":"elem-id-10005","targetid":"elem-id-10002","specialization":""},{"id":"elem-id-e174f84a-2055-490d-b497-b9d3db0f8083","type":"FlowRelationship","name":"Course Selection Guidance","documentation":"### Object\nThe guidance provided to a student about which modules or courses to select, based on programme requirements and personal goals.\n\n### Condition\nIssued when an adviser has reviewed the student's progress and goals and produced tailored advice.\n\n### Consequence\nArrival informs the student's personal learning plan and next module choices. Absence leaves the student without direction and may cause enrolment in unsuitable modules.","sourceid":"elem-id-872","targetid":"elem-id-879","specialization":""},{"id":"elem-id-6f6d929d-0438-4ac1-8a11-a80bab6472ad","type":"FlowRelationship","name":"Curriculum Blueprint","documentation":"### Object\nThe design specification for a programme or module, including learning outcomes, structure, credit weighting, assessment strategy, and resource requirements.\n\n### Condition\nIssued when curriculum design is approved by the relevant academic body and meets internal and professional body requirements.\n\n### Consequence\nArrival initiates development of teaching materials, assessment items, and resource acquisition. Absence leaves the intended learning design without content or delivery support.","sourceid":"elem-id-844","targetid":"elem-id-848","specialization":""},{"id":"elem-id-fee869f0-f0a0-47a2-aad3-e9b1d3522bff","type":"FlowRelationship","name":"Curriculum Blueprint","documentation":"","sourceid":"elem-id-844","targetid":"elem-id-843","specialization":""},{"id":"elem-id-c274347c-895d-416b-bf41-ff31ddc20825","type":"FlowRelationship","name":"Curriculum Blueprint","documentation":"","sourceid":"elem-id-844","targetid":"elem-id-845","specialization":""},{"id":"elem-id-0c448d93-c9a0-4d52-98b7-a6a66bddbddb","type":"FlowRelationship","name":"Curriculum Materials","documentation":"### Object\nThe developed learning resources, reading lists, assessment tasks, and supporting media for a module or programme.\n\n### Condition\nIssued when content has been authored, reviewed against the curriculum blueprint, and approved for use in teaching.\n\n### Consequence\nArrival makes the materials ready for publication to students and delivery channels. Absence leaves teaching without core learning content and causes delay in module delivery.","sourceid":"elem-id-848","targetid":"elem-id-882","specialization":""},{"id":"id-d25049fc-c83e-46b5-ac07-e8a38ff960f9","type":"FlowRelationship","name":"Curriculum Specification","documentation":"","sourceid":"elem-id-200010","targetid":"elem-id-200037","specialization":""},{"id":"elem-id-c5e783bb-fce6-4146-9515-78691f53a94f","type":"FlowRelationship","name":"Damage Repair Request","documentation":"### Object\nThe Damage Repair Request identifies specific damage to furniture, fixtures, or building fabric requiring remedial work.\n\n### Condition\nIt is raised after a post-occupancy inspection or departure reports damage above normal wear.\n\n### Consequence\nFacilities maintenance schedules the necessary repairs and charges the responsible party if applicable. Without this request, damage is left unrepaired and the room cannot be made ready for the next occupant.","sourceid":"elem-id-1004","targetid":"elem-id-1002","specialization":""},{"id":"elem-id-7ac71810-b755-4542-afed-d2b118d2d92e","type":"FlowRelationship","name":"Data Asset Inventory","documentation":"### Object\nThe Data Asset Inventory lists all data stores, their owners, and the data they contain.\n\n### Condition\nIt is maintained by data management as new data stores are created.\n\n### Consequence\nSecurity teams use this inventory to identify high-risk assets and monitor for unauthorised access. Without this inventory, data stores are unknown and unmonitored, leaving breaches undetected.","sourceid":"elem-id-971","targetid":"elem-id-967","specialization":""},{"id":"elem-id-d3d11833-f5bb-4bc0-b353-4d9a0c7e5af0","type":"FlowRelationship","name":"Dataset Access Grant","documentation":"### Object\nThe grant is the authorisation record that lets a research project use a curated dataset under specified conditions.\n\n### Condition\nIt is issued after the requesting project's data management plan is approved and any access fees or ethics conditions are met.\n\n### Consequence\nResearch production receives the dataset under the grant's terms, and without it the project cannot access the data needed for the stated analysis.","sourceid":"elem-id-896","targetid":"elem-id-895","specialization":""},{"id":"elem-id-258ca31c-54e7-4449-822c-44a65af4125c","type":"FlowRelationship","name":"Dataset Metadata Record","documentation":"### Object\nThis record holds the descriptive, technical, and access metadata required for a dataset to be discovered, cited, and reused.\n\n### Condition\nIt is produced when a dataset is deposited and its metadata fields pass validation against the institutional schema. Its arrival means the dataset is ready for external reporting.\n\n### Consequence\nDataset details are included in research output reports, and without the metadata record the dataset exists but is invisible to funders and assessment exercises.","sourceid":"elem-id-896","targetid":"elem-id-901","specialization":""},{"id":"id-8960431e-448f-4d4d-9702-80c0fbffcba7","type":"FlowRelationship","name":"Dataset Record","documentation":"","sourceid":"elem-id-200021","targetid":"elem-id-200026","specialization":""},{"id":"elem-id-7efeec2d-3d4d-40fa-b1d3-c0ad82eea7a6","type":"FlowRelationship","name":"Deliverable Performance Report","documentation":"### Object\nA report tracking the performance of each deliverable against planned time, cost, and quality criteria.\n\n### Condition\nIssued after deliverable performance is reviewed in the reporting period. Arrival means performance deviations are documented.\n\n### Consequence\nIssues arising from deliverable shortfalls are identified and recorded. Remedial actions are initiated. While absent, deliverable issues remain undetected and unaddressed.","sourceid":"elem-id-915","targetid":"elem-id-916","specialization":""},{"id":"elem-id-7cf2c8ea-0405-4f4b-8ccd-8a086a19daec","type":"FlowRelationship","name":"Departure Schedule","documentation":"### Object\nThe Departure Schedule lists the dates and rooms from which occupants will vacate, including any expected extensions or early departures.\n\n### Condition\nIt is issued when an accommodation allocation is finalised and departure dates are confirmed.\n\n### Consequence\nTurnaround teams plan cleaning, maintenance, and re-letting for each room in sequence. Without this schedule, rooms are not prepared on time, and vacant periods increase.","sourceid":"elem-id-1001","targetid":"elem-id-1004","specialization":""},{"id":"elem-id-6d09b6c9-5de8-4231-9ba5-8ad403bf7e19","type":"FlowRelationship","name":"Depreciation Schedule","documentation":"### Object\nThe Depreciation Schedule records the periodic depreciation charge for each asset class according to accounting policy.\n\n### Condition\nIt is prepared at period close after asset valuations are updated.\n\n### Consequence\nFinancial reporting incorporates depreciation into the income statement and balance sheet. Without this schedule, the financial statements overstate asset values and profit.","sourceid":"elem-id-995","targetid":"elem-id-996","specialization":""},{"id":"elem-id-000bb71b-c2c9-4f1d-8092-74873a22f160","type":"FlowRelationship","name":"Development Plan","documentation":"","sourceid":"elem-id-949","targetid":"elem-id-847","specialization":""},{"id":"id-e45a6b54-fa88-4c53-876e-ba2ad5d38c1c","type":"FlowRelationship","name":"Development Plan","documentation":"","sourceid":"elem-id-200014","targetid":"elem-id-200010","specialization":""},{"id":"elem-id-c256e821-392a-4fe9-b243-6e9fba6e62c6","type":"FlowRelationship","name":"Device Inventory Record","documentation":"### Object\nThe Device Inventory Record lists all end-user computing devices, their specifications, assigned users, and software versions.\n\n### Condition\nIt is updated when devices are deployed, changed, or retired.\n\n### Consequence\nICT service support uses the inventory to provide accurate support and plan refreshes. Without this record, devices are unmanaged, and support cannot target specific hardware.","sourceid":"elem-id-961","targetid":"elem-id-957","specialization":""},{"id":"elem-id-2da6850f-971d-49fb-bf10-3e847d1f14c2","type":"FlowRelationship","name":"Digital Communication Template","documentation":"### Object\nThe Digital Communication Template provides a pre-approved layout and branding for internal or external digital messages.\n\n### Condition\nIt is created after communications standards are approved.\n\n### Consequence\nEnd user computing applies the template across devices and platforms for consistent messaging. Without this template, each message has inconsistent branding and formatting errors.","sourceid":"elem-id-958","targetid":"elem-id-961","specialization":""},{"id":"elem-id-7dcf1109-9641-4fad-b672-53930e82a18a","type":"FlowRelationship","name":"Digital Course Update","documentation":"### Object\nThe set of changes or newly published online course materials, announcements, and delivery instructions.\n\n### Condition\nIssued when online content is updated or a new section is released within the online teaching environment.\n\n### Consequence\nArrival triggers communication to enrolled students about what has changed and how to access it. Absence leaves students unaware of new content and reduces engagement.","sourceid":"elem-id-881","targetid":"elem-id-958","specialization":""},{"id":"elem-id-dae360e0-30ca-4c70-b757-86dc0e741dd0","type":"FlowRelationship","name":"Digital Learning Materials","documentation":"### Object\nThe packaged set of online learning materials, including text, video, quizzes, and interactive content.\n\n### Condition\nIssued when content has been approved and published within the learning platform.\n\n### Consequence\nArrival makes non-presence teaching possible and gives students access to structured learning. Absence leaves the online course empty.","sourceid":"elem-id-882","targetid":"elem-id-881","specialization":""},{"id":"elem-id-fa4c73d5-c706-4302-983d-3316d701fa5f","type":"FlowRelationship","name":"Dining Service Announcement","documentation":"### Object\nThe Dining Service Announcement informs campus of special menus, closures, or new offerings at dining venues.\n\n### Condition\nIt is issued when dining services change or have news.\n\n### Consequence\nInternal communications relays the announcement to the campus community. Without this announcement, users are unaware and may be disappointed or miss events.","sourceid":"elem-id-933","targetid":"elem-id-940","specialization":""},{"id":"elem-id-33b23d72-cd11-4624-b4d3-4476cc268184","type":"FlowRelationship","name":"Dispute Outcome","documentation":"### Object\nThe Dispute Outcome records the final resolution of a legal dispute, including settlement terms or court judgment.\n\n### Condition\nIt is issued after the dispute is resolved.\n\n### Consequence\nLegal advisory updates precedents and informs future contract drafting to avoid similar disputes. Without this outcome, lessons are not learned, and the same contractual mistakes recur.","sourceid":"elem-id-978","targetid":"elem-id-979","specialization":""},{"id":"elem-id-f2651736-5429-491c-8baf-db36e712be49","type":"FlowRelationship","name":"Donation Lead","documentation":"### Object\nA notification of an individual who expressed interest in donating at an event or through a campaign response.\n\n### Condition\nIssued when an event or campaign generates a specific expression of giving intent or a request for follow-up.\n\n### Consequence\nArrival creates a new benefactor prospect and triggers acknowledgement and cultivation. Absence leaves the expressed interest without follow-up and loses potential gift.","sourceid":"elem-id-856","targetid":"elem-id-857","specialization":""},{"id":"elem-id-b3b6d3f4-4804-4297-a200-f7c177351bfe","type":"FlowRelationship","name":"Donor History","documentation":"### Object\nThe record of a benefactor's gift amounts, dates, designations, and stewardship interactions.\n\n### Condition\nIssued when a donation is recorded or when the alumni relationship record requires updated donor status information.\n\n### Consequence\nArrival enables accurate relationship context and tailored future engagement. Absence risks inappropriate solicitation and weak stewardship.","sourceid":"elem-id-857","targetid":"elem-id-855","specialization":""},{"id":"elem-id-744993f4-5234-4dc2-a8ac-c84ae9622e08","type":"FlowRelationship","name":"Donor Recognition Brief","documentation":"### Object\nThe set of stewardship and recognition requirements for a donor, including naming rights, event invitations, and reporting expectations.\n\n### Condition\nIssued when a gift agreement is finalised and recognition terms are specified.\n\n### Consequence\nArrival schedules recognition activities and updates event invitations. Absence risks failure to meet donor expectations and damages the relationship.","sourceid":"elem-id-857","targetid":"elem-id-856","specialization":""},{"id":"elem-id-f07a4eb1-87e0-463c-9cf9-d4363cb3c157","type":"FlowRelationship","name":"Draft Strategic Plans","documentation":"### Object\nThis is a draft strategic plan document with proposed goals, objectives, and resource implications.\n\n### Condition\nIt is issued after strategic options are evaluated and a draft is produced. Arrival means the proposed plan is available for review and adoption.\n\n### Consequence\nOn arrival, the strategic plan is reviewed, amended, and prepared for final approval. While absent, the institution has no consolidated strategic plan and planning remains fragmented.","sourceid":"elem-id-823","targetid":"elem-id-821","specialization":""},{"id":"elem-id-57bf7283-bc2a-4c24-a8e7-fddb05340a6e","type":"FlowRelationship","name":"Eligible Graduate Register","documentation":"### Object\nThe list of students who have met all award requirements and are eligible to attend a graduation ceremony.\n\n### Condition\nIssued when award outcomes are confirmed, debts are cleared, and any progression or appeal holds are resolved.\n\n### Consequence\nArrival triggers ceremony capacity planning, ticket allocation, and invitation generation. Absence prevents ceremony participation and delays award presentation.","sourceid":"elem-id-861","targetid":"elem-id-858","specialization":""},{"id":"elem-id-06406b74-15c3-4da6-a3ee-756be89bc9ee","type":"FlowRelationship","name":"Emergency Response Plan","documentation":"### Object\nThis is the institution's emergency response plan for physical campus incidents, carrying evacuation protocols, lockdown triggers, and coordination roles with external emergency services.\n\n### Condition\nIt is issued when emergency scenarios are reviewed and approved by continuity governance. Arrival means current authorised response procedures are available for physical incident coordination.\n\n### Consequence\nOn arrival, physical incident response follows the plan's evacuation protocols and lockdown triggers, and coordination with external emergency services uses predefined handoff points. While absent, response to an incident is unscripted and coordination with external services has no predetermined handoff.","sourceid":"elem-id-836","targetid":"elem-id-981","specialization":""},{"id":"id-5b12ba06-5d79-41bb-8336-c0cdaf86b8f7","type":"FlowRelationship","name":"Emergency Response Plan","documentation":"","sourceid":"elem-id-20009","targetid":"elem-id-200011","specialization":""},{"id":"elem-id-694ffcb7-95fb-4c27-af79-62d58023727d","type":"FlowRelationship","name":"Engagement Alert","documentation":"### Object\nThe alert notifying a personal tutor of a student's low attendance or engagement.\n\n### Condition\nIssued when engagement monitoring detects a student below a defined threshold.\n\n### Consequence\nArrival prompts tutor contact and early intervention. Absence allows disengagement to continue undetected.","sourceid":"elem-id-874","targetid":"elem-id-876","specialization":""},{"id":"elem-id-867e94e9-1081-450a-aa41-428790e2ab48","type":"FlowRelationship","name":"Engagement Feedback","documentation":"### Object\nThe feedback from prospective student engagement, including event attendance, enquiry themes, and channel effectiveness.\n\n### Condition\nIssued when engagement activity is recorded and the feedback is collated for the recruitment team.\n\n### Consequence\nArrival adjusts recruitment campaigns and messaging. Absence leaves recruitment strategy without observed response data.","sourceid":"elem-id-851","targetid":"elem-id-853","specialization":""},{"id":"elem-id-7a1825fd-3b9f-412a-abd0-fec610044062","type":"FlowRelationship","name":"Engagement Insight","documentation":"### Object\nThe insight derived from international prospect engagement, including regional preferences, question patterns, and conversion indicators.\n\n### Condition\nIssued when international engagement data is analysed and summarised for recruitment planning.\n\n### Consequence\nArrival refines market-specific recruitment tactics. Absence leaves international strategy reliant on assumptions.","sourceid":"elem-id-851","targetid":"elem-id-852","specialization":""},{"id":"id-8ea28171-9853-43d6-a0fe-019591405cf6","type":"FlowRelationship","name":"Enrolment Confirmation","documentation":"","sourceid":"elem-id-200034","targetid":"elem-id-200029","specialization":""},{"id":"elem-id-e0acff61-c8ee-4f88-91ed-4c1f00044c24","type":"FlowRelationship","name":"Enrolment Status","documentation":"### Object\nThe current record of a student's enrolment state on a programme, including status values such as enrolled, suspended, withdrawn, or intercalating.\n\n### Condition\nIssued whenever a change to a student's enrolment status is authorised, or on request where the current status must be confirmed.\n\n### Consequence\nArrival determines which students are eligible for assessment, funding, and learning access. Absence leaves the system without a definitive list of active learners.","sourceid":"elem-id-862","targetid":"elem-id-887","specialization":""},{"id":"elem-id-ca870a37-e296-4c99-b638-670d5fe9b43c","type":"FlowRelationship","name":"Enrolment Status","documentation":"### Object\nThe current record of a student's enrolment state on a programme, including status values such as enrolled, suspended, withdrawn, or intercalating.\n\n### Condition\nIssued when an enrolment status change is authorised and requires recording on the student's official record.\n\n### Consequence\nArrival updates the student record with the official status, ensuring consistency across systems. Absence leaves the official record out of date and causes conflicting views of student standing.","sourceid":"elem-id-862","targetid":"elem-id-863","specialization":""},{"id":"elem-id-66d3bb57-cd26-4e69-90d6-b9030f33e0ab","type":"FlowRelationship","name":"Enrolment Status","documentation":"### Object\nThe current record of a student's enrolment state on a programme, including status values such as enrolled, suspended, withdrawn, or intercalating.\n\n### Condition\nIssued when a change in status affects fee liability, funding eligibility, or payment obligations.\n\n### Consequence\nArrival triggers reassessment of tuition charges and funding. Absence leaves financial administration applying outdated status and creating incorrect bills.","sourceid":"elem-id-862","targetid":"elem-id-867","specialization":""},{"id":"id-3520ca74-3958-442f-b97e-37a4be7b42bf","type":"FlowRelationship","name":"Enrolment Status","documentation":"","sourceid":"elem-id-200029","targetid":"elem-id-200031","specialization":""},{"id":"elem-id-db1fa91b-03b2-4647-a4a7-bb99756546ee","type":"FlowRelationship","name":"Environmental Hazard Report","documentation":"### Object\nThe Environmental Hazard Report identifies chemical, biological, or physical hazards in the environment, such as spills, waste, or poor air quality.\n\n### Condition\nIt is filed when environmental monitoring or incident reporting reveals a hazard.\n\n### Consequence\nHealth and safety investigates the hazard, orders containment or cleanup, and updates risk registers. Without this report, the hazard remains uncontrolled, exposing staff and students to harm.","sourceid":"elem-id-984","targetid":"elem-id-986","specialization":""},{"id":"elem-id-8eb5b445-3c22-4354-afbe-9aeda0f8e62d","type":"FlowRelationship","name":"Evaluated Research Opportunity","documentation":"### Object\nThe opportunity carries the scoring against institutional criteria, the risk assessment, and the recommended level of investment.\n\n### Condition\nIt is issued when the opportunity analysis is complete and the scoring model has produced a final rank.\n\n### Consequence\nPrioritisation activity compares evaluated opportunities on the same scale, and without it opportunities are assessed anecdotally.","sourceid":"elem-id-888","targetid":"elem-id-889","specialization":""},{"id":"elem-id-fa607ad1-5253-4dc9-94b5-98bb78c6eff2","type":"FlowRelationship","name":"Event Attendance","documentation":"### Object\nThe record of which alumni and guests attended an event, plus any responses or feedback collected.\n\n### Condition\nIssued when the event concludes and attendance is recorded or self-reported.\n\n### Consequence\nArrival updates the alumni relationship record with engagement history. Absence leaves the relationship record incomplete and underestimates engagement.","sourceid":"elem-id-856","targetid":"elem-id-855","specialization":""},{"id":"elem-id-219bf503-d52e-4df7-9305-6773e7551745","type":"FlowRelationship","name":"Event Booking Confirmation","documentation":"### Object\nThe Event Booking Confirmation confirms that a venue has been reserved for a specific event, with dates, times, and assigned room.\n\n### Condition\nIt is issued after the booking request is approved and the venue is assigned.\n\n### Consequence\nVenue management receives this confirmation to finalise setup. Without this confirmation, the booking is not guaranteed, and the event may be double-booked.","sourceid":"elem-id-940","targetid":"elem-id-936","specialization":""},{"id":"id-245db329-681c-4f69-bf42-15a8730399b4","type":"FlowRelationship","name":"Event Booking Request","documentation":"","sourceid":"elem-id-200019","targetid":"elem-id-200036","specialization":""},{"id":"elem-id-782dc520-004e-4a5e-93ef-d56ef345b452","type":"FlowRelationship","name":"Event Catering Requirement","documentation":"### Object\nThe Event Catering Requirement specifies the number of guests, dietary needs, service style, and timings for an event.\n\n### Condition\nIt is provided after venue booking is confirmed.\n\n### Consequence\nFood and retail management prepares the catering order and schedules staff. Without this requirement, catering is not arranged, and the event lacks food service.","sourceid":"elem-id-936","targetid":"elem-id-933","specialization":""},{"id":"elem-id-aa98898a-a489-4886-ad58-7e8469e89b39","type":"FlowRelationship","name":"Executed Contract","documentation":"### Object\nA legally binding agreement signed by both parties, containing scope, obligations, service levels, pricing, milestones, and termination clauses.\n\n### Condition\nIssued when both parties have signed and any conditions precedent are met. Arrival means the contractual terms are active and enforceable.\n\n### Consequence\nMonitoring against contractual obligations begins. Performance baselines and delivery expectations are established. While absent, no binding reference exists for performance, and disputes over scope or payment have no contractual basis.","sourceid":"elem-id-913","targetid":"elem-id-918","specialization":""},{"id":"elem-id-5095ed6f-49cf-48c0-b594-5250f58d8284","type":"FlowRelationship","name":"Exit Issue Trigger","documentation":"### Object\nA trigger flagging a new or resurfaced issue discovered during exit activities, with description and urgency.\n\n### Condition\nIssued when exit activity reveals an issue requiring active management. Arrival means a new issue is raised for tracking.\n\n### Consequence\nIssue records are created and resolution efforts begin. The exit timeline is reassessed. While absent, exit-related issues go untracked and closure proceeds without addressing them.","sourceid":"elem-id-917","targetid":"elem-id-916","specialization":""},{"id":"elem-id-69d9dfef-78c3-44b1-9633-822b1818d13d","type":"FlowRelationship","name":"Exit Report","documentation":"### Object\nA report summarising the outcome of a commercial activity at closure, including deliverables completed, issues resolved, and lessons learned.\n\n### Condition\nIssued when all closure activities are complete and the activity is formally exited. Arrival means the closure evidence is ready for reporting.\n\n### Consequence\nClosure outcomes and lessons are aggregated into periodic reporting. Historical performance is available for future activities. While absent, closure metrics and lessons are missing from reports.","sourceid":"elem-id-917","targetid":"elem-id-919","specialization":""},{"id":"id-9b742b28-9e2a-46a8-9b92-1a129c7aa024","type":"FlowRelationship","name":"Exit Report","documentation":"","sourceid":"elem-id-20005","targetid":"elem-id-20007","specialization":""},{"id":"elem-id-339f355d-997c-46b0-95be-d6b287153b6e","type":"FlowRelationship","name":"Expenditure Transaction Record","documentation":"### Object\nThe Expenditure Transaction Record is the detailed journal entry for a payment or accrual, including supplier, amount, and account codes.\n\n### Condition\nIt is created when an expenditure event is processed.\n\n### Consequence\nFinancial reporting consolidates these records into the general ledger. Without this record, expenditure is not captured in the financial system, and accounts are understated.","sourceid":"elem-id-998","targetid":"elem-id-996","specialization":""},{"id":"elem-id-fab40a62-6522-441b-87a9-8b5b53078030","type":"FlowRelationship","name":"External Property Incident Report","documentation":"### Object\nThe External Property Incident Report documents an incident at a private-sector student property, such as a break-in, fire, or major repair emergency.\n\n### Condition\nIt is filed after the incident is reported by the tenant or landlord.\n\n### Consequence\nEmergency response teams coordinate with the landlord and local services to protect tenants and mitigate damage. Without this report, the incident receives no institutional response, and tenants are left unsupported.","sourceid":"elem-id-1005","targetid":"elem-id-1003","specialization":""},{"id":"elem-id-a61accd3-afca-4899-9999-ac95f00b7ef4","type":"FlowRelationship","name":"Facility Availability Notice","documentation":"### Object\nThe Facility Availability Notice announces open hours, closures, or new facility openings for sports and recreation venues.\n\n### Condition\nIt is issued when the availability changes.\n\n### Consequence\nInternal communications informs the community so they can plan use. Without this notice, users go to closed facilities or miss new opportunities.","sourceid":"elem-id-935","targetid":"elem-id-940","specialization":""},{"id":"elem-id-1157f12f-850b-4a09-a6a8-c3489fc5078d","type":"FlowRelationship","name":"Facility Downtime Schedule","documentation":"### Object\nThe Facility Downtime Schedule specifies when buildings, rooms, or equipment will be unavailable due to planned maintenance or repairs.\n\n### Condition\nIt is issued after maintenance schedules are finalised.\n\n### Consequence\nSpace utilisation systems block those spaces from booking during the downtime. Without this schedule, rooms are double-booked, and staff arrive to find facilities unusable.","sourceid":"elem-id-983","targetid":"elem-id-982","specialization":""},{"id":"elem-id-34ce3398-3ded-44b9-9700-e2a127df4844","type":"FlowRelationship","name":"Faith Community Event Notice","documentation":"### Object\nThe Faith Community Event Notice announces religious holidays, services, or events to the campus community.\n\n### Condition\nIt is issued when the religious support office schedules an event.\n\n### Consequence\nReligious support receives the notice to promote it through their channels. Without this notice, the event is not widely known, and attendance is low.","sourceid":"elem-id-940","targetid":"elem-id-934","specialization":""},{"id":"elem-id-46bf9be5-d41c-4f92-90eb-0ab80ff92f52","type":"FlowRelationship","name":"Feedback Channel Promotion","documentation":"### Object\nThe Feedback Channel Promotion encourages staff and students to submit complaints or compliments through the official channels.\n\n### Condition\nIt is created when the institution wants to increase feedback volume.\n\n### Consequence\nComplaint and compliment management receives a higher volume of feedback, enabling better service improvement. Without this promotion, feedback remains low, and service issues go unreported.","sourceid":"elem-id-940","targetid":"elem-id-941","specialization":""},{"id":"elem-id-4f06bfc6-67e4-47e0-b91b-716f1b27c08b","type":"FlowRelationship","name":"Final Deliverable Report","documentation":"### Object\nA report confirming that all contractual deliverables have been completed, accepted, and meet specifications.\n\n### Condition\nIssued when the final deliverable is verified and accepted. Arrival means the delivery phase is complete.\n\n### Consequence\nCompletion is confirmed and formal closure activities are initiated. While absent, closure is blocked pending confirmation of deliverable completion and acceptance.","sourceid":"elem-id-915","targetid":"elem-id-917","specialization":""},{"id":"elem-id-7abb4aad-5803-4812-a4a0-b91ddadf6e9a","type":"FlowRelationship","name":"Financial Clearance","documentation":"### Object\nThe statement that a student has no outstanding financial obligations that would block enrolment or progression.\n\n### Condition\nIssued when all tuition, accommodation, and other institutional debts are paid or an approved payment plan is in place.\n\n### Consequence\nArrival lifts enrolment and progression blocks and confirms the student's good standing. Absence prevents enrolment confirmation and may suspend study.","sourceid":"elem-id-867","targetid":"elem-id-862","specialization":""},{"id":"elem-id-cd5b4109-1949-44e5-82fb-2dc2c15ba18d","type":"FlowRelationship","name":"Financial Hardship Flag","documentation":"### Object\nThe indicator that a student is experiencing financial hardship, based on advice session outcomes.\n\n### Condition\nIssued when financial advice identifies hardship and the student consents to sharing with wellbeing services.\n\n### Consequence\nArrival connects financial and wellbeing support. Absence leaves financial stress unaddressed and affects mental health.","sourceid":"elem-id-873","targetid":"elem-id-877","specialization":""},{"id":"elem-id-e036e913-e5f2-442b-af9e-85cdf57540b4","type":"FlowRelationship","name":"Financial Performance Report","documentation":"### Object\nA report containing revenue, costs, margins, and variances for commercial activities over the reporting period.\n\n### Condition\nIssued after financial data for the period is reconciled and approved. Arrival means the performance figures are ready for consolidation.\n\n### Consequence\nCommercial financial results are consolidated into institutional financial statements. Revenue and cost positions are reflected accurately. While absent, financial statements understate commercial income and expenses.","sourceid":"elem-id-919","targetid":"elem-id-996","specialization":""},{"id":"id-8ada5a7a-5f29-4cff-8a7e-050a537b5639","type":"FlowRelationship","name":"Financial Performance Report","documentation":"","sourceid":"elem-id-20007","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-9321906d-8442-49d0-bcd2-3e8b76a58f73","type":"FlowRelationship","name":"Food Service Feedback Report","documentation":"### Object\nThe Food Service Feedback Report summarises complaints and compliments about dining outlets, including specific issues and satisfaction scores.\n\n### Condition\nIt is compiled after feedback is collected through various channels.\n\n### Consequence\nFood and retail management reviews the report to improve menu, service, or facilities. Without this report, repeated issues remain unaddressed, and customer satisfaction declines.","sourceid":"elem-id-941","targetid":"elem-id-933","specialization":""},{"id":"id-1fd37c24-4098-4274-99ca-9d313b8fb6a4","type":"FlowRelationship","name":"Funding Allocation","documentation":"","sourceid":"elem-id-200022","targetid":"elem-id-200012","specialization":""},{"id":"elem-id-d8167773-f6b2-4300-8c19-7017ca639051","type":"FlowRelationship","name":"Funding Opportunity Notice","documentation":"### Object\nThe notice carries the funder's call details, eligibility criteria, deadline, and the internal contact for the opportunity.\n\n### Condition\nIt is distributed after the funding identification team screens the call for institutional fit and confirms the opportunity is open.\n\n### Consequence\nProgramme development builds proposals against the notice's terms, and without it researchers are unaware of the call and miss the submission window.","sourceid":"elem-id-892","targetid":"elem-id-891","specialization":""},{"id":"id-76313c86-6699-46ee-b6d4-dedbd4fc8aed","type":"FlowRelationship","name":"Funding Opportunity Notice","documentation":"","sourceid":"elem-id-200022","targetid":"elem-id-200025","specialization":""},{"id":"elem-id-2b2bc1de-33e3-4ad9-94df-c7ea273bf905","type":"FlowRelationship","name":"Government Funding Announcement","documentation":"### Object\nThe Government Funding Announcement details a new funding stream, eligibility criteria, and application deadlines.\n\n### Condition\nIt is issued when a government body announces funding opportunities.\n\n### Consequence\nPublic relations teams prepare communication materials to inform the sector. Without this announcement, the institution misses the opportunity to apply or inform stakeholders.","sourceid":"elem-id-921","targetid":"elem-id-926","specialization":""},{"id":"elem-id-f24fefb0-811c-4527-bddb-0eafbe33646e","type":"FlowRelationship","name":"Graduate Roster","documentation":"### Object\nThe list of graduates attending a specific ceremony, including name pronunciation, guest count, and accessibility requirements.\n\n### Condition\nIssued when ceremony bookings close and all attendee details have been validated.\n\n### Consequence\nArrival enables venue layout, guest ticketing, and alumni engagement follow-up. Absence leaves ceremony logistics unconfirmed and disrupts guest management.","sourceid":"elem-id-858","targetid":"elem-id-856","specialization":""},{"id":"id-5c612615-46d9-4ab5-b379-313fa643e07f","type":"FlowRelationship","name":"Graduation Invitation","documentation":"","sourceid":"elem-id-200033","targetid":"elem-id-20003","specialization":""},{"id":"elem-id-cff2e4b5-9b1e-4163-81e7-ed258c880cf7","type":"FlowRelationship","name":"Grant Award Notice","documentation":"### Object\nThe notice records that a funding application has been successful, the award amount, and the start and end dates.\n\n### Condition\nIt is issued only when the funder sends the formal award letter and the institution accepts the terms.\n\n### Consequence\nThe award account is activated, and without it the awarded funds are not released to the project.","sourceid":"elem-id-892","targetid":"elem-id-893","specialization":""},{"id":"elem-id-6eaf0fbf-bbce-44f4-a0fb-46166bf8985f","type":"FlowRelationship","name":"HPC Resource Utilisation Report","documentation":"### Object\nThe HPC Resource Utilisation Report shows how high-performance computing clusters are being used, including job queues, node utilisation, and wait times.\n\n### Condition\nIt is generated from scheduler logs at regular intervals.\n\n### Consequence\nInfrastructure lifecycle management uses the data to plan capacity expansion or decommissioning. Without this report, HPC resources are either underutilised or oversubscribed, and investment decisions are uninformed.","sourceid":"elem-id-960","targetid":"elem-id-955","specialization":""},{"id":"elem-id-f5324b61-c0a7-4167-ba78-94f089c8ca84","type":"FlowRelationship","name":"HPC Software Requirement","documentation":"### Object\nThe HPC Software Requirement specifies the libraries, compilers, or applications needed by researchers on the high-performance computing platform.\n\n### Condition\nIt is submitted when a research project requires software not currently available.\n\n### Consequence\nApplication lifecycle management installs or licences the requested software on the HPC environment. Without this requirement, researchers cannot run their workloads, and scientific progress stalls.","sourceid":"elem-id-960","targetid":"elem-id-956","specialization":""},{"id":"elem-id-1a5f184f-a183-471f-a382-9409f7d1359c","type":"FlowRelationship","name":"Hardware Refresh Schedule","documentation":"### Object\nThe Hardware Refresh Schedule lists the dates when HPC components will be replaced or upgraded.\n\n### Condition\nIt is produced based on asset age and performance degradation.\n\n### Consequence\nHigh performance computing teams plan maintenance and user communication around the schedule. Without this schedule, hardware failures occur unexpectedly, disrupting research.","sourceid":"elem-id-955","targetid":"elem-id-960","specialization":""},{"id":"elem-id-6de4cb21-a5eb-4ef0-9109-e58616b152c0","type":"FlowRelationship","name":"Health Notification","documentation":"### Object\nThe Health Notification informs health care management about a staff or student health issue that requires attention.\n\n### Condition\nIt is created when an individual reports a health concern to internal communications.\n\n### Consequence\nHealth care management follows up with the individual and provides support. Without this notification, the health issue remains unknown to the appropriate service, and the person may not receive care.","sourceid":"elem-id-940","targetid":"elem-id-938","specialization":""},{"id":"elem-id-b2dcb180-286d-4903-b885-c8278e9b1abf","type":"FlowRelationship","name":"Health Service Alert","documentation":"### Object\nThe Health Service Alert communicates urgent or important health information, such as disease outbreaks, vaccination clinics, or service changes.\n\n### Condition\nIt is issued by health care management when a public health risk is identified.\n\n### Consequence\nInternal communications disseminates the alert across campus. Without this alert, individuals remain unprotected against health risks.","sourceid":"elem-id-938","targetid":"elem-id-940","specialization":""},{"id":"elem-id-d4038c5e-89ab-4ec0-94ff-233ea497f897","type":"FlowRelationship","name":"Health Support Plan","documentation":"### Object\nThe summary of a student's health support plan, including recommended adjustments and key contacts.\n\n### Condition\nIssued when health and wellbeing services complete an assessment and produce a support plan for academic staff.\n\n### Consequence\nArrival informs personal tutors of the support needed. Absence leaves tutors unaware and may inadvertently undermine student health.","sourceid":"elem-id-877","targetid":"elem-id-876","specialization":""},{"id":"elem-id-e8ec9499-8ba6-4b81-b479-58b33c630d72","type":"FlowRelationship","name":"Historical Financial Statement","documentation":"### Object\nThe Historical Financial Statement presents prior year income statements, balance sheets, and cash flow statements.\n\n### Condition\nIt is available after each financial year is closed and audited.\n\n### Consequence\nBudget management uses these statements to identify trends and set realistic baselines. Without these statements, budget projections lack historical context, and recurring patterns are missed.","sourceid":"elem-id-996","targetid":"elem-id-991","specialization":""},{"id":"elem-id-2270f98f-450e-4b06-b7fc-ed2b6eb5762b","type":"FlowRelationship","name":"Housing Welfare Alert","documentation":"### Object\nThe notification that a student's housing situation may affect their wellbeing, including risk of homelessness or unsafe conditions.\n\n### Condition\nIssued when housing advice identifies a welfare concern and the student consents to referral.\n\n### Consequence\nArrival triggers wellbeing support and may prevent escalation. Absence leaves the student without joined-up support across housing and health.","sourceid":"elem-id-875","targetid":"elem-id-877","specialization":""},{"id":"id-a3bede4e-bf08-4aee-8a8f-77e152480926","type":"FlowRelationship","name":"IT Incident Report","documentation":"","sourceid":"elem-id-200015","targetid":"elem-id-200014","specialization":""},{"id":"elem-id-1f9d05dd-91cc-43a1-9cff-38b0ef830b05","type":"FlowRelationship","name":"IT Support Ticket","documentation":"### Object\nThe IT Support Ticket records a user-reported service request or incident, including description, priority, affected service, and associated device or user.\n\n### Condition\nIt is raised when a member of staff or student submits a request or reports a fault to the IT helpdesk.\n\n### Consequence\nSupport staff receive the tick
