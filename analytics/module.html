<!DOCTYPE html>

<title>module</title>
<!--
  module.html — the analytical reporting system.
  Office/Design/sql space/module.html            Marcus Kael, 28 Aug 2026
  Architecture: Office/Design/sql space/PLAN_module_html.md
  Principle:    team_memory/principles/every_report_is_a_table_with_numbers_and_shape.md

  THE RULE (Bora, 27–28 Aug — stated as practitioner experience, not preference)
    Every report is a TABLE that also yields, FROM THE SAME QUERY, one or two
    significant COUNTS and at least one SHAPE (bar or pie), plus a FILTER.
    Counts, shape and table are three renderings of the SAME rows, so a number
    in a tile and a row in the table CANNOT disagree.
    A report is therefore a DECLARATION, not a page — see REPORTS below. Adding
    a report is one entry in that list.

  FOUR STAKEHOLDERS (Bora, 28 Aug — the fourth closed a real gap)
    library governance · architects · management · implementers
    The page built 27 Aug was the LIBRARY GOVERNANCE page; the 26 Aug audience
    analysis had missed the person who owns the library.
    Navigation is exactly TWO levels: pick a stakeholder, then a horizontal tab
    menu of that stakeholder's reports. A third level would make this a site.

  EMBEDDED DATA (Bora, 28 Aug)
    "analysis in publisher should not have a step when the user is asked to
     provide the data."
    When generated for the publisher, build_module.py writes the model's three
    tables into the <script id="model-data"> block below and the page opens
    straight into the reports. The CSV loader remains for standalone use and
    appears only when that block is empty. One codebase, two deployment modes.

  LIBRARIES — vendored locally, MIT only, nothing fetched at runtime (D-146)
    sql.js 1.11.0 · Chart.js 4.4.9 · Tabulator 6.3.1 · marked 15.0.7
    MIT is deliberate: copyleft here would permanently remove the option of
    selling or splitting these pages into editions (D-143).

  MUST BE SERVED. Browsers refuse to instantiate WebAssembly from file://.

  STAGE 1 does NOT generate links from tables to the published diagrams
  (Bora's instruction) — they would not resolve standalone. The contract is
  known and recorded: views/<view-id>.html, images/<view-id>.png,
  elements/elem-<element-id>.html, with target="view" (D-149).
-->
<link rel="stylesheet" href="lib/tabulator/tabulator.min.css">
<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e3e3e0;
    --accent:#2d5f8a; --soft:#eaf1f7; --warn:#8a5a2d; --warnsoft:#fbf3e9;
    --ok:#2f6b45; --oksoft:#eef5f0;
    --mono:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    --c1:#c8dcec; --c2:#8fb8d8; --c3:#5a8fbd; --c4:#31648f; --c5:#1d4665;
    --grid:#ececea;
  }
  /* LIGHT ONLY, deliberately (Bora, 28 Aug). This page is a report: it is read
     alongside a published model, printed, and screenshotted into decks, all of
     which assume a light ground. A dark variant was removed rather than left
     to follow the reader's OS, because a report that changes colour depending
     on whose machine opens it is not a document. The palette is stated once,
     above, and nothing overrides it. */
  :root{ color-scheme: light; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}
  header,nav.tabs{flex:0 0 auto}
  /* min-height:0 lets a flex child shrink below its content and actually
     scroll; min-width:0 + width:100% stop it sizing to its widest child on
     the cross axis, which pushed main to 1202px in a 1024px viewport. */
  main{flex:1 1 auto;min-height:0;min-width:0;width:100%}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;
         display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  header .mark{width:32px;height:32px;border-radius:7px;background:var(--soft);
        border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-size:16px;flex-shrink:0}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  header .sub{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
  header .home{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);
        background:var(--panel);border-radius:5px;cursor:pointer;color:var(--ink)}
  header .home:hover{border-color:var(--accent)}
  #status{margin-left:auto;font:12px var(--mono);color:var(--muted);text-align:right}

  nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);padding:0 22px;
           display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{font:inherit;font-size:12.5px;font-weight:500;padding:9px 14px;border:0;
        border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;
        white-space:nowrap;border-radius:0}
  nav.tabs button:hover:not(:disabled){color:var(--ink);background:var(--bg)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--bg)}
  nav.tabs button:disabled{opacity:.35;cursor:not-allowed}

  /* The page owns its scrolling. A publisher frame is declared
     scrolling="no" (Archi's default, found in every report checked), which
     kills the FRAME's scrollbar -- but an element inside the document can
     still scroll. So <main> is the scroll container, and the page works in a
     frame, standalone, and in a frame whose host we never edit. */
  html,body{height:100%;overflow:hidden}
  main{padding:15px 22px 40px;max-width:1500px;margin:0 auto;
       overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .qline{font-size:13px;color:var(--muted);margin:0 0 12px}
  .qline b{color:var(--ink);font-weight:600}

  /* entry — who are you */
  .entry{max-width:920px;margin:34px auto}
  .entry > h2{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .entry > p{margin:0 0 22px;color:var(--muted);font-size:13.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}
  .card-s{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:17px 18px;
        cursor:pointer;transition:.12s;text-align:left;font:inherit;color:var(--ink);display:block;
        width:100%}
  .card-s:hover{border-color:var(--accent);background:var(--soft)}
  .card-s h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .card-s .q{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0 0 11px}
  .card-s .avail{font-size:11.5px;font-weight:600;color:var(--ok)}
  .card-s .avail.part{color:var(--warn)}
  .card-s .avail.none{color:var(--muted)}
  .card-s:disabled{opacity:.55;cursor:not-allowed}
  .card-s:disabled:hover{border-color:var(--line);background:var(--panel)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;
        margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 15px}
  .kpi .k{font-size:11.5px;color:var(--muted);font-weight:500}
  .kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
  .kpi .v small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .v{color:var(--warn)}
  .kpi.ok .v{color:var(--ok)}

  .shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;
          margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px 16px}
  .card h2{margin:0 0 2px;font-size:13.5px;font-weight:600}
  .card .cap{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .cwrap{position:relative;height:230px}

  /* grid-slot portfolio — fixed circles in ordinal cells, label inside the cell.
     Origin: pedro/capabilities/grid_portfolio/CONCEPT_grid_slot_portfolio.md.
     The radius carries NO meaning: area is perceived non-linearly, so fixing it
     buys a legible label on every item at any density. Third variable = colour. */
  .gridbox{background:var(--panel);border:1px solid var(--line);border-radius:7px;
        padding:14px 16px;margin-bottom:14px;overflow:auto}
  .gridbox h2{margin:0 0 2px;font-size:13.5px;font-weight:600}
  .gridbox .cap{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  .gridbox svg{display:block}
  .gridbox svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .cellrect{fill:var(--bg)}
  .cellrect.alt{fill:var(--panel)}
  .cellrect.void{fill:var(--warnsoft)}
  .gline{stroke:var(--line);stroke-width:1}
  .axlab{fill:var(--muted);font-size:11px}
  .axttl{fill:var(--ink);font-size:12px;font-weight:600}
  .gitem circle{stroke:rgba(0,0,0,.2);stroke-width:1}
  .gitem text{fill:var(--ink);font-size:11px;dominant-baseline:middle;cursor:pointer}
  .gitem:hover circle{stroke:var(--ink);stroke-width:2}
  .gitem:hover text{font-weight:700;text-decoration:underline}
  .cellcount{fill:var(--muted);font-size:10px;font-weight:700;opacity:.6}
  .voidnote{fill:var(--warn);font-size:10.5px;font-style:italic}
  .gridlegend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 10px;
        font-size:12px;color:var(--muted)}
  .gridlegend .sw{display:inline-block;width:11px;height:11px;border-radius:50%;
        margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:7px;
           padding:11px 15px;margin-bottom:12px}
  .filters .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .filters h2{margin:0 8px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
              color:var(--muted);font-weight:700}
  .filters input[type=search], .filters select{font:inherit;font-size:12.5px;padding:6px 9px;
        border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
  .filters input[type=search]{min-width:220px;flex:1;max-width:360px}
  .filters .count{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .filters .count b{color:var(--ink)}
  #tbl{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}

  .drop{border:2px dashed var(--line);border-radius:7px;padding:24px 18px;text-align:center;
        color:var(--muted);font-size:13px;cursor:pointer;transition:.12s;background:var(--panel)}
  .drop:hover,.drop.hot{border-color:var(--accent);background:var(--soft);color:var(--ink)}
  button.b{font:inherit;padding:7px 15px;border:1px solid var(--line);background:var(--panel);
           border-radius:5px;cursor:pointer;color:var(--ink);font-size:13px}
  button.b:hover:not(:disabled){border-color:var(--accent)}
  button.b.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  button.b:disabled{opacity:.4;cursor:not-allowed}
  .slot{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin:0 12px 0 0}
  .slot .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .slot.has .dot{background:var(--ok)}
  .slot .nm{color:var(--muted)}
  .slot.has .nm{color:var(--ink)}
  .msg{padding:10px 13px;border-radius:0 5px 5px 0;margin-bottom:12px;font-size:13px;display:none}
  .msg.i{background:var(--soft);border-left:3px solid var(--accent)}
  .msg.e{background:var(--warnsoft);border-left:3px solid var(--warn);color:var(--warn);
         font:12.5px var(--mono);white-space:pre-wrap}
  .intro{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:26px;max-width:640px;margin:26px auto}
  .intro h3{margin:0 0 8px;font-size:16px}
  .intro ol{line-height:1.95;padding-left:20px;color:var(--muted)}
  .intro ol b{color:var(--ink)}
  .intro p{color:var(--muted);font-size:12.5px}
  .empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
  code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px}
  .note{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.7}
  .note b{color:var(--ink)}
  .sim{background:var(--warnsoft);color:var(--warn);font-size:11px;padding:1px 7px;
       border-radius:9px;border:1px solid var(--line)}

  /* Tabulator — its stylesheet sets color:#333 on the CELL; theming the row
     alone leaves it, which measured 1.31:1 on the dark panel (27 Aug). */
  .tabulator{background:var(--panel);border:0;font-size:12.5px;color:var(--ink)}
  .tabulator .tabulator-header{background:var(--bg);border-bottom:1px solid var(--line);
        color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col{background:var(--bg);
        border-right:1px solid var(--line);color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col-title{font-weight:600;font-size:12px;
        color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col .tabulator-arrow{border-bottom-color:var(--muted)}
  .tabulator-row{background:var(--panel);border-bottom:1px solid var(--line);color:var(--ink)}
  .tabulator-row.tabulator-row-even{background:var(--panel)}
  .tabulator-row:hover{background:var(--soft) !important}
  .tabulator-row .tabulator-cell{border-right:1px solid var(--line);padding:7px 10px;
        color:var(--ink)}
  .tabulator .tabulator-footer{background:var(--bg);border-top:1px solid var(--line);
        color:var(--muted)}
  .tabulator .tabulator-footer .tabulator-page{background:var(--panel);border:1px solid var(--line);
        color:var(--ink);border-radius:4px}
  .tabulator .tabulator-footer .tabulator-page.active{background:var(--accent);color:#fff}
  .tabulator .tabulator-footer .tabulator-page:disabled{opacity:.45}
  .tabulator .tabulator-footer .tabulator-page-size,
  .tabulator .tabulator-footer .tabulator-paginator label{color:var(--muted)}
  .tabulator .tabulator-footer .tabulator-page-size{background:var(--panel);
        border:1px solid var(--line);color:var(--ink);border-radius:4px}
  .tabulator .tabulator-placeholder{background:var(--panel)}
  .tabulator .tabulator-placeholder .tabulator-placeholder-contents{color:var(--muted)}
  .tabulator .tabulator-tableholder{color:var(--ink)}

  .pill{font-size:11px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);
        background:var(--bg);color:var(--muted);white-space:nowrap}
  .pill.hi{background:var(--soft);color:var(--accent);border-color:var(--accent)}
  .pill.lo{background:var(--warnsoft);color:var(--warn);border-color:var(--warn)}
  .pill.ok{background:var(--oksoft);color:var(--ok);border-color:var(--ok)}
  .lnk{color:var(--accent);cursor:pointer;text-decoration:underline;
       text-decoration-color:var(--line);text-underline-offset:2px}
  .lnk:hover{text-decoration-color:var(--accent)}

  dialog#doc{border:1px solid var(--line);border-radius:9px;padding:0;background:var(--panel);
       color:var(--ink);max-width:760px;width:calc(100% - 40px);max-height:82vh;
       box-shadow:0 18px 48px rgba(0,0,0,.24)}
  dialog#doc::backdrop{background:rgba(0,0,0,.42)}
  #doc .head{display:flex;align-items:flex-start;gap:12px;padding:15px 19px;
       border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
       border-radius:9px 9px 0 0}
  #doc .head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  #doc .head .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;
       gap:6px;flex-wrap:wrap;align-items:center}
  #doc .x{margin-left:auto;font:inherit;font-size:19px;line-height:1;background:none;
       border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0}
  #doc .x:hover{background:var(--bg);color:var(--ink)}
  #doc .body{padding:6px 19px 20px;overflow-y:auto;max-height:calc(82vh - 74px)}
  #doc .body h1,#doc .body h2,#doc .body h3,#doc .body h4{
       font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
       font-weight:700;margin:19px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  #doc .body p{margin:0 0 11px;line-height:1.62}
  #doc .body ul,#doc .body ol{margin:0 0 11px;padding-left:22px;line-height:1.62}
  #doc .body code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px}
  #doc .body pre{background:var(--bg);padding:11px 13px;border-radius:5px;overflow-x:auto;
       border:1px solid var(--line)}
  #doc .body blockquote{margin:0 0 11px;padding-left:13px;border-left:3px solid var(--line);
       color:var(--muted)}
  #doc .body table{border-collapse:collapse;width:100%;margin-bottom:11px;font-size:12.5px}
  #doc .body th,#doc .body td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  #doc .body th{background:var(--bg);font-weight:600}
  #doc .body a{color:var(--accent)}
  #doc .none{color:var(--muted);font-style:italic;padding:22px 0}
  #doc .views{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
       padding:11px 19px;border-top:1px solid var(--line);background:var(--bg)}
  #doc .views .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);font-weight:700;margin-right:2px}
  #doc .views a{font:inherit;font-size:12.5px;text-decoration:none;color:var(--accent);
       border:1px solid var(--line);border-radius:5px;padding:5px 11px;background:var(--panel)}
  #doc .views a:hover{border-color:var(--accent);background:var(--soft)}
</style>
</head>
<body>

<header>
  <div class="mark">▤</div>
  <div>
    <h1 id="h-title">Model analysis</h1>
    <span class="sub" id="h-sub">choose whose questions to answer</span>
  </div>
  <button class="home" id="home" style="display:none">&larr; Stakeholders</button>
  <span id="status">starting&hellip;</span>
</header>

<nav class="tabs" id="tabs" style="display:none"></nav>

<main>
  <div class="msg i" id="note"></div>
  <div class="msg e" id="err"></div>
  <div id="view"></div>
</main>

<dialog id="doc">
  <div class="head">
    <div>
      <h3 id="doc-t"></h3>
      <div class="meta" id="doc-m"></div>
    </div>
    <button class="x" id="doc-x" aria-label="Close">&times;</button>
  </div>
  <div class="body" id="doc-b"></div>
  <div class="views" id="doc-v" style="display:none"></div>
</dialog>

<!-- build_module.py replaces the contents of this block with the model's three
     tables. Left empty, the page shows the standalone CSV loader instead. -->
<script type="application/json" id="model-data">{"model":"UCISA","generated":"2026-10-19","source":"exporter_base.db","elements":[{"id":"elem-f1-id-6382","type":"BusinessActor","name":"Commercial Partners","documentation":"**Organisations that work with the institution commercially.** Commercial Partners collaborate with the university on funded projects, license intellectual property, or purchase specialist services. They rely on the institution for research expertise, facilities, or talent. In this model, their perspective matters because they influence commercial income, knowledge exchange, and the practical impact of the institution's work.","specialization":""},{"id":"elem-f1-id-6261","type":"BusinessActor","name":"Domestic & EU Students","documentation":"**Home and EU learners at the institution.** They are individuals from the institution's home country or European Union member states who apply, enrol, study, and graduate. They form a major market segment for student recruitment and income. Their choices of subject, mode of study, and expectations for teaching quality, facilities, and support shape the institution's course portfolio and operational planning. Admissions, student services, and academic departments create and use records about them to manage enrolment, progression, and satisfaction. Their retention and success are central to institutional performance and funding.","specialization":""},{"id":"elem-f1-id-6388","type":"BusinessActor","name":"External Researchers","documentation":"**Researchers from other institutions or organisations.** External Researchers collaborate on joint projects, access data or specialist facilities, and contribute to the university's research output. They rely on the institution for partnership, shared expertise, and access to resources. Their activity affects research funding, publication record, and the wider reputation of the institution.","specialization":""},{"id":"elem-f1-id-6376","type":"BusinessActor","name":"Funding Bodies","documentation":"**Organisations that provide financial support.** Funding Bodies finance research, teaching, or strategic initiatives through grants, contracts, or subsidies. They set conditions and evaluate outcomes against their own objectives. In this model, their expectations shape institutional planning, compliance requirements, and the allocation of resources to funded activities.","specialization":""},{"id":"elem-f1-id-6267","type":"BusinessActor","name":"International Students","documentation":"**Learners from outside the domestic fee regime.** They are individuals from countries outside the institution's home nation and European Union who apply, enrol, and study at the institution. They represent a distinct market segment, paying higher tuition fees and requiring specific support such as visa advice, orientation, and English language assistance. The institution depends on them for revenue and global diversity. Their recruitment, compliance with immigration rules, and academic success influence strategic decisions on international partnerships, marketing, and student services. They bring varied cultural and educational backgrounds that enrich the academic community.","specialization":""},{"id":"elem-f1-id-6364","type":"BusinessActor","name":"PG Students","documentation":"**Students undertaking postgraduate study.** PG Students pursue master's or doctoral degrees and rely on advanced teaching, expert supervision, and research facilities. They expect specialist support, access to academic resources, and opportunities for contribution to knowledge. Their needs drive the provision of dedicated services, research training, and academic infrastructure within the institution.","specialization":""},{"id":"elem-f1-id-6352","type":"BusinessActor","name":"Prospective Students","documentation":"**People considering applying to the institution.** Prospective Students evaluate courses, fees, entry requirements, and campus life before making an enrolment decision. They rely on clear information, advice, and support from admissions and marketing functions. Their decisions affect student numbers, diversity, and the financial health of the institution.","specialization":""},{"id":"elem-f1-id-6370","type":"BusinessActor","name":"Public Community","documentation":"**Local residents and wider society.** The Public Community interacts with the institution through public events, cultural programmes, lifelong learning, and access to facilities. They expect the university to be a responsible neighbour, to share knowledge, and to contribute to regional social and economic development. Their engagement matters for institutional reputation and social licence to operate.","specialization":""},{"id":"elem-f1-id-6358","type":"BusinessActor","name":"UG Students","documentation":"**Students undertaking undergraduate study.** UG Students pursue bachelor's degrees and rely on high-quality teaching, academic support, and the wider student experience. They expect accessible resources, clear guidance, and opportunities for personal and professional development. Their success is central to the institution's core educational mission and its standing in national league tables.","specialization":""},{"id":"elem-f2-id-868","type":"BusinessObject","name":"Academic Progression","documentation":"**A record of a student's movement through study.** It holds completed modules, credits, stage outcomes, and any decisions about continuation or transfer. Academic administrators and assessment boards create and update it; students, academic advisors, and registry staff rely on it. It supports decisions about progression between years, eligibility for awards, and interventions when a student falls behind. The record gives a single, authoritative view of how far a learner has advanced within a programme.","specialization":""},{"id":"elem-f2-id-828","type":"BusinessObject","name":"Academic Results","documentation":"**The official record of assessed performance.** It contains the marks or grades awarded for each module and the overall outcome. Examiners and assessment boards create and confirm these results; students, academic staff, and external bodies such as employers rely on them. The record supports the production of transcripts, the determination of awards, and the identification of students who need resits or further support. It is the authoritative source for a student's academic standing.","specialization":""},{"id":"elem-f2-id-905","type":"BusinessObject","name":"Academic Timetabling","documentation":"**The allocation of teaching activities to times.** It matches lectures, seminars, and practical sessions to rooms, weeks, and staff availability. Timetabling staff create the schedule with input from academic departments; students and teaching staff rely on it to know where and when to attend. The timetable supports the efficient use of space and staff time, helps avoid clashes for students and staff, and underpins the day-to-day delivery of teaching across the institution.","specialization":""},{"id":"elem-f2-id-821","type":"BusinessObject","name":"Academic Trusts","documentation":"**A charitable trust supporting higher education.** This type of external organisation holds funds or assets for the benefit of an academic institution. The institution records these trusts to manage relationships, track donations, and ensure that funds are used according to the trust's purpose. Finance and development teams rely on the record to monitor contributions and report to trustees. The record includes identifying information and the terms of the trust.","specialization":""},{"id":"elem-f2-id-922","type":"BusinessObject","name":"Academic Year Scheduling","documentation":"**The structure of the academic calendar.** It defines term dates, vacation periods, assessment windows, and key deadlines for enrolment and module changes. Central academic administration creates the calendar after consultation with departments; the whole institution relies on it for planning. It supports the alignment of teaching, examination, and progression activities, and ensures that students and staff share a common understanding of when each part of the academic year happens.","specialization":""},{"id":"elem-f2-id-884","type":"BusinessObject","name":"Account","documentation":"**A record of financial transactions.** An Account holds the debits and credits for a particular category of money, asset, liability, income, or expense. Finance staff create and maintain accounts to track the institution's financial position over time. Budget managers and auditors rely on account balances to see where money has come from and gone, to reconcile statements, and to support planning and reporting. The model treats Account as a core financial record that underlies invoices, payments, and journal entries.","specialization":""},{"id":"elem-f2-id-875","type":"BusinessObject","name":"Accreditation","documentation":"**Formal recognition of meeting standards.** It records that a programme or institution has been assessed and approved by an external body. The record holds the scope of approval, any conditions, and the date of review. Quality assurance teams create and maintain the accreditation record. Students, employers, and professional bodies rely on it to confirm that the qualification has value. Academic staff use it to ensure their programme remains compliant with external requirements. The record supports decisions about recruitment, funding, and curriculum changes.","specialization":""},{"id":"elem-f2-id-889","type":"BusinessObject","name":"Agent Broker","documentation":"**An intermediary acting for external parties.** An agent broker represents others in dealings with the institution, such as negotiating services or managing transactions. The institution records these intermediaries to track who is authorised to act on behalf of clients or suppliers. Procurement and contract teams use the record to verify credentials, manage communications, and ensure that agreements are properly authorised. The record holds contact details and the scope of authority.","specialization":""},{"id":"elem-f2-id-844","type":"BusinessObject","name":"Agreement","documentation":"**A record of mutual understanding between parties.** It captures the terms, obligations, and expectations agreed by the institution and another organisation or individual. Legal staff create and maintain this record when parties reach a shared position. Managers and contract owners rely on it to confirm what has been agreed, to monitor performance, and to resolve disagreements. It supports decisions about whether obligations are met and whether further formal action is needed. As part of the Legal group, it sits alongside more specific binding documents.","specialization":""},{"id":"elem-f2-id-836","type":"BusinessObject","name":"Alumnus","documentation":"**A record of a former student.** The institution creates this record when a student completes a course or otherwise leaves study. It holds contact details, education history, and engagement preferences. Staff use it to send alumni communications, invite participation in events, and request donations or other support. The record supports relationship building after study and informs reporting on graduate outcomes.","specialization":""},{"id":"elem-f2-id-809","type":"BusinessObject","name":"Applicant","documentation":"**A record of a person applying.** This record captures a person's application to study or work at the institution. It holds personal details, qualifications, chosen programme or position, and decision history. Admissions or recruitment staff create it when an application is received and update it during selection. The record supports evaluation, offers, and enrolment or hiring decisions.","specialization":""},{"id":"elem-f2-id-918","type":"BusinessObject","name":"Appraisal","documentation":"**A record of an employee's performance review.** An appraisal captures the agreed objectives, achievements and development needs discussed between a manager and an employee. Human resources and senior managers use it to make evidence-based decisions about pay progression, promotion and training priorities. The employee uses the record to understand expectations and plan professional growth. The appraisal summarises past performance and sets goals for the next review period. It is created during a formal or semi-formal review meeting and stored as part of the employee's personnel record.","specialization":""},{"id":"elem-f2-id-949","type":"BusinessObject","name":"Archive","documentation":"**A stored collection of records.** An archive holds records that are no longer in active use but are kept for evidence, reference, or compliance. Records managers and administrative staff create and maintain archives, and staff, auditors, and external parties use them to retrieve past information. The archive supports retention schedules, legal holds, and institutional memory. In this model, the archive sits alongside individual records and discovery requests, showing where inactive records are held and how they are accessed.","specialization":""},{"id":"elem-f2-id-834","type":"BusinessObject","name":"Assessment","documentation":"**The process of measuring student learning.** It includes coursework, in-class tests, presentations, and other instruments that generate evidence of achievement. Teaching staff design and mark assessments; academic administrators coordinate their submission and return; students and examination boards rely on the outcomes. The assessment record feeds into academic results and supports decisions about progression, feedback for improvement, and the overall certification of a student's knowledge and skills.","specialization":""},{"id":"elem-f2-id-909","type":"BusinessObject","name":"Assets","documentation":"**An item of economic value.** An Asset is a thing the institution owns or controls that has value, such as money, property, equipment, or investments. The finance office records assets to know what the institution holds and to manage its worth. Asset records support decisions about maintenance, replacement, insurance, and investment. In the model, Assets form part of the institution's financial position and are monitored by financial managers and auditors.","specialization":""},{"id":"elem-f2-id-941","type":"BusinessObject","name":"Audit","documentation":"**A formal examination of governance.** An audit is an independent review of how the institution meets its policies, regulations, and standards. It records evidence of compliance or non-compliance, findings, and recommendations. Internal or external auditors conduct it, and senior managers and governing bodies rely on it to assure themselves that obligations are met and to direct corrective work. In the model, Audit supports oversight of governance arrangements.","specialization":""},{"id":"elem-f2-id-930","type":"BusinessObject","name":"Award","documentation":"**A formal recognition of learning achieved.** An award is a formal recognition granted by the institution to a student who has completed the requirements of a course or programme of study. It records the type and title of the qualification conferred. The institution creates and issues the award at the point of graduation. The student receives the award and uses it as evidence of their achievement. Employers, professional bodies, and other educational institutions rely on the award to make decisions about recruitment, registration, or admission. The award therefore supports progression and recognition beyond the institution.","specialization":""},{"id":"elem-f2-id-837","type":"BusinessObject","name":"Benefactor","documentation":"**A donor of funds or assets.** A benefactor gives money, property, or other resources to the institution without expectation of direct commercial return. The institution records benefactors to acknowledge gifts, manage stewardship, and maintain long-term relationships. Development and alumni relations teams use the record to track donation history, recognise contributions, and report on philanthropic income. The record includes personal details and gift information.","specialization":""},{"id":"elem-f2-id-842","type":"BusinessObject","name":"Benefits","documentation":"**Expected positive outcomes from change.** Benefits are recorded as part of a business case or benefits realisation plan. Project and programme managers identify and document benefits, while senior leaders and portfolio owners rely on them to prioritise investments and assess whether change initiatives deliver value. Each benefit states the improvement an institution expects, who gains from it, and how it will be measured. In this model, Benefits provide the justification for a Programme of Work and Projects, and are tracked through Monitoring.","specialization":""},{"id":"elem-f2-id-887","type":"BusinessObject","name":"Brand","documentation":"**The public identity of an institution.** It encompasses the name, logo, visual style and reputation that distinguish the organisation in the minds of students, staff and partners. Marketing and communications teams create and maintain the brand; senior leaders rely on it to guide all promotional work. In this model, Brand serves as the reference point for campaigns, events and merchandise, ensuring consistent presentation across every touchpoint.","specialization":""},{"id":"elem-f2-id-898","type":"BusinessObject","name":"Budget","documentation":"**A plan for income and expenditure.** A Budget sets out expected income and planned spending for a period. Budget holders across faculties and departments create budgets to request and allocate funds. Finance staff and senior management rely on budgets to control spending, compare actuals against plans, and make resource decisions. The model uses Budget as a financial planning record that links to accounts, forecasts, and actual payments.","specialization":""},{"id":"elem-f2-id-848","type":"BusinessObject","name":"Building","documentation":"**A physical structure with walls and roof.** An institution records each building to know what space it holds, where rooms are located, and which services operate inside. Estates and timetabling staff create and maintain building records so that teaching, research, and support activities are assigned to appropriate spaces. Building data also supports maintenance planning, accessibility reviews, and wayfinding for staff, students, and visitors.","specialization":""},{"id":"elem-f2-id-839","type":"BusinessObject","name":"Bursary","documentation":"**A non-repayable financial award to a student.** The Bursary record holds the award amount, eligibility criteria, terms, and payment schedule. Student finance or administrative staff create and maintain it. Students use it to understand their funding; finance staff use it to disburse funds; academic and support staff use it to monitor access to study. The record supports decisions about financial support, budgeting, and student retention.","specialization":""},{"id":"elem-f2-id-880","type":"BusinessObject","name":"Campaign","documentation":"**A coordinated set of marketing activities.** It delivers a specific message to a target audience over a fixed period through channels such as advertising, email or social media. Marketing teams plan and execute campaigns; managers use them to achieve measurable goals like increasing applications or event registrations. The model records campaign objectives, budget, schedule, content and performance data, supporting review and future planning.","specialization":""},{"id":"elem-f2-id-832","type":"BusinessObject","name":"Campus","documentation":"**A distinct site for institutional activities.** The institution records campuses to organise its buildings, open spaces, and services across different geographical locations. Estates and strategic planning staff maintain campus records, and staff, students, and visitors rely on them for navigation and service access. Campus location data supports security, transport, and long-term estate planning.","specialization":""},{"id":"elem-f2-id-826","type":"BusinessObject","name":"Clubs & Societies","documentation":"**A register of student-run interest groups.** Students create and maintain these groups for activities outside the taught curriculum, and the model records their existence, purpose, and membership. The Students' Union and university staff use the register to support student engagement, allocate rooms and funding, and understand the range of extracurricular opportunities available. It holds information about each club or society, including its focus, officers, and affiliation status.","specialization":""},{"id":"elem-f2-id-945","type":"BusinessObject","name":"Collection","documentation":"**The library's assembled set of resources.** A Collection records the materials acquired and managed by the institution, whether physical or digital. Library staff create and maintain the Collection to support teaching, learning and research. Users rely on the Collection to find and access relevant works. The Collection guides decisions about acquisitions, budgets, storage and preservation. It also helps the library to report on the scope and availability of its holdings. This record holds descriptive, administrative and location information for the resources as a whole, making the library's offerings discoverable and manageable.","specialization":""},{"id":"elem-f2-id-899","type":"BusinessObject","name":"Collection Item","documentation":"**A single resource within the collection.** A Collection Item holds details about one distinct physical or digital object, such as a book, journal, dataset or media file. Library staff create a Collection Item record when the resource is catalogued, and update it as the item moves through acquisition, shelving and circulation. Users rely on Collection Item records to find specific materials and check availability. The record supports decisions about loan, renewal, reservation and preservation. It captures bibliographic data, location, format and condition, allowing the library to manage each item individually while linking it to the wider Collection.","specialization":""},{"id":"elem-f2-id-811","type":"BusinessObject","name":"Commercial Organisation","documentation":"**A business entity engaging with the institution.** A commercial organisation supplies goods, services, or expertise under commercial terms. The institution records these organisations to manage contracts, procurement, and partnership agreements. Finance and procurement teams use the record to track supplier performance, process payments, and ensure compliance with terms. The record holds business registration details, contact information, and contract references. These records support vendor management and audit activities.","specialization":""},{"id":"elem-f2-id-831","type":"BusinessObject","name":"Community","documentation":"**Local and regional groups around the institution.** The community includes residents, local businesses, and voluntary organisations that interact with the institution. The institution records community entities to manage engagement, outreach, and public relations. External affairs and communications teams use the record to coordinate events, respond to concerns, and build positive relationships. The record captures contact details and areas of interest or involvement. These records support community impact assessments.","specialization":""},{"id":"elem-f2-id-901","type":"BusinessObject","name":"Complaints","documentation":"**A record of formal dissatisfaction raised.** Complaints capture concerns from students, staff, or other stakeholders about services, conduct, or outcomes. The team receiving complaints logs details, actions, and resolutions. Support and wellbeing staff use the record to investigate, respond, and improve practice. Leadership reviews complaints to identify patterns and reduce risk. The record supports fair, consistent handling and informs policy updates. It is created when someone submits a concern and updated through resolution. Others rely on it for audit, quality assurance, and learning.","specialization":""},{"id":"elem-f2-id-867","type":"BusinessObject","name":"Contract","documentation":"**A binding legal commitment between parties.** It records the specific promises, deliverables, payments, and conditions that the institution and another party must honour. Legal and procurement staff create and maintain it. Contract managers and budget holders use it to track obligations, renewals, and performance. It supports decisions on enforcement, amendments, and termination. In the Legal group, it differs from a broader Agreement by having clearer enforceable terms.","specialization":""},{"id":"elem-f2-id-813","type":"BusinessObject","name":"Contractor","documentation":"**A record of an external service provider.** The institution creates this record for a person engaged under contract to deliver work or services. It holds contract terms, contact information, payment details, and performance notes. Procurement or finance staff manage the record to authorise work, process payments, and meet compliance obligations. The record supports oversight of contracted activity and cost control.","specialization":""},{"id":"elem-f2-id-943","type":"BusinessObject","name":"Copywright","documentation":"**A record of rights and permissions.** Copywright captures the rights status, rights holder information and any usage restrictions for a collection item. Library staff create and maintain this record when acquiring, licensing or digitising material. Users and library staff rely on Copywright to determine what copying, sharing and access are permitted. It supports decisions about making items available in physical or digital form, including interlibrary loan and course reading lists. By recording the terms that govern use of an item, Copywright helps the institution stay within agreed rights and avoid misuse of protected materials.","specialization":""},{"id":"elem-f2-id-885","type":"BusinessObject","name":"Course","documentation":"**A scheduled instance of study.** A course is a particular delivery of a module or a short learning unit in a given academic period. It has a defined cohort of students, a timetable, and assigned teaching staff. Academic departments create course records when they schedule a module to run. Students enrol on specific courses and receive grades for them. Administrators use course records to manage rooms, resources, and assessment. The record supports timetabling, attendance monitoring, and reporting on student progress.","specialization":""},{"id":"elem-f2-id-865","type":"BusinessObject","name":"Creditor","documentation":"**A party owed money by the institution.** A Creditor is a supplier or other body to whom the institution owes payment for goods or services received. The finance office maintains creditor records to track amounts due and payment deadlines. Payments to creditors are processed through the accounts payable function. The model includes Creditor as a financial counterparty whose claims affect cash flow and liabilities. Creditor records are used by finance staff when preparing payment runs and managing working capital.","specialization":""},{"id":"elem-f2-id-911","type":"BusinessObject","name":"Curriculum","documentation":"**The overall design for learning.** A curriculum is the complete specification of learning content, outcomes, and assessment methods for an area of study. It sets out what students need to learn and how their achievement is measured. Academic boards and curriculum designers create and approve the curriculum. Teaching staff use it to plan modules and courses. Students rely on it to understand what they will study. The record supports quality assurance, accreditation, and the development of new programmes. It holds the structure, content, and assessment strategy for a subject or discipline.","specialization":""},{"id":"elem-f2-id-942","type":"BusinessObject","name":"Debtor","documentation":"**A party that owes money to the institution.** A Debtor is a student, company, or other body that has received goods or services and has not yet paid. The finance office tracks debtors to know outstanding income and to chase late payment. Debtor records support credit control and cash flow management. In the model, Debtor represents money owed to the institution and is used by finance staff for aged balance reporting.","specialization":""},{"id":"elem-f2-id-820","type":"BusinessObject","name":"Department","documentation":"**An academic or administrative unit with defined responsibilities.** The model records the department as a structural element that owns programmes, research activity, or support functions. Department heads create and maintain this record, and university managers use it to assign budgets, staff, and performance targets. It holds the name, remit, and reporting line of the unit, and links to the people and activities within it. This element helps the institution map where work is done and who is accountable for it.","specialization":""},{"id":"elem-f2-id-919","type":"BusinessObject","name":"Discerplinery","documentation":"**A record of formal disciplinary action.** A disciplinary record documents an allegation, the investigation, the decision and any sanction applied following a breach of workplace conduct or performance standards. Human resources and line managers create and maintain the record to ensure fair and consistent treatment. Senior leaders use it to review patterns of behaviour and to defend employment decisions. The employee concerned receives a copy and responds to the points raised. The record supports appeals, audit and compliance with employment obligations.","specialization":""},{"id":"elem-f2-id-913","type":"BusinessObject","name":"Discovery Request","documentation":"**A formal request to locate records.** It is created by someone seeking specific information held by the institution, such as a member of staff, a student, or an external party. Records staff receive and process the request, searching records and archives to identify relevant material. The discovery request drives the release or review of records and supports transparency, legal obligations, and internal enquiries. In this model, it connects to records and archives as the sources searched in response to the request.","specialization":""},{"id":"elem-f2-id-920","type":"BusinessObject","name":"Employee Benefits","documentation":"**A record of non-salary rewards provided to staff.** Employee benefits capture the additional forms of compensation and support offered to employees, such as pension contributions, health cover, leave enhancements and flexible working arrangements. Human resources administers the benefits and keeps the record to manage eligibility and enrolment. Employees use the record to understand their entitlements and make choices. Managers and finance teams rely on it to cost the total reward package and to ensure consistent treatment across the organisation.","specialization":""},{"id":"elem-f2-id-849","type":"BusinessObject","name":"Ethical Clearance","documentation":"**Approval for research with people or data.** Ethical Clearance is the record that confirms a Research Proposal has been reviewed and found to meet the institution's standards for responsible research. An ethics review body creates this clearance after examining how the research will treat participants, handle personal information, and manage risk. Researchers use it to show that they have permission to begin a Research Project. Funders, partners, and institutional oversight bodies rely on it to check that the work is properly authorised. In this model, Ethical Clearance links the approval decision to the Research Project it governs and to the proposal that requested it.","specialization":""},{"id":"elem-f2-id-882","type":"BusinessObject","name":"Event","documentation":"**A planned marketing or outreach occasion.** It brings together prospective students, partners, staff or other audiences for activities such as open days, webinars, fairs or networking sessions. Marketing and events teams organise the event; admissions and engagement staff rely on it to generate leads and build relationships. The model stores event details, registration records, logistics and follow-up communications.","specialization":""},{"id":"elem-f2-id-856","type":"BusinessObject","name":"Examination","documentation":"**A formal test of student learning.** An examination is a structured assessment that measures a student's knowledge, understanding, or skills in a subject. Academic staff create examination papers and marking schemes. Administrators schedule the examination, allocate rooms and invigilators, and record the outcomes. Students take the examination under controlled conditions. Examiners mark the work and assign a result. The examination record holds details of the paper, the date and location, the students entered, and the marks awarded. It supports decisions on individual student performance, progression, and the award of credit, and it feeds into academic results.","specialization":""},{"id":"elem-f2-id-924","type":"BusinessObject","name":"External Location","documentation":"**A place outside the institution’s own sites.** The institution records external locations to manage placements, field trips, work-based learning, and off-site events. Placement coordinators and academic staff create these records, and students, supervisors, and risk managers rely on them for travel planning, safety assessments, and attendance tracking. External location data helps the institution meet its duty of care and understand off-campus activity.","specialization":""},{"id":"elem-f2-id-881","type":"BusinessObject","name":"Facility","documentation":"**A specialised space with a particular purpose.** An institution records facilities to track spaces that support research, teaching, sport, or student services. Estates and departmental staff create facility records, and academics, students, and service managers rely on them to know what equipment and conditions a space offers. This location type covers laboratories, workshops, studios, and other purpose-built areas.","specialization":""},{"id":"elem-f2-id-840","type":"BusinessObject","name":"Faculty","documentation":"**A grouping of related academic departments.** The faculty provides strategic direction and coordination for a broad subject area, such as the sciences or humanities. The model records the faculty as a higher-level unit that oversees schools and departments and manages academic quality and resource distribution across them. Faculty leadership creates the record, and university executives use it to plan curriculum, allocate funding, and review performance. It holds the faculty's name, scope, and links to subordinate units.","specialization":""},{"id":"elem-f2-id-879","type":"BusinessObject","name":"Financial Forecast","documentation":"**A projection of future financial results.** A Financial Forecast estimates future income, spending, and balances based on current data and assumptions. Finance staff create forecasts to anticipate funding gaps, plan investments, and inform senior management. Budget holders use forecasts to adjust their spending plans. The model treats Financial Forecast as a planning tool that supports decision-making about financial sustainability and resource allocation. Forecasts are updated regularly and compared against actual results.","specialization":""},{"id":"elem-f2-id-878","type":"BusinessObject","name":"Financial Journal","documentation":"**A chronological record of financial entries.** A Financial Journal logs individual accounting transactions as they occur, showing the accounts affected and amounts debited or credited. Finance staff create journal entries to record adjustments, accruals, and transfers. Auditors and management rely on journals to trace every figure back to source. In the model, Financial Journal is the detailed ledger underlying all financial reports and reconciliations.","specialization":""},{"id":"elem-f2-id-847","type":"BusinessObject","name":"Goverment","documentation":"**A government department or public body.** This type of external organisation sets policy, provides funding, or regulates aspects of the institution's operations. The institution records government entities to manage compliance, reporting, and funding relationships. Senior management and compliance teams use the record to track obligations, respond to consultations, and secure public funding. The record includes contact details for relevant officials and reference numbers for funding or regulatory schemes.","specialization":""},{"id":"elem-f2-id-863","type":"BusinessObject","name":"Guidence","documentation":"**Advisory information that supports governance.** Guidence explains how to interpret and apply policies, regulations, and standards in day-to-day work. It is produced by specialist teams or central functions and used by staff and managers across the institution. It provides recommended approaches without being mandatory. In this model, Guidence is a reference for decision-making and for carrying out governance-related tasks.","specialization":""},{"id":"elem-f2-id-825","type":"BusinessObject","name":"HEAR","documentation":"**A detailed record of academic achievement.** The Higher Education Achievement Report is a formal document issued to a student upon completion of a programme. It lists the modules taken, the grades achieved, and the awards conferred. The institution creates the report as a detailed statement of the student's academic record. The student uses the report when applying for employment or further study. Employers and admissions tutors rely on the report to verify achievements and compare candidates. In this model, the HEAR supports the graduation process by providing a consistent record of achievement.","specialization":""},{"id":"elem-f2-id-906","type":"BusinessObject","name":"Health","documentation":"**A record of an employee's health and wellbeing information.** Health records in a human resources context hold occupational health assessments, sickness absence details, medical clearance for work and adjustments needed to support an employee. Human resources and occupational health practitioners create and manage these records under strict confidentiality. Managers use them to make decisions about fitness for work, return to work and reasonable adjustments. The employee provides consent for the use of this information and relies on the record to receive appropriate support.","specialization":""},{"id":"elem-f2-id-925","type":"BusinessObject","name":"Index","documentation":"**A navigable list of information.** An index organises references to information assets, enabling users to locate specific data or records quickly. Information managers create and maintain indexes, and staff across the institution rely on them to retrieve information without scanning entire repositories. The index supports decisions and work that depend on timely access to accurate information. It reduces search time and improves the consistency of information retrieval.","specialization":""},{"id":"elem-f2-id-923","type":"BusinessObject","name":"Information Asset","documentation":"**A piece of information with value.** An information asset is any data, document, record or knowledge that the institution manages as a resource. Creators include staff who produce or collect the information, and users are decision-makers, analysts and operational teams who rely on it for their work. The asset supports evidence-based decisions, reporting, and compliance activities. It is registered and controlled to ensure its quality and availability.","specialization":""},{"id":"elem-f2-id-817","type":"BusinessObject","name":"Inncident","documentation":"**A record of an event with legal significance.** It documents what happened, when, who was involved, and what immediate response took place. Staff who observe or manage the event create the record. Legal and compliance teams rely on it to assess liability, reporting duties, and corrective action. It supports decisions about whether an investigation or further legal step is required. In the Legal group, it is the starting point for many formal processes.","specialization":""},{"id":"elem-f2-id-858","type":"BusinessObject","name":"Innvestigation","documentation":"**A formal inquiry into a legal matter.** It holds the scope, evidence, findings, and recommended actions from an examination of an incident or allegation. Investigators or legal staff create and maintain it. Decision-makers rely on it to determine whether rules were broken, who is responsible, and what remedy or sanction applies. It supports decisions on disciplinary action, corrective measures, and external reporting. In the Legal group, it follows an incident and precedes litigation or settlement.","specialization":""},{"id":"elem-f2-id-932","type":"BusinessObject","name":"Insurance","documentation":"**A contract transferring financial risk.** Insurance provides cover against specified losses, such as damage to property, liability claims, or interruption of operations. The institution buys insurance policies and records their terms, premiums, and claims. Finance and estates teams manage insurance to protect assets and activities. The model uses Insurance to capture risk transfer arrangements that affect financial liabilities and recovery. Insurance records are reviewed when claims arise and when policies renew.","specialization":""},{"id":"elem-f2-id-928","type":"BusinessObject","name":"Invoice","documentation":"**A request for payment for goods or services.** An Invoice states the amount owed, the supplier or payer, and payment terms. The finance office issues invoices to debtors for services rendered and receives invoices from creditors for purchases. Invoice records support verification, approval, and payment. In the model, Invoice links the purchasing or sales process to accounts payable and receivable and is used by finance staff for cash flow management.","specialization":""},{"id":"elem-f2-id-921","type":"BusinessObject","name":"Job Application","documentation":"**A record of a candidate's request for employment.** A job application captures the personal details, qualifications, employment history and supporting statements submitted by an individual seeking a particular job role. Human resources and hiring managers use it to shortlist candidates and to prepare for interviews. The candidate creates and submits the application, and relies on it to present their suitability. The record supports fair and consistent selection decisions and is retained according to data protection requirements.","specialization":""},{"id":"elem-f2-id-933","type":"BusinessObject","name":"Job Offer","documentation":"**A formal offer of employment to a candidate.** A job offer sets out the terms and conditions of employment, including the job role, salary, start date, working hours and any probationary period. Human resources creates the offer after a selection decision and sends it to the successful candidate. The candidate uses the offer to decide whether to accept the role. The record becomes the basis for the employment contract and is retained to evidence the terms agreed.","specialization":""},{"id":"elem-f2-id-870","type":"BusinessObject","name":"Job Role","documentation":"**A defined position within the organisation's structure.** A job role describes the purpose, responsibilities, reporting relationships and required competencies of a specific post. Human resources and line managers create and maintain job role descriptions to support recruitment, performance management and pay benchmarking. Employees use the job role to understand their duties and career expectations. The role record links to training, appraisal and salary elements, and provides a consistent reference for organisational design.","specialization":""},{"id":"elem-f2-id-910","type":"BusinessObject","name":"Job Termination","documentation":"**A record of the end of an employee's employment.** Job termination captures the reason for leaving, the effective date, notice period and any exit arrangements such as final pay or return of assets. Human resources and line managers create the record when employment ends, whether through resignation, dismissal or redundancy. The employee and payroll team use it to settle final payments and benefits. The record supports compliance with employment law and provides a clear audit trail for future references.","specialization":""},{"id":"elem-f2-id-927","type":"BusinessObject","name":"Lease","documentation":"**An agreement to use a physical asset or space.** The lease records the parties, term, rent, and conditions. The team managing property creates it when the institution takes on or grants use of a building, room, or equipment. Finance relies on it to schedule payments, and facilities staff use it to know what space is occupied and by whom.","specialization":""},{"id":"elem-f2-id-916","type":"BusinessObject","name":"Leave","documentation":"**A record of an employee's time away from work.** Leave records capture the type of absence, such as annual leave, sick leave, parental leave or special leave, along with start and end dates and approval status. Employees request leave through this record, and managers approve or reject it based on policy and staffing needs. Human resources uses the leave record to track entitlements, monitor absence patterns and ensure accurate pay. The record supports workforce planning and compliance with statutory leave rights.","specialization":""},{"id":"elem-f2-id-931","type":"BusinessObject","name":"Legislation","documentation":"**Legal requirements imposed by government.** Legislation consists of statutes and statutory instruments that the institution must follow. It sets binding obligations for areas such as data protection, equality, health and safety, and employment. The institution records relevant legislation and maps it to its policies and procedures. Compliance teams and governance bodies use this record to ensure the institution operates lawfully and to prepare for audits.","specialization":""},{"id":"elem-f2-id-877","type":"BusinessObject","name":"Library Loan","documentation":"**The lending of a collection item.** A Library Loan records the temporary allocation of a collection item to a borrower. Library staff create a loan record when an item is issued, and update it on return, renewal or recall. Borrowers rely on the Library Loan to understand due dates and any charges for late return. Library staff use the record to track circulation, manage holds and ensure items are available to other users. The Library Loan supports decisions on loan periods, fine policies and demand for multiple copies. It links a borrower, a collection item and the dates of the loan transaction.","specialization":""},{"id":"elem-f2-id-934","type":"BusinessObject","name":"Licence","documentation":"**A grant of permission to use something.** It records what the institution is allowed to do with property, data, or intellectual assets, together with limits, fees, and expiry. Legal and procurement staff create and maintain it. Operational teams rely on it to ensure they act within permitted boundaries. It supports decisions on renewal, compliance, and risk of misuse. In the Legal group, it is a permissive legal instrument rather than a mutual exchange.","specialization":""},{"id":"elem-f2-id-827","type":"BusinessObject","name":"Litigation","documentation":"**A record of a formal legal dispute.** It captures the parties, claims, court or tribunal references, and current status of a contested matter. The legal team creates and updates it. Senior managers and the governing body rely on it to understand legal exposure and resource needs. It supports decisions on settlement, defence strategy, and financial provision. In the Legal group, it represents the most adversarial stage of a legal matter.","specialization":""},{"id":"elem-f2-id-908","type":"BusinessObject","name":"Maintenance","documentation":"**A record of upkeep work on assets.** It holds what work was done or needed, when, by whom, and at what cost. The facilities team creates maintenance records to log repairs, inspections, and preventive tasks for physical assets. Asset managers and budget holders use these records to ensure equipment and buildings remain safe and operational, and to plan future spending.","specialization":""},{"id":"elem-f2-id-936","type":"BusinessObject","name":"Market Analysis","documentation":"**A structured assessment of demand and competition.** It examines characteristics of prospective students, employer needs, competitor offerings and market trends to inform strategy. Market research and planning staff create the analysis; senior leadership uses it to decide on new programmes, pricing and positioning. The model records data sources, findings and recommendations, linking to campaigns and brand decisions.","specialization":""},{"id":"elem-f2-id-866","type":"BusinessObject","name":"Merchandise","documentation":"**Physical items carrying the institution's brand.** It includes clothing, stationery, bags and other goods sold in campus shops or given away at events. Marketing and retail staff select and manage merchandise; students, staff and alumni purchase or receive items that raise brand visibility. The model records product descriptions, stock levels, orders and sales data.","specialization":""},{"id":"elem-f2-id-851","type":"BusinessObject","name":"Mission","documentation":"**A formal statement of an institution's purpose.** It defines why the institution exists and what it fundamentally seeks to accomplish. Created by senior leadership and governing bodies, it guides strategic planning and communicates core intent to staff, students, and external partners. It is used to align activities and evaluate whether initiatives fit the institution's fundamental aims.","specialization":""},{"id":"elem-f2-id-859","type":"BusinessObject","name":"Module","documentation":"**A self-contained unit of study.** A module is a discrete component of a programme with its own learning outcomes, credit value, and assessment. It covers a specific topic or skill. Academics design modules to fit within a curriculum and deliver them through courses. Students take several modules to complete a programme. The module record holds the syllabus, learning materials, and assessment details. Administrators use module records to manage enrolment, progression, and awards. The record supports the structure of programmes and the calculation of student results.","specialization":""},{"id":"elem-f2-id-815","type":"BusinessObject","name":"Monitoring","documentation":"**The ongoing tracking of performance.** Monitoring records progress against plans, targets and benefits. Project and programme offices create monitoring data, while sponsors and governance bodies use it to decide whether work stays on track, needs corrective action, or should stop. Monitoring captures status, milestones, risks and benefit measures at regular points. In this model, Monitoring supports the Programme of Work, Projects and Benefits by giving decision-makers a current view of delivery and value.","specialization":""},{"id":"elem-f2-id-874","type":"BusinessObject","name":"Needs Assessment","documentation":"**An evaluation of individual support requirements.** A needs assessment records what a person requires to access education or work. Support staff create it through interview, evidence, and professional judgement. The individual and support teams rely on it to plan adjustments, allocate equipment, or arrange specialist help. It supports decisions about reasonable accommodations and funding. The assessment includes identified barriers, agreed outcomes, and review dates. It is stored with the person's support record and shared only with authorised staff. Leaders use anonymised assessments to plan services and identify demand.","specialization":""},{"id":"elem-f2-id-912","type":"BusinessObject","name":"Online","documentation":"**A virtual space for digital activities.** The institution records online locations to deliver teaching, meetings, and services without a physical room. Learning platforms and administrative systems use this location type when a course component or event takes place over the internet. Timetabling staff assign Online as a location for remote sessions, and students access resources from any place. This record supports attendance tracking and digital service planning.","specialization":""},{"id":"elem-f2-id-814","type":"BusinessObject","name":"Ontology","documentation":"**A formal model of concepts.** An ontology defines the categories, properties and relationships within a domain, providing a shared vocabulary for information. Information specialists create it, and system designers, data managers and users rely on it to ensure consistent interpretation of information across the institution. It supports data integration, search and knowledge sharing. The ontology clarifies meaning across different systems and avoids ambiguity in information management.","specialization":""},{"id":"elem-f2-id-869","type":"BusinessObject","name":"Patent","documentation":"**A legal right protecting an invention.** It records the ownership, filing status, and scope of protection for a novel technical solution developed through research. Researchers and the institution create the record when they disclose an invention and pursue protection. The research office, legal advisers, and commercial partners rely on it to manage intellectual property, license technology, and decide whether to maintain or enforce rights. It supports decisions about commercialisation and protects the institution's investment in research outputs.","specialization":""},{"id":"elem-f2-id-926","type":"BusinessObject","name":"Payment","documentation":"**A transfer of money to settle an obligation.** A Payment records money leaving or entering the institution to pay invoices, salaries, grants, or other liabilities, or to receive income. Finance staff process payments through bank accounts and record them against invoices and accounts. Payments evidence that a debt has been discharged. The model uses Payment to track actual cash movements and to reconcile accounts. Payment records include the date, amount, method, and parties.","specialization":""},{"id":"elem-f2-id-938","type":"BusinessObject","name":"Physical Asset","documentation":"**A tangible item owned or leased.** Physical Asset records details about that item: what it is, where it is, its condition, and its maintenance history. Facilities staff create and update the record; managers across the institution use it to plan maintenance, allocate resources, manage leases, and ensure security. The record supports decisions about repairs, replacement, and space use. In the Facilities & Properties group, Physical Asset connects to Maintenance, Lease, Resource Bookings, Security, and Service Request, giving those processes a common object to reference.","specialization":""},{"id":"elem-f2-id-929","type":"BusinessObject","name":"Policy","documentation":"**A formal statement of institutional intent.** A policy sets out what the institution will do in a particular area and the principles that apply. Senior leaders or governing bodies approve policies, and staff use them to make consistent decisions. Policies define boundaries and expectations for conduct and operations. In the model, each policy is a record that links to related procedures, standards, and guidance.","specialization":""},{"id":"elem-f2-id-846","type":"BusinessObject","name":"Post Academic Career","documentation":"**A record of a graduate's later career.** This business object holds information about the employment, further study, volunteering, or other activity that a former student undertakes after leaving the institution. The institution's alumni or careers team creates and maintains the record using information supplied by the graduate or gathered from public sources. The institution relies on this record to understand where its former students go, to plan alumni engagement, and to report on graduate outcomes. It supports decisions about course design, student support, and relationships with alumni.","specialization":""},{"id":"elem-f2-id-818","type":"BusinessObject","name":"Principles","documentation":"**Foundational beliefs that guide governance.** Principles are high-level statements of the values and commitments that underpin the institution's approach. They are approved by governing bodies and inform the creation of policies, procedures, and standards. Decision-makers refer to principles to ensure choices align with the institution's core aims. In this model, Principles act as the ethical and strategic anchor for other governance elements.","specialization":""},{"id":"elem-f2-id-897","type":"BusinessObject","name":"Procedure","documentation":"**Step-by-step instructions for a task.** A procedure describes the specific actions staff must take to carry out a process or comply with a policy. It is created by operational managers or process owners and used by front-line staff. Procedures reduce ambiguity and ensure activities are performed consistently. In the model, a Procedure is linked to relevant Policy and Standard elements and is reviewed when those change.","specialization":""},{"id":"elem-f2-id-829","type":"BusinessObject","name":"Proffessional Service's Department","documentation":"**A unit that provides non-academic support to the institution.** This department delivers services such as human resources, finance, information technology, estates, or library support. The model records the professional service's department as an internal organisational element with a defined service remit. Service owners create and update the record, and staff and students use it to find the right support function. It holds the unit's name, service catalogue, and reporting line, helping the university coordinate support operations and account for resources.","specialization":""},{"id":"elem-f2-id-914","type":"BusinessObject","name":"Programme","documentation":"**A planned pathway to a qualification.** A programme is a structured set of modules and other requirements that a student completes to earn a qualification. It sets out the sequence of study, any optional choices, and the rules for progression. Academic staff design programmes and submit them for approval. Students enrol on a programme and follow its requirements. Administrators use programme records to track student progress and award qualifications. The record supports recruitment, funding, and external reporting. It holds the programme specification, duration, and award title.","specialization":""},{"id":"elem-f2-id-873","type":"BusinessObject","name":"Programme of Work","documentation":"**A coordinated set of related projects.** A Programme of Work brings together Projects that share objectives, resources or dependencies. Programme managers define and maintain the programme, while senior sponsors and portfolio owners use it to direct investment and oversee delivery. The programme records scope, schedule, budget and expected Benefits, and is subject to Monitoring. In this model, the Programme of Work provides the higher-level structure under which individual Projects are planned and managed.","specialization":""},{"id":"elem-f2-id-939","type":"BusinessObject","name":"Projects","documentation":"**Temporary efforts to deliver specific change.** A Project is a time-bound piece of work with defined scope, outputs and outcomes. Project managers create and update project records, while sponsors and programme
