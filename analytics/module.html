repairs those that fail.\n\n### Trigger\nThe arrival of a Research Infrastructure Request from an academic unit, when the requested asset is not currently assigned to another project.\n\n### Consumes\nResearch Infrastructure Request supplies the required asset, preferred dates, and the research purpose. Research Infrastructure Asset supplies the current inventory location, condition status, and existing booking commitments. Research Equipment Record supplies the maintenance history and operating status for each requested item. Facility Booking supplies the current allocation diary showing which assets are already reserved.\n\n### Steps\nThe request is checked against the Research Infrastructure Asset register to confirm the asset exists and is functional. If the asset is unavailable due to prior booking, the request is returned with alternative dates. If functional, the process creates a Facility Booking for the requested period and updates the Research Infrastructure Asset to show reserved status. At the end of the booking, the process records usage and any fault in the Research Equipment Record. A fault triggers a maintenance order and changes the asset status to unavailable until repair is completed.\n\n### Produces\nFacility Booking: issued when an asset is reserved for a specific period, establishing the requester's right to use it. Research Equipment Record: updated after each booking with usage and fault observations, leaving the record reflecting current condition. Maintenance Order: issued when a fault is recorded, establishing that repair work is authorised.\n\n### Outcome\nResearch infrastructure is either in use, reserved, or under repair, and no request proceeds without a valid Facility Booking.\n\n### Fails when\nThe Research Infrastructure Asset register is not updated at booking time and two projects receive the same Facility Booking; downstream research activity stalls because the asset is double-booked.","specialization":""},{"id":"elem-id-888","type":"BusinessProcess","name":"Research Opportunity Analysis","documentation":"### Identity\nWork here evaluates the feasibility and strategic fit of research opportunities before resources are committed.\n\n### Trigger\nThe arrival of a Research Opportunity from the scanning or collaboration activity, when the opportunity has not yet been assessed.\n\n### Consumes\nResearch Opportunity supplies the call or proposal details, deadline, and expected outcomes. Research Capability Profile supplies the available expertise, facilities, and track record. Research Strategy supplies the institutional priorities that the opportunity must serve.\n\n### Steps\nThe Research Opportunity is scored against the Research Strategy for alignment. The process then checks the Research Capability Profile to confirm sufficient expertise and capacity. If capacity is missing, the process records a capacity gap and either rejects the opportunity or proposes a collaboration. A feasibility assessment is produced, covering budget, timeline, and risk. The process issues an Opportunity Assessment Report with a Go/No-Go Decision.\n\n### Produces\nOpportunity Assessment Report: issued when the evaluation is complete, establishing the evidence and recommendation. Go/No-Go Decision: issued as the final call, establishing whether the institution will pursue the opportunity.\n\n### Outcome\nNo research opportunity proceeds without a documented feasibility assessment and explicit decision.\n\n### Fails when\nThe capacity check is skipped and an opportunity is marked Go despite insufficient staff; the subsequent application fails or the project stalls.","specialization":""},{"id":"elem-id-894","type":"BusinessProcess","name":"Research Output Mgt","documentation":"### Identity\nWork here validates, deposits, and assigns metadata to research outputs so each output is recorded as an institutionally owned research asset.\n\n### Trigger\nThe arrival of a Research Final Report from a research activity, when the underlying research has concluded.\n\n### Consumes\nResearch Final Report supplies the completed findings and the evidence that the research activity ended. Research Output supplies the draft version of the output to be validated and deposited. Data Management Plan supplies the required storage and open access conditions for the output. Open Access Compliance Record supplies the funder-required embargo or licence terms.\n\n### Steps\nThe Research Final Report is checked for completeness against the output description. The draft Research Output is then validated against quality, format, and metadata requirements. If validation fails, the output is returned to the originator with a Correction Notice. If validation passes, the output is deposited in the institutional repository. The process then applies the open access conditions from the Data Management Plan and creates or updates the Open Access Compliance Record to show compliance. A persistent identifier is assigned and the output's Metadata Record is updated. The process issues the validated Research Output.\n\n### Produces\nResearch Output: issued when the output has passed validation and been deposited, establishing it as a citable research asset. Open Access Compliance Record: issued or updated when the deposit meets the funder's open access mandate, establishing the evidence of compliance. Metadata Record: issued when descriptive fields are confirmed, establishing discoverability.\n\n### Outcome\nEvery completed research activity has a validated, deposited output with a compliance record.\n\n### Fails when\nThe validation step approves an output that is missing the required data access statement; the Open Access Compliance Record is then incorrect and the institution is non-compliant.","specialization":""},{"id":"elem-id-901","type":"BusinessProcess","name":"Research Output Reporting","documentation":"### Identity\nWork here assembles the institution's research output and publication records into external reports required by funders and regulators.\n\n### Trigger\nThe arrival of a reporting deadline, when the institution has accumulated Research Outputs and Research Publications for the reporting period.\n\n### Consumes\nResearch Output supplies the validated and deposited outputs to be reported. Research Publication supplies the published records and their open access status. Research Funder Report supplies the template and required fields for the specific funder. Open Access Compliance Record supplies the compliance evidence for each publication.\n\n### Steps\nThe process collects all Research Outputs and Research Publications created during the reporting period. Each item is checked against the Research Funder Report template to ensure all required fields are present. Missing fields trigger a request to the owning researcher for completion. The populated Research Funder Report is submitted to the funder before the deadline.\n\n### Produces\nResearch Funder Report: issued as the completed submission, establishing the institution's formal reporting of research outputs.\n\n### Outcome\nThe institution has fulfilled its research output reporting obligations for the period.\n\n### Fails when\nThe report is submitted with missing Open Access Compliance Records and the funder rejects the return; the institution is recorded as non-compliant.","specialization":""},{"id":"elem-id-889","type":"BusinessProcess","name":"Research Prioritisation","documentation":"### Identity\nWork here ranks competing research proposals and allocates scarce institutional resources to those with highest strategic and return potential.\n\n### Trigger\nThe arrival of a set of Research Proposals at a prioritisation round, when available Research Budget is less than total requested.\n\n### Consumes\nResearch Proposal supplies the objectives, expected outputs, and requested resources. Research Strategy supplies the institutional priority areas and success measures. Research Budget supplies the total available allocation for the round. Research Performance Report supplies past success rates and return from prior proposals.\n\n### Steps\nEach Research Proposal is scored against the Research Strategy using predetermined criteria. The process then weights the score by past performance from the Research Performance Report to adjust for delivery risk. A ranked list is produced and the available Research Budget is allocated down the list until exhausted. Proposals that fail to receive allocation are recorded as unfunded. The process issues a Prioritisation Decision for each proposal and updates the Research Portfolio Plan.\n\n### Produces\nPrioritisation Decision: issued for each proposal, establishing its rank and whether it receives resources. Research Portfolio Plan: updated with the chosen and rejected proposals, establishing the institutional research portfolio for the period.\n\n### Outcome\nResearch resources are allocated to the highest-priority proposals and the portfolio reflects strategic choices.\n\n### Fails when\nThe scoring weights are out of date and a low-priority proposal receives funding; a high-priority proposal is left unfunded and institutional targets are missed.","specialization":""},{"id":"elem-id-895","type":"BusinessProcess","name":"Research Production","documentation":"### Identity\nWork here executes the funded research activity from award acceptance to completion, producing the research results and the final report required by the funder.\n\n### Trigger\nThe arrival of a Research Award Notice from a funder, when the institution has an approved Research Proposal and an active Research Budget for the project.\n\n### Consumes\nResearch Award Notice supplies the funder's formal commitment, funding amount, and reporting conditions. Research Proposal supplies the original objectives, methodology, and timeline against which delivery is measured. Research Budget supplies the financial allocation and spending plan. Data Management Plan supplies the required data collection and storage protocols. Research Contract supplies the legal terms including intellectual property and reporting obligations.\n\n### Steps\nThe Research Award Notice is logged and matched to the Research Proposal. The process then allocates the Research Budget to cost centres and appoints a project lead. The project lead initiates the research activity, following the methodology in the Research Proposal. At each scheduled milestone, a Research Progress Report is produced and checked against the timeline. Deviations from the timeline or budget trigger a Project Review; if the review decides to continue, the timeline is revised and approved. Data collected during the activity is stored under the Data Management Plan and issued as Research Data. When the work is complete, the process assembles the Research Final Report and verifies that all funder conditions have been met. If the final report is incomplete, it is returned for revision before submission.\n\n### Produces\nResearch Data: issued as the collected datasets are deposited under the Data Management Plan, establishing the raw evidence of the research. Research Final Report: issued when all milestones are complete and the funder conditions are met, establishing the formal deliverable. Research Progress Report: issued at each milestone, establishing the current status and variance from plan.\n\n### Outcome\nThe funded research project is executed, its data is stored, and the final report is ready for output validation and funder submission.\n\n### Fails when\nThe final report is submitted without completing a milestone deviation review; the funder rejects the final claim and the Research Award Notice is not closed.","specialization":""},{"id":"elem-id-891","type":"BusinessProcess","name":"Research Programme Development","documentation":"### Identity\nWork here shapes broad research ideas into structured programme plans and, where appropriate, into submitted research proposals.\n\n### Trigger\nThe arrival of a Research Programme Idea from a senior academic, when the idea aligns with a priority area in the Research Strategy.\n\n### Consumes\nResearch Programme Idea supplies the initial concept, target research question, and potential funders. Research Strategy supplies the institutional priorities and resource boundaries. Research Capability Profile supplies the available staff, facilities, and track record. Research Performance Report supplies past programme outcomes and success rates. Research Budget supplies the indicative funding envelope for programme development.\n\n### Steps\nThe Research Programme Idea is logged and scored against the Research Strategy. If it fails alignment, the idea is rejected and recorded. If aligned, the process assembles a programme team from the Research Capability Profile. The team defines the programme's objectives, work packages, milestones, and required resources. A Research Programme Plan is drafted and reviewed by the relevant research committee. The plan is approved or returned for revision. Once approved, the process identifies suitable funding calls and drafts a Research Proposal based on the plan. The proposal is approved and submitted. If the proposal is rejected, the process records the rejection and decides whether to revise and resubmit or close the idea.\n\n### Produces\nResearch Programme Plan: issued when the idea is structured and approved, establishing the agreed scope, resources, and timeline. Research Proposal: issued when a funding call is targeted, establishing the formal application for external funding.\n\n### Outcome\nPriority research ideas are translated into approved programme plans and, where funded, into submitted proposals.\n\n### Fails when\nThe Research Programme Plan is approved without checking the Research Capability Profile and a key staff member is already committed elsewhere; the programme stalls and the proposal is withdrawn.","specialization":""},{"id":"elem-id-905","type":"BusinessProcess","name":"Research Programme Performance Mgt","documentation":"### Identity\nWork here reviews the performance of research programmes against institutional targets and intervenes when programmes drift from planned outcomes.\n\n### Trigger\nThe arrival of a Research Performance Report at the end of a reporting period, when the report shows actual results against target.\n\n### Consumes\nResearch Performance Report supplies the completed outputs, income, and milestones for each programme. Research Strategy supplies the target outcomes and priorities for the period. Research Budget supplies the financial plan against which spend is evaluated.\n\n### Steps\nThe Research Performance Report is parsed to extract output, income, and milestone data for each programme. The process then compares each metric against the Research Strategy targets. Programmes that meet or exceed target are recorded as on track. Programmes that miss target trigger a variance analysis to identify the cause. The process issues a Performance Review naming the underperforming programme and the required corrective action. If the cause is financial, the Research Budget is examined and a reallocation is proposed.\n\n### Produces\nPerformance Review: issued for each programme, establishing its current performance status and any variance. Corrective Action Plan: issued when a programme is off target, establishing the actions and owners required to recover performance.\n\n### Outcome\nResearch programme performance is measured and every off-target programme has an agreed recovery plan.\n\n### Fails when\nThe Research Performance Report is received but no variance analysis is run; a failing programme continues without correction and institutional research income falls below target.","specialization":""},{"id":"elem-id-900","type":"BusinessProcess","name":"Research Publication Mgt","documentation":"### Identity\nWork here moves validated research outputs through the publication submission and open access process so that every publication is compliant and recorded.\n\n### Trigger\nThe arrival of a validated Research Output from the output management process, when the output has an assigned persistent identifier and an Open Access Compliance Record.\n\n### Consumes\nResearch Output supplies the final version of the research finding to be published. Open Access Compliance Record supplies the funder-required open access route, embargo, and licence. Data Management Plan supplies the publisher's requirements for data availability statements. Copyright Transfer Agreement supplies the author's rights retained or transferred to the publisher.\n\n### Steps\nThe Research Output is matched to its Open Access Compliance Record to determine the required publication route. The process then selects a target journal or publisher and prepares the submission package including the manuscript and data availability statement. The package is submitted and the publisher's decision is awaited; if rejected, the process revises and resubmits to another outlet. When accepted, the Copyright Transfer Agreement is reviewed to ensure open access compliance. If the agreement conflicts with the Open Access Compliance Record, the process negotiates a compliant licence or selects another publisher. On final acceptance, the output is published and the process issues a Research Publication. The Open Access Compliance Record is updated to show published status and the persistent identifier.\n\n### Produces\nResearch Publication: issued when the output is accepted and published, establishing the citable public record. Open Access Compliance Record: updated to show published status and licence, establishing final compliance evidence. Publication Record: issued to log the publisher, date, and open access route, establishing an audit trail.\n\n### Outcome\nEvery research output that reaches publication is published under a compliant open access licence and its publication is recorded.\n\n### Fails when\nThe Copyright Transfer Agreement is signed without checking against the Open Access Compliance Record and the publication is not open access; the institution breaches the funder mandate and the publication is excluded from the next assessment.","specialization":""},{"id":"elem-id-906","type":"BusinessProcess","name":"Research Quality Mgt","documentation":"### Identity\nWork here assures that research activity meets ethical, integrity, and quality standards before and during execution.\n\n### Trigger\nThe arrival of a Research Ethics Application from a researcher, when the proposed research involves human participants, personal data, or sensitive material.\n\n### Consumes\nResearch Ethics Application supplies the study design, participant information, consent processes, and risk assessments. Research Protocol supplies the planned methodology and data handling steps. Data Management Plan supplies the privacy and storage controls for any personal data. Audit Findings supplies prior nonconformities from earlier reviews of similar research.\n\n### Steps\nThe Research Ethics Application is checked for completeness and for inclusion of all required approvals. The process then reviews the Research Protocol against the institution's ethical framework, focusing on consent, risk, and vulnerable participants. If the application has gaps, it is returned with a Request for Revision. If complete, the review panel decides whether to approve, require modifications, or reject. Approval issues an Ethics Approval with conditions that are recorded against the research project. During the research, a Quality Review Report is produced at each milestone, drawing on Audit Findings to verify that conditions are being met. Any nonconformity triggers a Corrective Action Request.\n\n### Produces\nEthics Approval: issued when the research design meets ethical standards, establishing the permission to proceed. Quality Review Report: issued at each milestone, establishing the current state of quality and ethics compliance. Corrective Action Request: issued when a nonconformity is found, establishing the required fix and deadline.\n\n### Outcome\nAll active research involving sensitive subjects has an Ethics Approval and is periodically reviewed for quality.\n\n### Fails when\nThe Ethics Approval is issued without checking the consent process and a participant complaint arises; the research is suspended and the institution is investigated.","specialization":""},{"id":"elem-id-907","type":"BusinessProcess","name":"Researcher Performance Mgt","documentation":"### Identity\nWork here assesses individual researcher performance and agrees development actions to improve research capability.\n\n### Trigger\nThe start of the annual appraisal cycle, when each researcher has a Researcher Performance Record for the previous period.\n\n### Consumes\nResearcher Performance Record supplies the research outputs, funding success, and impact activity for the period. Training Completion Record supplies the completed development activities since the last appraisal. Research Output supplies the evidence of published work and its quality.\n\n### Steps\nThe Researcher Performance Record and Research Output are reviewed together to measure against the institution's research standards. The Training Completion Record is checked to confirm required development was completed. A Performance Appraisal meeting is held where the reviewer and researcher agree on strengths and areas for improvement. The process then issues a Development Plan with agreed training or workload changes for the next period.\n\n### Produces\nPerformance Appraisal: issued after the meeting, establishing the recorded assessment and agreed objectives. Development Plan: issued with the appraisal, establishing the specific actions and funding allocated to development.\n\n### Outcome\nEach researcher has a current appraisal and an agreed plan for improving performance.\n\n### Fails when\nThe Training Completion Record is not checked and a required training course is missed; the researcher's development plan does not address the gap and performance stalls.","specialization":""},{"id":"elem-id-897","type":"BusinessProcess","name":"Researcher Training & Development","documentation":"### Identity\nWork here identifies and addresses the development needs of research staff to maintain research capability.\n\n### Trigger\nThe arrival of a Researcher Training Needs Assessment at the start of an appraisal cycle, when the researcher does not have a current Training Plan.\n\n### Consumes\nResearcher Training Needs Assessment supplies the identified skill gaps against the research strategy. Training Completion Record supplies prior completed training and current competencies.\n\n### Steps\nThe training needs assessment is analysed to prioritise required skills. A Training Plan is drafted and agreed with the researcher and line manager. The plan is scheduled against available training dates. As training is completed, the Training Completion Record is updated.\n\n### Produces\nTraining Plan: issued when the needs are prioritised and agreed, establishing the development route. Training Completion Record: updated after each course, establishing progress.\n\n### Outcome\nEvery research staff member has a current Training Plan and an accurate completion record.\n\n### Fails when\nThe Training Needs Assessment is not updated and an obsolete Training Plan is issued; the researcher misses required training and fails a performance review.","specialization":""},{"id":"elem-id-832","type":"BusinessProcess","name":"Risk Mgt","documentation":"### Identity\nThis process identifies, assesses, and treats the institution's strategic, operational, and compliance risks, and reports the aggregate risk position to the governing body. It is the part of the capability that keeps risk within the approved appetite.\n\n### Trigger\nThe discovery of a new risk, an incident, or a scheduled risk review triggers the process, when the current Risk Register no longer reflects the actual exposure.\n\n### Consumes\nRisk Register supplies the current set of risks, their owners, and existing treatments. Incident Report supplies details of events that have caused loss or harm. Strategic Objective supplies the objectives against which risk impact is judged. Risk Appetite Statement supplies the amount and type of risk the institution is willing to accept.\n\n### Steps\nFirst the process identifies the new or changed risk and assigns an owner. It analyses the likelihood and impact using defined criteria. It compares the assessed risk against the Risk Appetite Statement. If the risk is outside appetite, it develops treatment options and selects one. It assigns treatment actions with owners and due dates. It updates the Risk Register with the new risk status. It reports the risk profile to the risk committee at the next scheduled meeting.\n\n### Produces\nRisk Assessment records the likelihood, impact, and risk rating for each risk considered. Risk Treatment Plan records the selected treatment actions, owners, and deadlines. Updated Risk Register records the changed risk posture after treatment.\n\n### Outcome\nAll identified risks have an assessed rating, a treatment decision, and an owner; the aggregate residual risk is within the approved appetite.\n\n### Fails when\nThe Risk Appetite Statement is absent or ambiguous, because risks cannot be judged as acceptable or unacceptable and the process issues no treatment decisions, leaving exposure unmanaged.","specialization":""},{"id":"elem-id-850","type":"BusinessProcess","name":"Scholarship & Bursary Mgt","documentation":"### Identity\nThe work of awarding and paying scholarships and bursaries to students.\n\n### Trigger\nA Scholarship Application or Bursary Eligibility List is received.\n\n### Consumes\nScholarship Application supplies the student's need and merit evidence. Bursary Eligibility List supplies students meeting need criteria. Scholarship Budget supplies available funds. Award Criteria supplies the ranking rules.\n\n### Steps\nApplications are checked for eligibility against Award Criteria. Eligible candidates are ranked by merit or need. A Scholarship Award is approved for selected students. The award is recorded on the Student Fee Account. Payments are made or fee reductions applied. A Scholarship Payment Record is created. Students not selected are notified.\n\n### Produces\nScholarship Award. Scholarship Payment Record. Student Fee Account update.\n\n### Outcome\nScholarships and bursaries are allocated within budget to eligible students.\n\n### Fails when\nScholarship Budget is insufficient for the number of eligible applicants, leaving some without support.","specialization":""},{"id":"elem-id-982","type":"BusinessProcess","name":"Space Utilisation","documentation":"### Identity\nMeasurement and management of how space is used across the estate, including allocation, utilisation surveys, and reallocation.\n\n### Trigger\nThe arrival of a space utilisation survey schedule or a space request from a department.\n\n### Consumes\nSpace Request supplies the department's requirement and intended use. Space Inventory supplies the current room list, capacities, and owners. Space Utilisation Survey supplies measured occupancy and usage data.\n\n### Steps\nThe process records space requests and validates them against policy. It reviews current utilisation data to identify underused space. It proposes reallocation or new allocation. It updates the space inventory with ownership changes. It publishes allocations and monitors occupancy. If demand exceeds supply, a waiting list or prioritisation rule is applied. Survey results are reviewed annually to adjust the space strategy.\n\n### Produces\nSpace Allocation Decision states which room is assigned to which unit. Space Utilisation Report records measured occupancy against capacity. Space Inventory Update records any change to room ownership or usage type.\n\n### Outcome\nThe institution uses its space efficiently, with demand matched to available capacity and underused space reallocated.\n\n### Fails when\nSpace Inventory is outdated or departments do not report changes, causing double bookings and wasted spaces.","specialization":""},{"id":"elem-id-935","type":"BusinessProcess","name":"Sport & Recreation Mgt","documentation":"### Identity\nManagement of sport and recreation facilities and programmes, including bookings, memberships, and events.\n\n### Trigger\nThe arrival of a facility booking or a programme registration.\n\n### Consumes\nFacility Booking Request supplies the facility and time. Membership Application supplies the applicant's details. Programme Schedule supplies the organised activities.\n\n### Steps\nThe process checks availability. It confirms bookings. It issues memberships. It runs programmes. It maintains facilities. It manages safety and supervision. It collects fees. It reports on usage. If a facility is double-booked, it resolves the conflict.\n\n### Produces\nFacility Booking Confirmation states the reserved slot. Membership Card states the member's access. Programme Attendance Record records participants.\n\n### Outcome\nThe community has access to sport and recreation, contributing to well-being.\n\n### Fails when\nA facility is not maintained, causing injury or closure.","specialization":""},{"id":"elem-id-954","type":"BusinessProcess","name":"Staff Absence Mgt","documentation":"### Identity\nManagement of employee absence, including sick leave, annual leave, and other leave types.\n\n### Trigger\nThe arrival of an absence notification from an employee or manager.\n\n### Consumes\nAbsence Notification supplies the dates, type, and reason. Employee Record supplies the employee's leave entitlement and sickness history. Leave Policy supplies the rules for each absence type.\n\n### Steps\nThe process records the absence. It checks against the employee's remaining entitlement. It approves or queries the absence. It monitors sickness triggers and patterns. It initiates return-to-work interviews for long-term sickness. It refers to occupational health where required. It updates the employee's absence record. It reports absence data to management.\n\n### Produces\nAbsence Record states the approved absence and dates. Return to Work Interview Record states the outcome of the interview. Absence Trigger Alert notifies the manager when an employee reaches a policy threshold.\n\n### Outcome\nAbsence is recorded and managed within policy, and excessive absence is addressed.\n\n### Fails when\nAbsence records are not maintained, causing entitlement errors and unmanaged absence patterns.","specialization":""},{"id":"elem-id-947","type":"BusinessProcess","name":"Staff Engagement","documentation":"### Identity\nStaff engagement activities, including surveys, town halls, and feedback mechanisms. It measures and improves employee engagement.\n\n### Trigger\nThe arrival of a staff survey results or a scheduled engagement event.\n\n### Consumes\nStaff Survey Results supply the engagement scores and comments. Engagement Action Plan supplies the agreed initiatives. Employee Feedback Record supplies ad hoc suggestions.\n\n### Steps\nThe process analyses survey results. It identifies engagement drivers and low-scoring areas. It develops an action plan with owners. It monitors the implementation of actions. It communicates progress to staff. It runs follow-up pulse surveys. It updates the engagement dashboard. If an action fails, it is re-scoped.\n\n### Produces\nStaff Engagement Report states the survey results and trends. Engagement Action Plan states the agreed improvement actions. Engagement Communication informs staff of progress.\n\n### Outcome\nThe institution understands and improves staff engagement, leading to higher retention and morale.\n\n### Fails when\nEngagement survey results are ignored, causing disengagement and turnover.","specialization":""},{"id":"elem-id-847","type":"BusinessProcess","name":"Staff Professional Learning","documentation":"### Identity\nThe work of arranging and recording staff professional development activities.\n\n### Trigger\nA Staff Development Need identified by an annual appraisal.\n\n### Consumes\nStaff Development Plan supplies the identified training needs. Training Course Catalogue supplies available courses. Training Budget supplies funding. Line Manager Approval supplies the authorisation.\n\n### Steps\nThe staff member selects a course from the catalogue. Approval is sought from the line manager. The booking is made. Attendance is recorded. A Staff Development Record is updated. An evaluation form is completed. The new competence is added to the staff profile.\n\n### Produces\nStaff Development Record. Training Certificate. Training Evaluation Form.\n\n### Outcome\nStaff have current professional development records and completed training.\n\n### Fails when\nThe Training Budget is exhausted and no approval is given, leaving development need unmet.","specialization":""},{"id":"elem-id-953","type":"BusinessProcess","name":"Staff Record & Details Mgt","documentation":"### Identity\nMaintenance of employee personal and job records, including changes to roles, contacts, and documentation.\n\n### Trigger\nThe arrival of a change to an employee's details or a new employee joining.\n\n### Consumes\nEmployee Record update request supplies the new or changed details. Employment Contract supplies the initial terms. Personal Document supplies identity and right-to-work evidence.\n\n### Steps\nThe process validates the change request against the employee's file. It updates the HR system. It files the supporting evidence. It notifies payroll and other dependent areas. It confirms the change to the employee. It checks for data protection compliance. It archives old records according to retention rules. If the change affects pay or benefits, it triggers the remuneration process.\n\n### Produces\nEmployee Record Update states the new data and effective date. HR System Change Confirmation records the successful update. Data Protection Compliance Record states the basis for processing.\n\n### Outcome\nEmployee records are accurate, current, and compliant, enabling reliable HR decisions.\n\n### Fails when\nA change is not recorded or is recorded incorrectly, causing payroll errors and legal risk.","specialization":""},{"id":"elem-id-943","type":"BusinessProcess","name":"Staff Recruitment","documentation":"### Identity\nEnd-to-end recruitment, from vacancy creation through selection to offer and onboarding.\n\n### Trigger\nThe arrival of a Vacancy Request from a hiring manager.\n\n### Consumes\nVacancy Request supplies the role, salary, and justification. Job Description supplies the duties and person specification. Employment Application supplies candidate information.\n\n### Steps\nThe process validates the vacancy against budget and workforce plan. It advertises the role. It shortlists applications against the person specification. It arranges interviews and assessments. It selects the preferred candidate. It conducts right-to-work and reference checks. It issues an offer letter and contract. It manages the onboarding process. If the preferred candidate declines, the next candidate is approached. All rejected candidates are informed.\n\n### Produces\nJob Advertisement states the vacancy details. Interview Assessment Record scores each candidate. Employment Contract states the agreed terms with the selected candidate.\n\n### Outcome\nThe institution hires qualified staff into approved roles, meeting authorisation and compliance requirements.\n\n### Fails when\nA vacancy cannot be filled because no suitable candidates apply, causing the role to remain vacant and work to be redistributed.","specialization":""},{"id":"elem-id-823","type":"BusinessProcess","name":"Strategic Plan Development","documentation":"### Identity\nThis process develops the institution's five-year Strategic Plan by translating the strategic vision into measurable objectives and resource commitments. It is the part of the capability that converts direction into an approved plan.\n\n### Trigger\nA mandate from the governing body to develop or renew the Strategic Plan triggers the process, when the current plan has expired or the vision has changed.\n\n### Consumes\nStrategic Vision supplies the long-term aspirations and priorities. Horizon Scan Report supplies the external environment assumptions. Stakeholder Consultation Document supplies feedback from staff, students, and external partners. Financial Forecast supplies the projected income and expenditure over the plan period.\n\n### Steps\nFirst the process establishes the planning framework and timetable. It drafts strategic objectives and priorities based on the Strategic Vision and Horizon Scan Report. It consults stakeholders and records their responses. It reconciles the draft with the Financial Forecast to ensure affordability. It refines the objectives and sets measurable targets. It prepares the Strategic Plan along with the Strategic Objectives and Key Performance Indicators. It submits the plan to the governing body for approval. It addresses any conditions or amendments requested by the governing body before final approval.\n\n### Produces\nStrategic Plan records the approved five-year objectives, priorities, and targets. Strategic Objectives records the cascade of objectives to portfolios. Financial Plan records the resource envelope aligned to the Strategic Plan.\n\n### Outcome\nThe institution has an approved Strategic Plan with measurable objectives and a matching financial plan, endorsed by the governing body.\n\n### Fails when\nThe Financial Forecast does not reconcile with the draft objectives, because the plan cannot be approved and the institution continues without a current five-year plan, leaving budget and performance management unanchored.","specialization":""},{"id":"elem-id-821","type":"BusinessProcess","name":"Strategic Plan Mgt","documentation":"### Identity\nThis process keeps the approved Strategic Plan current by reviewing progress and incorporating material changes to objectives, targets, or priorities. It is the part of the capability that ensures the plan remains a live management instrument.\n\n### Trigger\nAn annual review date, a material change in the external environment, or a performance shortfall triggers the process, when the existing plan needs adjustment.\n\n### Consumes\nStrategic Plan supplies the current objectives, targets, and priorities. Performance Report supplies actual progress against those targets. Risk Register supplies the risks that may affect future achievement. Horizon Scan Report supplies any new external assumptions.\n\n### Steps\nFirst the process reviews the actual performance against each Strategic Objective. It identifies objectives where targets are no longer achievable or no longer appropriate. It evaluates proposed changes against the Risk Register and Horizon Scan Report. It prepares a draft update to the Strategic Plan. It consults the governing body or its committee on the changes. It approves the update and issues the revised Strategic Plan.\n\n### Produces\nStrategic Plan Update records the specific changes approved and the rationale for each. Strategic Plan Review Decision records the governing body's confirmation or rejection of each change.\n\n### Outcome\nThe Strategic Plan remains aligned with current performance, risk, and external assumptions, and each change is formally approved.\n\n### Fails when\nThe Performance Report is missing or materially inaccurate, because the review cannot determine where the plan is off track and changes are either not made or made without evidence, leading to continued use of an outdated plan.","specialization":""},{"id":"elem-id-824","type":"BusinessProcess","name":"Strategic Reporting","documentation":"### Identity\nThis process prepares the institution's strategic and annual reports for the governing body, regulators, and the public, synthesising performance and governance outcomes. It is the part of the capability that discharges accountability.\n\n### Trigger\nThe end of the academic year or a regulator's reporting deadline triggers the process, when the institution must report its performance and governance.\n\n### Consumes\nPerformance Dashboard supplies the annual KPI outcomes. Governance Decisions supplies the material decisions taken by the governing body. Statutory Filings supplies the returns already submitted to regulators. Financial Statements supplies the audited financial position.\n\n### Steps\nFirst the process collects the required content from the named sources. It drafts the narrative sections of the Strategic Report. It cross-checks the performance claims against the Performance Dashboard and Financial Statements. It obtains approval from the accountable executive and the governing body. It then publishes the report according to the reporting deadline.\n\n### Produces\nStrategic Report records the institution's performance, strategy, and principal risks for the academic year. Annual Report records the combined financial and non-financial statements for the year.\n\n### Outcome\nThe governing body and external stakeholders receive a single, approved report that presents the institution's performance and governance accurately.\n\n### Fails when\nThe Financial Statements are not yet audited, because the Annual Report cannot be approved and the institution misses its statutory publication deadline, risking regulatory sanction.","specialization":""},{"id":"elem-id-820","type":"BusinessProcess","name":"Strategic Vision Development","documentation":"### Identity\nThis process creates the institution's long-term Strategic Vision through engagement with the governing body, staff, and external stakeholders. It is the part of the capability that sets the direction for all subsequent planning.\n\n### Trigger\nA request from the governing body or a significant change in the external environment triggers the process, when the existing vision is no longer seen as fit for purpose.\n\n### Consumes\nHorizon Scan Report supplies the external trends and uncertainties. Stakeholder Input supplies the values, concerns, and aspirations of staff, students, and partners. Current Strategic Plan supplies the current priorities and constraints.\n\n### Steps\nFirst the process convenes workshops with the governing body and senior leaders. It synthesises the Horizon Scan Report and Stakeholder Input into a set of draft vision statements. It tests the drafts against the Current Strategic Plan to identify contradictions. It selects a preferred vision statement. It validates the vision with the governing body and records the decision.\n\n### Produces\nStrategic Vision records the final agreed vision statement and its rationale. Strategic Scenarios records the alternative futures considered and why they were not selected.\n\n### Outcome\nThe institution has a single agreed Strategic Vision that frames the next Strategic Plan and is owned by the governing body.\n\n### Fails when\nThe governing body cannot agree on a vision statement, because no Strategic Vision is issued and the subsequent planning cycle has no directional anchor.","specialization":""},{"id":"elem-id-868","type":"BusinessProcess","name":"Student Application Mgt","documentation":"### Identity\nThe work of receiving and processing Student Applications through validation and assessment.\n\n### Trigger\nA Student Application is submitted.\n\n### Consumes\nStudent Application supplies the applicant's details, qualifications and programme choice. Entry Requirements Register supplies the criteria for the programme. Fee Status Questionnaire supplies data for fee classification. Supporting Document supplies transcripts and references.\n\n### Steps\nThe application is checked for completeness; missing documents are requested. The applicant's qualifications are verified against the Supporting Document. Fee status is assessed from the Fee Status Questionnaire. The application is matched to the programme's Entry Requirements Register. If the applicant meets minimum criteria, an Assessed Application is created with a recommendation. If not, a Rejection Notice is issued. The Assessed Application is forwarded for offer decision. Duplicate applications are identified and merged.\n\n### Produces\nAssessed Application. Application Acknowledgement. Rejection Notice.\n\n### Outcome\nEvery submitted Student Application has a validated and assessed outcome.\n\n### Fails when\nRequired evidence is missing and the applicant does not respond, leaving the application incomplete.","specialization":""},{"id":"elem-id-874","type":"BusinessProcess","name":"Student Engagement & Retention","documentation":"### Identity\nThe work of monitoring student engagement and intervening to retain at-risk students.\n\n### Trigger\nAn Engagement Alert is raised by attendance or performance data.\n\n### Consumes\nStudent Engagement Data supplies absence and participation records. Student Results Record supplies academic performance. Student Record supplies contact details. Retention Policy supplies the intervention thresholds.\n\n### Steps\nThe data is analysed to identify at-risk students. Each student's situation is reviewed. An intervention is designed (e.g., tutoring, wellbeing referral, study skills). The intervention is delivered. Follow-up is scheduled. The outcome is recorded. A Retention Report summarises the cohort.\n\n### Produces\nEngagement Intervention Record. Retention Report.\n\n### Outcome\nAt-risk students receive timely intervention to support continuation.\n\n### Fails when\nEngagement Alerts are not acted on and students withdraw without intervention.","specialization":""},{"id":"elem-id-866","type":"BusinessProcess","name":"Student Exceptional Factors Misconduct / Appeal Mgt","documentation":"### Identity\nThe work of managing student appeals, misconduct cases and exceptional circumstances affecting assessment.\n\n### Trigger\nA Student Appeal or Student Misconduct Case is submitted.\n\n### Consumes\nStudent Appeal Case supplies the grounds and evidence. Student Misconduct Case supplies the alleged breach and evidence. Student Results Record supplies the assessment context. Academic Policy supplies the rules for handling.\n\n### Steps\nThe case is logged and assigned to a case officer. The evidence is reviewed. For misconduct, a hearing panel is convened; for appeals, the grounds are checked against permissible criteria. The panel or officer issues a Case Decision. If the decision upholds the appeal, the Student Results Record is amended. If misconduct is confirmed, a penalty is applied according to Academic Policy. The student is notified. An appeal against the Case Decision is lodged and triggers a review by a higher panel. The final outcome is recorded.\n\n### Produces\nCase Decision. Student Appeal Outcome. Student Misconduct Outcome. Updated Student Results Record where applicable.\n\n### Outcome\nStudent cases are resolved fairly and records reflect final decisions.\n\n### Fails when\nEvidence is incomplete and the panel cannot reach a decision, leaving the case unresolved.","specialization":""},{"id":"elem-id-867","type":"BusinessProcess","name":"Student Financial Administration","documentation":"### Identity\nThe work of managing student fee accounts, payments, debt and refunds.\n\n### Trigger\nA Student Fee Payment or Student Fee Invoice is received or due.\n\n### Consumes\nStudent Enrolment supplies the fee liability. Student Fee Account supplies the current balance. Student Fee Payment supplies the amount paid and method. Payment Schedule supplies the due dates.\n\n### Steps\nThe payment is matched to the Student Fee Account. If the payment meets the liability, the account is marked as settled. If it is partial, the outstanding balance is recorded. Invoices are issued for unpaid balances. Payment plans are set up where eligible. Refunds for overpayments are processed and recorded. Debt collection procedures are initiated for accounts in arrears beyond a threshold. The Student Fee Account is updated with each transaction.\n\n### Produces\nUpdated Student Fee Account. Student Fee Invoice. Payment Receipt. Refund Record.\n\n### Outcome\nStudent fee accounts are accurate and current.\n\n### Fails when\nPayments cannot be matched to an account and the debt remains unresolved, causing fee collection to stop.","specialization":""},{"id":"elem-id-873","type":"BusinessProcess","name":"Student Financial Advice","documentation":"### Identity\nThe work of advising students on managing finances and funding.\n\n### Trigger\nA student books a financial advice appointment.\n\n### Consumes\nStudent Enrolment supplies the fee status. Student Fee Account supplies the current balance. Funding Body Guidance supplies eligibility rules. Budget Template supplies the planning format.\n\n### Steps\nThe advisor reviews the student's financial situation. Options are explained. A budget is created using the Budget Template. A referral for a payment plan is made. The advice is recorded. Debt advice is provided if needed.\n\n### Produces\nFinancial Advice Record. Payment Plan Referral.\n\n### Outcome\nStudents receive advice to manage their finances.\n\n### Fails when\nThe advisor cannot access the Student Fee Account and cannot advise accurately.","specialization":""},{"id":"elem-id-877","type":"BusinessProcess","name":"Student Health & Wellbeing","documentation":"### Identity\nThe work of providing health and wellbeing support to students.\n\n### Trigger\nA student self-refers or is referred for wellbeing support.\n\n### Consumes\nStudent Health & Wellbeing Referral supplies the presenting issue. Student Record supplies the student's history. Risk Assessment supplies the risk level. Wellbeing Support Plan supplies the existing plan.\n\n### Steps\nThe referral is triaged. If urgent, immediate support is arranged. A support plan is developed with the student. Ongoing sessions are delivered. The plan is reviewed. Safeguarding concerns are escalated. The Student Record is updated with the support activity.\n\n### Produces\nWellbeing Support Plan. Risk Assessment Update. Updated Student Record.\n\n### Outcome\nStudents receive appropriate wellbeing support and risk is managed.\n\n### Fails when\nA high-risk referral lacks capacity and the student is not seen, leaving risk unmanaged.","specialization":""},{"id":"elem-id-839","type":"BusinessProcess","name":"Student Induction Mgt","documentation":"### Identity\nThe work of delivering induction activities for new students.\n\n### Trigger\nA batch of Student Enrolments is created for a new intake.\n\n### Consumes\nStudent Enrolment supplies the new student list. Induction Schedule supplies the planned activities. Welcome Pack supplies orientation materials. IT Account Setup supplies the credentials.\n\n### Steps\nNew students are invited to induction events. Attendance is recorded. Activities include library, IT and safety briefing. The Welcome Pack is distributed. Completion is recorded in the Student Record. A campus tour is conducted. A follow-up survey is issued.\n\n### Produces\nInduction Attendance Record. Updated Student Record. Induction Feedback Survey.\n\n### Outcome\nNew students are oriented to institutional services and expectations.\n\n### Fails when\nThe Induction Schedule is not published in time and students do not attend, leaving orientation incomplete.","specialization":""},{"id":"elem-id-865","type":"BusinessProcess","name":"Student Mobility","documentation":"### Identity\nThe work of approving and recording student participation in exchange or study abroad placements.\n\n### Trigger\nA Student Mobility Application submitted by a student.\n\n### Consumes\nStudent Enrolment supplies the home programme. Student Mobility Application supplies the proposed host institution and period. Host Institution Agreement supplies the terms of the exchange. Study Plan supplies the intended modules abroad.\n\n### Steps\nThe application is checked for academic suitability and host availability. The student's Study Plan is agreed to ensure credit transfer. The Host Institution Agreement is signed by both parties. Funding and visa requirements are confirmed. The placement is recorded in the Student Record. While abroad, the student's progress is monitored. On return, transcripts are received and credit is applied.\n\n### Produces\nStudent Mobility Agreement. Updated Student Record. Credit Transfer Record.\n\n### Outcome\nStudent mobility is formally approved and academically recognised.\n\n### Fails when\nThe Host Institution Agreement cannot be finalised or the Study Plan is rejected, blocking the placement.","specialization":""},{"id":"elem-id-883","type":"BusinessProcess","name":"Student Placement Mgt","documentation":"### Identity\nThe work of arranging and monitoring student work placements.\n\n### Trigger\nA Student Placement Application is submitted.\n\n### Consumes\nStudent Enrolment supplies the student's programme. Placement Opportunity supplies available placements. Placement Agreement supplies the terms with the employer. Health & Safety Checklist supplies the required checks.\n\n### Steps\nThe student's eligibility is checked. The student applies to Placement Opportunities. An interview or selection process occurs. On selection, a Placement Agreement is signed. A placement supervisor is assigned. Health & Safety checks are completed. During the placement, progress is monitored via Placement Reports. On completion, the placement is recorded on the Student Record and credit is applied.\n\n### Produces\nPlacement Agreement. Placement Progress Report. Updated Student Record. Credit Transfer Record.\n\n### Outcome\nStudents complete approved placements that contribute to their programme.\n\n### Fails when\nNo Placement Opportunity is available and the student cannot secure a placement, blocking progression.","specialization":""},{"id":"elem-id-863","type":"BusinessProcess","name":"Student Record & Details Mgt","documentation":"### Identity\nThe work of maintaining the authoritative Student Record, including personal details and academic history.\n\n### Trigger\nA Student Details Change Request or an academic decision that alters the record.\n\n### Consumes\nStudent Details Change Request supplies the new personal information. Academic Decision supplies the results, status or award changes. Student Record supplies the existing record. Supporting Evidence supplies verification documents.\n\n### Steps\nThe change request is verified against the Supporting Evidence. The new details are checked for consistency. The Student Record is updated. The change is logged in an audit trail. Confirmation is sent to the student. The record is made available to authorised consumers. A periodic reconciliation checks the record for missing or inconsistent fields.\n\n### Produces\nUpdated Student Record. Student Details Change Confirmation. Audit Trail Entry.\n\n### Outcome\nThe Student Record is accurate, complete and auditable.\n\n### Fails when\nSupporting documents are missing and the change cannot be verified, leaving the record stale.","specialization":""},{"id":"elem-id-854","type":"BusinessProcess","name":"Student Recruitment Agent Mgt","documentation":"### Identity\nThe work of appointing, monitoring and terminating student recruitment agents.\n\n### Trigger\nA prospective agent applies for appointment.\n\n### Consumes\nAgent Application supplies the agent's credentials. Student Recruitment Agent Contract supplies the agreed terms. Agent Performance Report supplies the evaluation data. Due Diligence Checklist supplies the verification steps.\n\n### Steps\nThe Agent Application is assessed against institutional criteria. Due diligence is conducted using the Due Diligence Checklist. If approved, a Student Recruitment Agent Contract is issued and signed. The agent is briefed and given recruitment materials. Performance is monitored periodically against the contract. Underperforming agents are warned or terminated. A termination notice is issued if required.\n\n### Produces\nStudent Recruitment Agent Contract. Agent Appointment Decision. Agent Performance Report.\n\n### Outcome\nThe institution has a compliant, performing agent network.\n\n### Fails when\nAgent due diligence fails or performance falls below contract terms and no replacement is found, reducing international recruitment capacity.","specialization":""},{"id":"elem-id-885","type":"BusinessProcess","name":"Student Results Mgt","documentation":"### Identity\nThe work of aggregating marks, applying progression rules and producing formal results.\n\n### Trigger\nAll Student Assessment Marks for a module are finalised.\n\n### Consumes\nStudent Assessment Mark supplies the raw scores. Module Registration supplies the student set. Academic Policy supplies progression and award rules. Results Board Agenda supplies the items for review.\n\n### Steps\nMarks are combined per module to produce a Module Result. The module result is checked against progression rules. Students with borderline or exceptional cases are flagged for the Results Board. The Results Board reviews and confirms final Student Results Records. The results are published to students. Students who fail are identified for resit or reassessment. The Student Results Record is stored as the official outcome.\n\n### Produces\nStudent Results Record. Results Board Decision. Progression Outcome.\n\n### Outcome\nStudents receive formally approved results and progression status.\n\n### Fails when\nMarks are incomplete or contested and the Results Board cannot confirm a result, delaying progression decisions.","specialization":""},{"id":"elem-id-999","type":"BusinessProcess","name":"Supplier Mgt","documentation":"### Identity\nOngoing management of supplier relationships, performance, and contracts post-award.\n\n### Trigger\nThe arrival of a new supplier contract or a supplier performance issue.\n\n### Consumes\nSupplier Contract supplies the agreed terms, service levels, and obligations. Supplier Performance Data supplies delivery, quality, and compliance information. Supplier Invoice supplies the billing against the contract.\n\n### Steps\nThe process registers the supplier and contract terms. It monitors delivery and service performance against agreed levels. It holds regular supplier review meetings. It manages supplier corrective actions for non-performance. It authorises payments based on performance. It handles supplier disputes and escalations. It updates supplier risk ratings. If a supplier fails repeatedly, termination is considered. At contract end, handover and debrief are completed.\n\n### Produces\nSupplier Performance Report records the supplier's service delivery against targets. Corrective Action Request states the improvement required from the supplier. Supplier Risk Rating updates the supplier's risk profile.\n\n### Outcome\nThe institution manages supplier performance actively, resolving issues and ensuring contracted value.\n\n### Fails when\nA key supplier underperforms and corrective actions are not enforced, causing service disruption across dependent operations.","specialization":""},{"id":"elem-id-944","type":"BusinessProcess","name":"Talent Mgt","documentation":"### Identity\nManagement of high-potential employees, succession planning, and talent pools.\n\n### Trigger\nThe arrival of a talent identification review or a succession planning cycle.\n\n### Consumes\nEmployee Performance Record supplies the performance and potential ratings. Succession Plan supplies the current successors for key roles. Talent Pool Definition supplies the criteria for inclusion.\n\n### Steps\nThe process identifies high-potential employees using performance and potential data. It reviews current succession plans against future needs. It develops individual development plans for talented staff. It monitors progress and rotates assignments. It updates the talent pool. It reports on readiness for key roles. If a key role has no successor, it triggers targeted development or external search.\n\n### Produces\nTalent Pool Update records the current members and their readiness. Individual Development Plan states the agreed development actions. Succession Plan Update records changes to named successors.\n\n### Outcome\nThe institution has a pipeline of internal talent ready to fill key roles.\n\n### Fails when\nSuccession planning is not maintained, leaving critical roles unfilled after departures.","specialization":""},{"id":"elem-id-997","type":"BusinessProcess","name":"Taxation Mgt","documentation":"### Identity\nInstitutional tax compliance, including VAT, payroll taxes, and corporate tax obligations.\n\n### Trigger\nThe arrival of a tax filing deadline or a change in tax legislation.\n\n### Consumes\nTransaction Records supply the taxable inputs and outputs for the period. Tax Legislation supplies the rules and rates to apply. Tax Filing Schedule supplies the deadlines for each tax return.\n\n### Steps\nThe process extracts transaction data and determines taxable amounts. It calculates tax liabilities and input credits. It prepares and reviews tax returns. It obtains sign-off. It submits returns to the relevant tax authority. It makes payments by the due date. It maintains records for audit. If a discrepancy is found, it is investigated and a correction is filed. Changes in legislation are assessed for impact on current processes.\n\n### Produces\nTax Return states the taxable amount and liability for each tax type. Tax Payment Confirmation records the payment made. Tax Correction Filing records any amendment to a previous return.\n\n### Outcome\nThe institution pays the correct amount of tax on time and maintains compliant records.\n\n### Fails when\nTransaction data is incomplete or tax rules are misapplied, causing an underpayment penalty and interest charges.","specialization":""},{"id":"elem-id-882","type":"BusinessProcess","name":"Teaching & Learning Content Mgt","documentation":"### Identity\nThe work of storing, versioning and distributing teaching content.\n\n### Trigger\nA Teaching Content Pack is submitted for publication.\n\n### Consumes\nTeaching Content Pack supplies the files. Module Registration supplies the target audience. Copyright Record supplies licensing status. Metadata Template supplies the tagging structure.\n\n### Steps\nThe content is checked for completeness. Version number is assigned. The pack is stored in the repository. Access is granted to enrolled students. Updates are logged. Copyright clearance is verified. Metadata is applied.\n\n### Produces\nStored Teaching Content Pack. Access List. Copyright Clearance Confirmation.\n\n### Outcome\nTeaching content is available to students in the correct version.\n\n### Fails when\nCopyright clearance is missing and the content cannot be published.","specialization":""},{"id":"elem-id-842","type":"BusinessProcess","name":"Timetabling Mgt","documentation":"### Identity\nThe work of allocating rooms, times and staff to Teaching Sessions and examinations.\n\n### Trigger\nArrival of the Module Registration set for the term.\n\n### Consumes\nModule Registration supplies the student cohorts and module demands. Room Inventory supplies available spaces and capacities. Staff Availability Record supplies instructor constraints. Academic Calendar supplies the term and examination windows.\n\n### Steps\nThe timetabler collects Module Registration data and groups modules by size and delivery mode. Room requests are matched against Room Inventory. Clashes are resolved by reassigning times or rooms. The draft Timetable is published for review. Incomplete or conflicting assignments return for correction. After a review window, the final Timetable is issued. Changes requested after publication are assessed for impact and approved only on documented grounds. A Timetable Change Notice is issued for each approved adjustment.\n\n### Produces\nTimetable with final session schedule. Room Booking Confirmation for each allocated space. Timetable Change Notice for any post-publication adjustment.\n\n### Outcome\nTeaching Sessions and examinations have conflict-free room and staff assignments.\n\n### Fails when\nRoom capacity cannot satisfy module demand and no alternative times are accepted, leaving sessions unscheduled.","specialization":""},{"id":"elem-id-950","type":"BusinessProcess","name":"Training & Development","documentation":"### Identity\nDelivery and administration of training and development, including mandatory, professional, and personal development.\n\n### Trigger\nThe arrival of a training need identified in a development plan or a scheduled course date.\n\n### Consumes\nDevelopment Plan supplies the agreed training needs. Training Course Catalogue supplies the available courses. Employee Record supplies the employee's eligibility and role.\n\n### Steps\nThe process matches training needs to available courses. It enrols employees and confirms attendance. It delivers or procures the training. It records attendance and completion. It evaluates learning outcomes. It updates the employee's development record. If mandatory training is missed, a follow-up is scheduled. Training spend is tracked.\n\n### Produces\nTraining Attendance Record states who attended and completed. Training Evaluation Report records the effectiveness and feedback. Development Record Update records the employee's new skill.\n\n### Outcome\nThe workforce has the skills required by the institution, and compliance training is completed.\n\n### Fails when\nMandatory training is not tracked, causing regulatory non-compliance or skill gaps.","specialization":""},{"id":"elem-id-992","type":"BusinessProcess","name":"Treasury Mgt","documentation":"### Identity\nManagement of cash, investments, borrowings, and working capital. It ensures liquidity and optimises returns.\n\n### Trigger\nThe arrival of a cash flow forecast update or a significant cash movement.\n\n### Consumes\nCash Flow Forecast supplies expected inflows and outflows for the period. Bank Account Balance supplies the current cash position. Investment Mandate supplies the permitted investment types and limits.\n\n### Steps\nThe process reviews the cash position and forecast. It identifies surplus or deficit periods. It invests surplus cash within the mandate. It arranges short-term borrowing or drawdowns for deficits. It manages banking relationships and accounts. It monitors counterparty risk. It re-forecasts regularly. If a covenant is at risk, it alerts governance. It records all treasury transactions.\n\n### Produces\nInvestment Trade Confirmation records an investment made or redeemed. Loan Drawdown Advice states the amount and terms of a borrowing. Cash Position Report states the current and forecast cash balances.\n\n### Outcome\nThe institution has sufficient liquidity at all times and earns optimal returns within risk limits.\n\n### Fails when\nCash flow forecasting misses a significant payment, causing a liquidity shortfall and inability to meet payroll or supplier obligations.","specialization":""},{"id":"elem-id-989","type":"BusinessProcess","name":"Vehicle Mgt","documentation":"### Identity\nManagement of the institution's owned and leased vehicle fleet, including allocation, maintenance, and driver records.\n\n### Trigger\nThe arrival of a vehicle booking request or a scheduled fleet maintenance date.\n\n### Consumes\nVehicle Booking Request supplies the required vehicle type, date, and driver. Fleet Maintenance Schedule supplies the service intervals for each vehicle. Driver Record supplies the driver's licence and eligibility status.\n\n### Steps\nThe process checks driver eligibility and licence validity. It reserves an available vehicle that meets the requirement. It issues a Vehicle Key Handover with condition check. It monitors vehicle return and records mileage and damage. It schedules and records maintenance. If a vehicle is returned damaged, a Damage Report is created and costs are assigned. Vehicle availability is updated daily. Expired licences or insurance trigger a block on future bookings.\n\n### Produces\nVehicle Booking Confirmation states the vehicle, driver, and time period. Vehicle Condition Report records the pre- and post-use state. Fleet Maintenance Record updates the service history.\n\n### Outcome\nVehicles are available, maintained, and used only by eligible drivers.\n\n### Fails when\nA vehicle breaks down or an ineligible driver gains access, causing disruption or legal liability.","specialization":""},{"id":"elem-id-936","type":"BusinessProcess","name":"Venue Mgt","documentation":"### Identity\nManagement of campus venues for internal and external hire, including bookings, setup, and compliance.\n\n### Trigger\nThe arrival of a venue hire request.\n\n### Consumes\nVenue Hire Request supplies the event details and requirements. Venue Availability Record supplies the free slots. Venue Setup Specification supplies the furniture and technical needs.\n\n### Steps\nThe process checks venue availability. It confirms the hire and terms. It arranges setup and technical support. It ensures health and safety. It runs the event. It restores the venue after use. It invoices the hirer. It collects feedback. If damage occurs, it claims against the deposit.\n\n### Produces\nVenue Booking Confirmation states the hire details. Venue Setup Order states the required configuration. Venue Invoice states the hire charge.\n\n### Outcome\nVenues are used efficiently and generate income while remaining in good condition.\n\n### Fails when\nA venue is double-booked or damaged, causing customer disputes and lost income.","specialization":""},{"id":"elem-id-942","type":"BusinessProcess","name":"Workforce Planning","documentation":"### Identity\nStrategic workforce planning, including demand forecasting, capability analysis, and headcount planning.\n\n### Trigger\nThe arrival of the annual planning cycle or a change in institutional strategy.\n\n### Consumes\nInstitutional Strategy supplies the future direction and priorities. Current Workforce Profile supplies the existing headcount, skills, and demographics. Turnover Data supplies the rate and reasons for leavers.\n\n### Steps\nThe process forecasts future workforce demand by role and skill. It assesses current supply and gaps. It develops workforce plans to close gaps through recruitment, development, or restructuring. It validates plans against budget. It monitors progress and revises. It reports the workforce plan to governance. If a gap cannot be filled internally, external recruitment is authorised.\n\n### Produces\nWorkforce Plan states the future headcount and skill requirements. Skills Gap Analysis records the difference between current and required capabilities. Recruitment Authorisation states the approved new roles.\n\n### Outcome\nThe institution has a workforce aligned with its strategy and a clear path to close skill gaps.\n\n### Fails when\nWorkforce planning is disconnected from budget, causing either overstaffing or critical skills shortages.","specialization":""},{"id":"elem-id-946","type":"BusinessProcess","name":"Workforce Relations Mgt","documentation":"### Identity\nManagement of employee relations, including union negotiations, disciplinary procedures, and grievance handling.\n\n### Trigger\nThe arrival of a grievance, a disciplinary case, or a collective bargaining date.\n\n### Consumes\nGrievance Record supplies the employee's complaint. Disciplinary Case File supplies the alleged misconduct and evidence. Collective Agreement supplies the negotiated terms with recognised unions.\n\n### Steps\nThe process assesses the case under policy. It follows the formal procedure: investigation, hearing, decision, and appeal. It applies the collective agreement where relevant. It consults with unions on collective matters. It records outcomes and implements sanctions or remedies. It reviews the case for learning. If an appeal is lodged, it is heard by a different manager. Cases are time-bound.\n\n### Produces\nDisciplinary Outcome Letter states the decision and sanction. Grievance Outcome Letter states the resolution. Collective Agreement Update records any new negotiated terms.\n\n### Outcome\nEmployee relations are conducted fairly and legally, reducing disputes and protecting the institution.\n\n### Fails when\nA grievance or disciplinary case is mishandled, causing an employment tribunal claim and reputational damage.","specialization":""},{"id":"elem-id-951","type":"BusinessProcess","name":"Workforce Reporting","documentation":"### Identity\nWorkforce reporting and analytics, including headcount, diversity, absence, and turnover metrics.\n\n### Trigger\nThe arrival of a reporting period close or a management information request.\n\n### Consumes\nWorkforce Data Extract supplies the raw HR data for the period. Reporting Template supplies the required metrics and format. Prior Period Workforce Report supplies the comparison baseline.\n\n### Steps\nThe process extracts and validates data. It calculates the metrics. It prepares reports for management and statutory bodies. It reviews for accuracy and consistency. It publishes to the appropriate recipients. It answers follow-up queries. It archives the report. If data quality issues are found, they are corrected at source.\n\n### Produces\nWorkforce Report states the headcount, diversity, absence, and turnover metrics. Management Information Pack supplies the board-level summary. Data Quality Correction records any correction to source data.\n\n### Outcome\nThe institution understands its workforce through accurate reports, informing decisions.\n\n### Fails when\nWorkforce data is not validated, causing incorrect metrics to be reported to the regulator and misleading management.","specialization":""},{"id":"elem-id-20001","type":"Capability","name":"Academic Administration","documentation":"### Identity\nThis is a management capability within the Teaching & Learning domain. It is accountable for the governing body of Programme Regulations and for ensuring those regulations are applied consistently to student progression and award decisions.\n\n### Consumes\nIt consumes Student Appeals when a learner submits a formal challenge to a mark, progression decision or award. It consumes Regulatory Guidance when an external body issues a new condition that affects assessment or progression. It consumes Programme Approval Documents when a new course or modification is put forward for academic approval.\n\n### Produces\nIt produces Programme Regulations as version-controlled rules that name modules, credits, progression thresholds and award requirements. It produces Assessment Board Decisions as a formal record of the board's resolution on each case. It produces Academic Policy Decisions as binding interpretations of regulations for future cases.\n\n### Activities\nActivities present in this capability are: apply Programme Regulations to a Student Appeal, record Assessment Board Decisions, issue Academic Policy Decisions, review Programme Approval Documents, reject a Student Appeal that lacks ground of challenge, and reassess a progression decision after an appeal is upheld.\n\n### Fails when\nIt fails when Programme Regulations contain conflicting provisions or when Assessment Board Decisions are not recorded. Student Appeals then remain unresolved, progression decisions become inconsistent, and Student Records are not updated, delaying Student Completion.\n\n### Constraint\nThis capability is constrained by the need to maintain a single authoritative interpretation of academic regulations across all academic years and programmes.\n\n### Operating Conditions\nA Student Appeal must include the learner identifier, module code, ground of challenge and supporting evidence; if these are missing it is returned as incomplete. Regulatory Guidance must carry a source, issue date and statutory reference; if the reference is absent it is escalated to legal review. Programme Approval Documents must name the responsible proposer, credit total and assessment load; if the credit total does not match the Programme Regulations, the document is rejected.","specialization":""},{"id":"elem-id-20002","type":"Capability","name":"Accommodation Management","documentation":"### Identity\nLayer: enabling; parent domain: Enabling Capabilities. This capability holds accountability for the allocation, tenancy, and condition of residential accommodation. It is answerable for matching enrolled students to available rooms, managing rent and deposits, and ensuring that accommodation meets statutory health and safety standards.\n\n### Consumes\nIt takes in Accommodation Application, triggered when a student applies for a place in halls. It takes in Maintenance Request, triggered when an occupant reports a fault. It takes in Notice to Vacate, triggered when an occupant gives notice of departure. It takes in Rent Payment, triggered when a tenant pays scheduled rent.\n\n### Produces\nIt issues Room Allocation when eligibility and preferences are matched against Room Inventory. It issues Tenancy Agreement when a room offer is accepted and deposit is received. It issues Room Condition Report when an occupant checks in or out. It issues Maintenance Work Order when a Maintenance Request is validated against urgency.\n\n### Activities\nReviews Accommodation Application against eligibility and support needs. Verifies student enrolment status with the Student Record. Allocates Room against Room Inventory and waiting list. Generates Tenancy Agreement with rent and occupancy terms. Records Rent Payment against Tenant Account. Schedules Room Inspection for condition and compliance. Processes Early Termination Request and calculates fees due. Reassesses Allocation Appeal and issues revised Room Allocation. Manages Waiting List when demand exceeds room supply.\n\n### Fails when\nIt stops delivering when Room Inventory is not updated with vacancies, maintenance status and reserved rooms, causing double allocation, unsuitable placements, or unoccupied beds during peak intake.\n\n### Constraint\nIt operates on a fixed academic-year cycle with intense September intake and July turnaround, leaving little room to correct allocation errors before term starts.\n\n### Operating Conditions\nAccommodation Application must include Student ID, term dates, and support needs; if incomplete, it is returned to the applicant. Maintenance Request must include location, fault description and urgency; if urgency is absent, it is returned for clarification. Notice to Vacate must be signed and dated and match the Tenancy Agreement; if not, it is accepted with qualification and a rent adjustment is made. Rent Payment must include Student ID and amount; if mismatched, it is accepted and placed in suspense until reconciled.","specialization":""},{"id":"elem-id-20003","type":"Capability","name":"Alumni Engagement","documentation":"### Identity\nThis is an operating capability within the Teaching & Learning domain. It is accountable for maintaining continuing contact with graduates and for converting that contact into measurable engagement and voluntary support.\n\n### Consumes\nIt consumes Graduate Records when an award is conferred and the graduate becomes eligible for alumni contact. It consumes Alumni Contact Preferences when a graduate chooses channels or opts out. It consumes Donation Pledges when a graduate commits money or estate gifts.\n\n### Produces\nIt produces Alumni Event Invitations when an event is scheduled and targeted to graduates by cohort or interest. It produces Alumni Newsletters when a publication cycle completes. It produces Donation Receipts when a Donation Pledge is
