tion Plan naming corrective action, owner, and due date. If the issue affects payment or acceptance, it also issues a Corrective Action Request to the counterparty or internal unit. Progress is tracked in the Issue Log until the corrective action is verified. Unresolved issues escalate to the Commercial Delivery owner at the escalation threshold defined in the Contract Agreement. On verification, the process closes the issue in the Issue Log and releases the holding entry.\n\n### Produces\nResolution Plan specifies corrective action, owner and deadline. Issue Log records the lifecycle of each issue, including escalation and closure. Corrective Action Request formalises the required remedy to the responsible party.\n\n### Outcome\nReported deviations are resolved or formally escalated, with no delivery obligation left unattended.\n\n### Fails when\nAn Issue Report lacks sufficient detail to identify the breached obligation, or no owner accepts the corrective action; the issue remains open, delivery continues out of compliance, and the contract is breached.","specialization":""},{"id":"elem-id-915","type":"BusinessProcess","name":"Commercial Activity Output Mgt","documentation":"### Identity\nThis process controls the release and acceptance of contracted outputs. It ensures each output is inspected against the Contract Agreement before it is handed to the consuming unit or client.\n\n### Trigger\nArrival of a Delivery Request requesting release of a specified output under the Contract Agreement.\n\n### Consumes\nContract Agreement supplies the output specification, acceptance criteria and delivery schedule. Delivery Request supplies the consuming unit's request and intended use date. Quality Check Record supplies the result of inspection against the specification.\n\n### Steps\nThe process checks the output against the acceptance criteria in the Contract Agreement. It then verifies that the Quality Check Record covers all required attributes and that no condition is outstanding. If any acceptance criterion fails, the process rejects the output and returns it to the originator with a Rejection Notice. If criteria are met, it obtains formal acceptance from the consuming unit or the designated acceptance authority. It then records the accepted output in the Output Register and issues a Delivery Acceptance to enable payment. When the output is rejected, the process tracks the rework until re-inspection is completed and then repeats acceptance. Each rejection and re-release is logged in the Output Register.\n\n### Produces\nDelivery Acceptance records that the output met the Contract Agreement and was accepted. Output Register records all outputs, acceptance status and rejections. Rejection Notice records a failed acceptance and the required rework.\n\n### Outcome\nContracted outputs are either accepted and handed over, or formally rejected with rework required; no output is released without recorded acceptance.\n\n### Fails when\nThe quality check record is missing or the consuming unit refuses acceptance and the disagreement cannot be resolved; the output is not released, payment is withheld, and the contract completion remains blocked.","specialization":""},{"id":"elem-id-919","type":"BusinessProcess","name":"Commercial Activity Reporting","documentation":"### Identity\nThis process assembles the periodic account of commercial activity for management and external reporting. It collects operational and financial records into a single Commercial Activity Report.\n\n### Trigger\nArrival of the final month-end performance data for the reporting period.\n\n### Consumes\nContract Performance Data supplies actual output, service levels and delivery status by contract. Financial Transaction Records supply the value of invoices, payments and commitments settled in the period. Issue Log supplies the open issues and their resolution status.\n\n### Steps\nThe process first reconciles Contract Performance Data against the accepted delivery records for the period. It then extracts from Financial Transaction Records all commercial spend and income, applying the institution's chart of accounts. Any transaction that cannot be matched to a Contract Agreement is flagged as unreconciled and returned to the originating unit for correction. Once all records are matched, it consolidates the data into a draft Commercial Activity Report. The draft is reviewed by the Commercial Monitoring owner and Finance; if they reject the draft, the process revises the underlying data and reissues. After approval, it publishes the Commercial Activity Report and archives the source records. The process also logs the report issue date for audit.\n\n### Produces\nCommercial Activity Report records the consolidated performance and financial position for the period. Reconciliation Exception Log records all unmatched transactions and their resolution.\n\n### Outcome\nManagement has an accurate, reconciled view of commercial performance and financial position for the period.\n\n### Fails when\nContract Performance Data or Financial Transaction Records contain unmatched entries that cannot be corrected before the reporting deadline; no report is issued, leaving performance unreported and financial statements incomplete.","specialization":""},{"id":"elem-id-920","type":"BusinessProcess","name":"Commercial Contingency Planning","documentation":"### Identity\nThis process maintains pre-agreed fallback arrangements for the failure of critical commercial partners or services. It converts risk exposure into tested contingency arrangements.\n\n### Trigger\nArrival of a Risk Register update that changes the rating of a material commercial failure scenario.\n\n### Consumes\nRisk Register supplies the current risk ratings and existing mitigation actions. Contract Agreement supplies the critical obligations and the terms that apply on early termination or failure. Supplier Performance Data supplies the actual reliability and recovery capability of each critical supplier.\n\n### Steps\nThe process identifies the commercial failure scenarios that exceed the institution's risk appetite, using the Risk Register. For each scenario, it reviews the Contract Agreement to determine the contractual fallback rights and the maximum acceptable downtime. It then evaluates each affected partner's recovery capability using Supplier Performance Data. Where no adequate fallback exists, it designs a Contingency Plan specifying alternate suppliers, internal workarounds, and communication triggers. The plan is costed and submitted to the Commercial Monitoring owner for approval. If rejected, it is revised and resubmitted. Once approved, it is stored in the Risk Register and assigned an owner. The process also schedules a test or review date for each plan.\n\n### Produces\nContingency Plan records the trigger, fallback actions, owners and test schedule for each material failure scenario. Risk Register Update records the revised mitigation status for the risk.\n\n### Outcome\nEvery material commercial failure scenario has a pre-agreed, owned fallback arrangement that can be invoked without negotiation.\n\n### Fails when\nNo adequate fallback can be identified or the plan is not approved; the institution remains exposed to a single point of failure and improvises during an actual disruption.","specialization":""},{"id":"elem-id-918","type":"BusinessProcess","name":"Commercial Contract Performance Mgt","documentation":"### Identity\nThis process assesses actual performance against each active Contract Agreement and forces corrective action for any shortfall. It is the continuous monitoring heartbeat of commercial delivery.\n\n### Trigger\nArrival of scheduled Contract Performance Data for the reporting interval.\n\n### Consumes\nContract Agreement supplies the performance standards, key performance indicators and remedy clauses. Contract Performance Data supplies the measured actuals for each indicator. Issue Report supplies the already-reported deviations that the process re-reviews.\n\n### Steps\nThe process first compares each indicator in the Contract Performance Data against the standard in the Contract Agreement. It calculates variance and trend, flagging any indicator outside tolerance. For each flagged indicator, it checks the Issue Log for an existing open resolution; if none exists, it issues a Corrective Action Request to the responsible party. It then holds a performance review with the contract owner and the counterparty where variance is material. The review decides whether to adjust the performance target, impose a remedy, or escalate. Decisions are recorded and the process updates the Contract Performance Data with the agreed interpretation. At the close of the review, it produces a Contract Performance Report for the contract. If any issue remains unresolved, it marks the report as qualified and names the open item.\n\n### Produces\nContract Performance Report records the assessed performance, variance, and any qualifications for each contract. Corrective Action Request formalises the required remedy for each performance breach. Performance Review Minutes record the decisions and agreed actions from the review.\n\n### Outcome\nEvery active contract has a current assessed performance position, and any deviation is under corrective action or formally qualified.\n\n### Fails when\nContract Performance Data is incomplete or the review cannot agree on variance interpretation; no report is issued, and underperformance continues unmanaged and unreported.","specialization":""},{"id":"elem-id-911","type":"BusinessProcess","name":"Commercial Market Analysis","documentation":"### Identity\nThis process analyses the supply market for a specific requirement, producing evidence for sourcing decisions. It turns an internal Sourcing Request into a structured market understanding.\n\n### Trigger\nArrival of a Sourcing Request from an internal unit, specifying a need for external supply and the expected category.\n\n### Consumes\nSourcing Request supplies the requirement, volume, and category of spend. Market Data supplies supplier landscape, pricing benchmarks, and availability. Government Policy supplies procurement regulations and any mandatory sourcing constraints.\n\n### Steps\nThe process first validates the Sourcing Request for completeness and category classification. It then collects Market Data from published sources, supplier briefings and internal spend records. The data is filtered for relevance to the requirement and assigned a confidence rating. The process analyses supplier concentration, pricing range, and barriers to entry. It also checks Government Policy for mandatory exclusions or preferred routes. Where the market is thin or monopolistic, it flags a sourcing risk. The analysis is compiled into a Market Analysis Report with a recommended sourcing approach. The report is reviewed by the Commercial Sourcing owner; if found insufficient, the process repeats data collection. Once approved, it produces a Supplier Shortlist of viable candidates.\n\n### Produces\nMarket Analysis Report records the market structure, pricing evidence, risk and recommended approach. Supplier Shortlist records the suppliers that meet the threshold for further assessment.\n\n### Outcome\nThe supply market for the requirement is understood, and a viable supplier set is available for opportunity assessment.\n\n### Fails when\nMarket Data is unavailable or the requirement cannot be classified to a market; no analysis is produced, and sourcing cannot proceed.","specialization":""},{"id":"elem-id-912","type":"BusinessProcess","name":"Commercial Opportunity Assessment","documentation":"### Identity\nThis process evaluates each Commercial Opportunity for strategic fit, financial viability and risk before any commitment. It converts opportunities into a prioritised decision.\n\n### Trigger\nArrival of a Commercial Opportunity from the identification step, with its provisional scope and source.\n\n### Consumes\nCommercial Opportunity supplies the proposed scope, expected benefits and origin. Market Analysis Report supplies the market evidence on feasibility, pricing and competition. Risk Register supplies the institution's current risk appetite and existing risk responses.\n\n### Steps\nThe process first reviews the Commercial Opportunity for alignment with institutional strategy and the commercial portfolio. It then builds a financial model estimating income, cost and return over the contract term, using data from the Market Analysis Report. It identifies legal, operational and reputational risks and maps them to the Risk Register. Where a risk exceeds appetite, the process proposes mitigation and recalculates viability. The assessment is compiled into an Opportunity Assessment Report with a recommendation of proceed, defer, or reject. The report is submitted to the Commercial Sourcing owner for a Go/No-Go decision. If a decision is deferred, the process requests additional data and updates the report. Once decided, it issues an Opportunity Decision recording the outcome and any conditions for proceeding.\n\n### Produces\nOpportunity Assessment Report records the financial analysis, risk assessment and recommendation. Opportunity Decision records the Go/No-Go outcome and any conditions.\n\n### Outcome\nEach Commercial Opportunity is assessed and prioritised; only viable, strategically aligned opportunities proceed to sourcing or engagement.\n\n### Fails when\nThe financial model cannot be built or the owner withholds a decision beyond the assessed window; the opportunity remains in limbo and cannot be acted upon.","specialization":""},{"id":"elem-id-910","type":"BusinessProcess","name":"Commercial Opportunity Identification","documentation":"### Identity\nThis process recognises and logs potential commercial opportunities from internal needs and market signals. It is the front door for new commercial activity.\n\n### Trigger\nArrival of a Service Request expressing an internal need or a market signal that supports an external commercial arrangement.\n\n### Consumes\nService Request supplies the need, expected volume and the benefit sought. Market Analysis Report supplies the currently known market conditions that affect feasibility.\n\n### Steps\nThe process first screens the Service Request against the institution's commercial strategy and existing Contract Agreements to avoid duplication. It then extracts the core need and converts it into a draft Commercial Opportunity with a provisional scope and outcome. The draft is validated against the Market Analysis Report to confirm there is a supply market for the need. If no market exists, the process rejects the opportunity and returns the Service Request to the originator with a Rejection Notice. For valid opportunities, it logs the Commercial Opportunity in the Opportunity Register and assigns a preliminary owner. The process also records the source of the opportunity for audit.\n\n### Produces\nCommercial Opportunity records the defined need, provisional scope and next step for assessment. Opportunity Register records all identified opportunities and their status. Rejection Notice records a need that cannot be converted and the reason.\n\n### Outcome\nEach viable internal need is converted into a logged Commercial Opportunity awaiting assessment; non-viable needs are returned with reason.\n\n### Fails when\nA Service Request cannot be expressed as a commercial opportunity or no market exists; nothing is logged, and the need remains unaddressed.","specialization":""},{"id":"elem-id-913","type":"BusinessProcess","name":"Commercial Partner Engagement","documentation":"### Identity\nThis process selects and agreements external partners for a commercial activity. It moves from initial opportunity to a signed Engagement Agreement, ensuring only qualified partners proceed.\n\n### Trigger\nArrival of a Partner Opportunity identifying a need for an external party to participate in a commercial activity.\n\n### Consumes\nPartner Opportunity supplies the scope of collaboration and the capability sought. Partner Profile supplies the prospective partner's track record, financial standing and service capabilities. Due Diligence Questionnaire supplies the prospective partner's responses on compliance, data protection, and financial stability.\n\n### Steps\nThe process first qualifies the Partner Opportunity against the Commercial Activity scope and confirms the required partner profile. It then issues a Due Diligence Questionnaire to shortlisted partners and receives their responses. The process evaluates the responses against mandatory criteria, including financial standing and regulatory compliance; any partner that fails a mandatory criterion is removed from consideration. For remaining partners, it conducts a comparative assessment and selects a preferred partner. Negotiation then produces draft engagement terms, which are reviewed by Legal and Finance. If a review rejects the terms, the process returns to negotiation. When terms are approved, it issues an Engagement Agreement and a Partner Selection Decision, recording the selected partner and the agreed scope.\n\n### Produces\nEngagement Agreement records the signed terms for collaboration. Partner Selection Decision records the chosen partner and the reasons for selection. Partner Due Diligence Report records the due diligence findings and confirmation of mandatory criteria.\n\n### Outcome\nA qualified partner is selected and engaged under agreed terms for a defined commercial activity.\n\n### Fails when\nNo shortlisted partner passes due diligence or the internal review rejects the engagement terms and no alternative is proposed; the commercial activity cannot proceed to integration and remains without a partner.","specialization":""},{"id":"elem-id-914","type":"BusinessProcess","name":"Commercial Partner Integration & Transition","documentation":"### Identity\nThis process brings a newly engaged partner into operational delivery and, where required, transfers activity from an incumbent. It produces the plans and evidence that make the partner accountable.\n\n### Trigger\nArrival of a signed Engagement Agreement and a completed Partner Due Diligence Report, marking the point at which the partner is ready to begin operational integration.\n\n### Consumes\nEngagement Agreement supplies the scope, obligations and service levels the partner must meet. Partner Profile supplies the partner's operational capabilities and contact structures. Incumbent Handover Record supplies the confirmed state of current activity, open items and asset transfers.\n\n### Steps\nThe process first reviews the Engagement Agreement and Partner Profile to build an Integration Plan specifying milestones, owners and readiness checks. It then assesses the partner's operational readiness against the plan; if any readiness check fails, the process holds the start of service and requires the partner to remediate. Once readiness is confirmed, it develops a Transition Plan for moving each activity, asset and data set from the incumbent or internal unit to the partner. It executes the transition in the agreed sequence, verifying each handover against a checklist. Any unresolved item is logged and assigned to the partner or the incumbent. After all items are confirmed, it issues a Handover Certificate recording that the partner has accepted operational responsibility. The process also issues a Transition Plan as a live document for post-transition review.\n\n### Produces\nIntegration Plan records the staged integration activities and readiness checks. Transition Plan records the agreed sequence and owner for each transferred activity. Handover Certificate records that the partner has accepted operational responsibility and all open items are resolved.\n\n### Outcome\nThe partner is operating within the commercial activity with no gap in service and with a documented transfer of accountability.\n\n### Fails when\nA readiness check fails repeatedly or an open transition item has no owner by the service start date; the partner cannot begin, the incumbent has already exited, and the commercial activity suffers a service gap.","specialization":""},{"id":"elem-id-988","type":"BusinessProcess","name":"Commercial Tenancy","documentation":"### Identity\nManagement of commercial leases and licences for third-party occupation of institutional space. It handles rent, compliance, and tenant relations.\n\n### Trigger\nThe arrival of a Commercial Tenancy Application or a rent review date.\n\n### Consumes\nCommercial Tenancy Application supplies the prospective tenant's business and proposed use. Lease Agreement Template supplies the standard terms and obligations. Tenant Payment Record supplies the rent and service charge status.\n\n### Steps\nThe process assesses the proposed use against planning and institutional policy. It negotiates and finalises the Lease Agreement. It collects rent and service charges and reconciles them. It monitors tenant compliance with lease terms. It handles tenant requests and maintenance obligations. If a tenant breaches terms, a Breach Notice is issued with a remedy period. At lease expiry, renewal or termination is processed. The space condition is inspected on handover.\n\n### Produces\nCommercial Lease Agreement states the tenant's occupancy rights and obligations. Rent Demand states the amount and due date for each period. Tenant Breach Notice states the specific non-compliance and remedy required.\n\n### Outcome\nInstitutional space is legally occupied by approved tenants, and rent and compliance are actively managed.\n\n### Fails when\nA tenant stops paying rent or breaches occupancy terms, causing lost income and unmanaged space.","specialization":""},{"id":"elem-id-903","type":"BusinessProcess","name":"Commercialise Research Outcomes","documentation":"### Identity\nWork here converts research outputs with commercial potential into revenue-generating agreements, licences, or new ventures.\n\n### Trigger\nThe arrival of an Intellectual Property Disclosure from a researcher, when a Research Output has been flagged as having commercial application.\n\n### Consumes\nIntellectual Property Disclosure supplies the invention description, inventors, and the funder or contractual background. Research Output supplies the underlying research result and its publication status. Commercialisation Plan supplies the chosen route to market, target sector, and revenue model. Market Assessment supplies the demand evidence and competitor analysis. Research Contract supplies any prior rights or obligations that affect ownership.\n\n### Steps\nThe Intellectual Property Disclosure is logged and checked for completeness and inventorship. The process then commissions a Market Assessment to establish demand and patentability. If the assessment shows no commercial value, the disclosure is closed and recorded as non-commercial. If value exists, the process drafts a Commercialisation Plan selecting licensing, assignment, or spinout as the route. The plan is approved by the research commercialisation committee. For licensing, the process negotiates and issues a License Agreement that specifies royalty terms and field of use. For spinout, the process establishes a Spinout Company, allocates equity, and licenses the underlying Research Output to the new company. Royalty Record is created to track future payments due to the institution.\n\n### Produces\nLicense Agreement: issued when a third party receives rights to use the intellectual property, establishing revenue terms. Spinout Company: established when the route requires a new legal entity, transferring ownership of the commercial activity. Royalty Record: issued when a licence is signed, establishing the schedule of payments owed to the institution.\n\n### Outcome\nResearch outputs with commercial value are under a revenue-generating agreement or a formally established venture.\n\n### Fails when\nThe Market Assessment underestimates patent risk and a License Agreement is signed without freedom-to-operate clearance; the institution faces an infringement claim.","specialization":""},{"id":"elem-id-941","type":"BusinessProcess","name":"Complaint & Compliment Mgt","documentation":"### Identity\nHandling of complaints and compliments from students, staff, and the public.\n\n### Trigger\nThe arrival of a formal complaint or compliment.\n\n### Consumes\nComplaint Form supplies the issue and resolution sought. Compliment Note supplies the praise. Complaint Policy supplies the timeframes and stages.\n\n### Steps\nThe process logs the complaint or compliment. It acknowledges receipt. It investigates the complaint. It gathers evidence from relevant parties. It issues a response. If unresolved, it escalates to the next stage. It records learning and actions. It reports on complaint trends. Compliments are shared with the responsible teams.\n\n### Produces\nComplaint Response Letter states the outcome and any remedy. Complaint Investigation Record states the findings. Compliment Acknowledgement Letter thanks the sender.\n\n### Outcome\nComplaints are resolved fairly and within time limits, and learning is captured.\n\n### Fails when\nA complaint is not acknowledged within the policy timeframe, causing escalation and reputational damage.","specialization":""},{"id":"elem-id-833","type":"BusinessProcess","name":"Compliance Monitoring and Reporting","documentation":"### Identity\nThis process monitors the institution's compliance with external regulatory obligations and reports evidence to the relevant regulator by each due date. It is the part of the capability that demonstrates lawful operation.\n\n### Trigger\nA new Government Policy Document or a scheduled regulatory reporting date triggers the process, when the institution must show evidence of compliance.\n\n### Consumes\nCompliance Obligation supplies the specific legal requirement, owner, and due date. Evidence Record supplies the documents and data proving compliance. Statutory Filing Template supplies the format and data fields required by the regulator. Policy Statement supplies the institution's approved position on the obligation.\n\n### Steps\nFirst the process maps each Compliance Obligation to the applicable Evidence Record and owner. It then schedules each required return in advance of its due date. It gathers the needed evidence and assesses whether it meets the obligation. If evidence is missing or inadequate, it raises a corrective action and notifies the owner. It drafts the Statutory Filing using the template and the evidence. It obtains formal approval from the accountable executive. It files the completed return with the regulator and records the filing date.\n\n### Produces\nCompliance Status Report records the status of each Compliance Obligation: compliant, non-compliant, or partially compliant. Statutory Filing records the completed return submitted to the regulator and its submission date.\n\n### Outcome\nEvery Compliance Obligation has a current evidence status and every due Statutory Filing has been submitted; non-compliance is visible to the governing body.\n\n### Fails when\nThe Evidence Record for a Compliance Obligation cannot be located, because the associated Statutory Filing cannot be completed and the institution misses a regulatory deadline, exposing it to sanction.","specialization":""},{"id":"elem-id-976","type":"BusinessProcess","name":"Contract Mgt","documentation":"### Identity\nManagement of contracts from drafting through negotiation, execution, and post-signature compliance.\n\n### Trigger\nThe arrival of a contract drafting request or a contract review need.\n\n### Consumes\nContract Request supplies the business need and key terms. Contract Template supplies the standard clauses. Risk Assessment supplies the identified legal and business risks.\n\n### Steps\nThe process drafts the contract using the template. It negotiates terms with the counterparty. It reviews legal and commercial risks. It obtains internal approvals. It executes the contract. It stores the signed agreement. It monitors key dates and obligations. It handles amendments and variations. If a breach occurs, it initiates the dispute process.\n\n### Produces\nContract Agreement states the final signed terms. Contract Register Entry records the metadata and key dates. Contract Variation states the agreed change.\n\n### Outcome\nThe institution's contracts are valid, accessible, and managed for compliance.\n\n### Fails when\nA contract is executed without approval or key deadlines are missed, causing legal exposure.","specialization":""},{"id":"elem-id-969","type":"BusinessProcess","name":"Copyright Mgt","documentation":"### Identity\nManagement of copyright for institutional works, including licensing, permissions, and enforcement.\n\n### Trigger\nThe arrival of a copyright permission request or a copyright infringement notice.\n\n### Consumes\nCopyright Permission Request supplies the work and proposed use. Copyright Policy supplies the institution's rules on use. Copyright Register supplies the owned copyrights and licences.\n\n### Steps\nThe process evaluates the request against policy and rights. It obtains or grants permissions. It records licences. It monitors for infringement. It issues takedown requests for unauthorised use. It advises staff and students on copyright. It renews licences. If an infringement is disputed, it refers to legal. It reports annually.\n\n### Produces\nCopyright Permission Grant states the allowed use and conditions. Licence Agreement records the terms for third-party content. Infringement Notice states the violation and required action.\n\n### Outcome\nThe institution complies with copyright law and protects its own works.\n\n### Fails when\nA permission requirement is overlooked, causing an infringement claim and financial penalty.","specialization":""},{"id":"elem-id-825","type":"BusinessProcess","name":"Corporate Performance Mgt","documentation":"### Identity\nThis process monitors the institution's Key Performance Indicators against annual targets, analyses variances, and initiates corrective action where performance is off track. It is the part of the capability that holds the institution to its strategic commitments.\n\n### Trigger\nThe end of a reporting period or the availability of a new Performance Data set triggers the process, when targets for that period are due to be assessed.\n\n### Consumes\nKey Performance Indicators supply the defined measures and their targets for the academic year. Performance Data supply the actual values for student enrolments, research outputs, commercial contracts, and service requests. Corrective Action Request from previous periods supplies unresolved performance gaps.\n\n### Steps\nFirst the process collects the actual Performance Data for each KPI and calculates the variance against target. It then identifies the KPIs with significant adverse variance. For each, it analyses the root cause using the underlying activity data. It drafts a Performance Review Report for the responsible executive. It decides whether a Corrective Action Request is required and assigns an owner. It monitors the implementation of existing corrective actions and updates their status. It presents the performance dashboard to the governing body.\n\n### Produces\nPerformance Dashboard records the current values, targets, and variances for each KPI. Performance Review Report records the analysis of significant variances and the actions agreed. Corrective Action Request records the owner, action, and due date for each unresolved variance.\n\n### Outcome\nThe institution's performance against its KPI targets is visible each reporting period, and each significant variance has an assigned corrective action.\n\n### Fails when\nPerformance Data for a KPI are not available, because the variance cannot be calculated and the KPI is reported as null, leaving a gap in the governing body's view of institutional performance.","specialization":""},{"id":"elem-id-845","type":"BusinessProcess","name":"Curriculum Change Mgt","documentation":"### Identity\nThe work of evaluating, approving and implementing changes to existing curricula.\n\n### Trigger\nA Curriculum Change Request submitted by a faculty or external body.\n\n### Consumes\nCurriculum Change Request supplies the proposed modification. Current Curriculum Blueprint supplies the baseline. Academic Policy supplies the rules governing change. Professional Body Requirement supplies external constraints.\n\n### Steps\nThe request is logged and assessed for impact on learning outcomes, resources and accreditation. The assessor checks the change against Academic Policy and Professional Body Requirement and identifies affected modules. If the change is minor, it is approved by the faculty board; if major, it goes to the Curriculum Approval Committee. The committee decision is recorded. On approval, the Curriculum Blueprint is updated and affected modules are flagged. Stakeholders are notified. If the request is rejected, the proposer receives a Rejection Notice with reasons.\n\n### Produces\nUpdated Curriculum Blueprint. Curriculum Change Decision. Stakeholder Notification.\n\n### Outcome\nCurriculum changes are controlled, recorded and aligned with approved learning outcomes.\n\n### Fails when\nA major change fails committee approval and no revised request is submitted, leaving the curriculum misaligned with requirements.","specialization":""},{"id":"elem-id-844","type":"BusinessProcess","name":"Curriculum Design","documentation":"### Identity\nThe work of creating a new programme or module specification, including learning outcomes, content structure and assessment strategy.\n\n### Trigger\nA Curriculum Proposal is submitted by a faculty.\n\n### Consumes\nCurriculum Proposal supplies the academic intent and target market. Market Demand Analysis supplies evidence of student demand. Academic Policy supplies the regulatory framework. Resource Capacity Statement supplies available staff and rooms.\n\n### Steps\nThe proposer drafts the Curriculum Blueprint with learning outcomes and module structure. The draft is checked against Academic Policy and professional body requirements. An internal review by the curriculum panel evaluates coherence and resource feasibility against the Resource Capacity Statement. If the review identifies gaps, the blueprint is returned for revision and the process repeats. Once approved, the Curriculum Blueprint is issued as the basis for delivery. The design is registered with the awarding body if applicable.\n\n### Produces\nCurriculum Blueprint. Curriculum Approval. Module Specification for each module.\n\n### Outcome\nA new programme or module is fully specified and approved for offer.\n\n### Fails when\nThe Market Demand Analysis shows insufficient demand and the proposal is withdrawn, leaving no approved curriculum.","specialization":""},{"id":"elem-id-849","type":"BusinessProcess","name":"Curriculum Performance Mgt","documentation":"### Identity\nThe work of monitoring module and programme performance against retention and attainment thresholds.\n\n### Trigger\nCompletion of an academic term or year, signalled by the publication of Student Results Records.\n\n### Consumes\nStudent Results Record supplies pass rates and marks. Module Evaluation Report supplies student feedback. Retention Data supplies withdrawal counts. Benchmark Data supplies comparison thresholds.\n\n### Steps\nThe analyst aggregates results and retention data per module. The data is compared against threshold targets and Benchmark Data. Underperforming modules are flagged. A trend analysis is performed over previous years. A Curriculum Performance Report is produced with recommendations. The report is submitted to the curriculum committee. An Improvement Action Plan is created for flagged modules.\n\n### Produces\nCurriculum Performance Report. Module Improvement Recommendation. Improvement Action Plan.\n\n### Outcome\nCurriculum performance is measured and underperformance is identified for action.\n\n### Fails when\nStudent Results Records are incomplete and the report cannot be produced, leaving performance unmonitored.","specialization":""},{"id":"elem-id-843","type":"BusinessProcess","name":"Curriculum Retirement Mgt","documentation":"### Identity\nThe work of phasing out a programme or module no longer offered.\n\n### Trigger\nA Retirement Proposal is submitted for a module or programme.\n\n### Consumes\nRetirement Proposal supplies the rationale and teach-out plan. Current Curriculum Blueprint supplies the structure. Student Enrolment data supplies current cohorts. Resource Reallocation Plan supplies the target for freed resources.\n\n### Steps\nThe proposal is checked for impact on enrolled students. A teach-out schedule is defined. The retirement is approved by the faculty board. The Curriculum Blueprint is updated to mark the item as retiring. Affected students are notified. The final cohort is tracked through completion. Resources are reallocated according to the Resource Reallocation Plan. A Retirement Completion Record is created.\n\n### Produces\nCurriculum Retirement Decision. Teach-out Schedule. Student Notification. Retirement Completion Record.\n\n### Outcome\nRetired curricula are removed without harming enrolled students.\n\n### Fails when\nCurrent students cannot be accommodated by the teach-out schedule and the proposal is blocked.","specialization":""},{"id":"elem-id-848","type":"BusinessProcess","name":"Curriculum and Resource Development","documentation":"### Identity\nThe work of developing learning materials and resources for approved curricula.\n\n### Trigger\nA Curriculum Approval indicating a need for new teaching resources.\n\n### Consumes\nCurriculum Approval supplies the approved learning outcomes. Teaching Content Pack from prior modules supplies reusable materials. Resource Budget supplies funding constraints. Accessibility Standard supplies the compliance requirements.\n\n### Steps\nThe developer identifies required resources against the learning outcomes. Materials are produced or sourced. The draft Teaching Content Pack is reviewed against institutional standards and the Accessibility Standard. Copyright and licensing checks are completed. A peer review is conducted. The final pack is stored in the repository with version control. A Resource Usage Log is updated.\n\n### Produces\nTeaching Content Pack for the module. Resource Usage Log recording what was produced. Peer Review Record confirming quality.\n\n### Outcome\nApproved curricula have complete learning resources available for delivery.\n\n### Fails when\nResource Budget is insufficient and the pack cannot be completed, leaving modules without materials.","specialization":""},{"id":"elem-id-958","type":"BusinessProcess","name":"Digital Communication Mgt","documentation":"### Identity\nManagement of digital communication channels, including email, collaboration platforms, and web content.\n\n### Trigger\nThe arrival of a digital communication request or an issue with a communication channel.\n\n### Consumes\nDigital Communication Request supplies the content and target audience. Channel Configuration Record supplies the current settings for each platform. User Issue Report supplies the malfunction or access problem.\n\n### Steps\nThe process validates the request against communication policy. It prepares the content for the selected channel. It schedules or sends the communication. It monitors delivery and engagement. It resolves user issues. It updates channel configuration. It reviews usage and cost. If a communication is incorrect, it issues a correction. It records all sends.\n\n### Produces\nDigital Communication Item states the sent content and channel. Channel Issue Resolution records the fix applied. Channel Performance Report records delivery and engagement metrics.\n\n### Outcome\nDigital communications are delivered effectively and the channels remain available.\n\n### Fails when\nA digital channel fails during a critical communication, causing message loss and user confusion.","specialization":""},{"id":"elem-id-878","type":"BusinessProcess","name":"Disability Support Mgt","documentation":"### Identity\nThe work of assessing and implementing disability support for students.\n\n### Trigger\nA student submits a Disability Support Request with evidence.\n\n### Consumes\nDisability Support Request supplies the student's needs. Medical Evidence supplies the diagnosis. Student Enrolment supplies the academic context. Reasonable Adjustment Policy supplies the adjustment options.\n\n### Steps\nThe evidence is reviewed by a disability adviser. A support plan is drafted with reasonable adjustments. The plan is agreed with the student. Adjustments are communicated to relevant teaching and assessment areas. The plan is reviewed annually. The Student Record is updated with the support plan.\n\n### Produces\nDisability Support Plan. Adjustment Notification. Updated Student Record.\n\n### Outcome\nStudents with disabilities receive agreed reasonable adjustments.\n\n### Fails when\nMedical Evidence is insufficient and the plan cannot be finalised, leaving adjustments unimplemented.","specialization":""},{"id":"elem-id-978","type":"BusinessProcess","name":"Dispute Resolution","documentation":"### Identity\nResolution of legal disputes, including litigation, arbitration, and settlement.\n\n### Trigger\nThe arrival of a dispute notification or a legal claim.\n\n### Consumes\nDispute Notification supplies the claim details and parties. Contract Agreement supplies the governing terms. Legal Precedent supplies relevant case law.\n\n### Steps\nThe process assesses the merits of the dispute. It consults with affected departments. It appoints counsel and develops a strategy. It attempts negotiation or mediation. It prepares for litigation if necessary. It manages settlement discussions. It documents all actions and costs. If a settlement is reached, it is formalised. If not, it proceeds to hearing. The outcome is recorded.\n\n### Produces\nDispute Resolution Record states the outcome and terms. Settlement Agreement records the agreed resolution. Legal Cost Record states the expenditure.\n\n### Outcome\nDisputes are resolved in the institution's interest, minimising cost and reputational damage.\n\n### Fails when\nA dispute is not managed, leading to an adverse judgment and significant financial loss.","specialization":""},{"id":"elem-id-853","type":"BusinessProcess","name":"Domestic Student Recruitment","documentation":"### Identity\nThe work of attracting and converting domestic prospective students into applicants.\n\n### Trigger\nThe start of a recruitment cycle for the next academic year.\n\n### Consumes\nRecruitment Campaign Plan supplies the marketing messages. Prospectus supplies programme information. Enquiry List supplies prospective student contacts. Open Day Schedule supplies events.\n\n### Steps\nThe recruitment team launches campaigns across chosen channels. Enquiries are captured from the Enquiry List. Prospective students are invited to open days. Application conversion activities are tracked. The campaign performance is reviewed against targets. Adjustments are made to underperforming channels. A lead nurturing sequence is triggered for warm prospects.\n\n### Produces\nRecruitment Campaign Report. Enquiry Response. Application Funnel Record.\n\n### Outcome\nDomestic prospective students are engaged and moved toward application.\n\n### Fails when\nThe campaign fails to generate the planned number of enquiries and no adjustments reverse the trend.","specialization":""},{"id":"elem-id-949","type":"BusinessProcess","name":"Employee Performance Mgt","documentation":"### Identity\nPerformance appraisal and improvement management for employees. It sets objectives, reviews performance, and manages underperformance.\n\n### Trigger\nThe arrival of a performance review cycle date or a performance concern notification.\n\n### Consumes\nPerformance Objectives supply the agreed goals for the period. Performance Evidence Record supplies the observed outcomes and behaviours. Employee Record supplies the employment history and job role.\n\n### Steps\nThe process agrees objectives at the start of the cycle. It holds mid-cycle check-ins. It gathers evidence and self-assessment. It conducts the formal review. It rates performance against the framework. It sets development actions for the next cycle. If underperformance is identified, an improvement plan is created. The plan's progress is monitored. If the improvement fails, it escalates to the formal capability procedure.\n\n### Produces\nPerformance Review Record states the agreed rating and feedback. Development Plan states the training and support actions required. Underperformance Improvement Plan states the expected improvements and consequences.\n\n### Outcome\nEach employee has assessed performance and agreed development or improvement actions.\n\n### Fails when\nPerformance concerns are not addressed, causing underperformance to continue and affect team delivery.","specialization":""},{"id":"elem-id-952","type":"BusinessProcess","name":"Employee Support","documentation":"### Identity\nProvision of employee support services, including pastoral care, counselling, and reasonable adjustments.\n\n### Trigger\nThe arrival of an employee support request or a referral from a manager.\n\n### Consumes\nEmployee Support Request supplies the employee's issue and the support required. Employee Record supplies the employee's role and any known adjustments. Support Service Catalogue supplies the available internal and external services.\n\n### Steps\nThe process assesses the request and determines the appropriate support. It assigns a case worker or refers to external services. It agrees an action plan with the employee. It monitors progress and follows up. It records the outcome. If the support involves a workplace adjustment, it coordinates with the manager and HR. It reviews cases periodically for closure.\n\n### Produces\nEmployee Support Case Record states the support provided and outcome. Reasonable Adjustment Agreement states the agreed adjustment and review date. Referral Confirmation records the external service involved.\n\n### Outcome\nEmployees receive effective support, and adjustments are in place to maintain their well-being and performance.\n\n### Fails when\nA support request is ignored or delayed, causing employee harm and potential legal claims.","specialization":""},{"id":"elem-id-961","type":"BusinessProcess","name":"End User Computing","documentation":"### Identity\nProvision and support of end-user computing devices, including desktops, laptops, and software.\n\n### Trigger\nThe arrival of a new starter equipment request or a user device fault report.\n\n### Consumes\nDevice Request supplies the user's role and equipment needs. Device Inventory supplies the current devices and their location. Software Licence Record supplies the licences that can be installed.\n\n### Steps\nThe process validates the device request against policy. It allocates a device or orders new. It configures the device with the required software. It deploys to the user. It provides support for faults. It patches and updates devices. It retires old devices. If a device is lost or stolen, it is remotely wiped and reported. All devices are tracked.\n\n### Produces\nDevice Allocation Record states the user and device. Software Installation Record states the licensed software installed. Device Retirement Record states the disposal or wipe.\n\n### Outcome\nUsers have working devices with licensed software, and the device estate is managed.\n\n### Fails when\nDevice stock is insufficient or licences are exhausted, causing new starters to be without equipment.","specialization":""},{"id":"elem-id-862","type":"BusinessProcess","name":"Enrolment Status Mgt","documentation":"### Identity\nThe work of changing a student's enrolment status, including suspension, withdrawal, and return.\n\n### Trigger\nA Student Status Change Request submitted by the student or an academic authority.\n\n### Consumes\nStudent Enrolment supplies the current status. Student Status Change Request supplies the requested new status and reason. Academic Policy supplies the rules for status changes. Funding Body Requirement supplies external constraints.\n\n### Steps\nThe request is checked for completeness and supporting evidence. The reason is verified against Academic Policy. If the change is suspension or withdrawal, the student's funding body is notified. The change is approved by the academic registrar or delegated authority. The Student Enrolment record is updated with the new status. The Student Record is updated to reflect the change. A Confirmation of Status Change is issued to the student. If the request is refused, a refusal notice with reasons is issued.\n\n### Produces\nUpdated Student Enrolment. Student Status Change Confirmation. Status Change Notice to funding body.\n\n### Outcome\nEnrolment statuses are accurate and formally approved.\n\n### Fails when\nThe request lacks required evidence and the status cannot be updated, leaving the Student Record inconsistent.","specialization":""},{"id":"elem-id-830","type":"BusinessProcess","name":"Enterprise Architecture","documentation":"### Identity\nThis process defines the institution's current and target architectures and the roadmap that moves from one to the other, and it governs architectural compliance. It is the part of the capability that ensures technology and business change follow consistent architectural principles.\n\n### Trigger\nA major business change request or a new Strategic Plan signals a need to adjust the architecture, when current state architecture no longer supports the intended future state.\n\n### Consumes\nCurrent State Architecture supplies the baseline business processes, applications, data entities, and technology components. Business Requirements supply the capabilities and constraints demanded by the change. Technology Standards supply the approved patterns, platforms, and security constraints. Architecture Principles supply the decision rules from prior governance.\n\n### Steps\nFirst the process captures and validates the Current State Architecture for the domain affected. Then it analyses gaps between current state and the stated Business Requirements. It designs one or more Target Architecture options, evaluating each against Technology Standards and cost. It selects a preferred option and defines an Architecture Roadmap with transition states. It reviews each proposed project against the roadmap, approving or rejecting architectural deviations. When a project needs a deviation, it records the exception and its justification.\n\n### Produces\nTarget Architecture records the agreed future state for the affected domain. Architecture Roadmap records the transition states, their sequence, and their dependencies. Architecture Decision records each approval or rejection of a proposed deviation.\n\n### Outcome\nAll approved change initiatives are consistent with a single documented target architecture and a sequenced transition path.\n\n### Fails when\nThe Current State Architecture is absent or incomplete, because the gap analysis cannot be performed and the resulting roadmap is based on unverified assumptions, causing downstream projects to deliver incompatible components.","specialization":""},{"id":"elem-id-974","type":"BusinessProcess","name":"Enterprise Content Mgt","documentation":"### Identity\nManagement of unstructured enterprise content, including documents, images, and multimedia, across its lifecycle.\n\n### Trigger\nThe arrival of new content or a retention review date.\n\n### Consumes\nContent Item supplies the new or changed document. Content Classification Scheme supplies the metadata and security classification. Retention Schedule supplies the required retention periods.\n\n### Steps\nThe process captures and classifies content. It applies metadata and security controls. It stores the content in the enterprise repository. It manages versioning and access. It runs retention and disposal rules. It migrates content when systems change. It provides search and retrieval. If content is misfiled, it is corrected.\n\n### Produces\nContent Item Metadata Record states the classification and ownership. Retention Disposal Decision states whether to keep, archive, or delete. Content Repository Index updates the search index.\n\n### Outcome\nEnterprise content is organised, secure, and available for its required retention period.\n\n### Fails when\nContent is not classified correctly, causing over-retention under GDPR or loss of important records.","specialization":""},{"id":"elem-id-984","type":"BusinessProcess","name":"Environmental Mgt","documentation":"### Identity\nManagement of environmental performance, including energy, waste, and regulatory compliance across the estate.\n\n### Trigger\nThe arrival of a statutory environmental return date or a scheduled sustainability performance review.\n\n### Consumes\nEnergy Consumption Record supplies utility usage and cost data. Waste Disposal Record supplies waste stream volumes and disposal routes. Environmental Compliance Requirement supplies the legal limits and reporting duties.\n\n### Steps\nThe process collects and validates energy and waste data. It measures performance against environmental targets and legal limits. It identifies deviations and investigates their cause. It implements corrective measures through Facilities Work Orders. It prepares and submits statutory returns. It tracks progress on sustainability initiatives. If a target is missed, a corrective action is assigned to the responsible area. Annual performance is reported to governance.\n\n### Produces\nEnvironmental Performance Report states the measured performance against targets. Statutory Environmental Return supplies the data required by regulators. Corrective Action Request states the work needed to address a deviation.\n\n### Outcome\nThe institution's environmental impacts are measured, reported, and corrected within legal and policy limits.\n\n### Fails when\nEnergy or waste data is missing or inaccurate, causing statutory returns to be late or incorrect and risking compliance breach.","specialization":""},{"id":"elem-id-980","type":"BusinessProcess","name":"Estate Development & Mgt","documentation":"### Identity\nStrategic and project-based development of the estate, including new buildings, major refurbishments, and space strategy.\n\n### Trigger\nThe arrival of an Estate Strategy requirement or a Building Condition Survey that identifies major works.\n\n### Consumes\nEstate Strategy supplies the long-term spatial and capital priorities. Building Condition Survey supplies the life-cycle defects and compliance risks for existing assets. Capital Budget supplies the funding envelope for approved projects.\n\n### Steps\nThe process prioritises projects against the Estate Strategy and condition data. It develops project briefs and feasibility studies. It obtains planning and statutory approvals. It procures design and construction services. It delivers the project through stage gates, monitoring scope, cost, and programme. It manages handover and snagging. It updates the estate asset register and condition data. If a project overruns, the contingency or reallocation decision is made at the stage gate. Completed projects are reviewed for benefits.\n\n### Produces\nEstate Development Plan states the approved programme of projects and their phasing. Project Business Case states the justification, cost, and expected benefits for a single project. Asset Register Update records the new or changed building asset.\n\n### Outcome\nThe estate is developed in accordance with strategy, maintaining building condition and capacity within capital limits.\n\n### Fails when\nCapital funding is withdrawn or planning consent is refused, causing approved projects to stop and building condition to decline.","specialization":""},{"id":"elem-id-929","type":"BusinessProcess","name":"Event Mgt","documentation":"### Identity\nManagement of institutional events, including planning, logistics, safety, and evaluation.\n\n### Trigger\nThe arrival of an event proposal or confirmed booking.\n\n### Consumes\nEvent Proposal supplies the purpose, date, and expected numbers. Venue Booking Confirmation supplies the confirmed room and facilities. Event Risk Assessment supplies the identified hazards.\n\n### Steps\nThe process plans the event logistics. It coordinates suppliers and internal services. It manages invitations and registrations. It runs the event. It ensures health and safety compliance. It collects feedback. It reports on outcomes. If the event exceeds capacity, it plans an overflow or reschedules. It closes the event file.\n\n### Produces\nEvent Plan states the schedule and responsibilities. Event Registration List records attendees. Event Feedback Report records attendee satisfaction.\n\n### Outcome\nThe institution delivers safe, successful events that meet their objectives.\n\n### Fails when\nA key supplier fails or a safety incident occurs, causing the event to be cancelled or damaged.","specialization":""},{"id":"elem-id-998","type":"BusinessProcess","name":"Expenditure Mgt","documentation":"### Identity\nProcessing of supplier invoices, expense claims, and other payments from receipt to payment.\n\n### Trigger\nThe arrival of a Supplier Invoice or Expense Claim.\n\n### Consumes\nSupplier Invoice supplies the amount, supplier, and goods or services received. Purchase Order supplies the authorised commitment to match against. Goods Receipt Note supplies confirmation of delivery or service completion.\n\n### Steps\nThe process matches the invoice to the purchase order and goods receipt. It checks for price and quantity deviations. It routes unmatched invoices for approval. It applies tax and discount terms. It schedules payment by due date. It posts the invoice to the ledger. It handles duplicate and disputed invoices. If a match fails, the invoice is queried with the supplier and held. Once resolved, it is released for payment.\n\n### Produces\nPayment Batch states the invoices approved for payment in a run. Supplier Invoice Record records the posting and payment status. Supplier Query states the missing or incorrect information that must be resolved before payment.\n\n### Outcome\nSupplier invoices are paid accurately and on time, with only authorised expenditure released.\n\n### Fails when\nPurchase order matching cannot be completed and the supplier query is not resolved, causing payments to stop and supplier service to be withdrawn.","specialization":""},{"id":"elem-id-1000","type":"BusinessProcess","name":"Financial Advisory","documentation":"### Identity\nFinancial advice and analysis to support institutional decision-making, investment appraisal, and financial planning.\n\n### Trigger\nThe arrival of a request for financial analysis or an investment proposal.\n\n### Consumes\nInvestment Proposal supplies the project financials and expected returns. Financial Data Set supplies current and projected financial position. Costing Model supplies the standard costing methods and assumptions.\n\n### Steps\nThe process scopes the analysis required. It gathers relevant financial data and validates its completeness. It constructs or updates a costing model. It performs sensitivity and scenario analysis. It prepares an advice paper with recommendations and risks. It presents the advice to the decision-maker. It responds to follow-up queries and revises the analysis. If the proposal is approved, handover to budget and project teams occurs.\n\n### Produces\nFinancial Analysis Report states the findings, assumptions, and recommended option. Investment Appraisal Decision records the approval or rejection. Costing Model Update records any change to costing assumptions.\n\n### Outcome\nThe institution makes investment and financial decisions from analysed, evidence-based advice.\n\n### Fails when\nFinancial data is incomplete or the costing model is not validated, causing poor investment decisions and financial loss.","specialization":""},{"id":"elem-id-996","type":"BusinessProcess","name":"Financial Reporting","documentation":"### Identity\nStatutory and management financial reporting, including month-end, year-end, and preparation of Financial Statements.\n\n### Trigger\nThe arrival of a period-end closing date or a statutory filing deadline.\n\n### Consumes\nGeneral Ledger Trial Balance supplies the closing balances for all accounts. Journal Entry supplies adjustments and accruals. Reporting Standard supplies the accounting rules to apply.\n\n### Steps\nThe process performs pre-close checks and reconciliations. It posts adjusting journal entries for accruals, prepayments, and corrections. It runs the trial balance and validates balances. It prepares the Financial Statements. It obtains audit evidence and responds to audit queries. It submits final statements to governance and regulators. It closes the period and opens the next. If a reconciliation fails, the account is investigated before continuing.\n\n### Produces\nFinancial Statements state the institution's position and performance for the period. Management Accounts Pack supplies internal performance reports. Period Close Confirmation records the closed period and any outstanding items.\n\n### Outcome\nThe institution's financial position is reported accurately and on time to stakeholders.\n\n### Fails when\nYear-end adjustments cannot be posted because supporting documentation is missing, causing a late filing and audit qualification.","specialization":""},{"id":"elem-id-933","type":"BusinessProcess","name":"Food & Retail Mgt","documentation":"### Identity\nManagement of food and retail outlets on campus, including catering, shops, and vending.\n\n### Trigger\nThe arrival of a daily operations schedule or a supplier delivery.\n\n### Consumes\nFood Order supplies the required ingredients and supplies. Sales Transaction Record supplies the daily sales. Health and Safety Standard supplies the hygiene requirements.\n\n### Steps\nThe process orders stock. It manages deliveries. It prepares and serves food. It operates retail outlets. It manages staffing. It ensures food safety compliance. It reconciles daily sales. It handles customer feedback. If a food safety issue occurs, it closes the outlet and investigates.\n\n### Produces\nDaily Sales Report states the revenue and stock used. Food Safety Audit Record records the hygiene check. Supplier Delivery Note records received goods.\n\n### Outcome\nThe campus community has safe and convenient food and retail services.\n\n### Fails when\nA food safety breach occurs, causing illness and temporary closure.","specialization":""},{"id":"elem-id-921","type":"BusinessProcess","name":"Government Relationship Mgt","documentation":"### Identity\nManagement of relationships with central and local government bodies. It tracks policy, responds to consultations, and secures permissions.\n\n### Trigger\nThe arrival of a Government Policy document or a government consultation deadline.\n\n### Consumes\nGovernment Policy Document supplies the policy change and its implications. Consultation Request supplies the specific questions and response date. Institutional Position Paper supplies the institution's agreed stance.\n\n### Steps\nThe process reviews the policy document or consultation. It assesses impact on institutional strategy and operations. It drafts a response or position. It obtains internal approval from the relevant executive. It submits the response by the deadline. It briefs senior leaders on the position. It monitors subsequent government announcements. If the policy is adversarial, an advocacy plan is developed. It records all interactions.\n\n### Produces\nGovernment Consultation Response states the institution's formal answer. Policy Impact Assessment records the effect on institutional operations. Advocacy Plan states the actions to influence decision-makers.\n\n### Outcome\nThe institution understands and responds to government policy, protecting its interests and meeting consultation duties.\n\n### Fails when\nA consultation deadline is missed, causing the institution's views to be excluded and policy decisions to be made without its input.","specialization":""},{"id":"elem-id-861","type":"BusinessProcess","name":"Graduation Eligibility Mgt","documentation":"### Identity\nThe work of determining which students have met all requirements for an award.\n\n### Trigger\nThe Results Board publishes final Student Results Records for the year.\n\n### Consumes\nStudent Results Record supplies the final marks. Programme Requirements Register supplies the required credits and conditions. Student Record supplies the students to check. Award Regulations supplies classification rules.\n\n### Steps\nEach student's completed credits are compared to the Programme Requirements Register. Students meeting all requirements are added to the Graduation Candidate List. Students missing credits are flagged for resit or appeal. The candidate list is checked by the Awards Board. The board confirms the Award Classification using Award Regulations. The confirmed list is approved.\n\n### Produces\nGraduation Candidate List. Award Classification. Graduation Eligibility Decision.\n\n### Outcome\nEvery student's eligibility for award is determined and classified.\n\n### Fails when\nProgramme Requirements Register is ambiguous and the Awards Board cannot confirm classifications, delaying graduation.","specialization":""},{"id":"elem-id-858","type":"BusinessProcess","name":"Graduation Event Mgt","documentation":"### Identity\nThe work of planning and delivering the graduation ceremonies.\n\n### Trigger\nThe Graduation Candidate List is approved.\n\n### Consumes\nGraduation Candidate List supplies the number of graduands. Venue Booking supplies the location and date. Academic Calendar supplies the ceremony dates. Academic Dress Order supplies the gowns.\n\n### Steps\nThe ceremony schedule is set. Graduands are allocated to ceremonies. Academic dress is arranged. Tickets are issued. The ceremony is rehearsed. On the day, graduands are processed and the ceremony is conducted. A photographer records the event. Certificates are distributed at the ceremony or after.\n\n### Produces\nGraduation Ceremony Schedule. Graduation Ceremony Record. Ticket Allocation.\n\n### Outcome\nGraduation ceremonies are delivered for all eligible graduands.\n\n### Fails when\nVenue capacity is exceeded and no additional ceremony can be scheduled, leaving some graduands unable to attend.","specialization":""},{"id":"elem-id-859","type":"BusinessProcess","name":"Graduation Record Certificate Mgt","documentation":"### Identity\nThe work of producing and issuing Awarded Degree Certificates and Graduate Records.\n\n### Trigger\nThe Awards Board confirms final awards.\n\n### Consumes\nAward Classification supplies the final award and class. Student Record supplies the personal details. Certificate Template supplies the format. Transcript Template supplies the academic history format.\n\n### Steps\nThe certificate is produced with the graduate's name, award and classification. The Graduate Record is prepared with the academic transcript. Both are checked for accuracy. The certificate is signed and sealed. The items are issued to the graduate in person or by post. A digital badge is issued where applicable.\n\n### Produces\nAwarded Degree Certificate. Graduate Record. Digital Badge.\n\n### Outcome\nGraduates receive verified credentials confirming their award.\n\n### Fails when\nThe Student Record has incorrect personal details and no correction is made before printing, causing invalid certificates.","specialization":""},{"id":"elem-id-986","type":"BusinessProcess","name":"Health & Safety","documentation":"### Identity\nInstitutional health and safety management, including risk assessment, training, accident reporting, and regulatory compliance.\n\n### Trigger\nThe arrival of an Accident Report or a scheduled safety audit date.\n\n### Consumes\nAccident Report supplies the incident details and persons affected. Risk Assessment supplies the identified hazards and controls for a workplace activity. Safety Audit Schedule supplies the planned audit dates and scope.\n\n### Steps\nThe process investigates accidents and near misses. It identifies root causes and recommends corrective actions. It reviews risk assessments for affected activities. It schedules and delivers safety training. It conducts audits and inspections. Non-conformities are recorded and assigned to responsible managers. The status of corrective actions is monitored until closure. Annual safety performance is reported to governance.\n\n### Produces\nAccident Investigation Record states the root cause and recommended actions. Corrective Action Request states the work required to close a non-conformity. Safety Audit Report records the findings and compliance status.\n\n### Outcome\nThe institution's activities are controlled by current risk assessments and closed safety actions.\n\n### Fails when\nA serious accident occurs and corrective actions are not implemented, causing repeated harm and regulatory enforcement.","specialization":""},{"id":"elem-id-938","type":"BusinessProcess","name":"Health Care Mgt","documentation":"### Identity\nManagement of on-campus health services for students and staff, including appointments, treatment, and referrals.\n\n### Trigger\nThe arrival of a healthcare appointment request or a urgent health need.\n\n### Consumes\nAppointment Request supplies the patient and symptoms. Patient Record supplies the medical history. Clinical Referral Pathway supplies the options for further care.\n\n### Steps\nThe process triages the request. It books an appointment. It provides clinical assessment and treatment. It prescribes or refers. It manages follow-up. It records the consultation. It manages urgent presentations immediately. It complies with confidentiality and regulatory standards. It reports on service usage.\n\n### Produces\nClinical Consultation Record states the assessment and treatment. Prescription Record states the medication issued. Referral Letter states the onward referral.\n\n### Outcome\nPatients receive appropriate healthcare and the campus remains a healthy environment.\n\n### Fails when\nNo clinician is available, causing an urgent case to be referred off-site with delay.","specialization":""},{"id":"elem-id-960","type":"BusinessProcess","name":"High Performance Computing","documentation":"### Identity\nManagement of the high-performance computing facility, including capacity, access, and research support.\n\n### Trigger\nThe arrival of a research computing project request or a capacity utilization review.\n\n### Consumes\nResearch Computing Request supplies the computational needs and duration. HPC Capacity Record supplies the available nodes and storage. User Access Request supplies the applicant's eligibility and project.\n\n### Steps\nThe process reviews the project against technical feasibility. It allocates computing time and storage. It grants user access. It monitors jobs and capacity. It supports users with code and environment issues. It schedules maintenance windows. It charges back usage where applicable. It plans capacity upgrades. If a job exceeds allocation, it is queued or rejected.\n\n### Produces\nHPC Allocation Record states the granted compute and storage. User Access Grant states the user's permissions. HPC Usage Report records consumption and costs.\n\n### Outcome\nResearchers have access to HPC resources, and capacity is managed within limits.\n\n### Fails when\nCapacity is oversubscribed, causing research jobs to fail or be delayed, impacting research outputs.","specialization":""},{"id":"elem-id-875","type":"BusinessProcess","name":"Housing Advice","documentation":"### Identity\nThe work of advising students on accommodation options and issues.\n\n### Trigger\nA student requests housing advice.\n\n### Consumes\nStudent Enrolment supplies the student status. Accommodation Register supplies available housing. Tenancy Agreement supplies contract issues. Legal Rights Guide supplies the rights information.\n\n### Steps\nThe advisor assesses the student's situation. Options are presented. If needed, the student is referred to external services. The advice is recorded. A tenancy check is performed. Dispute resolution guidance is provided.\n\n### Produces\nHousing Advice Record. External Referral.\n\n### Outcome\nStudents receive housing information and referrals.\n\n### Fails when\nThe Accommodation Register is empty and no options can be provided.","specialization":""},{"id":"elem-id-957","type":"BusinessProcess","name":"ICT Service Support","documentation":"### Identity\nService desk and incident management for ICT services, including request fulfilment, incident resolution, and change management.\n\n### Trigger\nThe arrival of a Service Request or Incident Report from a user.\n\n### Consumes\nService Request supplies the user's requirement, such as access or a new service. Incident Report supplies the service failure and impact. Knowledge Base Article supplies known solutions.\n\n### Steps\nThe process categorises and prioritises the request or incident. It attempts first-line resolution. If unresolved, it escalates to specialist teams. It updates the user on progress. It applies a workaround if a permanent fix is not immediate. It closes the ticket after user confirmation. It documents the resolution in the knowledge base. It identifies recurring incidents for problem management.\n\n### Produces\nResolved Incident Record states the root cause and fix. Service Request Fulfilment Record states the delivered service. Knowledge Base Article Update records a new solution.\n\n### Outcome\nUsers' ICT issues and requests are resolved within agreed service levels, and knowledge is captured.\n\n### Fails when\nA major incident cannot be resolved, causing prolonged system outage and widespread user inability to work.","specialization":""},{"id":"elem-id-959","type":"BusinessProcess","name":"Identity & Access Mgt","documentation":"### Identity\nManagement of digital identities, access rights, and authentication across systems.\n\n### Trigger\nThe arrival of a new account request or an access change request.\n\n### Consumes\nAccount Request supplies the user and required systems. Access Policy supplies the role-based permissions. Identity Record supplies the current accounts and rights.\n\n### Steps\nThe process validates the request against the access policy. It provisions the account or modifies access. It applies least privilege. It enforces multi-factor authentication. It reviews access periodically. It removes access upon departure or role change. It logs all changes. If a request is high-risk, it requires extra approval. Deprovisioning is immediate on termination.\n\n### Produces\nUser Account Grant states the new or changed access. Access Review Report records the periodic audit of rights. Deprovisioning Confirmation records the removal of access.\n\n### Outcome\nOnly authorised users have access to systems, and access is removed promptly when no longer needed.\n\n### Fails when\nAn account is not deprovisioned, allowing an ex-employee to access systems, causing a security breach.","specialization":""},{"id":"elem-id-993","type":"BusinessProcess","name":"Income Mgt","documentation":"### Identity\nManagement of all income streams, including student fees, research grants, and commercial income, from receipt to recognition.\n\n### Trigger\nThe arrival of an income receipt or an income schedule requirement.\n\n### Consumes\nIncome Receipt supplies the amount, source, and account code. Income Schedule supplies the planned timing and amount for each income stream. Student Fee Payment supplies specific payment for student fees.\n\n### Steps\nThe process matches income receipts to outstanding invoices or agreements. It allocates receipts to the correct account code and cost centre. It reconciles the income ledger to bank records. It recognises deferred income where revenue relates to future periods. It follows up on overdue invoices. It handles credit notes and refunds. If a receipt is unallocated, it is queried and resolved before posting. Periodic income reports are prepared.\n\n### Produces\nIncome Allocation Record states which invoice or account each receipt was applied to. Income Reconciliation Report records the match between ledger and bank. Overdue Invoice Reminder states the amount and due date for outstanding payments.\n\n### Outcome\nAll income is accurately recorded, recognised in the correct period, and pursued when overdue.\n\n### Fails when\nIncome receipts cannot be matched to an invoice, causing unallocated cash and incorrect revenue recognition.","specialization":""},{"id":"elem-id-922","type":"BusinessProcess","name":"Industry Relationship Mgt","documentation":"### Identity\nManagement of relationships with industry partners, employers, and commercial collaborators.\n\n### Trigger\nThe arrival of an industry partnership enquiry or a scheduled partnership review.\n\n### Consumes\nPartnership Proposal supplies the proposed collaboration and objectives. Industry Contact Record supplies the history and status of the relationship. Institutional Capability Statement supplies what the institution can offer.\n\n### Steps\nThe process scopes the partnership opportunity. It matches institutional capabilities with partner needs. It negotiates partnership terms. It secures internal approval. It establishes a partnership register entry. It manages ongoing communication and joint projects. It reviews partnership performance annually. If the partnership underperforms, it is renegotiated or terminated. It records all outcomes.\n\n### Produces\nPartnership Agreement states the mutual obligations and scope of collaboration. Partnership Review Report records the performance assessment. Partnership Register Update records the current status.\n\n### Outcome\nThe institution builds and maintains productive industry relationships that deliver mutual value.\n\n### Fails when\nA partner withdraws or the partnership fails to produce agreed outcomes, causing lost investment and reputational damage.","specialization":""},{"id":"elem-id-971","type":"BusinessProcess","name":"Information & Data Mgt","documentation":"### Identity\nData governance and management of institutional data assets, including data quality, standards, and master data.\n\n### Trigger\nThe arrival of a new data asset or a data quality issue report.\n\n### Consumes\nData Asset Inventory supplies the current data assets and owners. Data Quality Issue Report supplies the specific data errors. Data Standard supplies the required formats and definitions.\n\n### Steps\nThe process registers new data assets. It assigns data owners and stewards. It defines and enforces data standards. It monitors data quality. It corrects data quality issues with the owners. It maintains the business glossary. It reviews data access and usage. If a data quality issue is critical, it is escalated. It reports on data governance maturity.\n\n### Produces\nData Asset Register Update records the new or changed data asset. Data Quality Correction Record states the fix applied. Data Standard Update records a change to definitions.\n\n### Outcome\nThe institution's data is trustworthy, well-defined, and managed by accountable owners.\n\n### Fails when\nData quality issues accumulate w
