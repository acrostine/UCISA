 boards rely on them to approve spending and track delivery. Each project contributes Benefits and is monitored for progress, budget and risk. In this model, Projects sit within a Programme of Work and provide the detailed execution vehicle for institutional change.","specialization":""},{"id":"elem-f2-id-892","type":"BusinessObject","name":"Prospect","documentation":"**A record of a potential applicant or supporter.** This record identifies a person who has shown interest in studying, donating, or otherwise engaging with the institution. It holds contact details, interests, and interaction history. Marketing, recruitment, or fundraising staff create and update it from enquiries, events, or purchased lists. The record supports outreach campaigns, personalised follow-up, and conversion tracking.","specialization":""},{"id":"elem-f2-id-935","type":"BusinessObject","name":"Record","documentation":"**A single item of recorded information.** It holds factual details about a transaction, decision, or event within the institution. Staff create records during daily work, and managers, auditors, and external bodies rely on them as evidence of what happened. A record is kept according to retention rules and moves to an archive once its active use ends. In this model, the record is the basic unit that archives preserve and discovery requests search for.","specialization":""},{"id":"elem-f2-id-860","type":"BusinessObject","name":"Registered Designs","documentation":"**Legal protection for a product's appearance.** This record captures the visual features of a design, such as its shape, pattern, or ornamentation, for which the institution holds registered rights. Designers and researchers file the record with the relevant intellectual property office. The research and legal teams use it to prevent unauthorised copying, to support licensing agreements, and to track renewal dates. It provides evidence of ownership when the institution commercialises a designed product.","specialization":""},{"id":"elem-f2-id-948","type":"BusinessObject","name":"Regulation","documentation":"**Binding rules from external bodies.** Regulation comprises requirements set by regulators, funding bodies, or professional associations that the institution must satisfy. It is recorded to track obligations and demonstrate compliance. Compliance officers and managers use regulation to shape policies and procedures. In this model, Regulation sits alongside Legislation and Standard, providing an external constraint on institutional activity.","specialization":""},{"id":"elem-f2-id-872","type":"BusinessObject","name":"Regulator","documentation":"**A body that oversees compliance.** A regulator sets standards and monitors the institution's adherence to legal or professional requirements. The institution records regulators to manage submissions, inspections, and accreditation. Compliance and legal teams use the record to track regulatory requirements, prepare evidence, and maintain licences to operate. The record holds registration details, contact information, and key dates for reporting. These records support audit and risk management processes.","specialization":""},{"id":"elem-f2-id-903","type":"BusinessObject","name":"Research Body","documentation":"**An organisation conducting or funding research.** A research body collaborates with the institution on research projects, either as a partner or as a funder. The institution records research bodies to manage partnerships, joint funding applications, and knowledge exchange. Research offices and academic departments use the record to coordinate projects, share data, and report outcomes. The record includes areas of research interest and key contacts for collaboration. These records support research strategy and impact assessment.","specialization":""},{"id":"elem-f2-id-816","type":"BusinessObject","name":"Research Collaboration","documentation":"**A formal partnership for joint research.** It records the parties, aims, scope, resources, and outputs of research undertaken with one or more partners. Research offices and academic staff create and maintain the record while the collaboration is planned, delivered, and closed. Institutional leaders, research administrators, and external partners rely on it to understand responsibilities, track progress, manage funding, and report on outcomes. The record supports decisions about resource allocation, risk, and the value of the institution’s collaborative research activity.","specialization":""},{"id":"elem-f2-id-819","type":"BusinessObject","name":"Research Data","documentation":"**The information generated by research activity.** This object stores datasets, measurements, observations, or other factual material collected or created during a research project. Researchers generate and document the data as part of their work. Other researchers, funders, and institutional services use it to validate findings, support reproducibility, and meet open-access or preservation requirements. The record includes details about provenance, format, storage location, and access conditions, enabling the institution to manage data as a research asset.","specialization":""},{"id":"elem-f2-id-845","type":"BusinessObject","name":"Research Programme","documentation":"**A structured portfolio of related research.** It holds the aims, projects, funding, milestones, and outcomes of a coordinated body of research activity. Academic and research leaders create and maintain the programme record to manage a theme or strategic goal over time. Research administrators, funders, and institutional governance bodies use it to monitor progress, allocate resources, and assess performance. The programme record shows how individual projects contribute to agreed objectives and supports decisions about continuation, funding, and reporting.","specialization":""},{"id":"elem-f2-id-894","type":"BusinessObject","name":"Research Project","documentation":"**A planned piece of research.** A Research Project is the record of an approved research undertaking, created once a Research Proposal has been accepted and funding or internal approval is in place. It holds the project's objectives, planned activities, milestones, and responsible researchers. Project teams use this record to coordinate their work and report progress. The institution uses it to monitor research outputs, spending, and compliance with any conditions, such as Ethical Clearance. In this model, a Research Project sits alongside the Research Proposal that led to it and the Ethical Clearance that authorises the work, providing a central point for managing the research from start to finish.","specialization":""},{"id":"elem-f2-id-850","type":"BusinessObject","name":"Research Proposal","documentation":"**A plan for proposed research.** A Research Proposal is the record that researchers create to describe a piece of research they want to carry out. It sets out the research question, the methods to be used, the resources needed, and how any ethical issues will be handled. Review bodies within the institution use the proposal to decide whether the research should be approved, funded, or supported. The proposal is also the starting point for Ethical Clearance, as it gives the ethics review body the information needed to assess risks. In this model, a Research Proposal precedes and supports a Research Project, providing the original plan against which the later work is checked.","specialization":""},{"id":"elem-f2-id-900","type":"BusinessObject","name":"Research Publication","documentation":"**A formal output presenting research findings.** This is a record of a scholarly work, such as a journal article, book, conference paper, or report, produced by the institution's researchers. It captures bibliographic details, authorship, publisher, and publication status. Researchers create the record when they submit or publish their work. The library, research office, and funders rely on it to demonstrate research output, assess performance, and ensure compliance with open-access policies. It supports the institution's scholarly reputation and reporting.","specialization":""},{"id":"elem-f2-id-822","type":"BusinessObject","name":"Researcher","documentation":"**A record of a person conducting research.** This record identifies someone who undertakes research activity within or on behalf of the institution. It holds affiliation, expertise, funding details, and output information. Research support staff create it when a researcher joins a project or applies for funding. The record supports management of research projects, reporting, and compliance with funders.","specialization":""},{"id":"elem-f2-id-862","type":"BusinessObject","name":"Residence","documentation":"**Accommodation provided for students to live in.** The institution manages residence records to allocate rooms, track occupancy, and support student welfare. Accommodation services create and update these records, which students and residential staff rely on for contracts, maintenance requests, and safety checks. Residences are managed living spaces where enrolled students stay during their studies. The location data feeds into fees, catering, and pastoral care.","specialization":""},{"id":"elem-f2-id-857","type":"BusinessObject","name":"Resource Bookings","documentation":"**A reservation for a space or asset.** When someone needs a room, vehicle, or equipment for a period, they create a booking. The record holds who requested it, what resource, the dates and times, and the purpose. Facilities staff use bookings to avoid double-booking and to prepare the resource. The requester relies on the booking to have access at the agreed time.","specialization":""},{"id":"elem-f2-id-888","type":"BusinessObject","name":"Risk","documentation":"**A potential event affecting objectives.** Risk is a record of uncertainty that could harm or benefit the institution's ability to meet its goals. It includes a description, likelihood, impact, and owner. Risk managers and senior leaders create and maintain the risk record, and governing bodies use it to prioritise mitigating actions. In the model, Risk is part of governance because it informs decisions about controls, resources, and policy changes.","specialization":""},{"id":"elem-f2-id-915","type":"BusinessObject","name":"Room","documentation":"**A single space within a building.** The institution records rooms to manage timetabling, room bookings, and space utilisation. Timetabling staff assign rooms to classes, meetings, and examinations, and students and staff rely on room records for location and capacity details. Room data supports maintenance and cleaning schedules and helps the institution understand how its space is used.","specialization":""},{"id":"elem-f2-id-946","type":"BusinessObject","name":"Salary","documentation":"**A record of an employee's pay and compensation.** Salary captures the agreed base pay, any allowances, overtime, bonuses and deductions, along with the payment schedule and method. Human resources and payroll create and maintain salary records to ensure accurate and timely payment. Employees use the record to understand their earnings and tax deductions. Managers and finance teams rely on salary information for budgeting, pay reviews and statutory reporting. The record links to job role and employee benefits to form the total reward package.","specialization":""},{"id":"elem-f2-id-824","type":"BusinessObject","name":"Scholarship","documentation":"**A merit-based financial award for students.** The Scholarship record holds the award amount, selection criteria, duration, and terms. Scholarship committees or administrative staff create and maintain it. Students use it to plan their funding; finance staff use it to allocate funds; academic departments use it to attract and retain students. The record supports decisions about awarding, renewal, and reporting to donors or governing bodies.","specialization":""},{"id":"elem-f2-id-835","type":"BusinessObject","name":"School","documentation":"**An academic unit focused on a specific subject area or group of disciplines.** The school organises teaching, research, and student support within its field. The model records the school as a mid-level structural element below the faculty or university. School leadership creates the record, and faculty and central planners use it to manage course delivery, staff deployment, and quality assurance. It holds the school's name, subject scope, and links to programmes and staff, showing where academic activity is based.","specialization":""},{"id":"elem-f2-id-947","type":"BusinessObject","name":"Security","documentation":"**Protection of facilities, assets, and people.** The security element records access control, incidents, or risk assessments. The security team creates these records to document who has access to areas and to log any security events. Management uses them to review safety and to make decisions about locks, alarms, or staffing. In this model, security supports the safe operation of physical assets and spaces.","specialization":""},{"id":"elem-f2-id-940","type":"BusinessObject","name":"Servivce Request","documentation":"**A request for facilities work or support.** Service Request records who asks, what they need, where it is needed, and how urgent it is. Staff and students submit requests; the facilities team uses them to assign work, track progress, and confirm completion. The record supports decisions about prioritizing tasks, allocating technicians, and reporting on service performance. In the Facilities & Properties group, Service Request works alongside Physical Asset, Maintenance, Lease, Resource Bookings, and Security to coordinate care of the institution's spaces and equipment.","specialization":""},{"id":"elem-f2-id-876","type":"BusinessObject","name":"Specalised Equipment","documentation":"**A record of assistive devices issued.** Specalised equipment records items provided to meet assessed needs. Support staff create and update the record when equipment is requested, issued, maintained, or returned. The individual receiving support and the team managing inventory rely on it to ensure availability, condition, and allocation. The record supports decisions about procurement, repair, and loan periods. It holds details such as type, serial number, user, and status. Managers use aggregated records to forecast costs and stock levels. Auditors rely on the record to verify assets and compliance.","specialization":""},{"id":"elem-f2-id-852","type":"BusinessObject","name":"Specalised Support","documentation":"**A record of individual assistance provided.** Specalised support captures the delivery of tailored help agreed through a needs assessment. Support staff create and update the record to log sessions, outcomes, and progress. The individual receiving support and coordinators rely on the record to maintain continuity and quality. It supports decisions about service adjustments, funding, and resource allocation. The record includes dates, staff involved, and notes. Managers use it to monitor caseloads and contract performance. Auditors review it to confirm that services match assessed needs and agreed plans.","specialization":""},{"id":"elem-f2-id-904","type":"BusinessObject","name":"Sponsor","documentation":"**An organisation providing financial or in-kind support.** A sponsor funds activities, events, or infrastructure in exchange for recognition or other benefits. The institution records sponsors to manage sponsorship agreements, deliver benefits, and maintain relationships. Marketing and development teams use the record to track commitments, coordinate branding, and report on sponsored activities. The record holds contact details, sponsorship terms, and the value of support.","specialization":""},{"id":"elem-f2-id-895","type":"BusinessObject","name":"Staff","documentation":"**A record of an employed person.** The institution creates this record when it appoints someone to a paid position. It holds employment details, job information, pay and benefits data, and performance records. Human resources staff maintain the record, while managers use it for workforce planning, payroll, and development. The record supports day-to-day people management and statutory reporting.","specialization":""},{"id":"elem-f2-id-902","type":"BusinessObject","name":"Standard","documentation":"**A defined level of expected quality.** A standard specifies the measurable requirements for a process, service, or output. Subject matter experts or governing bodies set standards, and operational teams use them to assess performance and compliance. Standards provide the benchmark against which audits and reviews are conducted. In this model, a Standard is referenced by Procedures and Policies to ensure consistent delivery.","specialization":""},{"id":"elem-f2-id-841","type":"BusinessObject","name":"Strategy","documentation":"**A coordinated plan to achieve long-term goals.** It sets out priorities, resource allocations, and actions over a defined period. Developed by executive leadership with input from stakeholders, it directs operational planning and investment decisions. It helps the institution respond to changing conditions while maintaining focus on its mission and vision. It is referenced by managers and staff when implementing projects.","specialization":""},{"id":"elem-f2-id-830","type":"BusinessObject","name":"Student","documentation":"**A record of an enrolled learner.** The institution creates this record when an applicant accepts an offer and enrols in a programme of study. It holds personal details, enrolment status, module choices, and assessment history. Academic and administrative staff use it to deliver teaching, record results, and provide support. The record supports progression, award, and external reporting.","specialization":""},{"id":"elem-f2-id-853","type":"BusinessObject","name":"Student Accomodation","documentation":"**A record of a student's housing arrangement.** The Student Accomodation record holds details such as room assignment, tenancy dates, rent, and building location. Accommodation staff or student services create and update the record. Students use it to understand their living arrangements; residential staff use it for occupancy and safety; finance staff use it to collect payments. The record supports decisions about room allocation, maintenance, and student wellbeing.","specialization":""},{"id":"elem-f2-id-896","type":"BusinessObject","name":"Student Admission","documentation":"**A record of a student's acceptance.** The Student Admission record holds the offer decision, any conditions, intake date, and programme details. Admissions staff create and maintain it. Students use it to confirm enrolment; academic departments use it to plan cohorts; central administration uses it to manage capacity and reporting. The record supports decisions about enrolment, deferral, and compliance with entry requirements.","specialization":""},{"id":"elem-f2-id-886","type":"BusinessObject","name":"Student Application","documentation":"**A request to study at the institution.** The Student Application record holds personal details, educational history, chosen programme, and supporting documents. The applicant creates it, and admissions staff review it. Academic departments use it to assess suitability; central administration uses it for tracking and reporting. The record supports decisions about offers, interviews, and entry requirements. It also informs enrolment planning and applicant communication.","specialization":""},{"id":"elem-f2-id-871","type":"BusinessObject","name":"Student Attendance","documentation":"**A record of presence at teaching sessions.** The Student Attendance record holds dates, times, session identifiers, and attendance status. Teaching staff capture the data at each session. Students use it to monitor their engagement; academic advisors use it to identify support needs; administrative staff use it for funding and compliance checks. The record supports decisions about intervention, progress, and reporting.","specialization":""},{"id":"elem-f2-id-854","type":"BusinessObject","name":"Student Issues","documentation":"**A record of a student concern.** The Student Issues record holds the issue description, status, actions taken, and resolution. Student support staff or academic staff create it when a student reports a problem. Students use it to track resolution; support teams use it to coordinate help; management uses it to identify patterns. The record supports decisions about case handling, policy changes, and student support.","specialization":""},{"id":"elem-f2-id-833","type":"BusinessObject","name":"Student Mobility","documentation":"**A record of study away from home.** The Student Mobility record holds the destination, dates, programme details, and recognition arrangements. Mobility coordinators or academic staff create it. Students use it to plan exchanges; receiving institutions use it for enrolment; home institutions use it for credit transfer and funding. It also records any required approvals. The record supports decisions about placement, recognition, and partnership management.","specialization":""},{"id":"elem-f2-id-890","type":"BusinessObject","name":"Student Prior Learning","documentation":"**A record of assessed previous learning.** The Student Prior Learning record holds qualifications, evidence, assessment outcomes, and credit awarded. Academic staff or admissions staff create it after evaluating the student's background. Students use it to gain exemptions; programme teams use it to tailor study pathways; registry staff use it for transcripts and progression. The record supports decisions about entry level and module exemptions.","specialization":""},{"id":"elem-f2-id-891","type":"BusinessObject","name":"Students' Union","documentation":"**A student-led organisation representing student interests.** The union provides representation, advice, social activities, and commercial services for the student body. The model records the students' union as a distinct internal body with its own governance and charitable status. Its officers and staff create the record, and university managers use it to engage with the student voice and coordinate student-facing services. It holds the union's name, elected officers, and the services it runs, linking student needs to institutional planning.","specialization":""},{"id":"elem-f2-id-937","type":"BusinessObject","name":"Survey","documentation":"**A structured questionnaire for gathering opinions.** It collects feedback from specific audiences such as prospective students, current students, staff or partners on topics like satisfaction, preferences or awareness. Marketing and research teams design, distribute and analyse surveys; decision-makers use the results to improve services, messages and campaigns. The model stores question sets, response data and analysis reports.","specialization":""},{"id":"elem-f2-id-907","type":"BusinessObject","name":"Teaching & Learning Resources","documentation":"**Materials and tools supporting instruction.** They include reading lists, lecture notes, laboratory equipment, online content, and other items that help students learn and help staff teach. Academic staff and librarians create and curate these resources; students and teaching staff rely on them for course preparation and study. The resources support the delivery of the curriculum, enable self-directed learning, and provide the content foundation for modules and programmes across the institution.","specialization":""},{"id":"elem-f2-id-843","type":"BusinessObject","name":"Teaching Evaluation","documentation":"**Feedback on teaching quality.** It gathers student opinions, peer observations, and other evidence about how well teaching supports learning. Students complete surveys; academic managers and quality teams collect and analyse the information; teaching staff and committees rely on it to improve practice. The evaluation supports decisions about professional development, curriculum review, and the recognition of good teaching. It provides a structured way for the institution to monitor and enhance the student learning experience.","specialization":""},{"id":"elem-f2-id-864","type":"BusinessObject","name":"Tenant","documentation":"**An organisation renting space from the institution.** A tenant occupies buildings or land owned by the institution under a lease or licence. The institution records tenants to manage property, collect rent, and ensure compliance with occupancy terms. Estates and facilities teams use the record to coordinate maintenance, handle service charges, and monitor lease agreements. The record includes lease details, contact information, and payment schedules.","specialization":""},{"id":"elem-f2-id-917","type":"BusinessObject","name":"Training","documentation":"**A record of an employee's learning and development activities.** Training records capture completed courses, certifications, skills acquired and planned development needs. Employees and their managers identify training requirements through appraisals and job role definitions. Human resources administers the training record to track completion, manage budgets and ensure compliance with mandatory learning. The record supports career progression, competency assessment and succession planning. It links to appraisal and job role elements to align development with organisational goals.","specialization":""},{"id":"elem-f2-id-855","type":"BusinessObject","name":"Travel","documentation":"**Expenditure and arrangements for staff travel.** Travel covers the booking, approval, and reimbursement of journeys undertaken for the institution's work. Staff submit travel requests and expense claims; finance and line managers approve them against budgets. Travel records include costs such as transport, accommodation, and subsistence. In the model, Travel is a specific category of spend that must be controlled and reported within financial management.","specialization":""},{"id":"elem-f2-id-883","type":"BusinessObject","name":"Tuition Fee","documentation":"**A record of charges for study.** The Tuition Fee record holds fee amounts, payment due dates, funding sources, and payment status. Finance staff create and maintain it. Students use it to understand their financial obligation; finance teams use it to collect revenue; academic departments use it for budgeting. It is updated when payments are received. The record supports decisions about invoicing, payment plans, and debt management.","specialization":""},{"id":"elem-f2-id-838","type":"BusinessObject","name":"University Colleges","documentation":"**A constituent college within the university structure.** The college provides a smaller community for students and staff, with its own residential, social, or academic character. The model records each college as an internal unit that sits alongside faculties and departments. College leadership creates and maintains the record, and central services use it to organise accommodation, tutorials, and student welfare. It holds the college's name, location, and membership, helping the university deliver a collegiate experience.","specialization":""},{"id":"elem-f2-id-823","type":"BusinessObject","name":"University Group","documentation":"**The overarching corporate body that includes all university units.** The group represents the legal and organisational whole of the institution, encompassing faculties, schools, departments, colleges, and the students' union. The model records the university group as the top-level entity for reporting and governance. Executive leadership creates the record, and external bodies and internal planners use it to understand the institution's full scope. It holds the group's legal name, registered address, and consolidated structure, linking all other internal organisation elements to one accountable body.","specialization":""},{"id":"elem-f2-id-812","type":"BusinessObject","name":"Vendor","documentation":"**A supplier of goods or services.** A vendor provides products or services to the institution under a purchase order or contract. The institution records vendors to manage procurement, track orders, and process invoices. Procurement and finance teams use the record to evaluate supplier performance, negotiate terms, and ensure timely delivery. The record holds business details, payment information, and order history. These records support spend analysis and supplier management.","specialization":""},{"id":"elem-f2-id-944","type":"BusinessObject","name":"Venue","documentation":"**A space used for events and gatherings.** The institution records venues to manage bookings for conferences, performances, ceremonies, and public events. Events staff create venue records and external and internal clients rely on them to plan capacity, layout, equipment, and catering. Venue data supports timetabling of large gatherings and income generation from external hires.","specialization":""},{"id":"elem-f2-id-861","type":"BusinessObject","name":"Vision","documentation":"**An aspirational description of a desired future.** It describes what the institution aims to become or achieve in the long term. Created by leadership in consultation with stakeholders, it inspires and motivates the community. It is used to set direction and evaluate strategic options, ensuring that plans move the institution toward that envisioned state. It provides a benchmark for assessing progress.","specialization":""},{"id":"elem-f2-id-893","type":"BusinessObject","name":"Visitor","documentation":"**A person or group visiting the institution.** A visitor comes to the campus for events, meetings, or public access. The institution records visitors to manage access, safety, and hospitality. Security and events teams use the record to issue passes, track attendance, and provide information. The record includes the visitor's name, contact details, host, and purpose of visit. These records support security monitoring and event planning.","specialization":""},{"id":"elem-f2-id-810","type":"BusinessObject","name":"Volunteer","documentation":"**A record of an unpaid helper.** The institution creates this record for a person who offers time and skills without pay. It holds contact details, availability, interests, and activity history. Volunteer coordinators or engagement staff maintain it to match volunteers with opportunities, schedule work, and recognise contribution. The record supports safe and effective use of volunteer effort.","specialization":""},{"id":"elem-id-872","type":"BusinessProcess","name":"Academic Advice Mgt","documentation":"### Identity\nThe work of providing academic advice to students on module choices and progression.\n\n### Trigger\nA student requests academic advice.\n\n### Consumes\nStudent Enrolment supplies the programme context. Module Registration supplies current modules. Academic Policy supplies progression rules. Academic Advice Record supplies prior advice.\n\n### Steps\nThe advisor reviews the student's record. Advice is given on module selection or study skills. The advice is recorded in an Academic Advice Record. A follow-up meeting is scheduled if needed. If specialist support is required, a referral is made.\n\n### Produces\nAcademic Advice Record. Support Referral.\n\n### Outcome\nStudents receive personalised guidance to support academic progress.\n\n### Fails when\nThe advisor lacks the Student Enrolment record and cannot provide accurate advice.","specialization":""},{"id":"elem-id-840","type":"BusinessProcess","name":"Academic Policy and Regulation Mgt","documentation":"### Identity\nThe work of drafting, approving, versioning and communicating the Academic Policies and Academic Regulations that govern admission, teaching, assessment and awards.\n\n### Trigger\nArrival of a new Government Policy document or an internal proposal to amend existing rules.\n\n### Consumes\nGovernment Policy document supplies external compliance requirements. Academic Policy Proposal supplies the identified gap or improvement. Consultation Feedback supplies the views of academic boards and student representatives.\n\n### Steps\nFirst, a policy drafter compares existing Academic Policies against new requirements and drafts a revised Academic Policy Proposal. The proposal is circulated for Consultation Feedback from committees. Then consolidated feedback is incorporated and the draft is submitted to the Academic Board for Approval Decision. If the Approval Decision is refused, the process returns the proposal with required changes and the cycle repeats. Upon approval, the new Academic Policy or Academic Regulation is assigned a version number and publication date. The published version is distributed to all faculties. Each existing policy is reviewed on a scheduled cycle and flagged for revision if it no longer meets regulatory conditions.\n\n### Produces\nAcademic Policy establishes the binding rule set. Academic Regulation establishes the operational rule set. Policy Publication Notice notifies affected areas of the change.\n\n### Outcome\nAcademic Policies and Academic Regulations are current, version-controlled and aligned with external requirements.\n\n### Fails when\nA required change is blocked by conflicting consultation feedback and no Approval Decision is reached, leaving outdated rules in force.","specialization":""},{"id":"elem-id-871","type":"BusinessProcess","name":"Academic Skills Development","documentation":"### Identity\nThe work of delivering workshops and resources to improve academic skills.\n\n### Trigger\nA scheduled skills workshop or a student self-referral.\n\n### Consumes\nSkills Workshop Schedule supplies the dates. Student Enrolment supplies participants. Academic Skills Materials supplies the content. Needs Assessment supplies the identified gaps.\n\n### Steps\nThe workshop is delivered. Attendance is recorded. The student's skill development is logged. Follow-up support is offered. An evaluation form is completed. The workshop material is updated based on feedback.\n\n### Produces\nSkills Attendance Record. Academic Skills Log. Workshop Evaluation Summary.\n\n### Outcome\nStudents have improved academic skills as evidenced by attendance and participation.\n\n### Fails when\nNo students enrol for the workshop and it is cancelled.","specialization":""},{"id":"elem-id-841","type":"BusinessProcess","name":"Academic Year Scheduling","documentation":"### Identity\nThe work of defining term dates, assessment windows and graduation ceremony dates for the academic year.\n\n### Trigger\nThe start of the planning cycle for the next academic year, signalled by the end of the current one.\n\n### Consumes\nAcademic Calendar from prior year supplies the baseline dates. Teaching Schedule constraints from faculties supply room and staff availability. Public Holiday Calendar supplies closed days. Programme Delivery Requirements supply the minimum teaching weeks per level.\n\n### Steps\nThe scheduler drafts term dates and weeks of instruction. The draft is checked against the Public Holiday Calendar and major events. Faculties confirm availability of teaching weeks and examination periods. Conflicts are resolved through negotiation with faculty administrators. The final Academic Calendar is approved by the Academic Registrar. Any changes after publication go through a change request that documents the impact. The published Academic Calendar is distributed to all academic areas.\n\n### Produces\nAcademic Calendar with term dates, assessment weeks and ceremony dates. Teaching Week Allocation with assigned teaching weeks per faculty. Change Request Log recording any post-publication amendments.\n\n### Outcome\nThe institution has a single authoritative Academic Calendar for the year that all other scheduling consumes.\n\n### Fails when\nFaculty constraints conflict beyond resolution and the Academic Calendar cannot be approved, leaving no agreed teaching weeks.","specialization":""},{"id":"elem-id-1001","type":"BusinessProcess","name":"Accommodation Allocation","documentation":"### Identity\nAllocation work that assigns students to available rooms under accommodation policy. It matches preferences against room inventory, manages offers and declines, and maintains a waiting list.\n\n### Trigger\nThe arrival of a confirmed Student Enrolment for a student who has submitted an Accommodation Application.\n\n### Consumes\nAccommodation Application supplies the student's room preferences, lifestyle requirements, and medical or accessibility needs. Room Inventory supplies available rooms, their attributes, and their live occupancy state. Accommodation Contract Template supplies the terms that must accompany any offer.\n\n### Steps\nThe process validates the student's eligibility and accommodation guarantee status. It matches preferences against available rooms, giving priority to medical and accessibility needs. It selects the best-fit room or identifies a shortage. It issues an Accommodation Offer with the contract terms and a response deadline. If the student declines or the offer lapses, the room is released and the next waiting list candidate is considered. If no suitable room exists, the student is added to the Waiting List with a priority score. When an offer is accepted, the room is marked as allocated and the student's account is updated.\n\n### Produces\nAccommodation Offer sets the proposed room, fee, and contract terms for the student's acceptance. Room Assignment Record marks a specific room as allocated to a specific student. Waiting List records the unresolvable demand and its ordering.\n\n### Outcome\nEach eligible student is assigned a room or is placed on an ordered waiting list, and room inventory reflects live commitments.\n\n### Fails when\nRoom Inventory holds no available rooms or the student's accessibility needs cannot be met by any current vacancy, causing the student to be left without an offer and the allocation to halt.","specialization":""},{"id":"elem-id-1004","type":"BusinessProcess","name":"Accommodation Departure & Turnaround Mgt","documentation":"### Identity\nTurnaround work that returns accommodation rooms to lettable condition after a departure. It coordinates inspection, cleaning, maintenance, and reallocation readiness.\n\n### Trigger\nThe arrival of a Student Departure Notice that confirms a resident has vacated.\n\n### Consumes\nStudent Departure Notice supplies the vacated room identity and the departure date. Room Condition Report supplies damage and inventory findings from the outgoing inspection. Cleaning Schedule supplies the sequence and standard required for each room type.\n\n### Steps\nThe process records the vacant room and triggers an outgoing inspection. It compares the Room Condition Report against the prior check-in record to identify damage beyond fair wear. It assigns a cleaning work order and any repair tasks to the appropriate teams. It verifies that cleaning and repairs are complete against the required standard. It updates the room status to ready for allocation. If damage charges are due, it raises a Student Charge Note and applies the deposit terms. The room is then released to Room Inventory.\n\n### Produces\nRoom Condition Report records the post-departure state and any damage liability. Facilities Work Order states the required cleaning and repair tasks for that room. Student Charge Note states the amount owed by the departing student for damages.\n\n### Outcome\nEach vacated room is restored, assessed, and made available for the next allocation or held for maintenance.\n\n### Fails when\nInspection findings are disputed or cleaning work orders are not completed, causing the room to remain unavailable and the next allocation to fail.","specialization":""},{"id":"elem-id-1002","type":"BusinessProcess","name":"Accommodation Facilities Mgt","documentation":"### Identity\nOngoing maintenance and upkeep of accommodation buildings, common areas, and room fittings. It manages reported faults and planned servicing.\n\n### Trigger\nThe arrival of a Facilities Work Order or a student-reported fault notification for accommodation premises.\n\n### Consumes\nFacilities Work Order supplies the defect detail, location, and priority. Student Fault Notification supplies user-reported symptoms and access constraints. Maintenance Schedule supplies the planned servicing intervals for accommodation assets.\n\n### Steps\nThe process triages the incoming work order or fault notification by urgency and health and safety impact. It assigns a maintenance operative and schedules access. The operative repairs or services the asset and records the action. A supervisor checks the work against the required standard. If the fault is not resolved, the work order is re-opened with a revised approach. Completion is confirmed and the student or reporting source is informed. Recurring faults are logged against the room or building for trend review.\n\n### Produces\nCompleted Work Order records the repair action taken and the closure time. Asset Service Record updates the maintenance history for the affected asset. Student Fault Response informs the reporter of the resolution.\n\n### Outcome\nAccommodation assets and fittings are maintained to the required condition, and reported faults are closed or escalated.\n\n### Fails when\nMaintenance operative availability or spare parts are lacking, causing safety-critical faults to remain open and accommodation areas to become unusable.","specialization":""},{"id":"elem-id-1003","type":"BusinessProcess","name":"Accommodation Incident & Emergency Response","documentation":"### Identity\nEmergency response work that handles incidents in accommodation, including fire, flood, security, and welfare crises, and restores safe operation.\n\n### Trigger\nThe arrival of an Incident Report from accommodation staff, a student, or an alarm system.\n\n### Consumes\nIncident Report supplies the nature, location, and people affected by the incident. Emergency Contact List supplies the responsible responders and external services. Accommodation Policy supplies the safety and conduct rules that govern the response.\n\n### Steps\nThe process classifies the incident as safety, security, or welfare. It triggers the relevant emergency response, such as evacuation, first aid, or security attendance. It contains the immediate harm and preserves evidence. It notifies the identified emergency contacts and external services where required. It records actions taken and collects witness statements. It arranges for affected students to be relocated or supported. A post-incident review identifies corrective actions and assigns them to the responsible teams. The incident is closed only when corrective actions have an owner and a due date.\n\n### Produces\nIncident Report Record captures the full incident timeline, actions, and evidence. Corrective Action Request states the follow-up work required to prevent recurrence. Student Support Referral directs affected students to welfare services.\n\n### Outcome\nAccommodation incidents are responded to, contained, and converted into owned corrective actions, with affected residents supported.\n\n### Fails when\nEmergency contacts cannot be reached or the incident escalates beyond available on-site response, causing harm to residents and regulatory breach.","specialization":""},{"id":"elem-id-856","type":"BusinessProcess","name":"Alumni Event & Campaign Mgt","documentation":"### Identity\nThe work of planning and executing alumni events and fundraising campaigns.\n\n### Trigger\nApproval of an Alumni Event Plan for a specific event or campaign.\n\n### Consumes\nAlumni Contact Record supplies the invitation list. Event Venue Booking supplies the location and date. Campaign Budget supplies the financial limit. Event Registration List supplies confirmed attendees.\n\n### Steps\nThe planner defines the event purpose and audience. Invitations are issued from the Alumni Contact Record. Registrations are collected and attendance is confirmed. The budget is checked against the Campaign Budget before expenditure. The event is delivered and attendance is recorded. For campaigns, pledges are tracked and collected. After the event, a post-event feedback survey is distributed. The survey responses are used to produce the Alumni Event Report.\n\n### Produces\nAlumni Event Report recording attendance and outcomes. Campaign Performance Summary recording funds raised. Post-Event Feedback Summary recording attendee satisfaction.\n\n### Outcome\nAlumni are engaged through delivered events and campaigns, with recorded participation and contributions.\n\n### Fails when\nFewer than the planned minimum attendance is achieved and the Campaign Budget is not covered, stopping the planned engagement activity.","specialization":""},{"id":"elem-id-855","type":"BusinessProcess","name":"Alumni Relationship Mgt","documentation":"### Identity\nThe work of maintaining contact details and engagement history for alumni.\n\n### Trigger\nA change in alumni contact details or a new interaction is recorded.\n\n### Consumes\nAlumni Contact Record supplies the current details. Interaction Record supplies the history of engagement. Updated Contact Details supplies the new information. Communication Preference supplies the preferred contact method.\n\n### Steps\nThe change is validated against the existing record. The Alumni Contact Record is updated with the new details. Engagement history is appended with the interaction. Preferences for communication are checked and applied. A data protection check confirms the update is lawful. The record is saved. A confirmation is sent to the alumni if the change was self-submitted.\n\n### Produces\nUpdated Alumni Contact Record. Alumni Engagement Summary reflecting recent interactions. Data Protection Confirmation recording lawful processing.\n\n### Outcome\nAlumni records are current and complete, enabling targeted engagement.\n\n### Fails when\nContact details are invalid or the record cannot be updated, leaving alumni unreachable.","specialization":""},{"id":"elem-id-956","type":"BusinessProcess","name":"Application Lifecycle Mgt","documentation":"### Identity\nManagement of the software application lifecycle, from need through development, deployment, and retirement.\n\n### Trigger\nThe arrival of a business requirement for a new or changed application.\n\n### Consumes\nBusiness Requirement Document supplies the functional and non-functional needs. Current Application Portfolio supplies the existing applications and their status. Change Request supplies a request for modification to an existing application.\n\n### Steps\nThe process analyses the requirement against current portfolio. It decides build, buy, or modify. It develops or configures the application. It tests against acceptance criteria. It deploys to production. It provides documentation and training. It maintains and updates the application. It retires applications at end of life. If a change fails in testing, it is returned for rework.\n\n### Produces\nApplication Change Record states what was delivered and when. Test Report records the testing results and defects. Application Retirement Notice states the decommissioning plan.\n\n### Outcome\nThe application portfolio meets business needs and is current, supported, and secure.\n\n### Fails when\nA critical application change fails in production, causing service outage and business disruption.","specialization":""},{"id":"elem-id-964","type":"BusinessProcess","name":"Art/Museum Collection Mgt","documentation":"### Identity\nManagement of the institution's art and museum collections, including acquisition, cataloguing, conservation, and display.\n\n### Trigger\nThe arrival of a new acquisition offer or a conservation need.\n\n### Consumes\nCollection Acquisition Proposal supplies the item details and provenance. Collection Catalogue Record supplies the existing holdings. Conservation Assessment supplies the condition and treatment needs.\n\n### Steps\nThe process evaluates the acquisition against collection policy. It obtains expert valuation and provenance checks. It acquires the item. It catalogues it. It manages conservation treatments. It plans and delivers displays or loans. It monitors environmental conditions for stored items. It reviews the collection periodically. If an item is deaccessioned, it follows disposal policy.\n\n### Produces\nCollection Item Catalogue Entry states the new item details. Conservation Treatment Record states the treatment applied. Display Plan states the items and schedule.\n\n### Outcome\nThe institution's art and museum holdings are preserved, documented, and used for public benefit.\n\n### Fails when\nAn item's provenance is not verified, causing acquisition of stolen or fake art and reputational damage.","specialization":""},{"id":"elem-id-887","type":"BusinessProcess","name":"Assessment Administration","documentation":"### Identity\nThe work of preparing and scheduling assessments for modules.\n\n### Trigger\nA term starts and module cohorts are established.\n\n### Consumes\nModule Registration supplies the students to be assessed. Academic Calendar supplies the assessment windows. Assessment Policy supplies the rules for format and invigilation. Room Inventory supplies the available rooms.\n\n### Steps\nThe administrator determines the assessment format for each module based on Assessment Policy. Assessment Papers are produced or sourced. Assessment Schedules are defined, assigning dates and rooms. Invigilators are allocated. The schedule is published to students. Adjustments for students with approved exceptional circumstances are applied. The final papers are securely stored.\n\n### Produces\nAssessment Paper. Assessment Schedule. Invigilation Allocation.\n\n### Outcome\nAll modules have scheduled, policy-compliant assessments ready for delivery.\n\n### Fails when\nAssessment Papers are not ready by the scheduling deadline, causing assessment windows to be missed.","specialization":""},{"id":"elem-id-884","type":"BusinessProcess","name":"Assessment Delivery","documentation":"### Identity\nThe work of running the actual assessment event, including examinations and coursework collection.\n\n### Trigger\nThe Assessment Schedule date for a module arrives.\n\n### Consumes\nAssessment Paper supplies the questions. Assessment Schedule supplies the time and room. Module Registration supplies the candidate list. Invigilation Allocation supplies the invigilators.\n\n### Steps\nThe room is prepared and candidates are checked against the Module Registration. Assessment Papers are distributed. The assessment is conducted under invigilation. At the end, papers are collected and counted. A Candidate Attendance Record is completed. For coursework, submission is received and logged. Completed Assessments are handed to marking.\n\n### Produces\nCompleted Assessment. Candidate Attendance Record.\n\n### Outcome\nAssessments are delivered securely and all submissions are accounted for.\n\n### Fails when\nA student attends but is not on the Module Registration, causing a mismatch that must be resolved before marking.","specialization":""},{"id":"elem-id-886","type":"BusinessProcess","name":"Assessment Marking and Feedback","documentation":"### Identity\nThe work of marking completed assessments and providing feedback to students.\n\n### Trigger\nCompleted Assessments are handed to markers.\n\n### Consumes\nCompleted Assessment supplies the student's work. Marking Scheme supplies the criteria and marks. Academic Policy supplies moderation rules. Moderation Sample supplies the subset for checking.\n\n### Steps\nEach marker applies the Marking Scheme to produce a Student Assessment Mark and Feedback Record. Marks are recorded in a marking spreadsheet. A sample of marking is moderated by a second marker to check consistency. If moderation reveals variance, the marker is asked to remark. The final marks and Feedback Records are approved by the module leader. Marks are returned to students along with feedback.\n\n### Produces\nStudent Assessment Mark. Feedback Record. Moderation Record.\n\n### Outcome\nEvery assessment has a verified mark and actionable feedback.\n\n### Fails when\nModeration reveals systematic marking errors and no agreed adjustment is reached, leaving marks contested.","specialization":""},{"id":"elem-id-995","type":"BusinessProcess","name":"Asset Mgt","documentation":"### Identity\nAccounting and control of capital and non-capital assets, including their acquisition, depreciation, and disposal.\n\n### Trigger\nThe arrival of an asset purchase invoice or a scheduled depreciation run.\n\n### Consumes\nAsset Purchase Invoice supplies the asset cost, description, and acquisition date. Asset Register supplies the existing asset records and depreciation status. Depreciation Policy supplies the useful lives and methods for each asset class.\n\n### Steps\nThe process validates the asset purchase invoice against the asset register. It capitalises assets that meet the capitalisation threshold. It assigns a depreciation method and useful life. It runs periodic depreciation calculations. It reviews asset useful lives and impairment. It records asset disposals and transfers. It reconciles the asset register to the general ledger. If an asset is disposed of, the gain or loss is calculated and posted.\n\n### Produces\nAsset Register Update records new, changed, or disposed assets. Depreciation Journal supplies the calculated depreciation for the period. Asset Disposal Record states the disposal date and sale proceeds.\n\n### Outcome\nThe institution's asset base is accurately recorded, valued, and depreciated in line with policy.\n\n### Fails when\nAn asset is not recorded or is incorrectly depreciated, causing financial statements to be materially misstated.","specialization":""},{"id":"elem-id-857","type":"BusinessProcess","name":"Benefactor Mgt","documentation":"### Identity\nThe work of managing relationships with individuals who make major gifts.\n\n### Trigger\nA Benefactor Contact Record indicates a potential donation.\n\n### Consumes\nBenefactor Contact Record supplies the donor's history. Donation Pledge supplies the intended gift amount and purpose. Gift Agreement supplies the terms. Funding Priority List supplies the institutional needs.\n\n### Steps\nThe benefactor's interests are matched to the Funding Priority List. The Donation Pledge is documented. The Gift Agreement is drafted and signed. A stewardship plan is created to maintain the relationship. The pledge is tracked until payment. A receipt is issued. The benefactor is invited to recognition events. The engagement is recorded.\n\n### Produces\nSigned Gift Agreement. Donation Receipt. Benefactor Engagement Record. Stewardship Plan.\n\n### Outcome\nBenefactor relationships are formalised and gifts are recorded against agreed purposes.\n\n### Fails when\nThe benefactor withdraws the pledge before signing, leaving no gift recorded.","specialization":""},{"id":"elem-id-826","type":"BusinessProcess","name":"Benefits Mgt","documentation":"### Identity\nThis process tracks the realisation of benefits from approved change initiatives and enforces the discipline that expected benefits are measured after delivery. It is the part of the capability that connects investment decisions to measurable outcomes.\n\n### Trigger\nThe approval of a Business Case with quantified expected benefits starts the process, at which point the change has committed investment but no benefit has yet been recorded.\n\n### Consumes\nBusiness Case supplies the expected benefits, their monetary value, and the planned dates by which each benefit should occur. Project Status Report supplies delivery progress and confirms whether planned outputs have been produced. Benefits Realisation Plan supplies the measurement method and owner for each benefit.\n\n### Steps\nFirst the process registers each expected benefit in a Benefits Register, assigning an owner and baseline measurement. Then it compares actual performance data against the baseline at each planned review point. When a benefit is behind plan, the process records a deviation and requests corrective action from the project sponsor. When a benefit is ahead of plan, it updates the forecast. It reviews benefits after project closure and for a further two years, then marks each benefit as realised, partially realised, or not realised.\n\n### Produces\nBenefits Register records the current status of each expected benefit after each review. Benefits Realisation Report states the actual value realised against planned value and explains variances.\n\n### Outcome\nInvestment decisions are supported by measured evidence of benefits actually delivered, and unfulfilled benefits are visible for governance action.\n\n### Fails when\nThe Benefits Register has no agreed measurement baseline or benefit owner, because benefits cannot be assessed and the organisation continues to fund change without evidence of return. Downstream, portfolio prioritisation and future business case approvals proceed without benefit reliability.","specialization":""},{"id":"elem-id-927","type":"BusinessProcess","name":"Brand Mgt","documentation":"### Identity\nManagement of the institutional brand, including identity standards, brand assets, and brand compliance.\n\n### Trigger\nThe arrival of a brand usage request or a brand audit schedule.\n\n### Consumes\nBrand Usage Request supplies the intended use and context. Brand Guidelines supply the visual and verbal standards. Brand Asset Library supplies the approved logos and templates.\n\n### Steps\nThe process reviews the request against guidelines. It issues the appropriate brand asset. It monitors external usage for compliance. It updates the guidelines as needed. It delivers brand training. It handles brand infringements. It audits brand applications periodically. If misuse is found, it issues a correction request.\n\n### Produces\nBrand Usage Approval states the permitted use. Brand Asset Issue records the asset provided. Brand Correction Notice states the required change for non-compliant usage.\n\n### Outcome\nThe institution's brand is used consistently and correctly across all touchpoints.\n\n### Fails when\nUnauthorised or incorrect brand usage goes unchallenged, diluting the brand.","specialization":""},{"id":"elem-id-991","type":"BusinessProcess","name":"Budget Mgt","documentation":"### Identity\nAnnual and in-year budget construction, allocation, and monitoring. It sets financial limits and controls spend.\n\n### Trigger\nThe arrival of a budget construction deadline or a budget revision request.\n\n### Consumes\nBudget Submission supplies each unit's planned income and expenditure. Prior Year Actuals supply the historical spend and income baseline. Institutional Financial Plan supplies the overall financial targets and constraints.\n\n### Steps\nThe process consolidates budget submissions. It challenges and adjusts them against the financial plan. It allocates budgets to cost centres. It loads them into the finance system. It monitors actual spend against budget monthly. Variances are investigated and reforecast. Budget transfers and virements are processed within rules. If a unit exceeds budget, a corrective action is set. The final outturn is reported to governance.\n\n### Produces\nApproved Budget states the annual financial limit for each cost centre. Budget Variance Report records the difference between actual and budget. Budget Transfer records the movement of funds between cost centres.\n\n### Outcome\nThe institution operates within an approved budget, and variances are managed through reallocation.\n\n### Fails when\nBudgets are not loaded or are overspent without correction, causing uncontrolled expenditure and financial loss.","specialization":""},{"id":"elem-id-975","type":"BusinessProcess","name":"Business & Operational Reporting","documentation":"### Identity\nProduction of business and operational reports from institutional data for management and statutory use.\n\n### Trigger\nThe arrival of a reporting schedule date or an ad hoc report request.\n\n### Consumes\nReport Specification supplies the required data fields, filters, and format. Source Data Extract supplies the raw data from operational systems. Reporting Standard supplies the presentation rules and definitions.\n\n### Steps\nThe process validates the report specification. It extracts and transforms the data. It builds the report. It checks for accuracy and completeness. It distributes to authorised recipients. It stores the report in the reporting library. It handles follow-up data questions. If data quality issues arise, they are logged for correction at source.\n\n### Produces\nBusiness Report states the required metrics and analysis. Operational Report states the operational performance data. Report Distribution Confirmation records who received the report.\n\n### Outcome\nThe institution's management receives accurate and timely reports for decision-making.\n\n### Fails when\nSource data is missing or incorrect, causing the report to misstate performance and mislead management.","specialization":""},{"id":"elem-id-836","type":"BusinessProcess","name":"Business Continuity Mgt","documentation":"### Identity\nThis process establishes the institution's ability to continue critical activities during disruption and to recover within agreed timeframes. It is the part of the capability that maintains resilience against operational interruptions.\n\n### Trigger\nA material change in risk profile or a disruptive incident triggers the process, when the institution's existing continuity arrangements are known to be insufficient.\n\n### Consumes\nBusiness Impact Analysis supplies the analysis of critical activities, their dependencies, and maximum tolerable downtime. Risk Register supplies the threats and vulnerabilities that could cause disruption. Resource Inventory supplies the staff, facilities, systems, and suppliers available for recovery.\n\n### Steps\nFirst the process reviews the Business Impact Analysis for the critical activities in scope. It selects a continuity strategy for each, such as alternate site, manual workaround, or mutual aid. It then develops the Business Continuity Plan, assigning recovery teams, contact details, and step-by-step procedures. It schedules and conducts a test or exercise of the plan. It records test results and any failures. It updates the plan to address the failures and obtains sign-off from the accountable executive.\n\n### Produces\nBusiness Continuity Plan records the recovery procedures, roles, and invocation criteria for each critical activity. Test Report records the scenario tested, outcomes, and required plan amendments.\n\n### Outcome\nThe institution has a tested Business Continuity Plan for each critical activity, with recovery time objectives that align to the Business Impact Analysis.\n\n### Fails when\nThe Business Impact Analysis does not identify maximum tolerable downtime for a critical activity, because recovery priorities cannot be set and the plan cannot be validated against a time objective, leaving the recovery effort uncoordinated.","specialization":""},{"id":"elem-id-822","type":"BusinessProcess","name":"Business Horizon Scanning","documentation":"### Identity\nThis process surveys the external environment for political, economic, social, technological, legal, and environmental changes that could affect the institution's strategy. It is the part of the capability that provides early warning of strategic shifts.\n\n### Trigger\nA scheduled scanning cycle or the publication of a major Government Policy Document triggers the process, when the strategy team needs to refresh its assumptions.\n\n### Consumes\nGovernment Policy Document supplies formal regulatory and funding changes. Market Analysis supplies data on student demand, research income, and competitor behaviour. Stakeholder Input supplies observations from staff, students, and employers.\n\n### Steps\nFirst the process collects signals from the named sources. It filters signals for relevance to the institution's mission. It analyses the likely impact and timeframe of each relevant signal. It validates the analysis with subject matter experts. It then produces a Horizon Scan Report and updates the institution's Strategic Assumptions.\n\n### Produces\nHorizon Scan Report records the identified trends, their assessed impact, and the evidence base. Strategic Assumptions record the revised assumptions about the external environment used for planning.\n\n### Outcome\nThe institution has a documented set of Strategic Assumptions based on current external evidence, and material changes are flagged before they appear in internal performance data.\n\n### Fails when\nThe Market Analysis is not produced or lacks credible sources, because the scan misses shifts in student demand or funding, and the Strategic Plan is built on assumptions that no longer hold.","specialization":""},{"id":"elem-id-928","type":"BusinessProcess","name":"Campaign Mgt","documentation":"### Identity\nPlanning and execution of marketing campaigns, from research through delivery and evaluation.\n\n### Trigger\nThe arrival of a campaign brief from the marketing plan.\n\n### Consumes\nCampaign Brief supplies the objectives, target audience, and message. Audience Data supplies the segmentation and contact rules. Marketing Channel Plan supplies the selected channels.\n\n### Steps\nThe process develops the campaign strategy. It creates creative assets. It schedules and executes across channels. It monitors responses and engagement. It adjusts mid-campaign if needed. It reports on results. It manages the budget. If the campaign underperforms, it is paused or revised. It records lessons learned.\n\n### Produces\nCampaign Plan states the activities and schedule. Campaign Creative Assets supplies the adverts and content. Campaign Performance Report records the metrics and ROI.\n\n### Outcome\nThe institution achieves its campaign objectives and learns for future campaigns.\n\n### Fails when\nThe campaign target audience is incorrectly defined, causing wasted spend and no response.","specialization":""},{"id":"elem-id-985","type":"BusinessProcess","name":"Campus Parking","documentation":"### Identity\nOperational control of car parks, permits, enforcement, and daily vehicle access on campus.\n\n### Trigger\nThe arrival of a vehicle registration for a car park permit or a parking enforcement event.\n\n### Consumes\nVehicle Registration supplies the vehicle and owner details. Car Park Permit Application supplies the applicant's eligibility and required access. Car Park Capacity Record supplies the number of spaces available per zone.\n\n### Steps\nThe process verifies the applicant's eligibility for a permit. It checks available capacity in the requested zone. It issues a permit or places the applicant on a waiting list. It records the vehicle against the issued permit. Daily enforcement matches vehicles on site against permit records. A breach triggers a Parking Charge Notice. Appeals are reviewed against the parking terms and either upheld or dismissed. Permit renewals are issued before expiry where capacity allows.\n\n### Produces\nCar Park Permit authorises a specific vehicle to use a named zone. Parking Charge Notice states the penalty for an observed breach. Parking Appeal Decision records the outcome of a challenge.\n\n### Outcome\nCar park use is controlled through permits and enforcement, and capacity is managed within limits.\n\n### Fails when\nCar Park Capacity Record is inaccurate or permits are oversold, causing conflict and unmanaged demand on peak days.","specialization":""},{"id":"elem-id-981","type":"BusinessProcess","name":"Campus Security","documentation":"### Identity\nPhysical security operations across campus, including patrols, access control, incident response, and safeguarding.\n\n### Trigger\nThe arrival of a Security Incident Report or a scheduled patrol roster activation.\n\n### Consumes\nSecurity Incident Report supplies the event type, location, and persons involved. Access Control Record supplies door and zone entry attempts. Security Patrol Schedule supplies the patrol routes and time intervals.\n\n### Steps\nThe process assigns patrols according to the schedule and risk areas. It monitors access control records for anomalies. It responds to security incidents and records the response. It escalates serious incidents to emergency services and campus leadership. It secures affected areas and preserves evidence. It logs all actions and outcomes. It reviews incident patterns and adjusts patrol priorities. Completed patrols are signed off.\n\n### Produces\nSecurity Incident Log records each event and the response taken. Patrol Completion Record confirms each planned patrol was executed. Security Risk Assessment updates the risk priority for campus zones.\n\n### Outcome\nCampus physical security is maintained through patrolling, access monitoring, and incident handling.\n\n### Fails when\nAccess control systems fail or patrols are not completed, causing an unmonitored period during which an incident may occur without response.","specialization":""},{"id":"elem-id-870","type":"BusinessProcess","name":"Career & Employability Engagement Mgt","documentation":"### Identity\nThe work of connecting students with career advice and employability opportunities.\n\n### Trigger\nA student books a career appointment or attends an employability event.\n\n### Consumes\nStudent Enrolment supplies the student's programme. Career Opportunity Register supplies vacancies and placements. Employer Engagement Record supplies employer contacts. CV Draft supplies the student's current CV.\n\n### Steps\nThe appointment is held and advice given. The student is matched to opportunities in the register. Applications to opportunities are tracked. The outcome is recorded. A mock interview is arranged. An employer introduction is made.\n\n### Produces\nCareer Advisory Record. Employer Introduction. Application Tracking Record.\n\n### Outcome\nStudents access career support and are introduced to employers.\n\n### Fails when\nThe Career Opportunity Register is empty and no matches can be made.","specialization":""},{"id":"elem-id-829","type":"BusinessProcess","name":"Change Portfolio Mgt","documentation":"### Identity\nThis process prioritises and sequences change initiatives within the institution's change portfolio and makes explicit the trade-offs between competing investments. It is the part of the capability that ensures the total change load is deliverable.\n\n### Trigger\nA new Change Request or Business Case entering the portfolio for consideration starts the process, when the portfolio already has existing approved initiatives consuming resources.\n\n### Consumes\nChange Request supplies the scope and urgency of the proposed change. Business Case supplies the expected benefits, cost estimate, and strategic alignment. Resource Capacity Statement supplies the current availability of staff, budget, and key facilities. Strategic Objective supplies the criteria against which alignment is judged.\n\n### Steps\nFirst the process logs the incoming proposal and checks completeness of the Business Case. Then it scores the proposal against the institution's Strategic Objectives and risk appetite. It compares the proposal's resource demand with the Resource Capacity Statement to determine whether capacity exists. If capacity is insufficient, the process either rejects the proposal, defers it, or asks for a revised Business Case with reduced scope. If capacity exists, it ranks the proposal against the existing portfolio. It then issues a portfolio decision and updates the portfolio pipeline.\n\n### Produces\nChange Portfolio Decision records the outcome for each proposal: approve, defer, reject, or request revision, with reasons. Change Portfolio Report records the aggregate portfolio composition, resource utilisation, and strategic alignment after the decision.\n\n### Outcome\nThe approved change portfolio has an explicit resource demand that does not exceed available capacity and a strategic alignment score for every initiative.\n\n### Fails when\nThe Resource Capacity Statement is missing or outdated, because the process cannot judge whether new proposals can be delivered; as a result, the portfolio becomes overloaded and delivery risk transfers to individual projects without governance detection.","specialization":""},{"id":"elem-id-937","type":"BusinessProcess","name":"Child Care Mgt","documentation":"### Identity\nManagement of on-campus childcare provision, including places, staffing, and regulatory compliance.\n\n### Trigger\nThe arrival of a childcare place application or a regulatory inspection date.\n\n### Consumes\nChildcare Application supplies the child's details and sessions required. Staffing Roster supplies the available qualified staff. Regulatory Standard supplies the legal requirements.\n\n### Steps\nThe process assesses the application against available places. It allocates a place and starts records. It schedules staffing. It ensures compliance with child-to-staff ratios. It delivers daily care. It manages fees and invoicing. It meets inspection requirements. If a child has additional needs, it coordinates support. It reviews occupancy regularly.\n\n### Produces\nChildcare Place Offer states the allocated place and terms. Daily Attendance Record records children present. Regulatory Compliance Report states the outcome of inspections.\n\n### Outcome\nChildren are cared for safely, and parents have reliable childcare.\n\n### Fails when\nStaff sickness causes ratios to fall below legal minimum, forcing temporary closure.","specialization":""},{"id":"elem-id-890","type":"BusinessProcess","name":"Collaborative Opportunity Mgt","documentation":"### Identity\nWork here identifies and shapes collaborative research opportunities with external partners, moving from initial approach to a jointly agreed plan.\n\n### Trigger\nThe arrival of a Collaboration Request from an external body or an internal researcher, when the proposed collaborative work is not yet defined.\n\n### Consumes\nCollaboration Request supplies the partner's interest, available resources, and intended research area. Research Opportunity supplies the underlying funding or research need that the collaboration would address. Research Capability Profile supplies the institution's contribution and expertise. Research Strategy supplies the institutional stance on partnerships and priority areas.\n\n### Steps\nThe Collaboration Request is logged and matched against the Research Opportunity to confirm the need. The process then assesses the partner against the Research Capability Profile for complementary strengths. If the partner is not suitable, the request is declined and recorded. If suitable, the process drafts a Collaborative Opportunity Plan outlining the joint objectives, work split, and resource contributions. The plan is discussed with the partner and, if both sides agree, signed as a Collaborative Opportunity Agreement. The agreement is handed to relationship management for ongoing oversight.\n\n### Produces\nCollaborative Opportunity Plan: issued when the joint approach is defined, establishing the shared work and objectives. Collaborative Opportunity Agreement: issued when both parties sign, establishing the commitment to proceed jointly.\n\n### Outcome\nViable collaborative opportunities are defined and agreed, ready for formal partnership establishment.\n\n### Fails when\nThe partner suitability check is bypassed and a Collaborative Opportunity Agreement is signed with a partner lacking required expertise; the joint work fails.","specialization":""},{"id":"elem-id-917","type":"BusinessProcess","name":"Commercial Activity Exit Mgt","documentation":"### Identity\nThis process is controlled closure of a commercial arrangement once a counterparty or internal sponsor has signalled termination. It realises the delivery capability's obligation to end contracts without leaving unresolved liabilities or unreturned assets. It converts a termination notice into a settled, documented closure.\n\n### Trigger\nArrival of an Exit Notice from a counterparty or internal budget holder, with the contract still active and obligations outstanding.\n\n### Consumes\nContract Agreement supplies termination clauses, notice periods, asset return requirements and settlement basis. Exit Notice supplies the stated reason, effective date, and any request for early termination. Outstanding Invoice Register supplies the unpaid amounts and outstanding credits that must be settled.\n\n### Steps\nThe process first verifies the Exit Notice against the termination clauses in the Contract Agreement to confirm validity and effective date. It then assembles a schedule of all outstanding obligations: invoices, credits, assets, data returns, and confidentiality deeds. Each obligation is assigned to an owner and a due date; any obligation contested by either party is logged as an unresolved item. The process calculates the exit settlement, applying early termination charges and set-offs from the Outstanding Invoice Register. It then obtains internal approval from Finance and the Commercial Delivery owner; if approval is refused, the process returns the settlement to negotiation and reissues the calculation. Once approved, it issues an Exit Settlement Statement to the counterparty and records the agreed final position. After confirmation of settlement and asset return, it closes the Contract Agreement and marks the contract as ended in the Contract Closure Record.\n\n### Produces\nExit Settlement Statement records the final amounts payable or receivable and the effective closure date. Contract Closure Record establishes that all obligations are discharged and the contract is no longer active. Asset Return Schedule records the assets to be returned and their confirmed receipt.\n\n### Outcome\nThe commercial relationship is closed with every liability settled, every asset returned, and the contract no longer available for new commitments.\n\n### Fails when\nExit Notice is disputed or settlement is not approved before the notice period expires; the contract remains open, the counterparty pursues legal remedies, and Financial Statements cannot close the commitment.","specialization":""},{"id":"elem-id-916","type":"BusinessProcess","name":"Commercial Activity Issue Mgt","documentation":"### Identity\nThis process manages deviations that arise during delivery against a current commercial contract. It establishes ownership, root cause, corrective action and escalation for each reported issue, keeping the delivery obligation intact.\n\n### Trigger\nArrival of an Issue Report from a delivery team, counterparty, or monitoring activity, stating that a contractual obligation is at risk or has been breached.\n\n### Consumes\nIssue Report provides the specific deviation, affected obligation, and impact on delivery. Contract Agreement supplies the performance standard and the remedy or escalation clause applicable. Risk Register supplies the existing risk posture and previous decisions that affect the response.\n\n### Steps\nOn arrival, the process triages the Issue Report for severity, assigning a priority based on contract impact and delivery risk. It then confirms the obligation against the Contract Agreement and gathers evidence from the reporting party. A root cause is established and recorded; where the cause is disputed, the process convenes a review with the contract owner. The process drafts a Resolu
