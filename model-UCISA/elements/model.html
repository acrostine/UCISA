						<div class="markdown-doc"><script type="text/plain">### Identity
The model describes the operating capabilities of a UK higher education institution. It covers five domains: Commercial Activity, Enabling Capabilities, Research, Strategy & Governance, and Teaching & Learning. It spans the lifecycle of Student Records from application to graduation, the delivery of Courses, the creation and dissemination of Research Outputs, and the execution of Commercial Contracts. It excludes academic content creation, the internal detail of research methods, and the regulatory operations of external bodies such as the Office for Students or UK Research and Innovation. The boundary is the institution's own administration and service delivery; it does not represent sector-level funding allocation or student union activity.

### Economics
The model measures performance through counts of Student Enrolments, Research Outputs, Commercial Contracts executed, and Service Requests resolved. Its unit of comparison is the academic year, with each capability reported as a count of completed transactions. Better means higher Student Completion rates per enrolment cohort, increased Research Income per full-time equivalent academic staff member, lower cost per Student Credit, and shorter time from Research Grant application to award. The model also compares Facilities Work Orders completed on time and Financial Transactions processed without error. The unit of cost is pounds sterling; the unit of duration is days.

### Exchanges
Incoming across the boundary are Student Applications, Research Funding Applications, Supplier Invoices, Government Policy documents, and Student Fee payments. Outgoing are Awarded Degree Certificates, Research Publications, Graduate Records, Financial Statements, and Contract Agreements.

### Forces
The application of the model is changed by new data protection requirements under the UK GDPR, the Office for Students condition B3 on student outcomes, open access mandates for research publications, the replacement of the Research Excellence Framework exercise with new impact measures, and sustainability reporting obligations under the Climate Change Act. Student expectations for digital service availability and the shift from Student Loans Company funding to direct institutional bursaries also change how the model is applied.

### Constraint
The single condition that most limits the usefulness of this model is its assumption that all processes operate within a single legal institution; it does not capture shared services, franchise partnerships, or collaborative course delivery.

**Where it comes from.** The UCISA capability model, republished with navigation and visualisation. Based on the UCISA UK HE Capability Model v2 (2018), published under CC BY 3.0; navigation, visualisation and added definitions are changes made here. The descriptions of the domains, capabilities and processes are UCISA's own. The definitions of the 178 further elements (records, stakeholders, products, actors, locations and groupings) were written by the AI agents team.</script></div>
