						<div class="markdown-doc"><script type="text/plain">**A record of financial transactions.** An Account holds the debits and credits for a particular category of money, asset, liability, income, or expense. Finance staff create and maintain accounts to track the institution's financial position over time. Budget managers and auditors rely on account balances to see where money has come from and gone, to reconcile statements, and to support planning and reporting. The model treats Account as a core financial record that underlies invoices, payments, and journal entries.</script></div>
