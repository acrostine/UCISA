						<div class="markdown-doc"><script type="text/plain">### Object
The IT Support Ticket records a user-reported service request or incident, including description, priority, affected service, and associated device or user.

### Condition
It is raised when a member of staff or student submits a request or reports a fault to the IT helpdesk.

### Consequence
Support staff receive the ticket, diagnose the issue, and either resolve it or escalate to specialist teams. Without this ticket, the user's problem remains unrecorded and no remediation is scheduled.</script></div>
