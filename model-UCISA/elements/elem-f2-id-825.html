						<div class="markdown-doc"><script type="text/plain">**A detailed record of academic achievement.** The Higher Education Achievement Report is a formal document issued to a student upon completion of a programme. It lists the modules taken, the grades achieved, and the awards conferred. The institution creates the report as a detailed statement of the student's academic record. The student uses the report when applying for employment or further study. Employers and admissions tutors rely on the report to verify achievements and compare candidates. In this model, the HEAR supports the graduation process by providing a consistent record of achievement.</script></div>
