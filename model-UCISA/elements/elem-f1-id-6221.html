						<div class="markdown-doc"><script type="text/plain">**A location away from the main campus.** Off-campus refers to any physical site that is not the institution's central campus but is used for its activities. This includes partner premises, fieldwork sites, placement locations, and outreach centres. The institution uses off-campus locations to deliver work-based learning, community engagement, and collaborative research. Recording these locations supports travel planning, risk assessment, and partnership management. It also helps the institution meet its obligations for students and staff who operate outside the main site.</script></div>
