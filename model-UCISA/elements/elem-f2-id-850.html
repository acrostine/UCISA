						<div class="markdown-doc"><script type="text/plain">**A plan for proposed research.** A Research Proposal is the record that researchers create to describe a piece of research they want to carry out. It sets out the research question, the methods to be used, the resources needed, and how any ethical issues will be handled. Review bodies within the institution use the proposal to decide whether the research should be approved, funded, or supported. The proposal is also the starting point for Ethical Clearance, as it gives the ethics review body the information needed to assess risks. In this model, a Research Proposal precedes and supports a Research Project, providing the original plan against which the later work is checked.</script></div>
