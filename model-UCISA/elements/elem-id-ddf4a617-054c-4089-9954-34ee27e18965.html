						<div class="markdown-doc"><script type="text/plain">### Object
The Cleaned Dataset is the result of removing errors, duplicates, and inconsistencies, and applying standard formats.

### Condition
It is issued after data quality checks are passed.

### Consequence
Information analytics uses the cleaned dataset to produce accurate models and reports. Without this dataset, analyses are based on dirty data and produce unreliable results.</script></div>
